　誰の声を録音したのか、その声は、気持ちのよい、美しいバリトンだった。

　ぼくはベッドに戻って、冷めるままにうっちゃっておいた朝食を食べた。４マイナス献立の朝食は、中程度の大きさの小鳥の餌ぐらいの分量しかなかった。ところが、ひどく空腹だったはずなのに、それだけ食べると満腹感をおぼえた。胃が縮んでしまったのかもしれないとぼくは思った。食べ終わってからふと気づけば、これは、一世代ぶりに、はじめてとった食事だったわけなのだ。そして、トレイに献立表があったので手にとってみると、ぼくがベーコンだと思って食べていたのは〝田舎風細パンのトースト〟とあった。

　朝食と一緒に、新聞が載っていた。グレイト・ロサンゼルス・タイムズ二〇〇〇年十二月十三日水曜日の朝刊だ。

　新聞は、三十年以前とそう変わっていないように見えた。少なくとも体裁は似ていた。この新聞はタブロイド型で、用紙は昔のラフなパルプ用紙ではなく、つや出しのアート紙で、写真は多色刷りか、さもなければ黒白の実体写真ステレオになっている。この最後の実体写真ばかりは、どうにもそのからくりがわからなかった。実体鏡ステレオスコープを用いなくても立体的に見える実体写真は、ぼくらが小さな子供の時分からあった。五〇年代、子供だったぼくらは、冷凍食品の広告に使われていたこの実体写真を見て、ひどくびっくりしたものだ。だが、当時のそれは、小さなプリズムを働かせるためかなり厚手の透明なプラスチックでなければならなかったのに、これはほんの薄い新聞紙に刷ってありながら、なお深みがあるのだ。

　ぼくは考えるのを諦めて、新聞のほかの部分に目をうつした。〈勤勉ビーバー〉が新聞を書見台にセットしていってくれたのだが、しばらくのあいだぼくは第一面しか読めないのかと思っていた。どうやって新聞の裏を返していいものやら見当がつかなかったのだ。どう見ても、新聞はぴたりと書架に張りついて動かないように見えた。

　ところが、偶然にぼくの手が新聞の右下の端にふれたとたんに、新聞の表面が、その端を起点にして、いきなりくるくると巻きあがり、次のページを読むのに邪魔にならないように縮んでしまったではないか。ここに触るごとに、ページはいくらでもめくれるのだった。

　紙面のすくなくとも半分が、昔ながらの見出しや記事で埋まっていて、ぼくは危うくホームシックをおこしかけた。曰いわく「今日のあなたの星占い」「市長、新設貯水場開きに祝辞」「保安条令、新聞の自由に抵触か。ニューヨークの議員警告」「ジャイアンツ、ダブルヘッダーに圧勝」「異例の暖冬異変、ウインター・スポーツを脅かす」「パキスタン、インドに警告」エトセトラである。

　その他、二、三の記事は、初耳のニュースではあったが、ともかく理解できた。

「月世界定期便、双子座流星群のためなお空中に待機中──静止宇宙ステーション、二カ所に破損。死傷者なし」「白人四人、ケープタウンで黒人のリンチに遭あう。暴動鎮圧を提訴」「人工授精代理母団体、賃上げ要求のための組織を結成。〝アマチュア未登録者の非合法化〟を要求」「ミシシッピ農園主、ゾンビ・ドラッグ取締法違犯で起訴。農園主は語る。〝やつらあ薬を射たれちゃいねえ、最は初なっからパアなんでさ！〟」

　この最後の記事は、ぼくの経験からして、よく内情がわかるような気がした。

　だが、なかには、まったくチンプンカンプンの記事もいくつかあった。たとえば、フランスでは、〝ウォグリー〟がいまだに蔓まん延えん中で、三つの町が放棄された。〝王〟はこの地区を清掃する命令を出すことを考慮中であるというのがある。王とはなんだ？　それは、フランス政界のことだから、どんな政変が起きるか知れたものでない、いまごろ王が出てきてもおかしくないのかもしれないが、それはいいとして、彼らがその〝ウォグリー〟を鎮めるために使用を考慮中の〝保健パウダー〟とはいったいなんだろう？　放射能灰だろうか？　使うなら使ってもいいが、できるだけ風のない穏やかな日、望むらくは二月三十日かなにかを選んでやってもらいたいものだ。ぼくも一度サンディアにいたとき、放射性物質を、婦人部隊ＷＡＣ所属のボンクラのとんでもない過失から許容量以上に飲んでしまったことがある。さいわい、逝きて再び帰らざるのポイントは越さずにすんだが、あまりお奨めはできない療法だった。

　ロサンゼルス警察のラグナ・ビーチ分署では、署員全員が〝光線銃レイコイル〟で武装したとある。署長は、市に対して、すべての有名人は市を離れるように警告してつぎのように語った。「部下はまず発砲して、しかるのち調べをするよう指令されている。いかなることがあっても断固これを絶滅する！」

　ぼくは、なにがどうなっているのかわかるまで、ラグナ・ビーチには絶対足を向けまいと思った。とにかく、これは二、三の例にすぎない。読みすすむにつれわからないことだらけで、ぼくはしだいに心細くなってくるのをおぼえた。

　ぼくは大見出しを飛ばして読みはじめた。すると、また、見おぼえのある小見出しが目にふれた。出生、死亡、結婚、離婚等の個人消息欄である。ただし昔とちがうのは、その項目中に、各冷凍場から発表される〝入場者〟と〝退場者〟の名が出ていたことだ。ぼくは〝ソーテル共同冷凍場サンクチユアリ〟の項目を探して、ぼくの名前を見つけた。自分がなにかに〝所属〟しているという感じは、なんとなく温かい、ほのぼのとした安心感をぼくに与えた。

　だが、それより興味深かったのは広告欄だった。個人広告欄のひとつがぼくの目を捕えた。こんなやつだ。「旅行に趣味ある未亡人（非年輩者）、同様の趣味を持つ成年男子を求む。目的──二カ年契約結婚」

　しかし、もっともぼくの関心を誘ったのは、広告中でも、やはり商品の宣伝広告だった。〈ハイヤーガール〉とその姉妹品の一族が、すっかり世の中に普及していた。彼らは、まだ、がっしりした女性が箒ほうきを持っている商標を使っていた。ぼくが、ぼくらの会社の便箋のレターヘッドにデザインしたもの、そのままなのだ。ぼくは一いち抹まつの後悔を感じた。〈ハイヤーガール〉の株をあんなに早まってリッキーに譲渡するのではなかった。あれは、ぼくの持株の残り全部をあわせたよりも株価が出ているのだ。思ったとたんに、いやそうでないと思いなおした。もしあのとき、ぼくが株券を身につけていたら、あの強盗夫婦にまき上げられ、彼らに譲渡したように改かい竄ざんされていたこと受け合いなのだ。そうならずにリッキーのものになったのだから、よしとすべし。もしリッキーがあれで金持ちになっていたとしたら、本望とすべきなのだ。

　ぼくはリッキーの所在を確かめることを、なによりも先にしようと考えた。第一優先事項だ。彼女は、ぼくのかつて知っていた世界で、ぼくに残されたたった一人の身よりなのだ。リッキーの存在は、ぼくの心のうちで、いやが上にも大きくなっていた。かわいいリッキー！　もし当時、リッキーが十と歳おおとなだったら、ぼくは、ベルなぞに絶対に惑わされなかったろう……そして手痛い火傷もせずにすんだのだ。

　待てよ。いま彼女はいくつになっているだろう？　四十か──いや、四十一だ。四十一になったリッキーの姿はぼくにはまるで想像もできなかった。しかし──そうだ、四十になっていようと、西暦二〇〇〇年のこのころでは、そんな年寄りではない。いや、あの当時だって、若く見える女性はいた。四十フィート離れて見れば、四十一だか十八だかわからないことがよくあったものだ。

　もしリッキーが金持ちになっていたら、一杯奢おごらせて、世を去った哀れなわがピートのために献杯することにしよう。もしまた、なにかがまずくいって、あの株を持っていたにもかかわらず貧乏をしているとしたら、そのときは──そうだ、それこそ彼女と結婚してやろう！　そうとも、結婚するともさ！　十歳やそこらぼくより年上だろうと、そんなことは問題じゃない。むしろ、ぼくのふらふらした人生記録のぶざまさを考えてみると、ぼくには、誰かぼくの世話を焼いてくれる女ひと──必要なときはぼくのために〝ノー〟といってくれる年上の女が必要なのだ。そして、リッキーなら、その役には打ってつけだ。十歳にもならないうちから、小さな女の子の真剣さで、マイルズの身のまわりのことから家事いっさいをきりまわしてきたリッキーだ。四十のリッキーも、もちろん同じ働き者だろう。いや、年を取っただけに、酸すいも甘いも嚙みわけた、優しい女性になっていよう。

　ぼくは、西暦二〇〇〇年に目覚めて以来はじめての、心からなる安らぎを感じた。もう、見知らぬ土地に踏み迷った無力感は去っていた。リッキーこそは、あらゆる問題に対する答えなのだ。

　だがそのとき──心のどこか奥底で、ひとつの声が聞こえたのだ。それはこういった。「おい、おまえもよほどの間抜けだな。リッキーと結婚など、できるわけがないじゃないか。考えてもみろ。あんないい娘があのまま成長したとすれば、もう二十年も前に結婚して、子供の四、五人はいるはずだぞ。きっと、おまえよりうんと背の高い息子がいるだろう。そして彼女の夫は、ダニーおじさんなどというものが現われれば、きっといい顔はしないにきまっているんだ」

　耳を傾けるうちに、顎のあたりの力が抜けてきた。しばらくして、内心の声にいいかけるぼくの言葉には力がなかった。「わかったよ、わかったよ──ぼくはまた船に乗り遅れたんだ。しかし、やはりぼくは彼女を探しつづけるよ。夫がいくら怒っても、せいぜいぼくを撃ち殺すのが関の山だ。それに、なんといっても、彼女はピートを理解してた、たった一人の人間なんだ」

　いい切ると同時に、ぼくは、リッキーとピートとを、二人とも永遠に失ってしまったことを、改めてひしひしと思い知らされたのだった。ぼくは陰気な気分になった。そして、ぼくは、そのまま、ビーバー・ロボットが昼食を持ってきて起こしてくれるまで、新聞の上にもたれてぐっすりと眠りこんでしまった。

　ぼくは奇妙な夢を見た。夢の中で、ぼくはリッキーの腕に抱かれ、彼女のおしゃべりに耳を傾けていた。「大丈夫よ、ダニーおじさん。あたしはピートを見つけたのよ。それ以来、ずっとここにいるの。そうだったわね、ピート？」

「ミャアーオ」





　現代語を覚えるのは朝飯前だった。それよりもぼくは、歴史により多くの時間をかけた。三十年間には、およそありとあらゆることがおこり得る。ぼくは、大アジア共和国が、南アメリカ貿易からアメリカを閉め出そうとかかってるのを知っても、さして意外とは思わなかった。これはすでに台湾協定以来その兆きざしが見えていたのである。インドが、かつてのバルカン以上に国際紛争の中心と化していることもまた、驚くにあたらなかった。だが、イギリスを、カナダの一州と考えるのは、さすがにちょっととまどった。どっちが尻尾でどっちが頭だ？　一九八七年には、世界的な大経済恐慌があったらしい。そしてその結果、金きんは通貨の基礎的な位置を、永遠に喪ってしまった。その切り替え期には、なん千万という人々が破産の憂き目にあうという騒ぎがおこったのだ。

　ぼくは本をおいて考えはじめた。金が安くなり、貴金属でなくなったとすると、これを利用して、じつにさまざまのことができるはずだ。金のもつ高い比重、電気の良伝導性、およびその驚くべき柔軟性をもってすれば……とぼくはふいと思いあたった。そうだ、なぜぼくはまず技術書を第一に読んでみようとしなかったのだろう。金が貴金属として無価値になっても、原子力技術の点から見れば無限の価値がある。金は他の金属と比較にならないほどあらゆる意味において優れた性質を持っている。とすればこれをミニチュア精密工業用に用いると──そこまで考えて、ぼくは再びはたと思いあたった。ぼくは、あのビーバー・ロボットの頭脳が金製の部品で埋まっていることに、すでに疑念を持たなかった。ぼくが氷詰めになっていた間に、技術は長足の進歩を遂げたのだ。早くそれを学んで追いつかなければ、とぼくは思った。

　ソーテル冷凍場サンクチユアリには、技術関係の図書はそなえつけてなかった。そこでぼくは、アルブレヒト博士に、もう大丈夫だから早く退院させてくれと申し出た。彼は肩をすくめ、ぼくのことを馬鹿だといったが、結局同意してくれた。だが、ぼくはもう一晩だけ入院していることにした。横になってブックスキャナーで文字を追っているうちにへとへとになっていたからだ。

　翌日の朝、朝食がすむとすぐ、病院はぼくに現代式の衣服も支給してくれた。それはいいのだが、着ようと思うと着かたがわからない。やむなく手伝ってもらう羽目になった。服そのものは、それほどおかしくはなかった（といっても、裾が釣鐘型になった桜色のズボンなど、一生のうちにはくとは思っていなかった）が、ファスナーの締めかただけは、教えてもらうまではどうにもならなかった。おそらく、ぼくの祖父も、だんだんと馴れたからいいようなものの、そうでもなかったら、ジッパーの扱い方に、ぼくとおなじ苦労をしたにちがいない。これはスティックタイト繊維というやつだったのだ。この服を着ながら、スティックタイトの原理がよく頭に入るまでは、ボーイでも雇って寝起きに服の世話をさせなければならないなと思った。

　それから、ベルトをゆるめようとしていたらズボンがするすると脱げて足もとに落ちてしまった。しかし、誰も笑わなかった。

　それから、アルブレヒト博士がぼくに訊いた。「これからなにをしていくんです？」

「ぼくですか？　まず、市の地図を一枚買いますね。そして、どこか、雨露をしのぐかりの宿を探します。それから……しばらく、たぶん一年ぐらいは、なにもせずに専門の方面の読書をして暮らすつもりです。先生、ぼくは技術者として完全に時代遅れになってしまいました。しかし、このままの状態でいるつもりは毛頭ないんです」

「なるほどね。まあ、成功を祈りますよ。もしぼくにできることなら、なんでもするから、そんなときは遠慮せずに訪ねていらっしゃい」

　ぼくは手を差し出した。「ありがとう、アルブレヒト先生。あなたの親切は身にしみました。これは、ぼくの保険会社の会計と話をしてみて、ぼくがどの程度裕福か調べてみるまでいうべきことではないかもしれませんが──先生、ぼくは、ただありがとうと言葉のお礼だけではすまさないつもりです。先生がぼくにしてくださったご配慮に対する感謝は、言葉より、もっと実のあるものでなくてはね。ねえ先生？」

　博士は首を左右に振った。「お気持ちだけは喜んでちょうだいします。しかし、ぼくの料金は、この冷凍場サンクチユアリとの契約で支払われることになっています」

「でもそれでは……」

「だめです。受け取れないのですよ。もうその問題はよしましょう」そういうと彼はぼくの手を取って握りしめた。「お元気で。この滑走道路スライドに乗っていれば、本社のオフィスに行けますよ」それから、彼はややためらいがちにいった。「外へ出て最初のうち、もしあまり辛いと思ったら、保護契約条項に基づいて、あなたはまだ四日間ここで静養していく権利があるのだから、帰ってきてもいいんですよ。支払い済みの権利だから、使ったほうが得なんだ。自由に出入りしてもいいんだしね」

　ぼくはにっと笑ってみせた。「ありがとう、先生。でも、ぼくは決して帰ってなんかきませんよ──いつか、先生にご挨あい拶さつに来る以外はね」

　ぼくは本社のオフィスのところで滑走道路スライドを飛びおり、オフィスの受付にいたロボットに名を名乗った。ぼくに封筒を一枚渡したので見ると、それは、またシュルツ夫人なる人物から電話があったという伝言だった。そういえば、まだぼくは彼女に電話をかけていなかった。誰かわからなかったからだ。それに冷凍場サンクチユアリでは、蘇生した患者本人が望まないかぎり、訪問者も、外からかかる電話も直接患者に取り継がない規則にしていた。ぼくはちらっと一瞥をくれただけでそれをシャツのポケットにつっこみながら、こんなことになるのだったら、ぼくのフランクをあまり万能フレキシブルに作るのではなかった、と考えていた。昔は、受付というものは、たいていかわいらしい女の子がすわっていて、機械なんぞではなかったのだ。

　受付ロボットがいった。「こちらへどうぞ。会計担当重役がお目にかかるそうでございます」

　望むところだ。ぼくはそちらへ踏み出しながら、ぼくの投資した株が、どのくらい稼いでくれたろうかと考えていた。八七年の経済恐慌で、ぼくの株も大暴落したことは疑いの余地がない。がそれも、いまは再び上昇したはずだった。事実ぼくは、タイムズ紙の経済欄を読んで、ぼくの買った株のうち少なくも二種類が、いまではかなりの価格を持っていることを知っていた。ぼくはその新聞を、ほかの株の状況も知りたくなった場合の用意にと思って持ってきていた。

　会計担当重役は、まさに会計機械とでもいいたくなる男だったが、人間は人間だった。彼は機敏にぼくの手を握った。

「はじめまして、ミスタ・デイヴィス。ダウティと申します。どうかおかけください」

「こんにちは、ミスタ・ダウティ。貴重なお時間を潰していただくにはおよびませんよ。これだけうかがえばいいのです。ぼくの保険会社はこちらを通じて支払いをしてくれるのでしょうか。それとも、直接保険会社に行くんですか」

「どうか一応おすわりください。いろいろとあなたにご説明することがあります」

　そこでぼくは腰をおろした。彼のオフィス・アシスタントが（これまた、わが懐かしのフランクだった！）書類ホルダーを取ってくると、ダウティ氏はいった。

「これがあなたの契約書の原本ですが、ごらんになりますか？」

　もちろん、是が非でも見たかった。蘇生して以来、ぼくは合掌したいほどの気持ちで、ベルがあの支払保証小切手をどうにかしてしまったなどということがないようにと念じてきたのである。支払保証小切手は、個人振出しのとちがって、そう簡単に改かい竄ざんするわけにはいかないが、ベルはその点、おそろしい腕を持った女なのだ。

　彼女が、ぼくの支払委任の署名を変えずにおいてくれたことを発見して、ぼくは、安堵の胸をなでおろした。もちろん、ピートのための付属契約に関する項目は例外で、それだけはそっくりなくなっていた。おそらく、あとで問題がおこるのを避けるために、焼き棄てるかどうかしてしまったのだろう。ぼくは、ベルが〈ミュチュアル生命保険会社〉という字を〈カリフォルニア・マスター生命保険会社〉と書きなおした十数カ所におよぶ部分を注意深く調べてみた。

　まったく、天才的な手並みというほかなかった。顕微鏡や比較実体鏡その他化学反応試験の器具を備えた犯罪学者ならば、これらの部分に改竄のなされた事実を見破れたかもしれない。しかし、ぼくにはまったくその痕跡もわからなかった。いったいどんなふうにして支払保証小切手に手を加えたのだろう。支払保証小切手は必ず消去不能の紙でできているというのに。おそらく彼女はインク消しも使わなかっただろう──人は他人のことをあまりかしこいとは考えないものだが、ベルはまさにかしこい女だった。

　ダウティ氏が咳ばらいしたのでぼくは顔をあげた。

「ここで支払いが受けられるのですか？」とぼくは訊いた。

「そうです」

「それはありがたい、いくらになっています？」

「うむ……ミスタ・デイヴィス、その質問にお答えするまえに、もう一度、この書類に目を通していただきたいのです。そしてわたしの説明に耳をかしていただきたい。これは、あなたの冷凍睡眠コールドスリープ、およびその後の蘇生、保護契約に関し、わが冷凍場サンクチユアリとマスター保険会社とのあいだに取り交わされた契約書です。ご覧のように、費用の全額は前金で支払われています。これは、あなたと、同時にわれわれの両者の利益を相互的に保護する目的でなされたものでして、これがあるために、冷凍睡眠から蘇生するまでの期間の、あなたの安全が、完全に保障されたのです。この場合、積立金は未交付捺印証書手続きに基づいて、高等法院が平衡法事項としてこれを取り扱い、各四半期ごとに、既経過時期についてわれわれに支払われるのです」

「なるほど。よくできた規則ですな」

「そうです。患者の安全はこれがあるがために保護されるのです。さて、これで、当冷凍場が、あなたの契約された保険会社と完全に別個の組織であることがわかっていただけたと思います。われわれの保護契約は、あなたの資産信託とはまったく別個の契約なのです」

「ミスタ・ダウティ──いったい、あんたはなにをいおうというんです？」

「ミスタ・デイヴィス。あなたは、マスター保険に信託されたもの以外に、なんらかの資産をお持ちですか？」

　ぼくは考えてみた。そういえば、自動車があったっけ……が、その後どうなったかは神のみぞ知るのだ。ぼく個人の銀行の当座預金は、やけ酒を飲みはじめて間もなく残らず引き出して、あの日、マイルズの家でめでたく終しゆう焉えんを告げた忙しい日、すでに現金で、三、四十ドルしかポケットに残っていなかった。本や衣類や計算尺や、その他のがらくたは、いずれにせよ消えてなくなってしまったろう。

「バス代もありませんね」と最後にぼくはいった。

「それでは……ミスタ・デイヴィス、はなはだ申し上げにくいことではありますが、あなたは、いかなるかたちの資産も持っておられぬことになります」

　頭の中で、なにかがひゅーんと旋回したかと思うとどかんと墜落した。「な、なんですって？　しかし、ぼくの投資した株のうちには、すごく調子のいいのがいくつかありましたよ。それは確かなんだ。ちゃんとここに出てるんだから」ぼくは手にしたタイムズ紙を突き出してみせた。

　彼は首を左右に振った。「お気の毒です、ミスタ・デイヴィス。あなたはもう株をお持ちではないのです。マスター保険は破産してしまいました」

　さっきすわらせてくれていたおかげで助かった。ぼくは、ふらふらと気を失いかけていた。

「どうして？　どうしてそんなことになったのです？　恐慌のためですか？」

「いえいえ。マニックス・グループの破産が原因でしたよ。ああ、もちろんあなたはご存知ないわけですな。恐慌の直後にマニックス・グループの破産が始まって……そうですな、そういう意味では、やはり恐慌が遠因をなしているともいえるでしょう。しかし、マスター保険は当時まで決して赤字経営ではなかったのです。もし同社が計画的な収奪行為を……不正な収奪行為を受けなかったら、破産の憂き目は決してみなかったはずです。俗ないいかたをすれば、経営者が保険者の財産を横領したのですな。しかもそれが、普通の状態の破産でしたら、資産管理を行なうことによって、ある程度のものは残ったでしょう。ところがそうでなかった。気がついたときはもう、会社にはびた一文残っていなかったのです。そして、こういう不正をあえてした連中は、すでに司直の手のとどかぬところに逃げていた。まあ、こんなことは、慰めにもならんでしょうが、現在の法律では、こういったことは二度と起こり得ないようになりましたよ」

　まさに慰めにはならなかった。ばかりか、彼の言葉を信ずる気にもなれなかった。ぼくの親父がよくいっていた。法律が複雑になればなるほど、悪党どものつけいる隙も多くなるのだと。

　親父はこうもいった。賢い人間は、いつでも荷物を捨てる用意をしておくべきだ、と。だが、これとてぼくの慰めにはならない。〝賢人〟と呼ばれるのは結構だが、そのためにいったい、なんど荷物を諦めればいいというのだ！

「ミスタ・ダウティ、たんなる好奇心から聞くんですが、ミュチュアル生命はどうですか」

「ミュチュアル生命ですか？　ああ、一流会社ですな。もちろん、恐慌の際は、他のどこの会社とも同様に危なかったけれども、よくがんばり抜きましてね。あの会社と、なにか関係がおありなのですな？」

「いいえ」ぼくは説明を試みなかった。したところでしかたがない。ミュチュアルに頼ることはできっこないのだ。ぼくは、あの社との契約をついに実行しなかった。といって、マスター保険を訴えることもできない。破産した会社の死し屍しを鞭むちうってみたところで、どうなるものでもないのだ。

　訴えるなら、むしろベルとマイルズだ。もしあの悪党夫婦がまだこの世に生きていれば……いや、それもくだらん。証拠がなにひとつないじゃないか。

　それに、ぼくはベルを訴えたりなんかしたくはなかった。ぼくはベルをつかまえて、ナマクラ針で、身体じゅうに〝人でなし〟という字を刺青いれずみしてやるのだ。ピートのことを想うとそれでも飽きたらなかった。と、とつぜん、ぼくは、二人がぼくを蹴り出したとき、〈ハイヤーガール〉が身売りする先を、マニックス・グループだといっていたことを思いだした。ぼくは訊いた。「ミスタ・ダウティ。マニックス・グループが一文なしだというのは確かなんですか？　〈ハイヤーガール〉は彼らの所も有のじゃないんですか？」

「〈ハイヤーガール〉？　あなたのいうのはあの家電の製作会社のことですか？」

「もちろんそうです」

「それはどうですかな。いや、はっきり申し上げれば、そんなはずはありませんな。というのは、マニックス・グループなるものがすでに存在しないのですからね。もとより、〈ハイヤーガール〉社とマニックス・グループとの間に少しも関係がなかったと断言することはできませんよ。しかし、たとえあったにしてもたいしたものではありませんね。でなければ、当然わたしの耳にも入っているはずですからな」

　ぼくはこの問題を打ち切った。マニックス・グループの崩壊にマイルズとベルが巻きこまれたとすれば、実にいい気味だ。だが一方、もしマニックス・グループが〈ハイヤーガール〉社を所有していて、これをも搾取したとすると、リッキーも、マイルズたちとおなじ目にあったことになる。ぼくはリッキーにそんな目にあっていてもらいたくなかった……たとえリッキーが、すでに二十年前に結婚して、四人の子持ちになっていようとも。

　ぼくは立ちあがった。

「いろいろお心遣いをありがとう、ミスタ・ダウティ。それじゃぼくは、なんとかやっていきましょう」

「まだ行かないでください、ミスタ・デイヴィス。わが社は、わが社のお客様に対して、たんなる契約書の文言以上の責任を感じております。あなたの非運は、決してこの種のはじめてのケースではないのです。そこでわが社の重役会議は、少額ではありますが、無条件の資金をわたしの自由裁量に任せて、これによって、若干なりともお客様の非運を和らげる資とすることを決定したのです。これは──」

「施ほどこしはごめんだ、ミスタ・ダウティ。お志はありがたいけど」

「施しではない、貸付けです。信用貸付けと呼んでよろしい。まったくの話、こうした貸付けから生ずる損失は取るに足らないものなのです。それに、いずれにせよ当社としては、当社のお客様が一文なしでここを出ていかれるのを見るに忍びないのです」

　ぼくは考えた。確かにぼくは散髪代も持っていない。といって、金を借りるということは、両手に煉れん瓦がを縛りつけて泳ぐに等しい。そしてわずかな金というものは、百万ドル返すより借りにくいものである。ぼくはいった。

「ミスタ・ダウティ。アルブレヒト先生は、ぼくにはまだここに四日間いる資格があるといってくれましたが」

「あると思いますよ。あなたの書類を見てみないとはっきりはいえませんが。もっとも、たとえ契約書の期限が来ても、準備のできていない人をほうり出すようなことは、当社としてはいたしません」

「そうでしょうね。ところで、いまぼくの入っていた部屋の料金はいくらですか。部屋代と食事代とあわせて？」

「はあ？　いや、当社の病院は、そういうふうな入院は受けつけていないのです。病院は営業用ではなくて、当社のお客様の静養機関として設備してあるだけなのですから」

「もちろんそうでしょうが、でも、計算は出るはずでしょう。少なくとも原価計算はできるでしょう？」

「それはまあ……できるとも、できないともいえましょうな。計算といっても、そう簡単な問題ではありませんからね、減価償却費、運営費、予備費、賄い費、人件費、雑費……計算書を作ってもよろしいですがね」

「そんなのは結構です。それじゃ、あの程度の病室と食事つきだと、ふつうの病院ではどのくらいに相当します」

「それはまたわたしの専門ではないが──しかし、そうですな、まあ一日百ドル程度と思えばまず大過ないでしょうな」

「ぼくはまだ四日ここにいる権利がある。ミスタ・ダウティ、それじゃぼくに四百ドル貸してくれませんか？」

　彼はなにも答えずに、ロボットのオフィス・アシスタントに向かって、一連の数字記号でなにか命じた。そして、八枚の五十ドル紙幣が数えられ、ぼくに手渡された。それをポケットにしまいこみながら、ぼくは心から、「ありがとう」といった。「全力を尽くして、この借りができるだけ帳簿から早く消えるように努力しますよ。利子は六分ですか？　それとも利子なしですか」

　彼は首を振った。「これは貸付けではありませんよ。あなたのいわれたとおり、あなたの未使用の四日間を払い戻して差しあげたのです」

「なんだ、それじゃわるいな、ミスタ・ダウティ。ぼくはなにもあなたに無理をお願いするつもりじゃなかったんだ。もちろんぼくはこれを──」

「どうか、ミスタ・デイヴィス。わたしは金をお払いするようこれに申し付けたとき、帳簿にそう載せるように指示してしまいました。取るに足りない四百ドルばかりの金のために監査役連中に頭痛をおこさせたいのですか、あなたは。わたしは、もっとずっと多額の貸付けをするつもりでいたのですからね」

「そうですか……それじゃ、いまはもうなにもいいますまい。ところで、この四百ドルはどのくらい使いでがあるんですか？　貨幣価値はどうなっているのですか？」

「うーむ。これまた、難問ですな」

「ヒントだけで結構です。食事するのにどのくらいかかるんです？」

「食事はまあ高くなし、安くなしというところでしょうな。十ドルあれば、充分な料理が取れます──中ぐらいの値段のレストランを選べばですよ」

　ぼくはダウティ氏に礼をいい、気分よく外へ出た。ダウティ氏はかつての軍隊時代の給与係下士官を思いださせた。給与係下士官には二種類しかない。一種類は、当然入るべき金を、なんのかのと規則にこじつけて減らそうとかかるタイプで、もう一種類は、規則書を端から端までほじくり返して、たとえそれだけの資格はなくても、必要なだけ取れるようにしてくれるタイプだ。

　そしてダウティ氏は、この二番めのタイプだった。

　冷凍場サンクチユアリはウィルシャー滑走道路ウエイズに面していた。前の広場のあちこちにベンチが置かれており、灌木の林や花園があった。ぼくはベンチのひとつにかけて、西へ行こうか、それとも東かと考えた。ダウティ氏には強そうなことをいったものの、内心、ぼくはひどく弱っていた。ズボンのポケットに、一週間ぶんの食費が入っているとはいえ、心細いかぎりであった。

　だが、陽光は暖かく、ウィルシャー滑走道路の微かな唸うなりは心地よかった。ぼくはまだ若く（少なくとも生理的には）二本の丈夫な手と頭脳がある。口笛で流行歌（三十年前の）を吹きながら、ぼくはタイムズ紙の求人欄をひらいた。

　ぼくは〝技術者──熟練者を求む〟という項目に目を通したい衝動に抵抗して〝未熟練者〟のページを繰った。

　求人は皆無に近かった。





　　　　　６





　二日目に、ぼくは職にありついていた。西暦二〇〇〇年十二月十五日、金曜日である。だが、それまでにぼくは、比較的ゆるやかな法律との衝突をはじめ、新しいもののいいかた、ものの感じかた、もののしかたと、かなり紛糾した経験をしなければならなかった。西暦二〇〇〇年に生きることは、本で読むのとかなりちがった。それはセックスについて本で読むのに似ていた。

　もしぼくがオムスクとか、サンティアゴとか、あるいはジャカルタとかいう遠いところへやられていたら、そうまで面くらわずにすんだと思う。知らぬ土地の知らぬ町に行く場合には、風俗習慣がちがうだろうと最初から考えてかかる。ところが、グレイト・ロサンゼルスでは、いくらこの目で変わったところを見ていても、無意識のうちに、昔ながらの変わりないロサンゼルスであることを期待しているのだった。もとより、三十年の推移はたいしたものではない。一生のあいだには、誰だってそれくらいの、いやそれ以上の変化を経験しているのだ。しかし、一晩のうちにそれだけの変化に遭あうのは、おのずから別問題だった。

　たとえば、ぼくがなんの気もなしに使った言葉ひとつにしてもそうだった。ぼくは、前にいた女性に、いきなり眉をつり上げて怒られて面くらった。もしぼくが、冷凍睡眠者スリーパーであることを大急ぎで説明しなかったら、その女の夫に、すごいアッパーカットをくっていたにちがいない。いまここではその言葉は引用しな──いや、しよう。ぼくは、説明するために引用するのだ。もちろん、ぼくの子供の時にも、良い意味で使われてはいなかった。しかしそのころの、その言葉を、歩道にチョークで書きなぐったりはしなかったのだ。

　それは──〝異常なキンク〟という言葉である。

　このほかにも、いまだにぼくがうまく使えない──使う前にちょっと考えなければならない言葉がいくつかある。それは必ずしも前述のようなタブーの言葉ではないが、意味内容がすっかりちがってしまったのである。たとえば〝主人ホスト〟という言葉だ。これは、コートをとってくれて部屋のハンガーにかけてくれる男のことで、出生率とはなんの関係もなかったのだ。

　しかし、ぼくはどうにかやっていけた。ぼくのありついた職というのは、新品の自動車を、スクラップとして、ピッツバーグの自動車工業地帯へ送り返せるように、ぶち壊す仕事だった。キャデラック、クライスラー、アイゼンハワー、リンカーン──その他あらゆる型あらゆる種類の、立派な、大きな、強力なターボ・エンジンを備えた自動車、走行距離計が一キロも出ていない新車を、巨大な破砕機ジヨークラツシヤーの歯のまんなかへつっこんで、ぐわん、がちゃん、ぐしゃっ！　かくて熔鉱炉行きのスクラップができあがるという寸法なのだ。

　これは、最初ぼくの気持ちをひどく傷つけた。ぼくはいつも滑走道路ウエイズに乗って仕事に出ていたし、自分の自動車を持てる身分ではなかったからだ。ところがぼくは、そういう意味のことを口に出したおかげで、危うくせっかくの職をふいにするところだった。ぼくが冷凍睡眠者コールドスリーパーであったことを、職長が思いだして、ぼくには現代というものがよく理解できないのだと考えてくれなかったら、馘く首びはまちがいなかったのだ。

「ごく簡単な経済問題だよ、にいちゃん。この自動車は政府が生産費維持貸付金に対する保証として認めている余剰製品なんだ。二年前の自動車だから、絶対売れっこない。そこで政府がぶち壊して製鉄会社に売りわたすわけさ。熔鉱炉ってものは、原鉱だけやってたんじゃ、引き合わねえ。やっぱし、スクラップの鉄も作らなきゃならねえのさ。いくら睡眠者だからって、そのくらいの理屈は知ってなきゃしょうがねえぜ。まったくの話、程度のいい原鉱がいまじゃめったに取れねえんで、スクラップに対する需要は増える一方なんだ。鉄鋼業にはこの自動車がなくちゃならねえのさ」

「しかし、最初から売れないのがわかっているんなら、なぜわざわざ生産するんです。無駄な労力だと思いますがね」

「無駄のように見えるだけさ。それともなにか、おまえは労働者を失業させてもいいというのか？　生活水準を下げようってのか？」

「それじゃ、海外へ売り出したらどうなんです？　ぼくにいわせりゃ、スクラップにすることより、海外の自由市場に輸出したほうが、ずっと利潤があがると思いますがねえ」

「なんだと！　そんなことをして、輸出貿易をぶち壊しにしろってのか？　そればかりじゃねえ、もしこの自動車をそんな具合に海外へダンピングしてみろ──世界じゅうから文句をつけられらあ。日本も、フランスも、ドイツも、大アジア共和国も、みんなからよ。なにを考えてるんだよ、おまえは。戦争でもおっぱじめるつもりか？」職長は長ちよう歎たん息そくして、父親のような温情あふれる調子になった。「ちっとは図書館へでも行って本を読むんだな。もう少し勉強してからじゃなきゃ、おまえには、こういった難しい問題に口を出す資格はねえよ」

　ぼくは口を閉じた。ぼくは、あえて、暇さえあれば市の図書館かＵＣＬＡ図書館に入り浸って本を読んでいることは話さなかった。いや、ぼくは、自分がかつてエンジニアであったことをも隠すよう努めていた。いまぼくがエンジニアだと名乗ることは、あたかも、十六世紀の錬金術師が現代のデュポンへでも押しかけて、「これ、我わが輩はいは技術者様であるぞ。我輩ほどの術が使いきれるか」と威張り散らすようなものなのだ。

　ぼくはそれ以上の口を慎んで、余計なことはいわぬように心がけたが、もう一度だけ、どうしても我慢できなくなって、この問題をいい出したことがある。ほかでもない、価格維持用の自動車の大半が、不完全な製品だったのを発見したからだ。仕上げは雑だし重要な部品──計器や換気装置の類がしばしばついていない。ところがある日、破砕機の歯が自動車をくわえたところを見ると、なんとフードの下に肝心のエンジンがついていないのを発見したのだった。ぼくはそのことを職長に告げた。

　だが、ぼくは逆に職長から怖い顔で睨にらみつけられた。

「なにをいい出すかと思えば、馬鹿だなおまえは。余剰生産の自動車に念の入った仕事がしてなきゃいけねえとでも思っているのか？　この自動車は、組立工場にまわる前に生産費維持貸付金が取れたんで、もうそれ以上面倒なことをするのはやめたんだ」

　かくてぼくは口を閉じ、これに関しては、それきり、二度とあげつらうことをやめた。結局ぼくは技術者なのだ。技術者は技術者らしく技術面のことだけを考えていればよい。経済学はぼくにとっては難解すぎた。

　だが考える時間はふんだんにあった。ぼくのやっていた仕事は、ぼくにいわせれば仕事でもなんでもなかった。重要な仕事の大半は、おおむね、ぼくの〈万能フレキシブルフランク〉がさまざまに姿かたちを変えたロボットの手によってなされていた。フランク一族は破砕機を操作し、自動車を正位置に進め、スクラップになったその残骸を取りのけ、数をかぞえ、重さをはかる。そしてぼくは、狭い看視台上に立ち（すわることは厳禁だった）、なにか事故が起きたら、全作業にストップをかけるスイッチを入れるのが役目だった。そんな事故はちっとも起きなかったが、やがてぼくは、事故のあるなしにかかわらず、一交替中に少なくともひとつは、なにかロボットの失敗を見つけて、仕事を中止させ、修理班をそこへ差し向けること自体がぼくの仕事に含まれていたことを知ったのだった。

　しかし、これでも一日二十一ドルにはなるし、それだけあれば食うにはこと欠かない。衣食足りて礼節を知るの理ことわりだ。

　このうちから、社会保険、組合費、所得税、国防費、医療保険、厚生年金保険といろいろ差し引かれて、家へ持って帰れるのは十六ドル。ダウティ氏は食事一回に十ドルかかるといったが、あれは間違っていた。簡易食堂へ行って三ドルも出せば立派な飯が食えた。ただし、真物ほんものの肉でなければなどと贅沢をいうのではだめだが、そんなことをいうやつにかぎって、ハンバーグ・ステーキが、タンクで作られた肉か、天然ものの肉か、区別できはしないのだ。しかも、密輸肉をうっかり食うと、放射能中毒になるという噂が流れているときだ。ぼくは人工肉で結構満足していた。

　住むところを決めるのが、またちょっとした問題だった。ロサンゼルスは、六週間戦争中、スラム街撤去計画が施行されなかったため、驚くべき数の避難民が流れこんでいた。そして、戦争が終わったあとも立ち去ろうとしなかったのだ（ぼく自身も、そうした避難民の一人だった。もっとも、ぼくはその時はそうは考えなかったが）。帰っていく家を持っていた連中までもがだ。この都市は──グレイト・ロサンゼルスを都市と呼べるならばだが──ぼくが冷凍睡眠コールドスリープについた当時ですら、窒息しそうなほどの人口過剰に悩んでいた。いまではそれが、女性のハンドバッグの中のような、想像を絶する混沌さを加えていたのだった。あるいは、スモッグをとりはらったのが、間違いだったのかもしれない。六〇年代でさえも、咽喉炎のためにロサンゼルスを離れる人は、ごく少なかったのである。

　それが、今では、誰一人出ていかなくなってしまったのだ。

　冷凍場サンクチユアリを後にした日、ぼくは、いろいろなことを計画していた。まず第一に職を探すこと、第二に寝る場所を見つけること、第三に、エンジニアとしての遅れを取り戻すこと、第四にリッキーを見つけること、第五に、なし得れば──得るかどうかわからないが──自分の力で、エンジニアとしてやっていく方法を見つけること、第六にベルとマイルズとを見つけ、刑務所に放り込まれない程度に彼らをぶちのめすこと、第七にいくつかの細かいことを片づけること──たとえば、ビーバー・ロボットのオリジナル特許を見つけ出し、それが、〈万能フレキシブルフランク〉であるというぼくの第六感の正しさを確かめ（これは、利害関係ではなく、完全な好奇心からだ）、〈ハイヤーガール〉の社史を調査する等々である。

　ぼくはこれらを、優先順にリストにした。というのは、なん年も前（あやうく落第しそうになった、工科大の一年生のころのことだ）、ぼくは、優先順をきめて物事をやらないと、まさに椅子とりゲームで音楽がとまったとき、立ちんぼうのままとりのこされるということを発見していたからだ。もちろん、優先順とはいっても、いくつかを同時に進行させることはある。たとえばぼくは、エンジニアとして努力しながらリッキーを探し、同時にベル一味を探そうと思っていた。だが、先のことは先に、後のことは後に、だ。職を探すことは、寝るところを探すよりも先にしなければならない。先立つものが、すべてに先行するのだ……しかもその、先立つものがないときは特に。

　市内で六回めの求人先をはねられてから、ぼくは、サン・バナディノ・ボローまで、広告につられて出かけたが、十分着くのが遅かったために、それも逃してしまった。こんな時は、すぐにその場で、雑ざ魚こ寝ねでもいいから宿をとるべきだったのだ。ところがぼくは、利口に立ちまわったつもりでまた市内へ舞い戻った。どこかその夜一晩泊まるところを探して、翌朝うんと早く起き、朝刊に載った仕事に一番に行って並んでやろうと考えたのである。

　それが愚の骨頂だったことを、知る由よしもないぼくだった。ぼくは、安宿を四軒歩きまわって予約申込書に名前を書き、ついに万策尽きて公園に来た。ぼくは公園に腰を落ち着けた。暖を取るために、ほとんど真夜中まで公園じゅうをぐるぐる歩きまわった。そして──ついに我慢しきれなくなってしまった。ロサンゼルスの冬は寒かった。ぼくはウィルシャー滑走道路ウエイズのステーションの中に避難した。そして、午前二時ごろ、警官の一隊がやってきて、同じくステーションにたむろしていた浮浪者たちと一緒に、ぼくも狩りこまれてしまったのだ。

　監獄は改善されていた。少なくとも、戸外より暖かだった。

　ぼくの罪名は騒乱罪バラツキングであった。判事は若い男で、読みさしの新聞から顔をあげてみようともせずに、「みな初犯かね？」と警官に訊いた。

「そうです」

「三十日の禁固だ。でなければ労役後仮出所。つぎ」

　警官がぼくらを前進させようとしたがぼくは動かなかった。「ちょっと待ってください、裁判長」

「なに？　なにか不服があるのか？　おまえは有罪をみとめるか、否認するか？」

「それが、よくわからんのです。だいいち、ぼくは自分がなにをしたので捕まったのか、それさえわからないんですからね。つまりぼくは──」

「つまりおまえは官選弁護士が望みなんだな？　それだと、弁護人がおまえの事件を扱うことのできるまで、豚箱入りになるぞ。早くても六日はかかるが、しかし、それはおまえの権利だ。望むようにしよう」

「そういわれても困るんです。ぼくの望むのは労役後仮出所というやつかもしれないが、それがどんなものかがわからないし……ぼくの一番ほしいのは、裁判長閣下の忠告なのです」

　判事は看守にむかって、「ほかの者を連れていけ」と命じてからぼくのほうをふりかえった。

「では話せ。念のためいっておくが、本官の忠告はおそらくおまえの気に入らんぞ。本官は充分な経験を積んでいるから、たいがいなでたらめは聞いただけでわかるし、でたらめに対しては非常な嫌悪を感じる習慣がついているのだからな」

「ぼくの話はでたらめではありません、裁判長。調べていただけばわかります。実は、ぼくはきのう冷凍睡眠コールドスリープから蘇生したばかりなのです、そして──」

　だが、彼はたちまち嫌悪の情を顔にみなぎらせた。

「おまえもあの連中の一人なのか？　いったいなんでまたわれわれの祖父たちは、自分のくずどもをわれわれのところへ送りつけようなどと考えたものかね。ロサンゼルス市がおよそ世の中でもっとも歓迎しないものがなんだか教えてやろうか、ええ？　これ以上の人間だよ。ことにおまえらのような、自分の生まれた時代でもやっていけなかっただらしのない連中だ。まったく、できることなら、おまえの首に、〝あんたがたの夢みる未来の世界にも黄金の舗装道路はありません〟という手紙をくっつけて、おまえの来た年へ蹴り返してやりたいくらいだ」彼は歎息ひとつして、つけ加えた。「が、そんなことをしてもはじまらないだろう。それでおまえは本官になにをしてほしいというのだ？　もう一度だけ機会を与えてやるのか？　そして、一週間も経たないうちにまたここに舞い戻ってこさせるのか？」

「判事さん、そんなことにはなりませんよ、きっと。ぼくは、なんとか職にありつけるまでの金は持っているし、それに──」

「なに？　金を持っているものが、なんのために集団騒乱の仲間に入っていたのだ？」

「それなんです、判事さん。ぼくは、その言葉の意味がまずわからないんです」そういうと、今度は彼は、ぼくに説明の機会を与えてくれた。そしてぼくが、マスター保険で全財産をなくしたところへ話が来ると、彼の態度ががらりと変わってしまった。

「ろくでなしどもめが！　ぼくの母も、二十年契約をして保険金をやられたんだ。なぜそれをはじめからいわなかった」そういって彼はカードを一枚とり、そのうえになにか書きつけて、「これを持って余剰生産調節局の求人受付へ行ってみたまえ。もしそこでも職がなかったら、今日の午後ここへ来てぼくに会う。わかったね？　二度と、集団騒乱などしちゃいかんよ。犯罪と悪徳の巣になっているだけじゃなくて、きみ自身が、ゾンビ組織の秘密勧誘員の手に陥ちる危険があるんだ」

　こうして、ぼくは、新車をぶち壊す仕事にありついたのだった。しかしぼくは職探しを第一にしようと決めたことに間違いはなかったと思っている。銀行にたっぷり預金のある男のための家はどこにでもあるし、警察も放っておいてくれる。

　そして、ぼくの予算の範囲内で、なかなか住みやすい部屋をみつけた。前はもっと大きな部屋の衣装部屋だったらしい部屋であった。





　こんな有様だったからといって、ぼくのこの西暦二〇〇〇年を、一九七〇年のころに比べ、気に入っていなかったと考えてもらっては困る。ぼくは二〇〇〇年が決していやではなかったし、蘇生して二週間めに巡ってきた二〇〇一年も同様に気に入った。時おり、ほとんど耐えられないようなホームシックの発作に悩まされながらも、ぼくは二十一世紀の夜明けのグレイト・ロサンゼルスを、かつて見たこともないすばらしい都市だと思っていた。能率的で清潔で刺激の強い大都会、ただ、人間が充満しすぎているのが難だったが、それすらも、いまや、マンモスのように巨大で大胆な規模の都市計画によって解決されつつあったのだ。ロサンゼルスの新都市計画地域は、技術者の夢をいやが上にもそそるものだった。もし市当局に、今後十年間新規の転入者を阻止する法案を可決させるだけの実力があれば、住宅問題もなんとか片がつくところだが、それがないので、せめてできる範囲で浮浪者の群をくいとめようとしていたのだった。

　世の中から風邪というものが一掃されて、水みずっ洟ぱなをたらす者が一人もいなくなったのも驚異だった。これだけでも、優に三十年間眠りつづけた甲斐はあるというものだ。少なくともぼくにはこれが、金星に探険隊を送るより、ずっと有意義な問題に思えた。

　さらに、二つの事柄がぼくに深い感銘を与えた。ひとつは、いうまでもなく重力制御法ヌルグラヴの発見である。一九七〇年代にも、すでに、バブスン研究所で重力研究が盛んに行なわれていたが、ぼくには、成果があがるとは思えなかった。事実、この重力制御法ヌルグラヴの根本をなす場の基礎的理論は、バブスンでなく、イギリスのエディンバラ大学の研究に基づくものであった。ぼくはかつて学校で、重力を制御する方法などというものはあり得ないと教えられてきた。なぜなら、引力は宇宙の在りかたそのものに本来備わっているものだからである。

　ということは、人類がついに宇宙の在りかたそのものをすら変えてしまったことを意味する。もちろんそれは、局部的、一時的なものであり、そしてまた、あくまで地球上での場の相関関係にとどまっているので、これを宇宙船の動力として使用することは、少なくとも二〇〇一年の現在の段階ではできないのだが、重い物体を地球上の一地点から他の地点へ動かすという目的のためならば、これで充分なのである。たとえば、サンフランシスコから、グレイト・ロサンゼルスへ物を運ぶにも、その物体を空中のある高さまで持ちあげておき、これにわずかな力を働かせば、物体はちょうど氷上スケートのように、まったく動力なしでするすると滑走してくるという具合なのだ。

　すごい！　ぼくは舌を巻いた。

　ぼくは、この理論を勉強しようとした。が、その数学は、テンソル解析が終わったところから始まっている。とてもぼくの手に負えるものではなかった。しかし、考えてみれば、だいたい、技術者というものは数理物理学者である必要はないし、また、たいていの場合そうではない。ぼくら技術者は、実際面に応用できる程度に、表面をかすめておけば、用は足りるのだ。

　もうひとつのほうは、スティックタイト繊維の完成が可能とした、女性の服装の変わりかただった。ぼくは海水浴場で女性が一糸まとわぬヌードになることには、さして驚きもしなかった。この傾向は、一九七〇年ごろからあった──いや、もっと以前から今日あることがしめされていた。だが、スティックタイト繊維の密着性を利用した女性のスタイルの奇怪さには……ぼくは、あいた口がふさがらなかった。

　ぼくの祖父は一八九〇年の生まれだが、もしこの祖父が一九七〇年まで生きていたら、おそらくこの気持ちをわかってくれたろう。

　だが、こうした世界の極端な変貌にもかかわらず、もしぼくが、あれほどきびしい孤独感に、あれほどしばしば襲われなかったら、この力強い若々しい新世界は、非の打ちどころなくぼくの気に入っていたのだ。ぼくは淋しかった。耐えられないほど孤独だった。そして時おり、ぼくには、（たいていふと目覚めた真夜中など）一匹の傷だらけの猫とでも──あるいは、ただ一度かわいいリッキーを動物園につれて行くためだけにでも──あるいはまた、かつて、モハーヴェ砂漠で、毎日、淡い希望と辛い仕事に明け暮れていたころのマイルズとの友情を、一日取り戻すためだけにでも、全世界をなげうっても惜しくない気持ちになることがあったのである。

　こうして、ぼくが失業対策のための水増し雇用の職につくづく愛想をつかし、一日も早く懐かしい製図板の前へ帰りたくなったのは、二〇〇一年もまだあまり日数を重ねていない春のころだった。現在の技術水準をもってすれば、一九七〇年代には現実不可能だった多くのことが、わけなくやれるのだ。ぼくは、なんとかして仕事に取りかかりたかった。アイデアはぼくの頭脳の中に、数ダース渦巻いていた。

　たとえばぼくは、自動秘書機オートマチツク・セクレタリがもう実用の段階に達しているものと信じていた。人の力をいっさいかりずに、それにむかって口述しさえすれば、綴りから句読点からフォーマットまで、完璧な手紙を書いてくれるような機械である。ところが、現実にはそれらしいものもないのだ。もちろん、口述タイプライターと称するものを誰かが発明してはいた、がそれは、たとえばエスペラント語のような発音と文字が一致する言葉にしかつかえない。複雑な英語などでは、まったく役に立たないしろものだったのだ。

　発明家の都合にあわせて人々が英語の非論理性を放棄するなんてことはないだろう。モハメットは山に行かなければならないのだ。だが、女子高生でも、かなり面倒な英語の綴りを区別できるし、たいていはタイプもきちんと打てるのだ。これが機械に教えこめないはずはないとぼくは思った。

「そんなことができるものか」といわれるむきがあるかもしれない。人間は判断力と理解力を持っているからこそ、高校生にでもできるのだと。しかし、まさにそこにこそ発明家の舞台があるのではないか。発明とは、それまで不可能であったものを可能にするという意味である。そのために、政府が特許権を保護するのだ。

〈万能フレキシブルフランク〉に使ったメモリチューブと、現在の技術水準が可能とした超小型精密化の技術と（ぼくの思ったとおり、これを可能にしたのは黄金を材質としたためだった）この二つをもってすれば、一立方フィートの空間に十万個の反応装置を詰めること──言葉を換えていえば、ウエブスターの大学生用辞典にのっているあらゆる言葉を収容することだって、簡単なことなのだ。しかも、そこまでの必要はぜんぜんない。せいぜい一万語も入れば充分役に立つのだ。人間の速記タイピストにだって、ある程度以上専門的な言葉を正しくタイプしろなどと要求する人はいないだろう。たとえば〝kourbash（革鞭）〟や〝pyrophyllite（葉よう蠟ろう石）〟といった言葉だ。どうしても使いたければ、そのたびに、口述者が綴りを教えてやればいい。

　よろしい。この機械には、必要な場合は綴りを受け入れる能力も備えよう。句読点は音声コードで対応し、さまざまなフォーマットをととのえる。そして、ファイルを調べて住所を知る能力、コピーを何通とったらよいか決める能力、発送の能力などもみな備える──それから、仕事や事務に用いうる特別なボキャブラリーのためには、少なくとも千個の空白欄を設け、使用者が、そのたびに彼自身で綴ってみせられるようにする。こうすれば、使用者は、一度だけ、記憶装置用のボタンを押してその言葉を機械に綴ってみせれば、それ以後その言葉は秘書機の語ご彙いに加えられるというわけだ。

　じつに簡単明瞭である。すでに市場に出ている機械を組み合わせ、それから生産モデルにするだけでよいのだ。

　ただひとつの困難は同音異語ホモニムの問題だった。この口述機は、かなり似通った綴りの単語でも、音がちがっているかぎりは類別できる。しかし、「彼らは（They're）」と「彼らの（their）」や「正しい（right）」と「書く（write）」などの場合がどうしても混同されるのだ。

　ロサンゼルス図書館へ英語同音異語辞典を探しに行ってみると、あった。ぼくは早速どうしても避けられない同音異語の数をかぞえ、文脈によって識別する方法と、特別の記号をつけて識別する方法とを考え出した。

　こうして仕事は進んだものの、ぼくは、だんだん、いらいらしはじめた。一週三十時間も、愚にもつかない労働に費していることがいやだったばかりでなく、図書館の読書室では、ろくな仕事もできなかったからだ。むしょうに自分の製図室がほしかった。部品のカタログや工業日誌や計算機や、その他必要なもののそろった、仕事のしやすい製図室が。

　ぼくは、心ひそかに、近いうちに必ず多少なりとも技術に関係のある仕事にありついてやるぞと決心した。もちろん、ぼくとても、自分が再びエンジニアといわれるだけのものになったと自うぬ惚ぼれるほどの馬鹿ではなかった。ぼくがまだ学びきれていない──自由自在のものとしきれていないことは、それこそ山ほどあった。新しく身につけた技術を使って、ああもできる、こうもできるぞと内心得意で図書館の本を見ると、すでに誰かが、その同じ問題を、ずっとスマートに、見事に、しかも安く、もひとつおまけに十年も十五年も以前に考え出しているという事実にぶつかったことも、二度や三度ではなかった。

　ぼくは、どこかの工業関係のオフィスに雇われて、そうした技術を、骨の髄にまで浸透させたかった。そのためには製図工の見習いの職にでもつければ一番いい。

　しかし、最近そういったオフィスでは、製図工の見習いなど置かず、たいてい、一種の半自動的な製図機を用いて仕事の能率をあげていた。癪しやくにさわる機械ができたものだと思ったが、その製図機の写真を見たとき、ぼくはなにかはっとした。この製図機なら、機会さえ与えられれば、二十分とかからずに、操作法をマスターしてみせるぞと思った。というのはほかでもない──その製図機は、三十年前のある日、ぼくが考えついた製図機のアイデアに、じつによく似ていたからである。製図者が椅子にすわってキーを押すだけで、イーゼルの上の任意の箇所に、直線なり曲線なりを描き出すことができるところなど、まるで、ぼくのアイデアを模倣したとしか思えないほどなのだ。

　しかし、これにかぎっては、〈万能フレキシブルフランク〉の場合のように、ぼくのアイデアが盗まれたのではないことは確かだった。なぜといって、製図機は、ぼくの頭脳のなか以外には、まだ存在していなかったのだから、これほど確かなことはない。誰かがぼくとまったくおなじアイデアを持っていて、それを、ぼくがやったらおなじことをしたにちがいない過程を経て実現させただけなのだ。

　ビーバー・ロボットの製作元アラジンが、こうした製図機のうちでももっとも優秀な〈製図機ダン〉を作っていた。そこである日、ぼくは、一計を案じ、貯金を総ざらいして新しい服とセコハンの書類鞄を買いこみ、鞄の中には新聞紙を詰めこんでふくらますと、アラジン商会のショウルームへ出かけた。

　ぼくは応対に出たセールスマンに、〈製図機ダン〉を見せてもらいたいといった。

　待望のダンに近づいたとき──ぼくは、思わずあっと声をあげそうになった。後にも先にも、あんな奇妙な印象を受けたことはない。心理学者のいういわゆる既視感デジヤ・ヴユだ。来たことのあるはずがない土地に、確か来たことがあると考える心理的倒錯。それは、まさしくぼくの頭脳の中にあったとおりの形──もしぼくが、やつらの奸計にひっかかって、冷凍睡眠コールドスリープに送りこまれなかったら、そして、それからいままでの時間を、この機械のために費していたら、そうもしたであろうような形をしていたのだ。

　なぜそんな、と理由を訊かれても答えようはない。自分の仕事は、自分にはわかるのだ。美術批評家は、筆さばきの具合ひとつから、あるいは光線のあてかたから、構図の取りかたから、絵具の選択からでさえ、これはルーベンスであるとか、レンブラントであるといったような見わけがつく。エンジニアの仕事もおなじことで、ある意味では芸術だ。ひとつの技術的な問題を解くにも、それぞれの流儀と方法がある。エンジニアは、絵描きとおなじように、その流儀の選びかたで、自分の仕事にはっきりと署名するのだ。

　ダンは、あまりにも明瞭に、ぼく独得のテクニックの個性を持っていた。ぼくはしばらく呆然として立ちつくした。テレパシーというものが、やはりこの世に実在するのだろうかと思っていた。

　やがて、気を取りなおしたぼくは、ダンの特許を調べてみた。その最初の日付が一九七〇年となっているのを見たときは、もう前ほど驚かなかった。見る前からわかっている気がしていたのだ。だれがこれを発明したのか、つきとめてやるぞと心に誓った。ことによったら、ぼく自身が現在のスタイルを学び取った、ぼくの先生がたの一人かもしれない。それとも、かつて一緒に仕事をしていたことのある同僚かもしれない。

　おそらく、この機械の発明者はまだ生きているにちがいない。もしそうなら、いつかその人に会いに行ってみよう。自分とまったくおなじ心の動きを持った人物に会うのは、怖いような気がするが。

　ぼくはセールスマンに、機械を操作して見せてもらった。だが、その必要もないほどだった。ダンとぼくとは、生命あるもの同士のように、最初から息があったのだ。十分と経たないうちに、ぼくはそのセールスマンよりずっとうまくダンを使いこなせるようになっていた。しばらく夢中で使ってみたのち、ぼくは未練たっぷりに操作盤をはなれ、それから定価を訊き、値引きやアフター・サービスの話を取り決めたあとは契約書にサインするばかりにしておいて、すぐ電話するからといって出てきてしまった。汚いやりかただが、結局相手に与えた損害は、一時間ばかり時間を潰させただけなのだ。

　アラジンを出ると、ぼくはすぐその足で〈ハイヤーガール〉の本社に行き、就職したいと申し出た。

　そのときまでに、ぼくは、マイルズとベルとが、すでに〈ハイヤーガール〉株式会社にいないことを確かめていた。毎日の仕事と、現在の技術水準に一日も早く追いつくための自分の勉強とで、一日の時間のほとんどは費されたが、それ以外のあらゆる余暇を利用して、ぼくはマイルズとベルと、とくにリッキーの行方を探していたのだ。三人とも、グレイト・ロサンゼルスの電話登録名簿を調べたかぎりでは、とうとう発見されなかった。さらにぼくはクリーヴランドにある連邦事務局に調査費まで払って、合衆国じゅうの電話登録者名簿を調べてもらったが、それもついに無駄におわった。

　ロサンゼルス郡カウンテイの投票者登録局への問い合わせも、おなじ結果しかもたらさなかった。

　ぼくは〈ハイヤーガール〉株式会社に手紙を書いた。折り返し第十七代の副社長から、この種の愚にもつかない質問に答えるありきたりの文面の返信が来て、三十年以前にはその名の重役もいることはいたが、現在はいない、お役に立てなくて残念であると書いてあった。

　こうなれば、自分で探してみるしか手はないが、三十年も昔のことを調べるのは、暇も金もろくにない素人探偵の手に負える仕事ではない。専門の探偵事務所に頼んで、莫大な賞金でもつければ、書類を調べたり過去の新聞を漁あさったりして、ついには探しあててくれるかもしれないが、莫大でなくとも、賞金などぼくに出せるわけがなかった。

　ぼくは、ベルとマイルズの行方を探すことを諦めてしまった。ただ、少しでも余裕ができたら、さっそく専門家を雇ってリッキーの行方だけはどうしてもつきとめよう、と決心した。リッキーが〈ハイヤーガール〉の株を持っていないことはほぼ確実だった。ぼくは、バンク・オブ・アメリカ宛に手紙を書いて、その名前の人物が信託預金をしているか、でなければしていた事実が過去においてあったかどうかを確かめたのだ。バンク・オブ・アメリカからはやがて返事があって、そうした事柄はいっさい秘密だから当事者以外に洩らすわけにはいかないと書いてきた。ぼくは折り返し手紙を送った。ぼくは冷凍睡眠者コールドスリーパーで、彼女はぼくのたった一人の肉親だから、例外を設けて教えてくれ、といってやったのだ。すると今度は、前よりずっと丁重な手紙が来た。それには、銀行の重役の一人のサインがしてあって、信託預金に関する情報は、ぼくの場合だけ例外をつくって教えるわけにはいかないが、フレデリカ・ヴァージニア・ジェントリーという名前の人物が、バンク・オブ・アメリカ本店を含む傍系のどの銀行にも、信託預金を預けたという事実は過去にも現在もないようです、と書いてあった。

　やはりあの悪党夫婦は、なんらかの方法を用いて、リッキーからあの株を取りあげてしまったのだ。ふつうだったら、その株券は、ぼくが手配しておいたとおりに、バンク・オブ・アメリカを通じてリッキーに譲渡されていなければならないはずなのだ。可哀そうなリッキー。憎むべき強盗夫婦め。ぼくだけでは飽きたらず、リッキーのものまで盗みとったのか。

　それでも、ぼくはもうひと押し押してみた。モハーヴェ郡の教育監督局には、フレデリカ・ヴァージニア・ジェントリーの名の小学校児童が存在したという記録が残っていた。だが、同児童は一九七一年転校の手続きを取り、それ以後の消息は不明であると書類は告げていた。

　誰かが、どこかで、リッキーの実在を認めてくれたのが、せめてもの慰めだった。だが……そのリッキーが合衆国じゅうになん千、なん万と数知れぬパブリック・スクールのどこへ転校していったのか、それは皆目見当もつかないのだ。もし学校へいちいち手紙を出していたら、どのくらい時間がかかるだろう？　それに、こんな問い合わせに答えられるほど学校の記録は整っているのだろうか？

　三十年前に、二億五千万の人々の中に飛びこんだ女の子一人──それは、大洋に投げこまれた一個の小石にもひとしいのだ。





　だが、こうした探索が空むなしく終わったことは、ひとつだけ有意義な成果を生みだした。このおかげでベルとマイルズが〈ハイヤーガール〉の経営者でないことがわかり、ぼくは〈ハイヤーガール〉に職を求めに行く気になったのである。ほかにもロボットの製造会社は百以上もあったが、アラジン商会と〈ハイヤーガール〉は、家庭用ロボット業界ではもっとも知られたメーカーで、その業界の占める地位は、ちょうど陸上自動車全盛期の自動車工業におけるフォードやゼネラル・モーターズにも匹敵していた。ぼくは、感傷的な気持ちで、アラジンよりも〈ハイヤーガール〉を選んだ。ぼくは、ぼくの古巣がどう発展したか見たくてならなかったのだ。

　二〇〇一年の三月五日月曜日、ぼくは〈ハイヤーガール〉の求人課の事務所に出かけた。技術部門となんら関係のない事務系統の臨時の求人しかなかったので、仕方なしにその列に入ったが、面倒な書類を一ダースも書かされたあげく、「追ってご通知します」という例の挨あい拶さつで、みんな追い返されてしまった。

　ぼくは係員のあとを追いまわして、とうとう求人課の課長代理に会うことができた。彼は面倒くさそうに書類をめくっていたが、やがて、三十年もブランクがあったのでは、技術者としての前歴もなんの意味もないですなといった。

　ぼくは冷凍睡眠者コールドスリーパーであることを彼に念をおした。

「なおわるいね。いずれにしても、うちでは、四十五歳以上の人は雇わない方針なんだ」

「だって、ぼくは四十五じゃないですよ、まだ三十になったばかりだ」

「一九四〇年生まれでかね。お気の毒だが、だめだな」

「それじゃ、ぼくはどうすればいいんだ？　自殺でもするのか？」

　彼は肩をすくめた。「わたしなら、養老年金を申請するね」

　ぼくは急いで事務所を飛び出した。そして四分の三マイル歩いて、本社の建物の正面玄関からあがりこんだ。ＧＭの名前はカーティスだった。ぼくはカーティスに面会を申しこんだ。

　ぼくは前から待っていた弁護士二人を、急用だからといって飛ばして前へ進んだ。〈ハイヤーガール〉株式会社はロボットの製作会社のくせに、受付ロボットを使っていなかった。受付嬢はきれいな人間の女の子だった。ぼくは何十階かでエレヴェーターを降りた。あと二つくらいでＧＭの部屋というところまできて、ぼくはこわもての女性の秘書にとっつかまった。秘書は用件をいえといってきかない。

　ぼくはあたりを見まわした。そこは大きな部屋で、およそ四十人ぐらいの人間の事務員と、かなりの数のロボットが仕事をしている。秘書が鋭くいった。「さあ、早くご用件をおっしゃってください。わたくしがカーティス様の来客係の秘書に連絡してさしあげますわ」

　ぼくはわざと周囲のみんなに聞こえるような大声を張りあげて、怒鳴った。「ぼくの女房をどうする気だといってくれ！」

　六十秒後に、ぼくは首尾よく彼の私室に通されていた。カーティスはぼくを見あげた。

「いったい、あのでたらめはどういう了見なんだね？」

　ぼくは、三十分あまりかかって、ぼくには妻と名のつく女などいず、実は、何を隠そう、ぼくこそこの会社の創設者だということを彼に納得させた。昔の記録類が引っ張り出された。とたんに、待遇は一変した。飲みものが出されるやら葉巻をすすめられるやら、彼は営業部長とチーフ・エンジニアその他、さまざまの部の部長たちを呼び寄せてぼくに紹介した。

「わたしたちは、もうあなたは亡くなったとばかり思っていましたよ」と、カーティスがいった。「事実、社の記録には故人になったと載っていたんですからね」

「デマですよ。どこかほかのＤ・Ｂ・デイヴィスでしょう」

　営業部長のジャック・ギャロウェイが唐突に口をはさんだ。「ミスタ・デイヴィス、あなたはいまどういうことをやっていらっしゃるのです？」

「たいしたことはやってません。自動車工業のほうにちょっと関係してましたがね。近日中に辞めようと思っています。なぜですか？」

「なぜとおっしゃるんですか？　一目瞭然じゃありませんかね」ギャロウェイはチーフ・エンジニアのマクビーをふりかえると、言葉を継いだ。「聞いたかい、マック。きみたち技術屋ってものは、みんなおなじだね。きみたちときたら、決して販売という面から物事を見ようとしないから、すごい好機がむこうからやって来ても、まるで気がつかないんだよ。なぜかといいますとね、ミスタ・デイヴィス、あなたが宣伝効果そのものだからですよ。あなたはロマンスなんだ、英雄なんだ！　創設者故郷に帰る！　世界最初のロボット発明者、輝かしきロボット工業の発展に感激」

　ぼくはあわてて口をはさんだ。「ちょっと待ってくださいよ──ぼくは宣伝用のマネキン人形でもなけりゃ、映動グラビースターでもないんだ。ぼくは人から騒ぎたてられたくないんだ。そんなつもりでやって来たんじゃなくて、技術関係の職がほしくてやって来たんだ……」

　マクビー氏の眉がぴくりとあがったが、なにもいい出さなかった。

　いっとき、言葉の応酬が続いた。ギャロウェイは、それが、ぼくの創設した会社への義務だといってぼくを説き伏せようとする。一方、マクビーはあまり口をきかなかったが、彼はぼくの入社をあまり歓迎していないこと、ことに彼の部門には、あまりプラスになりそうもないと思っていることが、ありありと見てとれた。話の途中で、彼はぼくに、ソリッド・サーキットの設計についてどう思うかと訊いたが、ぼくは、その知識についてあまり専門的でない本をすこしかじった程度であることを認めなければならなかったのだ。

　最後に、カーティスが妥協案を提案した。「ねえ、ミスタ・デイヴィス、あなたの立場はきわめて微妙だ。ある者は、あなたが、この会社の創設者のひとりであるばかりか、この種の工業全体の創始者だというでしょう。たしかにそうです。がしかしだ、ミスタ・マクビーがさっきちょっと触れられたように、ロボット工業は、あなたが冷凍睡眠コールドスリープに入られて以来、不断の発展を遂げてきたのです。さてそこで、あなたを会社の幹部として迎える際の地位だが……そうですな、名誉技術研究室長というのはどうです？」

　ぼくはためらった。「それはどういう役柄なんです？」

「あなたの好きなように考えてくだされば結構。ただし、率直に申しあげると、あなたにはおもに営業部門でミスタ・ギャロウェイに協力していただくことになると思います。われわれはロボットを作るだけでなく、売るのが目的なのですからな」

「技術部門のこともやらせてもらう機会はあるんですか？」

「それはあなた次第だ。設備も便べん宜ぎもあるのだから、あなたの好きなことをやっていただければいい」

「技術部門の設備と便宜ですね」

　カーティスはマクビーの顔を見た。チーフ・エンジニアが答えた。

「もちろんですよ、もちろん、もっともな理由さえあればね」それ以上は形容詞だらけの（二〇〇一年のだ）いわゆるグラスゴー式スピーチというやつで、ぼくは少しも理解できなかった。

　ギャロウェイが調子よく、「よっしゃ、それで決まった。ぼくはちょっと失礼させていただきます。いや、行かんでください、ミスタ・デイヴィス。いま、〈ハイヤーガール〉の第一号モデルと一緒に写真を一枚撮らせてもらいますからね」

　彼は文字どおり能率的だった。だがそれよりぼくは、〈ハイヤーガール〉の第一号モデルに再会できたことが嬉しかった。ぼくが、この二本の腕で、汗水流して組み立てたわが子だ。ぼくは、彼女がまだ働くかどうか試してみたかった。だがマクビーはどうしてもぼくに彼女を操作させてくれなかった──彼は、ぼくが〈ハイヤーガール〉の操作法を知っているということが、信じられないらしかった。





　三月と四月を通じて、〈ハイヤーガール〉におけるぼくの生活は楽しかった。今までほしくてたまらなかったさまざまの道具や業界専門誌、必要欠くべからざる商品カタログの類、工業図書館ほど揃った参考書籍類、それに例の〈製図機ダン〉（〈ハイヤーガール〉は製図機は製作していなかったので、市場でもっとも優れているアラジンの製品を使っていた）。なかでも嬉しかったのは、職場でつれづれに聞く同僚技術者たちの専門的な会話だった。それはぼくの耳に、こよなき天上の音楽としてひびいた。

　技術者仲間でも、組立部のサブチーフ・エンジニア、チャック・フロイデンバークとは、特に仲良しになった。ぼくの貯金にかけて、チャックは〈ハイヤーガール〉の技術者中、ただ一人の真の技術者といえる男だった。のこりの連中は教育過剰の大風呂敷屋で、その点ではマクビーも例外ではなかった。このチーフ・エンジニアどのは、大学で学位を取って、技術者らしいスコットランド訛りをおぼえればいっぱしの技術者に見えると思っている、これらの技術者たちの好見本だったのだ。のちに、もっと親しくなってから、チャックに話したら、彼も同じように思っていることを認めた。「マックは正直なところ新しいものはなんによらず好きじゃないんだ。できるものなら、彼のじいさんが、昔クライド海軍工廠でやってたような具合にやりたいところなんだろうよ」

「彼はチーフ・エンジニアとしてどういう仕事をしているんだ？」

　フロイデンバークにも詳しいことはわからなかった。現在の会社は、以前は〈ハイヤーガール〉から特許の使用権を借りて製作するだけの製作会社だったのが、二十年ほど前、一連の税金対策の一環として〈ハイヤーガール〉の株と現在の会社の株とが交換され、現在の会社が、ぼくの創設した〈ハイヤーガール〉の名前を継承することになった。マクビーはそのころ会社に入ったらしいとチャックはいった。「だから、彼も株の一部は持っているだろうよ」

　チャックとぼくは夕方になって会社が退ひけると、酒場へ行ってビールをくみ交わしながら、工業技術についての話や、会社の今後の方針や、その他もろもろの問題について語りあうようになった。彼がぼくに興味をおぼえたのは、ぼくが睡眠者スリーパーだったからであった。その前からぼくは、睡眠者スリーパーだというとたいていの連中が（まるでぼくが怪物ででもあるかのように）あくなき好奇心を発揮するのが嫌だったので、できるだけぼくが睡眠者スリーパーだということを知らせないようにしてきた。だが、チャックの場合はほかの連中とちがって、冷凍睡眠が可能とする時間的な跳躍ジヤンプそのものに興味を持っていたので、純粋な知的興味から、自分の生まれる以前の世界がどんなふうだったか、その世界を、あたかも昨日のことのように経験して知っている人間の口から聞きたがっていたのだった。

　そのかわりに彼のほうは、ぼくの頭のなかで渦巻いていた新しい機械類についての知識欲を充みたしてくれ、ぼくが、二〇〇一年にあってはすでに無価値になってしまったものに引っかかろうとするたびに（ぼくはしばしばこれを繰り返した）ぼくの方向を是正してくれた。こうした彼の親しい導きを得て、ぼくは急速に現代科学の水準に追いつき、現代の技術者になっていたのである。

　だが、ある四月の夕方、ぼくが例の自動秘書機の設計について話すと、チャックは急に改まった口調でいった。

「ダン、きみはその仕事を会社の時間にやったのか？」

「え？　いや、そうじゃないけど、なぜだ？」

「きみの雇用契約はどうなっている？」

「雇用契約だって、そんなもの、ぼくにはないよ」

　カーティスがぼくの名前を給料簿に載っけてくれ、ギャロウェイがぼくの写真をなん枚か撮らせて、そのあとで広告部のコピーライターをぼくのところによこし、愚にもつかない質問をさせた。それきり、そんなことはまったく触れられなかったのだ。

「なるほど……。ねえダン、ぼくだったら、自分の立場がはっきりするまで絶対口外はしないね。それはすごい発明だ。きっと成功すると思うよ」

「その点についちゃ、心配はしてないんだ」

「とにかく、もうしばらくのあいだそっとしておくんだな。きみは会社の現状を知っているだろう。会社は黒字だし、製品もいい、ただ、この五年間、ぼくらが会社にもたらした新製品は、すべてぼくらの独力で強引に会社に通したものばかりなんだ。およそマックを通してちゃ、なにひとつ成じよう就じゆしたためしがない。きみもマックを通り越して、直接ボスに持っていける機会を待つんだよ。でなきゃ、ぜんぜん黙っているかだ──きみがその発明を、会社の給料のうちだと考えて、会社に渡してしまうつもりでなかったらね」

　ぼくはこの忠告をききいれた。そして、設計は相変わらず続けたが、これでよしと思った部分の設計図は片端から焼き棄ててしまった。一度頭に入れてしまえば、そんなものの必要はなかったからだが、こうしてもぼくはべつに罪の意識は感じなかった。彼らはぼくを技術者として雇ったのではない。ギャロウェイの宣伝用のマネキン人形としてぼくに給料を払っているのだ。もしぼくの宣伝効果がなくなったら、彼らは一カ月分の給料を退職金としてよこし、サヨナラグッドバイと馘く首びにしてしまうにきまっているのだ。

　だが、そのころまでには、ぼくは立派な現代技術者になっているから、いつでも自分の会社を創ることができる。もしチャックに一か八かやってみるつもりがあれば、彼と一緒にやりたいと思っていた。

　ジャック・ギャロウェイはぼくの話を新聞に渡してしまわずに、全国的な大雑誌に掲載して効果を引き延ばすことを考えた。そして、ライフ誌に話を持ちこみ、三分の一世紀ほど前、〈ハイヤーガール〉がはじめて市販されたときと同様のタイアップ広告をしようと持ちかけた。ライフはこの餌に乗ってこなかったが、彼はそのほか何種類かの雑誌にタイアップ広告を載せることに成功した。

　ぼくは恥ずかしくて、鬚ひげでも生やしてやろうかと思った。そして、世間の誰一人もぼくを知らないことを思いだした。いや、知っていても、気にかけないだろうことを。

　事実ぼくは、この宣伝のおかげで、妙な手紙をひと山ほども受け取った。そのうち一通などは、神様のみ心に叛そむいて、自分勝手に人生を扱った罰で、おまえは必ず地獄に堕ちて業火に焼かれるぞと書いてあった。ぼくは噴きだした。もし神がほんとうにぼくの身におこったことに反対されるならば、冷凍睡眠コールドスリープに入れられたとき、あれを阻止してくださらなければならなかったはずだ。ところが事実はそうではなかった。そうでなければ、それ以外のことは、ぼくの知ったことではないのだ。

　ところが、思いがけないことがおこった。二〇〇一年五月の三日、木曜日、ぼくのところへ、ある電話がかかってきたのである。

「ミセス・シュルツからお電話です。お出になりますか、デイヴィスさん？」

　ミセス・シュルツ？　ああ、そうだった、あのシュルツ夫人か。ぼくは冷凍場サンクチユアリのダウティ氏を最後に訪ねたとき、そのことはぼくが処理すると約束したことを思いだした。しかし、どうも気が進まないのでずるずると引き延ばしていたのだ。どうせ、冷凍睡眠者コールドスリーパーというと後を追いかけてくだらない質問をする物好きな婆さんにきまっているのだ。

　だが、ダウティ氏の話によると、この女は、ぼくが去年の十二月に冷凍場の病院を退院してから、もうなんども電話をかけてきたらしかった。冷凍場の方針にしたがって、彼は、ぼくの住所を女に教えずに、ただ伝言を伝えておく、とそのたびに答えてくれたのだ。

　仕方がない。これ以上ダウティ氏に面倒をかけるのはわるいから、ぼくが出て黙らせてやろう。そう思って、ぼくは交換手にいった。「つないでくれ」

「ダニー・デイヴィスなの？」女の声がした。ぼくの事務所の電話はテレビ設備がないから、むこうにもこっちの姿は見えなかったのだ。

「デイヴィスです。シュルツさんとかいわれましたね」

Ｙ・Ｅ・ロイター





　ぼくはロイターに電話をかけ礼をのべた。これでぼくの知りたいことはすべてわかったようなものだった。想像どおり、ぼくがせっかくリッキーに譲渡しようとした〈ハイヤーガール〉の株は、何者かに横領されていたのだ。記録に載っているハイニックという人間には心当たりはないが、ぼくには、ベルのにおいがするような気がした。おそらくそれは、ベルの別の共犯者か、さもなければまったくの架空の人物かだ。きっとベルは、その当時すでに、こうした影武者を用意して、マイルズをだまし討つべく計画していたにちがいない。

　そしておそらく、マイルズの死後間もなく、ベルは金に困って株を手放したのだ。そこまで考えたとたん、マイルズの株について調べれば、あるいはリッキーの所在をつきとめる材料になるかもしれないと思いついた。もう金曜の午後だから今週はだめだ。来週月曜にまたロイターに頼もうと思って、もう一通の大型の封筒に手をのばした。差出人の住所に見覚えがあったからだ。

　ぼくは三月の初めごろ、ビーバー・ロボットと〈製図機ダン〉のオリジナルの特許について知らせてくれと特許局に手紙を出しておいた。〈製図機ダン〉のことがあって以来、ビーバー・ロボットが、ぼくの〈万能フレキシブルフランク〉の改造型にちがいないというぼくの確信は、すっかり動揺してしまっていた。〈製図機ダン〉がいかにぼくのアイデアに似ているにしろ、ぼくの発明でないことは確かだ。なにしろぼくはそれを頭の中で考えただけなのだから、そのダンを、こうして、誰かがぼくのアイデアそっくりに作ったという事実がある以上、ダンを発明したそのおなじ人物、あるいは他の発明家が、偶然にぼくの〈万能フランク〉とまったく同じ着想のロボットを考えだし、製作したという可能性も、またあり得ないとはいえないのだ。二つの特許が、両方ともおなじ年の出願で、しかも二つともおなじアラジン工業の所有になっているところからも、この想像には根拠がありそうに思えた。

　ぼくはこれをつきとめたかった。そして、もしこの未知の発明家がまだ生きていたら、ぜひ会ってみたかった。彼はぼくにいろいろと教えてくれるはずだ。

　ぼくがはじめ特許局に手紙を出した時には、期限切れの特許の記録は今すべてカールズバード洞窟の国立公文書館に保管されているという返事が返ってきただけだった。そこで公文書館に手紙を書くと、手数料一覧表つきの手紙が返ってきた。そこで、三回目にぼくは二つの特許についてのすべての記録──説明書、権利書、設計図、来歴──を送ってくれるよう手紙に書き、料金を送ったのだ。この厚い封筒はその返事だった。

　上にあったのはビーバー・ロボットに関する書類だった。特許番号は 4307909。ぼくはほかの書類は無視し、設計図を引き出してながめた。ぼくにとっては、面倒な文字を読むより、設計図を見たほうがずっと手っとり早いのだ。

　ひと目見て、ぼくは、ビーバーがぼくの〈万能フレキシブルフランク〉に、思ったより似ていないことを認めざるを得なかった。フランクよりずっと能率的だし、連動装置も簡素化されている。基本的なアイデアは同じだが、トーセン・チューブを使っているかぎり、基本的アイデアが同じになるのは当たりまえだ。

　ふとぼくは、いつかぼくがフランクの改造型を作ろうと思ったことを思いだした。もしあれが実現していれば、ちょうどこんな形になったのではないか……？　召使用としての制限をなくした〈万能フレキシブルフランク〉を、ぼくはたしか、これによく似た設計にするつもりだったのでは……？

　ぼくは書類をひっくり返して発明者の名前を探した。

　あった。Ｄ・Ｂ・デイヴィスとなっている！　やっぱり、これはぼくのだったのだ！

　ぼくは静かに調子っぱずれの口笛を吹きはじめた。それじゃ、あれもベル一流の噓だったのか。いったい、彼女がぼくに話して聞かせたことのなかに、少しでも本当のことがあったのだろうか？　もちろん、ベルの噓つきは一種の病気だ。だが、病的な噓つきにはたいていひとつの型があって、初めは真実から出発して、それに尾お鰭ひれをつけるもので、まったくの空想の場合はめったにないという。すると……おそらくは、ぼくのフランクの試作品は結局盗まれたのでなく、誰かほかの技師に改良のためにまわされて、完成したとき、改めてぼくの名前で、特許出願の手続きをとったのではあるまいか？

　しかし、それではなぜマニックス・グループとの取引が失敗したのだろう。取引の失敗は、ぼくが記録で確かめたのだから間違いのない事実なのだ。ベルは、契約であった〈万能フランク〉の生産の失敗が、マニックス・グループとの取引をだめにしたのだと言っていた。

　マイルズがフランクを隠しておいて、ベルには盗まれたように見せかけたのかな？　そして、また盗まれたのかな？　だとすると……。いや、わからん。

　ぼくは臆測をやめた。それを知ることはリッキーを探すよりもはるかに望みがうすい。アラジン自動工業へでも勤めれば、彼らがどこでこのオリジナルの特許を手に入れたのか、その取引で誰が利益を得たのか、探り出すことはできるだろうが、そんなことはしてみてもしようがない。特許はすでに時効になりかかっているのだし、マイルズはとうの昔に死に、ベルは、かりに一度はなんらかの利益を得たとしても、はるか以前に手放してしまっている。ともかくも、ぼくの確かめたかったことはわかったのだ。オリジナルの発明者はやっぱりぼくだったのである。それで、ぼくの職業的なプライドは救われた。ぼくはそれで満足だった。

　そう考えながら、ぼくはつぎの〈製図機ダン〉の特許書類をめくりはじめた。

　特許番号 4307910。じつにみごとな設計だった。ぼくは、他ひ人と事ごととはいえすっかり嬉しくなった。ぼく自身がやったにしても、とうていこれ以上立派な設計をすることは望めない。連鎖操作の巧妙さ、可動装置を最小限におさえるための回路の巧みな配置、キーボードに、電動タイプライターのキーを利用した点の思いつきの秀逸さ──ぼくは設計者の頭脳の冴えを、しばしほれぼれと見つめていた。

　これはすごい、これこそ技術というものだ。ひとの発明を盗んだなどというものじゃない。天才の仕事だ。

　ぼくは慌あわただしく書類を繰った。この天才の名前を一刻も早く知りたかった。

　そしてその天才の名は──〝Ｄ・Ｂ・デイヴィス〟と記されていたのである。

「今日は金曜だな。酔っぱらってもよしと。よかろう」

　ぼくは書類鞄に設計図その他を詰めこんで、二人して外へ出た。

　ぼくらはまずビールを飲み、それから食事のごときものをし、ついで音楽のいいビヤホールへ出かけてまたビールを飲み、最後に音楽のない、防音装置つきのボックスのあるバーへ行った。一時間に一回ぐらいなにか注文しておけば、ここほど邪魔の入らないところはちょっとないのだ。ぼくらは本題に入った。ぼくは彼に特許の記録を見せた。

　チャックはビーバーの原型を興味深くながめた。

「これはたいしたものだ。ダン、きみのような友人を持って嬉しいよ。いまのやつより、ぼくはこのほうが気にいった」

「ところがだ。これを見てくれ」ぼくはそういって製図機の特許書類を見せた。

「ふむ。ある意味ではこれのほうがまだいいな。ダン、きみは、自分が、現代科学工業に、おそらくはかつてのエジソン以上の影響を与えた人間だということがわかっているか？　きみはたいしたものなんだよ」

「茶化さないでくれ。これは真面目な問題なんだ」ぼくは複写写真にむかって、性急な身振りをしてみせた。「このうちのひとつだけは、確かにぼくの仕事だよ、それは間違いない、しかし……しかし、両方ともぼくの発明であるはずがないんだ。だってぼくは、その製図機のほうを発明したおぼえはないんだからな。ぼくが冷凍睡眠コールドスリープに入る前のことをすっかり忘れてしまったんでないかぎり……つまりぼくが記憶喪失症にかかっているのでないかぎりだ」

「きみはこの二十分ほどそのことばかりいっているぞ。大丈夫だよ、エンジニアはどっちみち少し狂っているんだが、きみもその程度にしか狂っちゃいないよ」

　ぼくはテーブルを平手でばんと叩いた。陶器のビールのジョッキが飛びあがった。「確かめたいんだ！　でなきゃ気がすまないんだ」

「しっかりしろよ。どうしようというんだ、それじゃ」

　ぼくは考えこんだ。「精神分析医のところへ行って、ぼくの過去を掘り出してもらおうかと思ってる」

　チャックが溜ため息いきをついた。「そういうだろうと思ったよ。いいかい、ダン、きみのいうとおり、頭脳屋のおっさんのところへ行って、精神分析をやってもらった結果、きみの記憶は狂ってない、どこも悪いところはないといわれたらどうするんだ？　それこそ、中継線は切れちまうんだぜ」

「そんなことはあり得ない」

「コロンブスもそういわれたのさ。だいいち、きみは、一番あたりまえの説明をしてみてないじゃないか」

「え？　どんなことだ？」

　チャックはぼくの問いに答えずに、ウェイターを呼んで、電話帳を持ってこいと命じた。ぼくはいきりたった。

「なにをする気なんだ、チャック。ぼくを神経内科へでも送ろうっていうのか？」

「いや、まだだね」彼はウェイターの持ってきた分厚い電話帳をしばらく繰っていたが、やがて指を止めるといった。「ダン、ここをよく見てみろ」

　ぼくが見ると、彼の指はデイヴィスという項目を押さえている。いろんなデイヴィスの名前がずらりと並んでいる中に、彼の指さすところには、ダブニーからダンカンに至るＤ・Ｂ・デイヴィスが、優に一ダースは続いていた。

　ダニエル・Ｂ・デイヴィスも三つあった。そのうちのひとつはぼくだった。

「人口七百万以下のロサンゼルスでさえこれだ。二億五千万のアメリカ全体だと、どういうことになると思う？」

「そ、そんなことは関係ないさ」とはいったものの、いまさっきの意気ごみはなくなっていた。

「そうだ、関係はない」チャックは同意した。「確かに、偶然の一致にしても、あまりに符合することが多すぎる。おなじような才能を持った二人の技術者が、たまたま、おなじような機械をおなじ時期に発明していて、しかもその二人の頭文字と苗字がおなじだというのは偶然といいきれない気がする。統計学によってみると、そんなことのおこる機会がいかに少ないかがよくわかる。だが、人は重大なことを忘れがちだ──とくに、きみのような、頭脳のある人間にかぎってそれが多いんだが──そのおなじ統計学上の法則が、そういった偶然は少ないことは少ないが、にもかかわらず依然として存在するという厳然たる事実を教えていることをだ。きみの場合は、まさにそうだとぼくは思う。いずれにしろ、ぼくはそう思いたい。唯一のビール友だちの頭のタガがはずれていたとは思いたくない。良きビール友だちとは得がたいものだからね」

「きみはどうしたらいいと思う？」

「第一は、精神分析医なんかのところへ行って時間と金を無駄にしないことだ。それはあとでもできる。第二はこの特許を取ったＤ・Ｂ・デイヴィスなる人物のファースト・ネームを調べあげること。それにはいくらでも方法がある。おそらく、それはデクスターとか、ことによったらドロシーだったなんてことになるよ。しかし、かりにそれがダニエルであっても、早合点しちゃいけない。まだミドル・ネームがある。うっかり喜んで、そいつが社会保障番号のちがうバーゾフスキーとかいうやつであってみろ。それから第三はだ、いまのところそんなことは忘れて、ビールをもう一ラウンドいこうじゃないか」

　そこでぼくらはまた飲んだ。そして、ほかの話を──もっぱら女の話をした。チャックは、女について、女は機械に似ているが、論理ではわりきれないという持論を持っていた。彼はテーブルの上にビールでグラフを描いて彼の仮説を証明した。

　しばらくののち、ぼくはいきなり話題をもとへ戻した。

「もしこの世に時間旅行というものがほんとうにあれば、ぼくの問題もわけなく解決がつくんだがな」

「え？　なんの問題だって？」

「さっきの問題さ。いいかいチャック、ぼくは、古めかしい二輪馬車みたいな方法でとことことここへ──現在という意味だよ──来た。ところが、困ったことには、後戻りがきかない。そして、三十年前におこったことが、いまぼくを悩ませているんだ。だから、もしここにタイムマシンというようなものがあったら、そいつに乗っかって過去にもどり、真相をつきとめてくることができるんだがなあ」

　チャックは急にまじまじとぼくの顔を凝み視つめた。

「あるさ」

「なにっ？」

　彼はとたんに正気にもどって、しまったという顔をした。

「いっちゃいけないことだった」

「いけなかったかしれないが、もういっちゃったんだ。話せチャック。ぼくがこのビールをきみの頭にぶっかける前に話せ」

「よせダン、忘れてくれ。口がすべったんだ」

「は・な・せ！」

「それが話せないんだ」彼はそっと周囲に目を配った。あたりには誰もいなかった。「軍の機密なんだ」

「時間旅行が軍の秘密だって？　なぜだい？」

「なぜって……きみは役所勤めをしたことがないのか？　やつらは、必要とあれば、セックスだって機密にしちまうよ。理由なんかなくてもいいんだ。それが、役所の方針だ。とにかくぼくはそれに縛られてる。話すわけにはいかない。あきらめろ」

「しかし……おいチャック、ごたく並べるのはやめてくれ。ぼくにとっちゃ、一世一代の重大事なんだ」彼が答えようとせず、むっつり黙りこんでしまったのを見て、ぼくはいった。「話しても大丈夫だよ、チャック。ぼくはＱ等官だったんだ。休職にもなっていない。いまは政府と関係がないだけなんだ」

「Ｑ等官てなんだ？」

　ぼくが説明すると、彼はうなずいた。「ああ、つまり、アルファ級の官吏だったというわけだな。するときみは、相当のお偉方だったわけだ。ぼくはベータ級だからな」

「だから話せないわけはあるまい」

「え？　だって、Ｑ等官ならそれはわかってるはずだろう。国家機密はその官職等級にかかわりなく、その必要性によって、知らせられたり、られなかったりする。きみには、この秘密を〝知る必要性〟がない」

「知る必要性がないだって？　冗談いうな、それこそ、おれがいちばんたくさん持ってるものじゃないか！」

　だが彼は口を割らない。とうとうぼくは仏ぶつ頂ちよう面づらでいった。

「いいよ、わかったよ、そんな秘密なんてないんだ、げっぷがいわせたほらなんだろう」

　チャックは、しばらく厳粛な顔でぼくを睨にらんでいたと思うと、やがていった。「ダニー」

「なんだ？」

「話してやろう。きみがアルファ級であることを忘れるなよ。ぼくがこれを話すのは、きみの問題の解決になんの役にも立たないということを、わかってもらうためだ。いいか。時間旅行というものは確かにある。だが、実用にはならないものなんだ。使えないんだよ」

「なぜ使えないんだ？」

「黙って聞けよ。時間旅行はできたが、重大な欠点がどうしても調整できないのさ。論理的にも、調整できる見込みはないんだ。だから、実用にならないだけじゃない、研究目的のためにも無価値なんだ。これは重力制御法ヌルグラヴの副産物として偶然できたもので……そのため機密になっているんだ」

「だって、重力制御法は機密指定を解除されてるじゃないか」

「それとこれとは関係がない。商業用だって、機密になるじゃないか。まあ、だまって聞け」

　ぼくはだまらなかったが、だまって聞いたことにして話をしたほうがわかりやすいだろう。チャックの話はつぎのようなものだった。チャックは、コロラド大学にいたころ、大学研究所の助手として、学資を稼いでいた。ここには、大規模な低温工学クライオジエニツクスの研究室もあって、彼は最初そこに勤めたが、そのうち大学がエディンバラ大学と契約を結んで、場の理論を専門に研究する新しい研究所をコロラド山中に建てた。チャックはここのトウィッチェル教授──ヒューバート・トウィッチェル博士の助手になるよう転任を命ぜられた。博士はこの年のノーベル賞を取り損ねて、憤慨している最中だった。

「トウィッチェルは重力制御法の研究で第三軸を成極させれば、重力場をゼロにするかわりにこれをマイナスに持ってゆくことができる、という理論を立てたんだ。ところが、実験の結果はさっぱりうまくいかない。そこで彼は、やけになってそれまでの実験のすべてを計算機にぶっこんでみたが、その結果えらいことに気がついた。もちろん、ぼくには教えてくれなかったが、とにかく、ある日彼はタイムマシンのテスト用の檻の中に銀貨を二つぼくにしるしをつけさせてから置いて──そのころはまだ硬貨を使っていたんだ──彼がボタンを押すと……銀貨は二つとも目の前で消えてなくなったんだ。

　これだけなら、たいしたことじゃない」とチャックは言葉をつづけた。「これが、奇術なら、このあと彼はお客さんに向かって、誰か舞台にあがってきてくださいといって、志願者の鼻の穴から銀貨を取り出して見せるところだが、彼は銀貨を消しただけで満足だったらしい。ぼくも、パート・タイムだったから、種あかしを見るために時間潰しはしたくなかった。

　一週間後、そのうちひとつの銀貨が現われた。ひとつだけだった。ところがその前に、ある日の午後、トウィッチェルが家へ帰ったあとでぼくが研究室の掃除をしていると、テスト檻の中にモルモットが一匹現われたんだ。研究室のモルモットじゃなさそうだし、だいいち、前に一度もモルモットなんか研究室内で見たこともないので、ぼくはそのモルモットを家に帰る途中にある生物研究所に持っていった。だが、そこでも、モルモットを数えてみたが一匹も足りなくなってはいないという。そこで家へ持って帰って飼うことにした。

　それから例の銀貨が戻ってきたんだが、その後しばらく、トウィッチェルは、鬚ひげも剃らずに仕事に猛烈にうちこんだ。そして次の実験のとき彼は生物学研究所からモルモットを二匹もらってきて使った。そのうち一匹は、おそろしくぼくのやつによく似ていた。だが、確かめる前に彼がボタンを押したので、二匹とも消えてしまった。

　十日後、そのうち一匹──ぼくのに似ていないほうの一匹が戻ってきたんだよ。つまり、こっちの一匹は未来へ、そしてぼくの見つけたほうのやつは過去へ飛んだわけなんだよ。これで、トウィッチェルはすっかり確信を得た。するとしばらくして、国防省の管区配属将校がやってきた。もと植物学の教授だった大佐だ。これがえらく軍隊式の男で、とうていトウィッチェルなどの手におえる相手ではなかった。大佐はぼくとトウィッチェルに、ぼくらの資格にかけてこの機密を守ることを誓わせた。彼は、それこそシーザーがカーボン紙を発明して以来の大変な兵へい站たん学がく上の発明を手に入れたと考えたらしい。彼は、負けた戦闘の、あるいは負けそうな戦闘の場所へ、前もって援軍を送っておいて、その戦闘を勝利にしてしまうことを考えたんだ。敵は、なにがどうなったかわからないうちに負けてしまうわけだ。彼は狂喜した、ところが……結局、戦争が終わるまで、彼はあれほど欲しがっていた肩の星スターを、増やすことができなかった。そして、彼のくっつけた〝軍事機密〟というレッテルだけは、ぼくの知るかぎり、それから現在に至るまで解除されていないんだ」

「それはまだ軍事目的の役に立つからだろう」とぼくがいった。「ある時間に、軍隊をある場所に送れる仕組みにしておけば……と、ちょっと待てよ。わかったぞ。きみらは、いつも送る対象を対ついにしていたな。すると二個中隊必要なわけだ。一個中隊は前へ、一個中隊は後ろへ行く。そして、必ず一方は捨て石になる。どうももったいない話だな。正しい場所へ、正しい時間に一個中隊だけ送れるようにすれば、ずっと実用的になると思うけどな」

「そのとおりだよ。ところが、実際にはそれが不可能なんだ。対にするのは、要するに質量を釣り合わせるためさ。モルモットだって銀貨だってそうだ。だからたとえば、片方は兵隊一個中隊にして、片方はそれと同じ質量の石でもいいわけだよ。つまり、作用反作用の法則さ、ニュートンの第三法則と同じ系統の」彼はまたビールのしずくを指の先につけて式を描きだした。

「MV＝mv ……ロケットの動力のもっとも基本的な公式だ。時間飛行の公式もこれと同系列すなわち MT＝mt となる」

「どうもわからんね。なぜそれで実用に使えないんだ？　石は安いじゃないか」

「頭脳あたまを使えよ、ダン。ロケットの場合は方向を定めて飛ぶことができる。しかし、時間の場合はどうだ？　先週とはどっちの方向だ！　わかるもんなら、指さしてみてくれ。させないさ。だからだよ、どっちの質量が過去へ行って、どっちの質量が未来へ行くのか、誰にもわかりゃしないんだ。それを調節する装置がないんだよ」

　ぼくは完全に考えこんでしまった。なるほど、援軍が来ると期待している現地の司令官のところへ、砂利かなにかがどかどかっと到着されては困るだろう。例の大佐が昇進できなかったのもむりはない。チャックはなおもしゃべりつづけた。

「ところがまだ悪いことがある。いちばんまずいのは、過去でも未来でも、行ったが最後戻ってこられないことなんだ」

「戻ってこられなくてなぜ悪い？」

「おいおい──戻ってこられないじゃ、研究用にもなんにもならんじゃないか。もちろん、商業用にもならない。過去へ行こうと、未来に行こうと、持ってる金は使えなくなるし、といって出発した時代への連絡の方法はぜんぜんない。設備も、そうだ。それに電力もない。タイムマシンを動かすには、強力な電力がいるんだよ。大学の研究所はアルコ原子力発電所から電力を得ていたが、これがすごく金がかかる。これまた、大きな障害のひとつだよ」

「帰ってこられるじゃないか」ぼくは思いついていった。「冷凍睡眠コールドスリープというものがある」

「過去へ行った場合にはね。しかし、未来へ行っちまったらどうする？　行かないとはかぎらないんだよ。それに、過去に行ったにしてもだ、冷凍睡眠コールドスリープがあるぐらい近い過去に行ければいいが──もしそれ以上──六週間戦争より前じゃだめだよ──前へ戻ってしまったら、なにもかもだめになる。きみの狙いはなんだった？　きみは一九八〇年前後のなにかが知りたかったんだろう。それなら誰かに訊くなり、古い新聞を調べるなりすれば用は足りるじゃないか。とにかく、時間旅行なんてだめだよ。現在へ帰ってこられないだけじゃない、そんな大きな電力の消費を禁ずる法律があるんだ」

「にもかかわらず、時間旅行を試みようとする人間はきっとあるんだ。いままで、タイムマシンに乗った人は一人もいないか？」

　チャックはまたあたりを見まわした。「もうぼくはしゃべりすぎるほどしゃべった」

「だからもう少しぐらいしゃべってもおんなじだよ」

「いままで、三人いたと思う。思うんだよ、いいか。そのうちの一人は大学の講師だった。ぼくが研究室にいると、トウィッチェルとそのカモが──レオ・ヴィンセントという男だ──入ってきた。トウィッチェルがぼくにもう家へ帰っていいといった。ぼくが、研究所の外でぶらぶらしていたら、しばらくしてトウィッチェルが出てきたが、ヴィンセントは一緒じゃなかった。そして、いまだに出てこないんだ。とにかく、それ以後その講師は大学で教鞭をとっていない」

「ほかの二人はどうなった？」

「学生だった。トウィッチェルと一緒に三人して研究室に入ってったが、出てきたときはトウィッチェル一人だった。しかし、そのうち一人は、あくる日の講義に出ていた。もう一人は、一週間行方不明だった。わけはきみのご想像にまかせる」

「きみ自身は行きたいと思ったことはないか？」

「ぼくが？　ぼくの頭がそんなぺたんこに見えるか？　トウィッチェルは、科学の学徒として、すすんで志願するのがぼくの義務みたいなことをいったが、ぼくは結構ですといって断った。しかし、彼が行くときスイッチを押す役なら、喜んでするつもりだったよ。残念ながらそこまでぼくを信用してくれなかったがね」

「ぼくだったらやったな。少なくとも、そうすればぼくの悩みは確かめられるんだ。そして、冷凍睡眠コールドスリープでまた現在へ帰ってくればいいんだ。やってみるだけの価値はある」

　チャックは長ちよう歎たん息そくした。「きみにはもうビールを飲ませないぞ、ダン。きみは酔っぱらってる。ちっともぼくのいってることを聞いてくれないんだな。いいか、第一にだ」彼は数えあげはじめた。「きみは過去に戻れるとはかぎらない。未来へ行ってしまうかもしれない」

「そのくらいの危険は冒すさ。ぼくは、三十年前に現在を好いていた以上に、現在、現在が好きだ。いまから三十年さきはきっともっと好きになれるだろう」

「それこそ、冷凍睡眠コールドスリープで行けばよかろう。そのほうが安全だ。でなければ、ぼくみたいに、おとなしくすわって二〇三一年になるのを待っているかだ。余計な口をはさむなよ、混乱するから。第二に、かりに過去に行けたとしても、一九七〇年をかなり大幅にはずれる危険がある。ぼくの知るかぎりにおいて、トウィッチェルのテストは闇夜に鉄砲なんだよ。ぜんぜん狙いが定まらないんだ。第三に、あの研究所は松林のあとに建てられたもので、完成したのは一九八〇年だ。密生した松林のどまんなかに、研究所が建つ十年前にぴょこんと飛び出してみたまえ、どうなると思う？　きみの身体はコバルト爆弾みたいに大爆発してけし飛んじまうかもしれないぞ」

「し、しかし──どうもわからないな。どうして研究所のもとの場所に飛び出すとかぎるんだ？　三十年前に研究所のあった位置に該当する宇宙空間に飛び出すんじゃないのか？　つまり、その──」

「つまりもそのもない。今いる世界を飛び出すわけにはいかないんだよ。数学は忘れて、実験につかったモルモットを思いだすんだ。とにかく、研究所が建つ以前に戻ったら、松林の中で一命を落とすと思えば間違いなしだ。さて第四。かりにうまくいったとして、正確に三十年前に到着し、生命も無事だったとしても、どうやって冷凍睡眠コールドスリープにはいるつもりだ？」

「どうやって？　ぼくはもう一度経験ずみだ。勝手はいささか心得てるよ」

「金はどうするつもりなんだよ？」

　口を開きかけて、ぼくはまた閉じた。とつぜん、計画全体が馬鹿げて見えてきたからだ。確かにそうだ。前のときはぼくは金を持っていた。それが、いまはまるきりないのだ。貯金をしてためたって……それを持っていくわけにはいかないのだ。冗談じゃない、かりに銀行強盗を働いて（どうしてやればいいか皆目わからないが）百万ドル手に入れたところで、それを一九七〇年へ持っていって使うわけにはいかないじゃないか。ニセ金を使おうとした罪で警察につかまり、一生を牢獄の中で終わるのが関の山だ。札の続き番号がちがうのはもとよりのこと、日付も色もデザインも形さえすっかりちがってしまっている。しかし……「むこうへ着いてから働いてためりゃいいさ」ぼくは口の中でいった。

「結構なことさ。充分たまるころには、冷凍睡眠なんかしなくたって現在へ帰ってきてるよ。ただし、髪が白くなって歯が抜けてね」

「いいよ、わかったよ、しかし、ちょっと変じゃないか。あそこで三十年前に大爆発のあったことがあるのか？　研究所のあったあたりでだよ」

「ないね。ないと思うね」

「それじゃぼくが松林の中で一命を落とすってはずもないよ。現に落としてないんだからね。わかるかい？」

「そうは問屋がおろすもんか。そんな古くさい逆説なら、ぼくのほうが上うわ手てだよ。いいか、爆発はおきず、きみは木の中で一命を捨てなかった。なぜなら、きみは時間旅行に出かけなかったからだ。わかるか？」

「だって、ぼくがやったとしたらどうする？」

「きみはやらないよ。それがぼくの第五の要点だ。これが肝心だから聞き洩らすなよ、きみは時間旅行には出かけない、なぜなら、時間旅行自体が軍事機密になってるからだ。いくらきみがじたばたしても、軍が許可をしてくれないよ。な、だからあきらめろ、ダニー。おかげさまで大変におもしろい知性的な夕べを迎えることができまして、明日の朝はぼくは連邦警察のお尋ねものになってるだろうよ。この世の名な残ごりにもう一杯ずつ乾杯といこう。これで、月曜の朝になっても牢獄に入れられてなかったら、アラジンのチーフ・エンジニアに電話をかけて、このもう一人のＤ・Ｂ・デイヴィス先生のフルネームと、この先生が生きてるか死んじまったかを聞いてみよう。ことによったら、この会社で働いてる男かもしれないや。そしたら昼飯でも一緒に食いながら話をするとしよう。いずれにしろ、このアラジンのチーフ・エンジニアのスプリンガーには、会っておいてもらいたいんだ。なかなか話のわかる男だよ。な、とにかく時間旅行のなんのというタワゴトはやめにしよう。タイムマシンは絶対実用にはなりっこない。あーあ、こんなことをしゃべるんじゃなかったぞ……もしきみが、おれがしゃべったなんて白状しやがったら、きみの目の前で、おまえは大噓つきの馬鹿野郎だといってやるからそう思え」

　そこでぼくらはもう一杯ずつビールを飲んだ。それからそれぞれ家へ帰って、シャワーをあび、飲んだビールの一部を体外へ排出してしまうころには、チャックのいうとおりだとぼくも思いはじめていた。過去を明らかにするために時間旅行に出かけるなどということは、頭痛を癒すために咽の喉どをかき切るにひとしい。それにチャックが、アラジンのミスタ・スプリンガーから、ぼくの知りたいことを聞き出してくれるといったのが効いた。これなら、たかだか昼飯のサラダとチョップをおごる程度で、金もかからず、危険もなく、汗もかかないですむわけだ。

　ベッドにもぐりこむと、ぼくは一週間ぶんの新聞の束に手をのばした。タイムズ紙は毎朝配達チューブでぼくの部屋に届く。いまや、ぼくはれっきとした二〇〇一年のアメリカ市民になったのだ。ぼくは新聞をあまり熱心には読まなかった。というのが、ぼくの頭は絶えずなにか技術的な問題に捕われているのがふつうだったから、毎日のニュースにあるごちゃごちゃした事件の類は、退屈で読むに耐えないか、あるいはおもしろすぎて、ぼくの思案を逸らせてしまう怖れがあったからだった。

　にもかかわらず、ぼくは一応新聞の大見出しと、人口動態統計欄をひととおりながめないではいられなかった。統計欄は、出生、死亡、結婚などの項目を飛ばして、冷凍睡眠コールドスリープから蘇生する人々の告知欄だけを見る。つまりぼくは、いつの日か、三十年以前の世界でぼくの知っていた誰かの名前をそこに発見する望みを捨てきれなかったのだ。もしそうした誰かの名前が見つかったら、飛んでいってその人に会い、せめてご機嫌ようの挨あい拶さつをして、握手ぐらいは交わしたいと、その考えがつねに頭を離れなかった。もちろん、そんな機会はまだ一度だってなかったのだが、ぼくは望みを捨てなかった。そうやって統計欄を見終わると、甲斐はなくとも、一種の満足感を感ずるのだった。

　ぼくは、無意識のうちに、冷凍睡眠者コールドスリーパー全体を、一種の血縁のように考えていたのだ。軍隊で、おなじ部隊にいたもの同士が、おたがいに親友──すくなくとも、再会したとき一杯飲みかわすぐらいの友だちになるのと、おなじ気持ちなのだ。

　新聞にはたいしたことは出ていなかった。火星航路の定期宇宙船が、いまだに行方不明になっているぐらいのものだった。最近蘇生した睡眠者の中にも、見知った名前はなかった。ぼくは横になって電気の消えるのを待った。





　夜中の三時ごろ、ぼくはいきなり目が覚めた。同時に起きあがっていた。電気がついてぼくは明るさにまばたきした。いやな夢を見ていたのだ。悪夢というほどではなかったが、それに近かった。リッキーの消息を、その日の統計欄のなかで見落とした夢だった。

　そんなばかなはずはなかった。だが、ぼくは、新聞の束がまだそこに置いてあるのを見てほっと安堵の胸をなでおろした。眠りにつく前に、習慣的に新聞をダストシュートの中へほうりこんでしまっていた可能性があったからだ。

　ぼくは新聞を引き寄せて、もう一度動態統計欄に目を走らせた。こんどは、念入りに、あらゆる項目を読んだ。出生、死亡、結婚、離婚、養子縁組、姓名変更──いつもは、リッキーがあるいは結婚するか、子供を生むかしていないかという考えから、走り読みするだけだった。こうした欄で、ぼくがリッキーの名前を読みながら気がつかなかったのではないか。そんな予感めいたものが、いきなりぼくの胸に浮かんできたのだった。

　そしてぼくは、危うくそれを……ぼくに悪夢を見させたものを見落とすところだったのだ。タイムズ紙の二〇〇一年五月二日水曜の新聞に載っていた蘇生者リストのなかの、「リヴァーサイド冷凍場サンクチユアリ──Ｆ・Ｖ・ハイニック」という名前であった。

　Ｆ・Ｖ・ハイニック！

　リッキーの祖母の名がハイニックだったのだ！　まちがいない！　なぜまちがいないと思ったのか、なぜいきなり確信できたのか、理由はわからない。だがそれは、記憶の底深く埋もれていたものが、いまこの目で読んだとたんに浮かびあがってきたような感じだった。おそらくぼくは、以前リッキーかマイルズからこの名前を聞くか、あるいは見るかしたことがあるにちがいない。

　そうだ！　あのロイターが調べてくれた株券の所有者の名がハイニックとなっていたことを思いだせ！

　ぼくはもう疑わなかった。その名は、ぼくの記憶の環の喪われた部分にぴたりとあったのだ。

　あとはただ確かめてみるだけだ。Ｆ・Ｖ・ハイニックが、フレデリカ・ヴァージニア・ハイニックであるかどうかを確かめてみるのだ。

　興奮と期待と、そして恐怖に全身が震えた。もうすっかり馴れたはずのスティックタイト服の着かたを忘れて、縫目をあわせればいいものを、一生懸命ジッパーをかける手つきをしていた。おかげで、ぶざまな格好になったが、それでも数分後には、テレビ電話のある玄関ホールまで駆けおりていた。あまり使わないので自分の部屋には電話を置いていなかった。ぼくはただ呼び出しで電話のリストに載っているだけだった。とたんに、電話用のＩＤカードを忘れてきたのを思いだして、身み悶もだえしながら再び部屋へとって返さなければならなかった。ぼくは完全にまいあがっていた。

　いよいよカードを手にして電話の前に立ったときは、手がひどく震えて、スロットルの中へそれを入れることができないほどだった。だが、ようやく入ると、ぼくは〝サービス〟の信号を送った。

「サービス・ステーション。回路をどうぞ」

「リヴァーサイド冷凍場サンクチユアリをたのむ。リヴァーサイド・ボローにある」

「サーチング──ホールディング──サーキットフリー。おつなぎします」

　テレビ・スクリーンがぱっと明るくなって、眠そうな目をした男の姿が現われ、ぼくをねめつけた。「かけちがいじゃないですか。こちらは冷凍場ですよ。夜間は受けつけておりません」

「切らないでください、リヴァーサイド冷凍場なら、まちがいじゃない、ぼくはおたくへかけたんだ」

「いったいなんの用です。こんな時間に？」

「そちらのお客さんでＦ・Ｖ・ハイニックというひとがいる。今度蘇生したひとだ。ぼくはそのひとの──」

　男は首を左右に振った。「わたくしどもでは、電話でお客様についてのご質問にはお答えしないことになっています。ことに、こんな真夜中のご質問ではね。あした十時以後に電話をかけるなり、できれば直接こちらにおいでになるなりしていただきたいですな」

「かけますよ、行きますよ。しかし、ぼくの知りたいのはひとつだけなんだ。Ｆ・Ｖのフルネームを教えてくれませんか？」

「いまも申し上げたように──」

「たのむ、ちょっとでいいから聞いてくれ。ぼくはそこいらにいる物好きじゃない。ぼくも睡眠者スリーパーだったんだ。ソーテル冷凍場サンクチユアリだ。つい最近蘇生したばかりなんだ。だから、冷凍場の規則や制度についてはよく知っている。しかし、この患者の名前はもう新聞に発表になっているんだ。しかもふつうは蘇生者の名前はフルネームで発表される。この場合頭文字だけになっているのは、新聞のスペースが足りなかったからにちがいない。あんたもそう思うだろう？」

　男はややしばらく考えてから、「そうかもしれない」と答えた。

「だったら、このＦ・Ｖという頭文字の綴りをぼくに教えてくれたって、べつに害はないだろう？」

　彼はまだしばらくためらっていたが、やがていった。

「まあ、害はないでしょうな。もしあなたの知りたいとおっしゃるのがそれだけなら。待ってください」

　彼はスクリーンから姿を消した。一時間も経ったかと思うほどの時間が経過した。彼は一枚のカードを手にして戻ってきた。「灯りが暗いんでね」といいながら彼はカードに目を近づけた。「フランセス──じゃない、フレデリカだ。フレデリカ・ヴァージニアです」

　耳がごうごうと鳴るような気がした。気が遠くなりかけて、ぼくはいった。「神様！」

「だいじょうぶですか？」

「だ、だいじょうぶ。ありがとう、ほんとうに、心からありがとう。もうだいじょうぶだよ」

「もうひとつの事実をお知らせしても差し支えないだろうな。あなたも、わざわざ来ないですむかもしれないし」と男がつづけていった。「この患者はもう出ていきましたよ」





　　　　　９





　すぐにリヴァーサイドへタクシーを走らせれば時間の節約になったのだが、あいにく、手元に現金がおいてなかった。ぼくのアパートはウエスト・ハリウッドにあった。いちばん近い終夜銀行は滑走道路ウエイズのグランド・サークルにある。そこでぼくは、まず滑走道路に飛び乗って銀行へ向かった。このときまで、恩恵にあずかることがなかったために気がつかなかったのだが、この全国共通小切手制度は、おそらくもっとも大きな社会的改革のひとつといってもよかったのだろう。たった一台のサイバネティック・ブレーンが、ロサンゼルス全市の手形交換所の用を足して、親銀行から振り替える面倒なしに、どの銀行でも小切手を現金にすることができるのだ。

　現金を手にすると、ぼくはリヴァーサイド行きの急行滑走道路エクスプレスをつかまえた。冷凍場サンクチユアリについたのは、すでに夜がしらじらと明けるころだった。

　冷凍場には、さっきぼくと電話で話した夜勤の技師と、その細君で夜勤の看護師をやっている女性と二人しかいなかった。ぼくはあまりよい印象を与えなかったにちがいない。鬚ひげは剃っていないし、目は血走っている、吐く息は、ビール臭いときている。おまけにぼくには、首尾一貫した噓をつく用意もできていなかった。

　だが意外なところから助け船が出た。夜勤看護師の細君のほうが、意外にぼくに同情してくれて、なにくれとなく気を遣ってくれたのだ。彼女はファイルから写真を一枚持ってきていった。

「これがあなたの従妹いとこさんですか、ミスタ・デイヴィス？」

　リッキーだった。疑いの余地はなかった。確かにリッキーだった！　もちろん、ぼくの知っていた昔のリッキーではない。写真のリッキーは、すでにちいさな少女ではなく、二十か二十一に成長した若い女性のリッキーだった。大人の髪かたちに、大人の、そして、はっと胸打たれるばかりに美しい顔をしたリッキー。彼女はかすかに笑っていた。

　だがその瞳は変わっていなかった。少女時代の彼女を、あれほど明るい愛らしい子供に見せたあの妖精のような性質は年をとらなかった。それは成熟し成長し美しい娘となったリッキーの、しかし見み紛まがうべくもないおなじあのリッキーの顔だった。

　立体写真がぼやけて歪んだ。涙が、ぼくの両眼にあふれた。「そうです」ぼくは曇った声でようやくいった。「リッキーです。まちがいありません」

　技師が横から口を出した。「ナンシー、写真なんか出して見せちゃだめじゃないか」

「なにいってるんです、ハンク。写真を見せるだけの、どこがいけませんか」

「規則は知っているはずだ」というと、ぼくにむきなおった。「電話で申し上げたように、患者さんの消息はお知らせしないことになっているのです。十時になると事務所が開きますから、そのころもう一度いらしてください」

「八時でもいいんですよ」と細君がつけ足した。「ベルンシュタイン博士がいらっしゃるから」

「ナンシー、すこし黙っていられないか、この方が患者の消息を知りたいんなら、重役に会ってもらわなきゃならないんだ。ベルンシュタインだって、われわれ以上のことを答える権限はないじゃないか。それに、あの患者はベルンシュタインの受持ちでもないし」

「ハンク、どうしてそんな難しいことばかりいうの。あなたたち男って、規則のための規則が好きなんだわ。この方が早く従妹さんに会いたいなら、十時まで待つあいだに、ブローリーへ行ったほうがいいじゃないの」彼女はぼくをふりかえった。「八時にもう一度ここへいらっしゃい。それがいちばん早道よ。夫もあたしも、これ以上はなにもお話できないのよ」

「ブローリーがどうこうというのはなんのことです？　従妹はブローリーに行ったんですか？」

　もし夫がその場にいなかったら、もっと詳しく教えてくれたのだろうが、彼女はそこでためらった。夫が厳しい顔をした。彼女がいった。「とにかく、ベルンシュタイン博士にお会いなさい。それから、もし朝ご飯がまだなら、この道をくだったところに、それはよいお店がありますよ」

　そこでやむなく、ぼくはその〝それはよいお店〟に行き、朝食をとったあとで、そこの洗面所を使わせてもらった。洗面所に備えつけの自動販売器から鬚ひげ剃りクリームを出して鬚を剃り、もうひとつの自動販売器からワイシャツを出して、それまで着ていたのと着替え、前のは捨てた。洗面所を出たときには、りゅうとした紳士になっていた。

　だが、おそらく技師は、ぼくのことをベルンシュタイン博士に偏見をもってしゃべったらしい。年の若い博士は、恐ろしく堅苦しい態度でぼくを迎えた。「ミスタ・デイヴィス、あなたは、ご自身も睡眠者だったとおっしゃった。それなら、当然、蘇生したばかりの睡眠者専門に、そのだまされやすい傾向と、新しい環境に不馴れなのにつけこんで、悪事を働くもののいることをご存知でしょう。睡眠者スリーパーはおおむね、かなりの資産を持っている。しかも、彼らの全部が、蘇生した世界の勝手がわからず世間ばなれして、たいていはひどく孤独を感じ、恐怖心さえ抱いている。犯罪者にとっては、申しぶんない獲物なのです」

「しかし先生、ぼくが知りたいのは彼女の行先だけですよ？　ぼくは彼女の従兄です。彼女より前に睡眠スリープに入ったし、彼女が睡眠することを知らなかったから……」

「彼らはたいてい狙う獲物の親戚だというんですよ」彼はぼくにぐっと顔を近づけた。「あなたには、どこかで会いませんでしたかね？」

「そんなことはないでしょう。たまたま滑走道路ウエイズの上かなんかですれちがいでもしないかぎりは」ぼくは、じつによく、人から前に会ったことがないかといわれるのだ。ぼくの顔はきっと、ピーナツかなんぞのように、どこにでもある標準型の顔なのだろう。「先生、それでは、ソーテル冷凍場サンクチユアリのアルブレヒト博士に電話して、ぼくの身分を問い合わせてもらえませんか」

　彼は裁判官のようなもったいぶった顔をした。「まあ、あとで重役に会いにきてください。彼が、ソーテル冷凍場でも──あるいは警察でも、適当と思ったところへ電話をかけるでしょうから」

　ぼくは諦めて冷凍場をあとにした。そして心せくあまり、しなくてもいい失敗をしてしまったのだ。十時まで待って、重役に会い、おそらくはアルブレヒト博士の口添えで、知りたかったすべてを聞かせてもらえただろうかわりに、その足でいきなりブローリーへ飛んでしまったのである。

　ブローリーで、リッキーの足跡をみつけるのに三日かかった。リッキーは祖母と一緒にここに住んでいたのだった。祖母は二十年前に死に、リッキーはそのとき冷凍睡眠コールドスリープに入ったらしい。ここまでは、わけなくわかった。グレイト・ロサンゼルスの人口七百万に較べて、ブローリーはわずか十万にすぎない。二十年前の記録を調べあげるのに手間はかからなかった。ところが、逆に、たった一週間前の彼女の行動を追及する段になって、ぼくははたと行きづまった。ぼくは必死に彼女の行動のあとを追った。

　気になったのは、リッキーが、誰かと一緒らしいことだった。彼女が、何者とも知れぬ男と一緒だということを知ったとき、ぼくはそれが、ベルンシュタインがいった、冷凍睡眠者専門の詐欺師の一人ではないかと怖れた。いそげ！　ぼくはさらに気をひきしめた。

　ぼくは間違った手掛りをつかんでカレクシコまで行ったあげく、またブローリーに舞いもどり、もう一度はじめからやりなおした。今度は正しい手掛りらしかった。ぼくはこれを追ってユマへ飛んだ。

　だが、ユマへ来て、ぼくはリッキーを追うことをついに諦めた。なぜならリッキーは、ああ、ここで結婚していたのである！　郡役所の登記係のところで、その事実を確かめたとたん、ぼくは手にしたものをなにもかもその場に取り落として、デンバー行きの定期便に飛びのっていた。飛行機が飛び立つ前、ぼくはチャックに、ぼくの机を整理して、ぼくの部屋のものをまとめてしまってくれと葉書を書いた。





　デンバーに来たのは、歯科医療器具店で買い物をするためだった。ぼくは、デンバーがアメリカの首都になって以来──六週間戦争で、東部の大都市は壊滅してしまったのだ──一度も行ったことがなかったので、その変わりように目をみはった。目抜き通りだったコルファックス・アヴェニューさえもわからない始末なのだ。重要な官庁その他は、すべてロッキー山脈の山やま間あいの地下にもぐってしまったはずだったが、こうして見たところ、無数の官公庁の建物がまだ地上に残っている。グレイト・ロサンゼルスよりも、もっと乱雑な印象をうけた。

　歯科医療器具店で、ぼくはアイソトープ一九七の金の十四番針金を十キロ買った。工業用の金は、キロ七十ドルで売られているのに、この店ではキロ八十六ドル十セントだったのだから、ずいぶん高価な買い物だった。おまけに、この買い物のおかげで、千ドルしかない持ち金は、むざんに残り少なになってしまった。だが、工業用の金は自然の鉱石としては絶対出てこない合金であるか、それともアイソトープ一九六、または一九八、あるいは用途に応じてその両方を含有している。ぼくの目的には、そうでない純粋の金──自然の鉱石から精錬されてできた金──アイソトープ一九七の金でなければいけなかった。それに、持って歩いているあいだにズボンが焦げたりするのはありがたくなかった。サンディア兵器廠しようでの放射能中毒以来、それにはこりごりしていたのだ。

　ぼくは純金の針金を腰に巻きつけて、ボールダーのコロラド大学へむかった。十キロというと、ちょうど週末旅行用に充分詰めこんだボストンバッグぐらいの重さはある。それだけの金は、一クォート入りの牛乳壜ぐらいかさばる。針金にした場合は、金塊の場合よりもっとかさばるのだ。とても腰バンドむきとはいえないが、少なくとも金塊の場合よりは持ち運びが楽だし、いつも身につけていられる利点がある。

　トウィッチェル博士はまだそこに住んでいた。もっとも、いまは講義は持っていないで、大学の名誉教授におさまり、昼の時間の大部分を、大学の教授クラブのバーで過ごしていた。ぼくは博士を、ほかのバーで待つこと四日、ようやくつかまえることができた。教授クラブは会員制で、ぼくらのような部外者は入れなかったからである。しかし、いざつかまえてみると、彼に酒をおごるのは簡単だとわかった。

　彼は、古代ギリシャ的な意味で──悲劇の人の風貌をそなえていた。偉大な──見るからに偉大な人物の、いまや破滅せんとする姿である。本来なら、アインシュタインやボーア、ニュートンなどとともに、現代科学の偉大な模範とあおがれてしかるべき彼なのだ。にもかかわらず、いまの彼の名を──彼の仕事の真の意義を知っているのは、場の理論を扱う少数の専門家でしかない。そしていま、ぼくが会ったとき、彼の天才的な頭脳は、失意にうちひしがれ、寄る年波に曇り、ひたりきりのアルコールに毒されて見る影もなかった。それは、なにか、かつての壮麗な寺院が、屋根は落ち、柱はなかば朽ちこぼたれて、つる草がその上を一面に覆いつくしている──そんな廃墟を訪れたような感じだった。

　にもかかわらず、彼は最盛期のぼくなどよりよほど優れた頭脳あたまの持ち主なのだ。ぼくは、真の天才を遇する道を心得ていた。

　はじめて彼に会ったとき、彼はぼくを見とめると、かっと目を見ひらいて見つめた。「またあったな」

「はあ？」

「きみはぼくの講義をきいていた学生だろう？」

「いいえ、先生、不幸にして、ぼくはその名誉にあずかりませんでした」どうも、よくひとはぼくを見たと思いこむらしい。ぼくは余計なことを考えるのをやめて、これに便乗することにした。「でも、おそらく先生は、ぼくの従兄弟いとこのことを考えられたんじゃないでしょうか。八六年の卒業生です。一時、先生の講義をうかがっておりました」

「なるほど、そうかもしれんね。そのひとは何を専攻した？」

「それが、学位を取らずに学校をやめなければならなくなりましてね。従兄弟は先生の大崇拝者でした。いつでも、先生のもとで研究していたと自慢して話をしてましたっけ」

　母親にかわいいお子さんですねといって嫌われるはずはない、トウィッチェル博士はぼくが彼の横にすわるのを許し、やがてぼくのおごった一杯を快く受けてくれた。この偉大なる廃墟の、最大の弱点は、彼の持つ職業的虚栄心だった。ぼくは彼と面識を得るまでに費した四日間の一部を、大学図書館で彼についての文献を調べることに費やしていた。そのためぼくは、彼がどんな研究論文を書き、それがどこに提出されたか、彼がどんな学位や名誉を持っているか、そして彼がどんな本を書いたかなどをすべて知っていた。ぼくは彼の著書の一冊を読みかけてみた。ただし、九ページあたりですでにわけがわからなくなってしまったが、それでも、ある程度の知識はそれから拾いあげることができた。

　ぼくは、ぼく自身、科学の非戦闘従軍者であることを話した。そして、現在、『埋もれた天才たち』と題する本を執筆中であるというと、彼はすぐに反応を示した。

「それはどういうものなのかね？」

　そこでぼくは、実はこの本を、先生の人と作品という章から書きおこしたいと思ってやってきたのだと告白した。もちろんそのためには、先生が、その有名な世間嫌いの殻から、少しは気軽に出てきて、いろいろ話をしてくださらなければならない。

　彼はそんな人気取りみたいなことはいやだと、最初いった。だがぼくが、それを彼の後代に対する義務ではないかと指摘するに及んで、彼の態度は変わってきた。その日は、考えておこうということで別れたが、さて次の日になると、彼はすでにぼくが彼の伝記──一章ぐらいではなく、一冊の本として書くものと決めてかかっていた。さあそれからというもの、彼は猛烈に話しまくった。ぼくはいやでもノートを取らざるを得なかった。というのは、うっかりノートを取るマネなどをしていると、時おり彼が読みなおして聞かせろと要求するので、危険この上なかったからだ。

　だが、いつまでたっても彼は肝心の時間旅行については触れようとしない。

　しびれをきらしたぼくは、きっかけを見つけていった。

「先生、以前ここに駐在していたある軍人の邪魔さえなかったら、先生はノーベル賞を獲得していたはずだという噂がありますが、あれはほんとうなのですか？」

　博士は、たっぷり三分間ほど、堂々たるスタイルの呪じゆ詛そを吐きつづけた。「そんなことを、だれに聞いてきた？」

「ええとその、それは──ぼくが国防省のためにある記事を書いていたときのことで……このことはお話ししてありましたね？」

「いや聞いておらん」

「書いていたのです。で、そのとき、国防省のほかの課にいたある若い博士号持ちの男から、いっさいの真相を聞いたのです。その男の話では、もしあなたが、例の研究を公けに発表しておられたら、おそらく、先生の名前は、現代物理学におけるもっとも著名なものとなっていただろう──こういってました」

「ふん！　まあ、噓ではないな」

「しかし、その件は機密になっているとかでしたね、そのなんとか大佐……プラッシュボタン大佐とかの命令で」

「トラッシュボータムだ。あのデブの、ハッタリ屋の、頭に打ちつけてでもおかねば自分の帽子も探せん大タワケだ」

「それはどうも残念で」

「なにが残念だな？　トラッシュボータムのやつが低能なことが残念なのか？　それは自然のなせる業わざで、わしの罪ではないぞ」

「いや、ぼくのいうのは、この話を世間が聞かされないできたことが残念だという意味です。確か、先生はこれについて口外を禁じられているのでしたね？」

「だれがそんなことをいった？　わしはいいたいことはいうぞ」

「ぼくも先生はそういう方だと聞きました……その国防省の友人からです」

「ふむ！」

　その夜は、これが彼から聞きだし得たことのすべてだった。彼が研究室をぼくに見学させる気になったのは、それから一週間後のことだった。

　研究所の建物の大部分は、いま、ほかの研究のために使われていたが、彼の時間研究室だけは、長いこと使用せぬまま、彼が断固として権利を留保していた。彼はその機密指定を楯にとって誰も手を触れることを禁じ、タイムマシンを分解してしまうことも絶対許さなかった。彼の案内でそこへ入ったとき、研究室は、なん年間も閉めきってあった地下室のような臭いがした。

　彼はかなり酔っていたが、それでもしっかりしていて、肝心なことはちっとも洩らそうとしなかった。彼の知能指数は非常に高かった。彼は時間の理論や時間転位（つまり時間旅行だが、彼は決してこの言葉を使おうとしなかった）の理論をぼくに講義してきかせたが、ノートを取ってはいけないと注意することを忘れなかった。ただしそれは、「かかるがゆえに以下のことは明瞭である、すなわち──」ではじまって、説明する彼自身と、おそらく天にまします神様にしか明瞭ではないおそらく難解な問題へと進むのだから、ノートなど、取っても取らなくても、わからないことはおなじだったのだ。

　彼がようやく話をやめたすきにぼくはいった。「友だちの話ですと、先生の天才をもってしても、ついに、タイムマシンの目盛を正確にあわせることだけはできなかったそうですが？　つまり、時間転位の射程が正確に測定できないのだというのですが、そうですか？」

「なんじゃと？　ば、ばかな！　測定のできないものが、どうして科学といえるか」彼は、しばしのあいだ沸ふつ騰とうするヤカンよろしく泡をふいて怒っていたが、やがて続けた。「よろしい、きみに見せてやろう」そして彼は機械のほうに向きなおって、タイムマシンの目盛を操作しはじめた。タイムマシンとはいっても、外に出ているのは、彼が〝転位台〟と呼ぶ、低い台の周囲に檻のように柵をめぐらしたものと、蒸気機関か、低圧室についている操作盤のような設備の二つだけだった。この程度なら、ちょっと調べるだけの時間さえあれば、ぼく一人だって操作できるにちがいない。だがぼくは、前もって博士から、絶対にそばへ寄ってはいけないといいわたされていた。ぼくは、八ポイントのブラウン管、非常に強力な電圧に耐えるスイッチ、そのほか、一ダースほどの、この種の設備によく見かける計器が並んでいるのを見てとった。だが、回路の図式がわからなければ、ぼくにはどうしようもない。

　彼はぼくをふりかえっていった。「きみは小銭を持っているか？」

　ぼくはポケットを探って、ひとつかみほどの貨幣をとりだした。彼はそれを一いち瞥べつすると、中から、その年発行されたばかりの、六角形をした緑色のプラスチック製の五ドル貨幣を二つえらび出した。ぼくはそれを見ながら、せめて二ドル半のやつにしてくれればいいのにと思っていた。というのは、ぼくの懐ふところ具合はすでにだいぶお寒くなっていたからだ。

「ナイフは持っているかね？」

「あります」

「この金に、それぞれきみの頭文字を彫ってごらん」

　ぼくはいわれたとおりにした。それから彼はぼくに、その二つを、台の上へ並べて置くようにといった。「時間をよく見ておきたまえ。いま、目盛をいまから正確に一週間前、プラス・マイナス六秒の誤差で過去に合わせる」

　ぼくは時計を見つめた。トウィッチェル博士が秒を読みはじめた。「五──四──三──二──一秒──そら！」

　ぼくは時計から目をあげてみた。五ドル貨は二つとも姿を消していた。わざと目をむいてみせる必要はなかった。チャックから話には聞いていたが、百聞まさに一見にしかず。ぼくは仰天していたのである。

　トウィッチェル博士のきびきびした音声がぼくを我に返らせた。「今日から一週間めの夜、ここへ来てみれば、いまの五ドル貨のひとつが戻ってくるのが見られる。もうひとつについては──よいか、きみは、二つともその台の上にあったのを見たね？　きみは自分で台の上にあれを置いたことを認めるね？」

「もちろんです」

「わしはどこにいた？」

「操作盤の前においででした」確かに彼は少なくともテスト台から十五フィートは離れたところにいた。そこに立ってから五ドルが消えるまで、一歩も近寄らなかったのだ。

「よろしい。ここへ来たまえ」ぼくが行くと、彼はポケットに手をつっこんだ。「これがもう一方の五ドルだ。そして片方は今日から一週間めに戻ってくる」彼はいいながら、緑色の五ドル貨をぼくの手の上に置いた。それに、ぼくの頭文字が彫られていた。

　ぼくはなにもいわなかった。顎がガクガクして、うまくものがいえなかったのだ。彼はまた語を継いだ。

「実は先週、わしはきみの話を聞いてひどく心を動かされた。そこで水曜日に久々にここを訪ねてみた。そうだ、もうずいぶん長く──一年あまりも来なかったここをだ。すると、この台の上でわしはその五ドル貨を発見した。そこではじめて、わしは、わしがこのタイムマシンを使った──というのは、使うであろうことを知ったのだよ。そして今夜、わしはきみにこの事実を教えてやろうという決心をしたのだ」

　ぼくは掌てのひらの上の五ドル貨をながめてそっと触れてみた。

「これが──これが、今夜、先生とぼくがここへ来たとき、すでに先生のポケットの中にあったのですか」

「もちろんだ」

「しかし、ひとつのものが、ぼくのポケットの中と、先生のポケットの中に同時にあったなんて、そんなことがどうしてあるのです？」

「おいおい──きみのその目は節穴なのかい？　きみは、たんにそれがきみの取るに足らん実在の外にあるというので、この単純きわまる事実が飲みこめんというのか？　よいか、きみは、それをきみのポケットから出してここへ置いた。そしてわれわれはそれを一週間前の過去へ送った。きみの見たとおりじゃ。さてわしは今日より数えて一週間前、それをここで発見した。わしはそれをこのわしのポケットへ入れた。そして今夜、それをここへ出して見せた。おなじ五ドルじゃろうが──正確にいえば、四次元的構造としては一週間ぶん消耗し、一週間ぶん以前より鈍くなったおなじ貨幣じゃ。ただしそれは、赤ん坊が成長して大人になった場合、その赤ん坊と大人とが同一人と見わけられるほどに見わけやすくないが、要するに一週間年をとっているわけだ」

　ぼくは貨幣を見つめた。「先生……ぼくを、一週間前に戻してみてくれませんか」

　彼は憤然としてぼくを睨にらみつけた。「とんでもない」

「なぜいけません？　人間には効かないのですか？」

「なにい？　もちろん、人間とておなじことだ」

「それなら、なぜやってみてくださらないのです。ぼくはちっとも恐くない。しかも先生、この経験がぼくの本にどれほどすごい効果を与えるか考えてみてください！　トウィッチェル時間転位法が真実であることを、著者自身が体験で確かめることができるんですよ！」

「そんなことをせずとも、きみ自身の経験で本を書けるじゃないか。それをたったいまきみは見たはずだ」

「そりゃ見ました」とぼくは静かに肯定した。「でも、あんなことでは、ぼくがいくら書いても信じられませんよ。あんな貨幣ぐらいの実験では、そりゃ、ぼくは実際見もしたし信じてもいます。しかし、ぼくの記事を読むだけの連中は、おそらくぼくがだまされやすくて、先生に手品を見せられて真実と思いこんだにちがいないと考えるにきまってます」

「ばかな！」

「そうなんです。世間というものは、つねにそうした考えなのです。世間の連中は、実際にぼくが見て書いたのだということを決して信じてくれないのです。しかし、もしぼく自身が一週間過去にもどれたら、ぼくは自分の体験をもとにして、世間の連中の納得するような記事を──」

「すわりたまえ、きみ。すわってわしのいうことをきいてくれ」博士はそういって腰をおろした。ぼくはすわろうにもすわる椅子がなかったが、彼はそれに気がつかない様子だった。「わしは、かなり以前、人体実験をしてみたことがあるんだ。その実験の結果、わしは、二度とそれを繰り返すまいと決心したのだ」

「なぜですか？　死んだのですか？」

「死んだ？　ばかをいうな」彼はすごい目で睨んでからまたいった。「これは、本に書いてはいかんよ」

「そうしましょう」

　博士は受話器をもとに戻して、「ばかどもが！」と吐き棄てるようにいった。

　ぼくは一瞬、わがトウィッチェル博士が発作をおこしてその場にぶっ倒れるのではないかと思った。むごいとは思ったが、仕方がなかった。彼を刺激するには、彼に残った唯一の反射作用──虚栄心を利用するしかなかったのだ。

「出てこいきさま、出てこい！　八つ裂きにしてやるぞ！　この両手で、八つ裂きにしてくれる！」

「そうらみろ、やっぱりインチキだ。国防省の連中のいうとおりだったんだ。トウィッチェル、あんたは見かけ倒しの安ペテン師だな。ええ？　ろくでなしのごくつぶしめ。トラッシュボータム大佐はよくいったよ」

　これが効いた。トウィッチェルは、急にスイッチを入れたのだ！

　トウィッチェルがスイッチにつかみかかったとき、ぼくは反射的に、待ってくれ、スイッチを入れないでくれと叫びかけた。だが、時すでにおそかった。つぎの瞬間、ぼくはすでに奈落めがけて転落しつつあった。ぼくの頭脳あたまに最後に閃ひらめいた想いは、ただもう、苦痛にみちた悔恨のそれだった。ぼくは自らあらゆる機会を投げ打ったのだ。ぼくはなにをしたわけでもない罪つみ咎とがもない老人を、死ぬほどいためつけた罪で、自分が未来へ進んでいるのか、過去へ戻ってゆくのか──いや、果たしてどこかへ着くことすらできるのかもわからないまま、まっさかさまに落ちていった。

　つぎの瞬間、ぼくの身体は、いやというほど、なにか堅いものにぶつかった。落ち切ったのだ。感じでは、せいぜい四、五フィートの高さしかなかったのだが、予期していなかったからたまらない。ぼくは棒きれのようにぶっ倒れ、空からの袋かなんぞのようにぺちゃんこにのびてしまった。

　そのとき誰かの声がした。「いったい、どこからやって来たんだきみは？」

　それは人間の男だった。年のころは四十前後、頭は禿げあがっていたが、がっちりとしたいい体格の長身の男である。男はぼくに真正面を向いて両手の拳を腰骨のあたりで握りしめている。いかにも頭脳あたまのきれそうなその男の、敏捷そうな顔は、そのときぼくを睨みつけているのでなかったら、それほど不愉快には見えなかったろう。

　ぼくは半身を起こした。みかげ石の小砂利に松葉の散った中に、ぼくはすわりこんでいた。男の横に、一人の女が立っている。男よりいくつか若い、綺麗な好印象の女だ。彼女は目をまるくしてぼくを見つめているきりで、口を開こうとはしなかった。

「ここはどこです？」ぼくは愚問を発した。

「いまはいつです」と訊いたほうが当を得ていたのだろうが、いっそう馬鹿げて響いたろう。だいいち、ぼくにはその言葉が思いあたらなかったのだ。この男女をひと目見たとたん、ぼくははっきり覚さとっていた。ここは一九七〇年の世界ではないといって、二〇〇一年でも、もちろんない。二〇〇一年だったら、この男女のような格好をしているわけがない。観念の目を閉じてぼくは思った──ぼくは未来へ来てしまったのだ。

　というのはほかでもない。その男も、そして女も日焼けした生まれたままの姿で、身に一糸もまとっていなかったのだ。しかも二人は平気な顔だ。ぼくに見られても、少しも困ったような顔をしていなかった。

　そういわれても、ぼくの服装は、べつだんおかしくはないはずだった。少なくとも、彼らよりはましなはずだ。しかし、ぼくは答えなかった。郷に入れば郷に従えということがある。へたをすれば、面倒がおきかねない気配がした。

　女が、男の腕に手をおいた。「およしなさい、ジョン。このひと怪我をしているんじゃない？」

　男は女をちらと見て、再びぼくに視線を移した。

「怪我をしているのか？」

「たいしたことはなさそうだ。かすり傷ぐらいでしょう。ところで今日はなん日です」

「三日だよ」
