「ボストンバッグをどうなさるの？」

「この人の仮装舞踏会用の衣裳を隠すのさ。こいつはあまり目立ちすぎる」

　ジェニー・サットンが出かける前に、ぼくはそそくさとその辺の灌かん木ぼくの茂みに入って服を脱ぎはじめた。彼女に行かれてしまうと、脱衣場を探す口実がなくなってしまうからだ。ハダカになるのはなんでもないが、ぼくは腰に時価二万ドル（一九七〇年代には金一オンス六十ドルだから、十キロだと最低そのくらいになるはずだった）の純金の針金を巻いている。それを見せるわけにはいかなかったからだ。針金をはずすのに長くはかからなかった。金のベルトをつくってはじめて風呂に入ろうとしたときに苦労していたので、折りたたんで正面でとめておいたのだ。

　服を脱いでしまうと、金の針金をその中に巻きこんで、服だけの重さしかないように軽軽と持つふりをしたが、これがなかなか骨が折れた。ジョン・サットンは、まるめた服を見たが、なにもいわずにぼくに煙草をすすめた。ハダカでどうやって持っていたのかと思ったら、足首に紐でくくりつけてあったのだ。二度と再び見ることもあるまいと思っていた、懐かしい煙草だった。

　ぼくはありがたく一本もらって、ひょいと振ったが、火はつかなかった。ジョンがライターで火をつけてくれた。

「さて」と彼は静かな声音でいいだした。「ここにはぼくときみだけだ。なにかぼくに話しておきたいことはないかね？　ぼくらの客としてクラブに連れていく以上、ぼくはあなたが絶対にみなに迷惑をかけないということを知っておかなければならないんだ」

　ぼくは煙草をひと吸いすった。煙草は咽喉にいがらっぽかった。「ジョン、絶対に迷惑はかけないよ。それはおよそいちばんしたくないことだ」

「うむ、それじゃ、例の〝ぐらぐら〟ってきてうんぬんの話はいまのうちに訂正するかね？」

　ぼくは考えこんだ。のっぴきならない立場だった。この男には知る権利がある。しかし、たとえ真実を話しても、信じてもらえそうもない。少なくとも、もしぼくが彼だったら信じやしない。しかし、もし信じてもらえたらいっそう面倒なことになる。ぼくのもっとも歓迎しない大騒ぎがもちあがること必ひつ定じようなのだ。もちろん、もしぼくが合法的な時間旅行者で、科学の探究に精進する学究の徒であれば、そうした公表を歓迎もし、論議の余地ない証拠を提出して、科学者たちの望むテストをすすんで受けるなどするところだろう。

　だがぼくはそうでない。ぼくは一個人の資格で、しかも若干うしろ暗いところのある密航者だ。他人の注意をひくことは、むしろまったく不本意なのだ。ぼくはぼくの夏への扉をなし得るかぎりひそやかに探し出したいと念願していたのだ。

「ジョン。話しても、おそらくきみは納得してくれないよ」

「うむ……。しかしだよ、ダニー、ぼくはこの目で空から人が降ってくるのを見たんだ。しかも、その男は地上にぶつかって怪我さえしなかった。その男は妙な服装をしていて、自分がどこにいるかも、今日がなん日かも知らなかったんだ。ダニー、ぼくも人なみに、チャールズ・フォート（Charles Fort 一八七四～一九三二。アメリカの超常現象研究家、四冊の有名な著書があり自然界の不思議な事実を集めている）ぐらいは読んでいる。しかし、ぼく自身がそんな機会に遭遇するとは、夢にも思っていなかった。ふたたびしかしだ、そんな機会にこうして面と向かった以上、子供だましの説明を聞いて、はいそうですかと黙っているわけにはいかないな」

「ジョン、さっきからきみがいってることや、きみの言葉つきから判断すると、きみは弁護士だと思うのだが、ちがうか？」

「そうだよ。ぼくは弁護士だ。それがどうかしたかね？」

「ぼくは秘匿特権プリヴイレジド・コミユニケーシヨン（弁護士と依頼人の間での秘密に相談する権利。警察もこれには干渉できない）を行使したいが、いけないか？」

「ふうむ。つまり、ぼくの依頼人になりたいという意味か？」

「そういういい方のほうが良ければ、そうしてもいい。いずれにしろ、ぼくは弁護士の忠告が必要になるだろうから」

「引き受けよう。話したまえ」

「話そう。ぼくは未来から来た。時間旅行者なのだ」

　彼はしばしのあいだなにもいわなかった。ぼくらはそのまま、陽光を浴び四肢をのばして、地面に大の字なりに横たわっていた。ぼくは身体を温めるためにそうしていた。コロラドの五月は、陽は暖かかったが、風が冷たかった。ジョン・サットンのほうはこの気候に馴れているらしく、松葉を嚙みながらもの想いに耽ふけっていたのだ。

「きみのいうとおりだ」やがて彼はおもむろにいった。「ぼくには信じられそうもない。〝ぐらぐら〟説のほうがまだましだ」

「だから、信じてくれないだろうといったんだ」

　彼は溜ため息いきをついた。「それじゃ信じたくないといおうか。幽霊とかよみがえりとか、それからこういった超自然的な魔術は、いずれにしろ信じたくないほうでね。ぼくは、単純なせいか、ぼくの理解できるような単純な事柄が性に合うんだ。たいていの人はそうだろうがね。そこで、ぼくの忠告第一号は、この話をぼくらのあいだだけの秘密にしておくことだ。ほかの人にふれまわってはいけない」

「望むところだ」

　彼はごろりと寝返って身体を起こした。「その衣装は、燃やしてしまったほうがいいな。きみには、あとで何か着るものを見つけてあげる。それは燃えるかい？」

「そうねえ……あんまり燃えやすいほうじゃない。融けるんだ」

「靴ははいていたほうがいい。ぼくらも、ふつう靴だけははくんだ。靴なら、なんとかきり抜けられるだろう。もし誰かにその靴のことを訊かれたら、特別あつらえだとでもいうんだな。健康にいいとかなんとか」

「実際いいんだぜ」

「よし」彼はいったかと思うと、ぼくがとめようとする暇もなく服の包みをほどきだした。

「これはなんだ？」

　しまったと思ったがもう遅い。ぼくは彼がほどくにまかせた。

「ダニー」と彼は奇妙な声を押し出して、「これは見えるとおりのものなのか？」

「なんに見える？」

「金か？」

「イエス」

「こんなもの、どこで手に入れた？」

「買ったんだ」

　彼はそれに触って、柔軟そのものの、パテのような手ざわりを試し、つぎに持ちあげて重さを計った。そして、「驚いたな！」と口走った。「ダニー……注意してぼくのいうことをきけよ。ぼくはきみにひとつ重大な質問をする、充分気をつけて答えるんだ。ぼくは、自分の弁護士に噓をつく依頼人は持ちたくない。噓をついたとわかったら、ただちに契約は解除だよ。それに、もうひとつ、ぼくは犯罪者に手は貸さないのだ。ダニー、きみはこれを合法的に手に入れたのか？」

「もちろんだ」

「では、きみはおそらく一九六八年の金私有禁止法を知らないのだな？」

「いや、知っている。しかしこれは合法的に手に入れたものだ。ぼくはこれをデンバー造幣局ミントへ持っていって売るつもりだったんだ」

「貴金属商の営業許可はあるんだろうね？」

「ない。ジョン、ぼくは単純な事実を話しているんだ、きみが信じてくれても、くれなくても。ぼくのいた未来の世界で、ぼくはこれをちゃんと店先で金かねを出して買ってきたんだ。合法的も合法的、これ以上合法的にできやしない。それでいまは、できるかぎり早い機会に、これをドルに換えたいと思ってる。金きんを私有すると法律にふれることはよく知っているんだ。ぼくがもしこれを造幣局へ持っていって、カウンターの上に、目かたを量ってくれといって置いたら、どうなるかな？」

「どうもならんだろうとは思うよ……もしきみが例の〝ぐらぐら〟話をあくまで押しとおせればね。だが、そうでないと……きみのその後の人生がきわめて辛いものになること間違いなしだ」彼はいいかけると針金を見つめた。「こいつに少し土をつけといたほうがいいな、ダニー」

「埋めろというのか？」

「そこまでする必要もあるまいが……つまりもしきみの話が真実だったら、きみはこれを山の中で発見したことになる。鉱や山ま師しが金を見つけるのはたいてい山の中だからな」

「なるほど……きみのいうとおりにしよう。いずれにしろ、これは絶対合法的にぼくのものなんだから、多少の噓ぐらいは気にしないことにするよ」

「しかしほんとに噓なのか？　きみがこの金をはじめて見たのはいつなんだ？　これがはじめてきみの所有に帰したのは正確にいつだった？」

　ぼくは考えてみた。それはぼくがユマを出発した日で、二〇〇一年の五月のなん日かだった。そしてそれは、いまから二週間ほど前……。

　そうか！

「きみのいうとおりだ、ジョン。ぼくがこの金の針金を見た最初の日は──一九七〇年五月三日。今日だ」

　彼はうなずいた。「そして、きみは、山の中でこれを発見したのだ」





　サットン夫妻は月曜の朝までクラブに泊まることになっていたので、ぼくもそうすることにした。クラブ員たちはみな非常に友好的だったが、その反面、ぼくの個人的な問題については、驚くほど関心を示さなかった。それは、ぼくがいままでつきあったどのグループにもかつてなかったほどだった。やがてぼくは、ヌーディストクラブにおいてはこれが礼儀とされていることを知ったが、それにしても彼らはぼくがいままで会った中でもっとも慎つつましやかな、上品な人々の集まりだった。

　ジョンとジェニーの夫婦は部屋をひとつ持っていたが、ぼくはクラブハウスの共同寝室で眠った。なんだか、おそろしく寒かった。翌朝、ジョンが、シャツ一枚とブルージーンズをくれた。ぼくの服は金の針金をくるんだままボストンバッグに入れて、彼の自動車のトランクの中にしまいこまれた。話はちがうが、彼の自動車は豪奢なジャガー・インペレーターで、これを見ただけでも、彼がそこらの安弁護士でないことは明らかだった。もちろん、ぼくは、彼の態度からそのくらいのことはわかっていたが。

　こうして一晩泊まってあくる火曜日、若干の金が入ったのをはじめとして、例の針金にはそれきりお目にかからなかったが、つづく二、三週間のうちに、ジョンは純金の時価から貴金属商の取る法定手数料を引いただけのドルをぼくに渡してくれた。彼は自分の手数料は一セントも取ろうとせず、貴金属商の領収証と金を一緒によこして、細かいことはなにひとついおうとしなかった。

　ぼくは気にしなかった。というより、現金が手に入ると同時に、猛烈ないきおいで仕事にとりかかっていたのである。一九七〇年五月五日の第一火曜日、ぼくはジェニーの自動車に乗せてもらって、旧商業地区の二階に事務室を一部屋借りた。ぼくはここに製図台と仕事台、それに軍隊用のベッドその他最低限の必要品を備えつけた。このほか、電気と水道とガスとすぐつまる癖のある水洗便所がついていたから、これ以上なにもいらなかった。というより、ぼくは金が惜しかった。これから一セントにもケチケチして、爪に火をともすくらいの覚悟でいなければならないのだ。

　旧式の製図台で、コンパスにＴ定規を使って設計するのは面倒でもあるし、だいいち時間の無駄づかいだ。一刻の時間も無駄にはできないのだ。そこでぼくは〈万能フレキシブルフランク〉より先に〈製図機ダン〉の実用模型を作ることにした。いよいよ〈万能フランク〉を作る段になって、ぼくはふと気がついた。そうだ、ぼくの作るのは〈万能フランク〉ではなかった。フランクをはるかに凌しのぐ真のロボット──人間に可能なことならなんでもできる万能フレキシブルロボット〝護民官ピート〟をこそ作るはずだったのではないか。

　ぼくは猛然と仕事に取り組んだ。特許を取るだけなら、ほんとうは実用模型は必要でなく、設計図と説明だけでよかったのだが、ぼくはぜひ実用品を完成させておきたかった。完全に働いて、誰でも容易に操作できる実用模型である。こうした模型を作っておけば、放っておいても自然と人の目につく。目につけば、その実用価値と、経済的な点とから、これがたんに便利なだけの機械でなく、非常に有利な投資であることが、必然的に知れわたる。したがって売れるということになるのだ。

　仕事の進みかたは、早いとも、遅いともいえた。設計も計算も、すべて細かな点までぼくの頭脳の中ですでにできあがっていたのだから、その意味では文句なしに早かったのだが、一方製造のほうが、さっぱりそれにともなわない。というのは、ぼくには必要な動力つきの工作機械ひとつ、手伝いのスタッフひとりいなかったからだ。やむなく、ぼくは貴重な残金の中から、いくつかの工作機械をレンタルした。そのためそれ以後は、いくらか製造にもスピードが出た。ぼくはただもうがむしゃらに、朝から夜、疲れてぶったおれそうになるまで、働きずくめに働いた。一週間七日ぶっとおし、休みといったら、月に一回だけ、ジョンとジェニーのおともをして、ボールダーの近くのヌーディストクラブへ行くことだけだった。そのおかげで、九月の第一週めごろには、模型は両方とも試運転の段階に入り、ぼくは設計図の準備にとりかかっていた。

　このあいだにも、ずいぶんとはらはらさせられることがあった。一度は、ぼくがサーボ・モーターを買いに市街まで出たとき、偶然、むかしカリフォルニアで知っていた男と出くわしたのだ。そいつが話しかけてきたとき、知らん顔をすればよかったものを、ぼくはうっかり返事をしてしまったのだ。

「おい、ダン！　ダニー・デイヴィスじゃないか！　こんなところで会おうとは思わなかったな。あんたは、モハーヴェ砂漠にいたんじゃなかったか？」

　握手しながら、ぼくはいった。

「仕事の用でちょっと来たのさ。二、三日中にまた帰るんだ」

「おれは今日の午後帰るんだよ。帰ったらさっそくマイルズに電話をかけて、あんたに会ったといってやろう」

　ぼくは思わず顔色を変えた。

「そんなことはしないでくれ、お願いだ」

「なぜさ？　きみとマイルズは、いまでも仲の良い実業界の両大立者ってところじゃなかったのかい？」

「それが……ねえ、モート、聞いてくれ。マイルズはぼくがここにいることは全然知らないんだ。ぼくは、社用でアルバカーキにいることになっている。それを、ぼくのまったく個人的な用件でこっちへやって来ているんだよ。会社にはなんの関係もないことだから、マイルズに知られて、面倒なことを説明するのはいやなんだ」

　この馬鹿野郎はとたんにわかったような顔をした。

「ははあ。女の問題か？」

「いや……じつはそうなんだ」

「人妻だな？」

「まあ、そんなところだ」

　彼はぼくの脇腹をぐんとついたかと思うとウインクした。

「わかった。マイルズ先生はお堅くいらっしゃるからな。いいとも、ダン。いまあんたを助けておきゃ、いつかあんたがぼくを助けてくれないともかぎらないからな、彼女、イケるか？」

　助けてやるとも、この四流の小悪党めが。首くくったら足を引っ張るのを手伝ってやる。この男は外回り専門のセールスマンだったが、お客さんのサービスに気を遣うよりは、旅先のレストランのウェイトレスかなにかを誘惑することばかり考えている種類のろくでなしだった。おまけに扱っている商品は、彼以上に見かけだおしのインチキときている。

　だが、ぼくはそんな気持ちを毛ほども見せずに、彼に酒をおごって、即興の人妻との情事を物語ってきかせ、あとでお返しに、彼のほうの、これまた作りものくさい恋の冒険談を我慢してきいてやった。

　酒をおごるといえば、ぼくはトウィッチェル博士にも会ったのだ。このときは、酒をおごろうとしてついに果たさなかったのだ。

　会ったのは、チャンパ街のあるドラッグストアのレストランのカウンター席で、それこそ偶然に彼のお隣りに席をしめて、ふと前を見やると、前の鏡の中に彼の顔を見つけたのだった。ぼくは、本能的に、カウンターの下にもぐりこもうとしかけた。

　だが、ようやく気を取りなおして考えれば、一九七〇年代に生きていた人間のうちで、およそ彼ほど怖がらなくていい人間はいないわけなのだ。そうだろう、ぼくはまだ彼になにもしていないのだから……ぼくが彼をおそれることはないわけだ。いやそうでない、ぼくは未来において彼を怒らせたのだから、過去の現在はまだ……いや……。もうやめた。うまい言葉になりっこない。将来、時間旅行が一般化したら、英語の文法の時制テンスは完全に新しい時間旅行用の変化をつけ足さないと役に立たなくなるだろう。そうしたらフランス語やラテン語の時制テンスが簡単に思えるにちがいない。

　いずれにしろ、過去であろうと未来であろうと、いまぼくがトウィッチェルを恐れる必要はないわけだ。そう思うと、ぼくはほっと溜息をついた。

　ぼくは鏡の中の彼の顔をつくづく見た。もしかして、よく似た人間を人違いしたのではないかと思ったのだ。しかし、やはりそうではなかった。トウィッチェルは、ぼくのような標準型の顔はしていない、峻厳な線、自信の強い、いくらか傲慢な感じさえ持つ完璧な男性型のその顔は、主神ゼウスによく似ていた。ぼくのおぼえているのは、この顔が、やがて荒廃に帰してしまったのちの残骸でしかなかったわけだが、それにしても見紛うべくもない顔だった。この老人を、ぼくがどれほどひどい目にあわせたかと思うと、内心忸じく怩じたるものがあった。どうしてあの埋め合わせをしたらいいのだろう……。

　トウィッチェルは、ぼくが鏡の中で見つめているのに気がついて、ふりかえった。

「ぼくの顔がどうかしたかね？」

「いや、そのう……あなたはトウィッチェル博士ですね、コロラド大学の？」

「デンバー大学のトウィッチェルだが。きみは誰かね？　きみとはどこかで会ったことがあるかな？」

　そうだ。一九七〇年ごろは彼はデンバー大学で教えていたんだっけ。過去と未来と、両方のことをおぼえておくのは、ひどく骨が折れるものだ。ぼくは若干あわてていった。

「いいえ、先生。でも、ぼくは先生の講義をきいたことがあります。先生のファンです」

　彼の口元がひきつるように歪んだ。微笑しかけたのだが、彼はそのままそれを引っ込めてしまった。そのことから、ぼくは彼の追つい従しようへのあくなき欲求が、このころはまださほど強くなかったことを知った。このころの彼には、まだ強固な自信もあり、ただ若干の自うぬ惚ぼれの度が過ぎる程度だったのである。「きみはぼくを映画スターかなにかと勘ちがいしているんじゃないかね？」彼は苦笑いを嚙みしめていった。

「とんでもない。あなたはヒューバート・トウィッチェル博士、現代物理学界の第一人者ですよ」

　彼の口元がまた歪んだ。

「ただの物理学者だよ。あるいは、物理学者たらんと志して目下修業中というところだ」

　こうして、ぼくたちはしばらくのあいだ雑談を交わした。

　ぼくは、彼がサンドウィッチの食事をすませたあとも、もう少しひきとめようと試みた。そして、もしぼくに一杯おごらせていただければ、これにこした光栄はない、といってみたが、彼は頭を振って拒絶した。

「ぼくはほとんど飲まないし、ことに陽のあるうちは絶対アルコールは口にしない。いずれにしろご好意は感謝する。きみに会えて、なかなか愉快だった。そのうち近くへ来ることでもあったら、ぼくの研究所に寄ってくれたまえ」

　ぼくはぜひうかがうと約束した。

　こうした二、三の偶然はあったが、そのほかは、ほとんど失敗らしいこともなかった。一九七〇年代が理解できたせいもあったが、それより、ぼくの知人のほとんど全部が、カリフォルニアに住んでいたからだった。もしこれ以上知った顔に出くわしたら、妙な助平根性は起こさずに、知らん顔をして、そっぽを向いてやろうとぼくは考えた。

　だがそれより悩まされたのは、むしろ日常生活の些さ事じだった。たとえば服についているジッパーだ。例のスティックタイト式のファスナーも、最初は勝手がちがってとまどったが、馴れてみると、ジッパーなどよりよほど確実で便利なので、再びジッパーに戻ったときはひどく不便を感じた。二〇〇〇年から二〇〇一年にかけて、わずか半年しか生活をしていなかったのに、ぼくはもうすっかり二十一世紀の生活に、馴れ親しんでしまっていたのだ。まったく、ことあるごとに二十一世紀が恋しくなったのには、ぼく自身驚いた。一例をあげれば鬚ひげ剃りがそうだ。二十世紀にかえったとたんに、ぼくは鬚剃りというものが、かくも面倒きわまるものだったかと呆れる想いだった。それから、一度などは、風邪を引いてしまった。忘れ去って久しいこの過去の亡霊にとりつかれたのは、ぼくが、服というものは雨にあえば濡れるものだという事実を完全に失念していたことが原因だった。そのほか、料理がすぐ冷めてしまう皿、洗濯に出さなければならないシャツ、使おうとするときには必ず蒸気で曇ってしまっている浴室の鏡、舗装されていないため、靴──だけでなく肺の中まで埃だらけになる泥道、数え上げればきりがない。とにかく、清潔で完全な二十一世紀の生活に馴れたぼくには、一九七〇年の世界は果てしない不便と面倒との連続だった。

　そういえば、もう一度だけ、危うくえらい失敗をしかけたことを思いだすが、これなども、そうした些事のくいちがいを、うっかり忘れていたための出来事だった。ぼくは、〈ハイヤーガール〉の幹部社員になって、金に余裕ができるようになったころ、年来の虫歯を完全に治療してしまった。それで、もう一生のあいだ歯医者に行くことなどないと思っていたところが、一九七〇年には完全な虫歯予防剤がなかったために、たちまち歯に大きな穴があいてしまった。それがひどく痛むので、そうでなければ我慢してしまうところだったのを、やむなく歯科医へ行ったのだ。しくじったのは、ぼくは歯医者がぼくの口の中をのぞきこんだら何を発見するかを、忘れていたことだった。歯医者は目をぱちくりして、反射鏡でぼくの口の中を見まわすといった。

「これはすごい！　あなたはどこでこの歯を治療したんですか」

「ふわおちよおれしあ？」

　彼が気がついて、ぼくの口にかけていた両手を離した。

「どこの歯医者で治療しました？　どんなふうにやりました？」

「この歯ですか？」とたんにぼくは青くなった。「こ、これですか。これはそのう……イ、インドで、実験的にやってもらったのですが……」

「どんなふうにしてやったんですか？」

「ぼくは素人だからわかりませんよ」

「ふーむ。ちょっとお待ちくださいね。これは、ぜひとも写真を二、三枚撮らせていただかんことには……」彼はそういいながらレントゲン撮影機をもちだそうとガタガタやりはじめた。

「だめですよ、先生」ぼくはあわてて抗議した。「そんなことより、虫の食ったところを掃除して、なんでもかまわないから詰めて、早く釈放してください」

「しかし──」

「申しわけないですが、先生、ぼくは猛烈に急いでいるんです」

　がんばると、歯医者もやむなくぼくのいうとおりにしたが、途中でなんどとなくぼくの歯を見ては溜息をついた。ぼくは金を払うと名も告げずに早々に引きあげてきてしまった。

　こうして、〈製図機ダン〉と〈護民官ピート〉との製作に一日十六時間以上働くいっぽう、ぼくはジョンの法律事務所を通じて私立探偵をやとい、ベル・ダーキンの過去を調査させた。ぼくはベルの住所と車種と車のナンバー（車のハンドルは指紋をとるのに最適の場所なので）を教え、彼女がおそらくは何度か結婚しており、警察の記録に載っているだろうと示唆した。ぼくはかける費用をきっちりと制限しなければならなかった。満足な調査を頼む余裕などなかったからだ。

　十日で成果があがらなければ、無駄金を使ったことになる。だが、数日後、探偵から報告があった。それは、想像以上にぼくの推測の正しかったことを裏書きしていた。ベルはじつに忙しい女だった。まず、自称していたのより六年も前に生まれていたのを手はじめに、十八になる前にすでに二度結婚して二度とも離婚され、以後、少なくとも四度結婚しているが、そのうち一度は、戦争未亡人年金めあての詐欺だったらしい。そして一人の夫は、原因不明で死亡していた。

　ベルの警察記録は、なんページにもおよぶ長いもので、きわめて興味深いものであった。ただし、なんどか、詐欺や横領の容疑線上に浮かびながら、実刑をくったことは一度、ネブラスカで放火か殺人級の重罪で収監されただけで、まもなく、どんな手づるを使ってか仮釈放を許され、刑務所を出たとたんに変名し社会保障番号を手に入れて、現在（一九七〇年の）へ、何食わぬ顔でぼくらの前に現われたわけだった。

　私立探偵は、この事実をネブラスカ警察に知らせるべきかどうかといってきた。

　ぼくは、その必要なしと返事してやった。もしそうしてやれば、今後の（一九七〇年以後の）彼女の人生に大きな変化があることになるわけだが、ぼくには別の考えがあった。それに、過去と未来と現在との複雑なからみ合いを、いまのぼくの計画以外に調節することは、億おつ劫くうというよりは、頭の中が混乱する怖れがあった。





　設計図を作るのに、ぼくは意外に手間どってしまった。そして、知らぬ間に十月がやってきた。予定はどんどんおくれていく。二十一世紀へ戻るべき十二月はもう眼前に迫っていた。設計図につける説明のほうはまだ半分もやっていないし、特許権の申請には、全然手もつけていなかった。なお悪いことには、この特許を維持させるための会社を設立することがまったくできない。これは、特許申請の手続きが全部すんでしまわないと、いずれにせよできないのだ。ぼくは、あのときなぜトウィッチェル博士に、三十一年でなく三十二年前にしてもらわなかったかと悔やみだした。ぼくはぼくの必要とする時間を過小に評価し、ぼくの能力を過大評価していたのだ。

　ぼくは進退に窮しつつあった。それまでぼくは、仕事を、サットン夫妻にも見せなかった。それは、べつに隠しだてするつもりではなく、不完全のうちにひとに見せて、不必要な忠告など受ける具合のわるさを避けたかったからだ。九月の末の土曜日、ぼくはまた二人といっしょにヌーディストクラブに行くことを約束してあった。仕事の予定が遅れているため、その前の晩おそくまで仕事したので、翌朝ジョン夫妻がやって来る時間に間にあうようにかけた目覚まし時計の、じゃんじゃん鳴る音で目が覚めたときは、泣きたいような気持ちだった。ぼくはそのサド的な道具を、えいやとばかりに止めながら、二十一世紀にこんな残酷な機械を残しておかなかった神様の配慮に心からなる感謝の祈りをささげた。そして、半分居眠りした状態で角のドラッグストアまで行くと、ジョン夫妻に電話をかけて、残念だが今日は行けない、仕事が遅れているので今日も一日やらなければいけないのだと弁解した。

　ジェニーが電話に出た。

「ダニー、あなた働きすぎよ。田舎でゆっくり週末をすごせば、とても身体のためになるのよ」

「それが、残念だけどもできないんだよ、ジェニー。ほんとに申しわけないけど。仕事をしなきゃならないんです」

　ジョンが電話をかわった。

「いったい、なんでそんなに馬車馬みたいに働かなきゃならないんだね、ダン」

「どうしようもないんだよ、ジョン。とにかく急がなきゃならないんだ。みなさんに、きみからよろしくいっておいてくれよ」

　そしてぼくは仕事部屋にもどり、トーストを焦がしフライパンの上で卵をぶっこわして朝食をとると、すぐさま〈製図機ダン〉の前にすわりこんだ。

　一時間後、ジョンたちがぼくの部屋のドアをたたいた。

　かくして、結局ぼくたちは田舎へ行かず、そのかわりにぼくが、〈護民官ピート〉と製図機とを、二人に操作してみせたのだ。ジェニーは、製図機にはあまり興味がなかったようだが（彼女が技術者ででもあれば話は別だが、それは女性の利用者は少ない）、〈護民官ピート〉には目をまるくした。彼女は、家で〈ハイヤーガール〉を使っていたので、ピートの性能のよさがいちだんとよくわかったのだ。

　だが、さすがにジョンは、〈製図機ダン〉の持つ重要性にすぐ気がついた。ぼくが、ただキーを押すだけで、すらすらと製図機にぼくの署名──それは、ぼくの手で書いたものと寸分のちがいもなかった──を書かせるのをみると、彼の眉がぴくりとあがった。「これは大変なものだね、ダン、こんな機械ができたら、製図工がなん千人も職を失ってしまうじゃないか」

「いや、そんなことはないよ。わが国の工業技術者の不足は毎年ひどくなる一方なんだ。この機械はそのギャップを埋めるためのものだ。二、三十年のあいだに、この機械は、国じゅうのおよそあらゆる工業関係建築関係の会社に必ず一台は設備されるようになる。この機械なしでは、ちょうど現代機械工業から電力がなくなったも同然というときが来るんだ」

「見てきたようなことをいうね」

「見てきたんだよ」

　彼は〈護民官ピート〉をながめまわした。ぼくはピートを操作して、ぼくの仕事台の上を整頓させた。「ダニー……」と彼がいった。「ときどき、ぼくは、あの日、ほら、ぼくらがはじめて会った日に、きみが、でたらめをいっていたんじゃないような気がすることがある」

　ぼくは肩をすくめてみせた。「千里眼かもしれないさ。とにかくぼくは知っているんだ。確信があるんだ」

「きみは、これをどうするつもりなんだ？」

　ぼくは眉をひそめた。

「それが問題なんだよ、ジョン。ぼくは技術者としては自信があるし、必要な場合には一人前の熟練工にもなれる。しかし、ぼくは、実業家としてはぜんぜんだめなんだ。証拠があるんだ。ジョン、きみはぜんぜん特許法をかじったことはないのか？」

「前に話したろう。それは特許法の専門家でなきゃだめだ」

「それじゃ、だれか、正直な人を知らないか？　正直で、おまけに腕のいい人でなきゃだめだ。じつは、もう、どうしてもそういう人が欲しい段階にまで来ているんだ。そして、この機械を製造する会社をつくらなきゃいけない。しかも、もうあまり時間がない。ぼくはめちゃめちゃに時間に追いかけられているんだよ」

「なぜだね？」

「ぼくは、まもなく、来たところへ戻るんだ」

　彼は腰をおろしてしばらくのあいだ無言だったが、やがていった。「時間はどのくらいあるんだ？」

「それが、二カ月とちょっとしかない。正確にいって今週の木曜から九週間だ」

　ジョンは機械を見やり、それからぼくに視線を移した。

「予定を変更するんだね、ダニー。九週間が九年間でも無理だと思うよ。九カ月あっても、まだ生産を開始することは難しいな──せいぜい会社が動きはじめるのが関の山だろう。すべてスムーズにいってだよ」

「それじゃだめなんだ、ジョン──」

「だめだっていったって、だめだよ」

「予定はもう変更できないんだよ。もうぼくの力ではどうにもならなくなっているんだ」ぼくは顔を両手の中に埋めた。ぼくはあまりの疲労に参りかけていた。一日平均五時間以下しか眠っていないのだ……。こんな気持ちが続いたら、やがてぼくは、世の中に〝運命〟なるもののあることを、いやでも信じざるを得なくなりそうだ。人間の運命に闘いを挑むことはできても、ついにそれを変えることはできないといういいつたえを……。

　ぼくはふいにジョンを見あげた。

「ジョン、きみが会社をやってくれないか？」

「ぼくが？　会社のなにを？」

「なにもかもをだ。技術的なことはぼくがみんなしてしまう。きみは会社の経営さえしてくれればいいんだ」

「大変な注文だな、ダン。ぼくは会社を乗っ取ってしまうかもしれないんだよ。きみにはそれがわかっているのか？　しかもこの会社は金鉱同様の価値が出るかもしれないんだぞ」

「出る。それはぼくが保証する」

「それじゃ、なぜぼくなんかを信用するんだ。一番の方法は、ぼくを会社の弁護士にしておくことだと思うぜ」

　ぼくは考えようとした。頭がずきんずきんと痛んだ。ぼくはかつて共同で事業をした、そしてものの見事にだまされた。が──なんどひとにだまされようとも、なんど痛い目をみようとも、結局は人間を信用しなければなにもできないではないか。まったく人間を信用しないでなにかをやるとすれば、山の中の洞窟にでも住んで、眠るときにも片目をあけていなければならなくなる。いずれにしろ、絶対安全な方法などというものはないのだ。ただ生きていることそれ自体、生命の危険につねにさらされていることではないか。そして最後には、例外ない死が待っているのだ。

「たのむ、ジョン。なぜ信用するのか、きみがいちばんよく知ってるじゃないか。きみはぼくを信用してくれた。だからぼくもきみを信用するんだ。いま、ぼくにはきみの助けが必要になった。きみは助けてくれるだろう？」

「もちろんよ、ダニー」とジェニーが横から口を出した。「もっとも、わたし、あなたがたがいま何を話していたのか、聞いてなかったけど。ねえダニー、このロボットはお皿は洗えるの？　あなたのとこのお皿はみんな汚れっぱなしだわ」

「そりゃ洗えるだろう。もちろん洗えるよ」

「それじゃ、洗えって命令してみてよ。わたし、どんなふうにするのか見てみたいわ」

「それがねえ、ジェニー、ぼくはこれを皿洗い用には作らなかったんで、だめなんだ。もちろん、いまからだってそうするようにはできるよ。しかし、そのためには、少しばかり時間がかかるんだ。そのかわり、一度おぼえさせてしまえば、いつだってできるがね。やはり最初は……皿洗い皿洗いといっても、なかなか馬鹿にはできないんだよ。要するに、皿洗いは、非常に複雑な動きが必要だ。煉瓦を積んだり、トラックを運転したりするような、どっちかといえば単純なおきまり仕事じゃない、判断力を要する仕事だからね」

「まあすてき！　とうとう、男のひとで家事のわかるひとをみつけて、こんな嬉しいことはないわ。ねえあなた、いまダニーのいったことを聞いて？　でも、いまわざわざしなくてもいいのよ、ダニー。ここのお皿はわたしが洗ってあげるから」彼女はあらためて部屋じゅうを見まわした。「ダニー、ここはまるで豚小屋ね、控えめにいってもよ」

　まったくの話、そういわれても仕方なかった。ぼくは〈護民官ピート〉を、さまざまな商業目的その他に応用することばかり考えていたために、ピートにぼくの身のまわりの世話をさせられることを、頭から忘れていたのだった。そうだ、やはりこれにも、〈万能フレキシブルフランク〉がやったような家事を学ばせなければとぼくは思った。その能力は充分にある。ピートは、フランクの三倍のトーセン・チューブを装備できるように設計してあったのだ。

　ジョンは、ついに会社を引き受けてくれた。

　ジェニーは設計図のための解説をタイプしてくれた。ジョンは特許法専門の弁護士を雇って、申請の手続きを手伝わせた。彼が現金でこの弁護士の料金を払ったのかそれとも株を持たせたのか、ぼくは訊きもしなかった。ぼくは、すべてを彼の一存にゆだねた。ぼくらがどのくらいの割合で株をもつかも彼に一任した。そのほうが仕事に専念できるからだし、彼は決してマイルズのようにはならないと思ったからだった。そしてぼくは正直言ってどうでもよかった。金は重要ではない。もし彼ら二人が、ぼくの思ったとおりの人間でないとしたら、ぼくもいよいよ洞窟住まいでもして、隠者にでもなるしかないではないか。

　ぼくは、ただ二つのことだけ我意を通した。ひとつは会社の名前だった。

「ジョン、会社の名前はアラジン自動工業商会としたいと思うんだ」

「妙な名前だな。デイヴィス・アンド・サットンじゃいけないのかい？」

「いけないんだよ。こうでなきゃならないことになってるんだ」

「へえ。きみの例の千里眼かい？」

「かもしれない。商標には、アラジンがランプをこすっている絵で、その上に魔人が姿を現わしているところを使おう。ぼくがラフスケッチを描くよ。もうひとつ。本社はロサンゼルスに置くことにするんだよ」

「ロサンゼルスに？　それじゃすこし遠すぎるよ。つまり、ぼくが会社を経営するんならね。デンバーじゃいけないのかい？」

「デンバーでべつに悪いことはないさ。ここはいい都市だよ。しかし、工場を建てる土地じゃないな。いい場所を見つけて工場を建てる、ところがある朝起き出してみると、そこが連邦政府の指定地になってしまって、こっちは追い出しをくう。そこで、べつの土地を見つけて工場を建てなおすまで生産中止の破目になる──」ぼくは、ここが正念場とまくしたてた。「おまけに、労働力は少ないし、生産資材は陸上輸送してこなきゃならないし、建築資材はみんな闇市場でなけりゃ手に入らないときてる。これに反してロサンゼルスは、優秀な労働者の無限の供給源だ。日に日に労働者の数は増えつつある。ロサンゼルスは海港だ。ロサンゼルスは──」

「スモッグはどうだ？　健康にわるいぜ」

「もうなん年もたたないうちに、そんなものは処理されるさ。それに、このデンバー自体が、最近スモッグをつくりだしはじめたことに気がついてないな？」

「ちょっと待ってくれよ、ダン。きみは、きみが何かほかのきみ自身の仕事をやってるあいだ、ぼくがこの会社をやっていかなければならないようにしむけた。よろしい、引き受けた、会社はやる。しかし、やるにしても、条件がひとつふたつあるぞ」

「そりゃもちろんだよ、ジョン」

「コロラドに住んでいる人間はだね、ダン、正気でいるかぎりは、カリフォルニアなんぞへ引っ越す気にはならないよ。ぼくも、戦争中にむこうに駐在したことがある。ジェニーがいい例だよ。ジェニーはカリフォルニア生まれなんだよ。それを、いつも心ひそかに恥じているくらいなんだ。ぼくはいいが、ジェニーが戻りたがらないんだよ。ここにいれば、冬はすばらしいし、四季ごとに変化はあるし、気持ちのいい山の空気がすえるし、雄大な山の趣きは……」

　そのときジェニーが顔をあげた。それまで、静かに編み物をしていたのだった。「あら、ジョン、わたしはなにも、絶対に戻らないなんていわないわよ」

「なんだって？」

　ジェニーは編み物をひざの上においた。彼女は、こんな場合、いよいよ何かいうことがあるとならないかぎり、めったに口を出さない。いまがまさにそうだった。「ロサンゼルスにお引っ越しすれば、わたしたちはオークデール・クラブに入れるわ。あのクラブには、一年じゅう泳げるスイミング・プールがあるのよ。ちょうどわたし、先週ボールダーのプールに氷が張ってしまったのを見て、むこうのクラブに行きたいなと思ったところだったのよ」

　ジェニー万歳！

　ぼくは一九七〇年十二月二日の夕方、最後のぎりぎり一秒というときまで、デンバーにいた。出発前に、ぼくはついに金に窮し──ぼくの買った部品がおそろしく高価だったせいだ──ジョンから三千ドル借りなければならない破目になった。ぼくは、それだけの分の株を抵当に入れる証文を書いてジョンに渡した。ジョンは、ぼくが署名を終わるのを待って、それをぼくの目の前で破ったうえ紙屑籠にほうりこんだ。

「払えるようになったら払ってくれればいい」

「しかし、それには三十年かかるんだよ、ジョン」

「そんな長いあいだ、どこでなにをするんだ？」

　ぼくは考えこんだ。六カ月前のあの午後、時間旅行などということは信じられないと率直にいいながら、なおかつぼくをクラブに連れていってくれて以来、彼は一度も真相を話せとぼくに迫ったことはなかった。

　いまこそ、すべての話をするときだ。ぼくはそういった。

「ジェニーも起こしてこようか？　彼女も、この話をきく権利がある」

「うむ……いや、よそう。きみが出かける時間まで、あのまま眠らせておこう。ジェニーはあまり複雑な問題は得意じゃない。女あ房れは、きみが誰だろうと、どこから来た人間だろうと、きみという人間が好きなんだ。ぼくが聞いたあとで、聞かせてもいい話だと思ったら、ぼくから話して聞かせるさ」

「きみのいいようにしよう」そういってぼくは話しだした。彼は、ぼくに自由に話させておいて、時たま二人のグラスを満たすときだけ話をさえぎった。ぼくのグラスにはジンジャーエールだけだった。彼は不思議がったが、ぼくにはアルコールを飲んではいけない理由があったのだ。やがて話はすすんで、ぼくがボールダーの山中に着陸（？）したところまで来て、言葉を切った。「これでおしまいだ」とぼくはいった。「ただ、ひとつだけよくわからないことがある。ぼくは、あれ以来あそこの地形をよく見てみたが、ぼくの落ちたのはせいぜい二フィートかそこらだったらしい。ところが、もし例の研究所を作るときに、ブルドーザーかなにかであそこを深く掘ったりしてたら──というのはつまり、今後掘ったりしたらということだよ──、ぼくは、生きながら地中に埋められてしまったわけだ。さあ、そのときはどうなったか。おそらくは、きみたちを二人とも爆死させてしまったろうと思うよ。いや、下へ手たするとコロラド州の半分ぐらいは吹き飛ばしてしまったかもしれない。すでに質量のあるところへさらに質量が押しこんできたらどんなことになるか、想像もつかないからね」

　ジョンはしばらく黙って煙草をふかしていた。

「さあ、どう思ったか聞かせてくれ」ぼくが催促した。

「ふむ。きみはロサンゼルスが──グレイト・ロサンゼルスがといおうか──どうなってゆくかを聞かせてくれたね。三十年たってきみに再会したとき、きみの予言がどのくらい正確だったか、今度はぼくが聞かせてやろう」

「大丈夫、正確だよ。せいぜい、小さなおぼえちがいが二つ三つある程度だ」

「ふーん。まあ、確かにきみの話は非常に論理的だった。しかし、一方ぼくはきみを、珍しい論理的な妄想を抱く狂人だと思う気持ちも抑えきれない。もっとも、それは、きみが優秀な技術者ですばらしい友人だということに、なんら抵触しないがね。ぼくはきみが好きだ。こんどのクリスマスには、きみに、新型のストレート・ジャケットを買ってあげよう」

「まあ、好きなように考えていいよ」

「こう考えるしかないじゃないか。でなきゃ、ぼくのほうが、たいへんな誇大妄想狂になる──となると、ジェニーがあんまり可哀そうだからね」そういって彼は時計を見た。「おや、もうそろそろジェニーを起こしたほうがいいな。きみにさよならをいう機会も与えないできみを行かせてしまったとあっては、生きながら頭の皮をむかれちまう」

「大おお袈げ裟さだな」

　それから二人はぼくをデンバー国際空港まで送ってきた。ジェニーはゲートでぼくにお別れのキスをしてくれた。ぼくはロサンゼルス行十一時発の定期便に飛び乗った。





　　　　　11





　あくる一九七〇年十二月三日の夕刻、すこし早めに、ぼくは運転手に命じてマイルズの家から一ブロックほど離れたところにタクシーをとめた。最初のとき、ぼくがマイルズの家に入った時間を正確におぼえていなかったので、慌てないですむようにと大事を取ったのだった。彼の家に近づいたとき、あたりはもう薄暗かったが、道路に彼の自動車だけが駐車してあるのが見えた。そこでぼくは約百ヤードあと戻りして、自動車を監視できる場所を見つけ、そこで時間が来るのを待った。

　煙草二本ほどの時間が過ぎたころ、もう一台の自動車が道路をこちらへやって来たかと思うとストップし、灯を消した。ぼくは二分ほど待ってから、急ぎ足にそこへ行ってみた。まさにぼくの自動車だった。

　自動車の鍵キーは持っていなかったが、そんなことはなんでもない。いつでも技術的な問題で頭をいっぱいにしているために、鍵を忘れることがしばしばだったので、ずいぶん前から、スペア・キーを一個、トランクの中に置いておくことにしてあったのだ。ぼくはトランクをあけてその鍵を取り出すと自動車に乗りこんだ。ぼく（つまり、さっきこの自動車でやって来たほうのぼく）が下り坂にむかって自動車を停めたので、自動車はやや前のめりに傾斜している。そこでぼく（待っていたほうのぼくだ）は、エンジンをかけずライトもつけずに、サイドブレーキをはずすと、傾斜を利用してそろそろと自動車をすべらせていった。角まで降りてきてハンドルを切り、そこでエンジンのスイッチを入れて、ライトはつけないまま、マイルズの家の裏に通ずる小路の、ちょうどガレージのまん前でブレーキをかけた。

　ガレージには鍵がかかっていた。ぼくはよごれたガラス窓をすかして内な部かをのぞきこんだ。薄暗い中に何かシートをかけたものが置いてある。その輪郭から、ぼくはそれが、わが懐かしの〈万能フレキシブルフランク〉であることを知った。

　ガレージのドアは、タイヤ・レンチと、強固な決意とで武装した男に抵抗するようにはできていない。少なくとも一九七〇年の南カリフォルニアではそうだった。ドアの鍵を壊すのには、ほんの数秒しかかからなかった。だが、フランクを持ち運びできるように──そして自動車に乗せられるように分解するのは、それほど簡単にはいかなかった。ぼくはまずフランクのためのメモやスケッチが、ぼくの思ったところにあるかどうかを確かめてみた。それはやはりそこにあった。ぼくはそれを取り出して自動車の床にほうりこみ、それからフランクに取り組んだ。ぼく以外に、この分解したフランクを組み立てられる人間はいない。どんなに壊してもかまわないと思うと、作業ははかどった。にもかかわらず、一人作業の悲しさで、分解に一時間近くかかってしまった。

　最後の部品を自動車のトランクの中に押しこんで、かさばる部品の上にむりやり蓋をかぶせ終わった、まさにそのときだ──ぼくは、ピートのあの悲しげな泣き声を聞いたのだった。ぼくは、フランクを分解するのに手間どったことを呪いながら、ガレージの裏をまわって裏庭へ出た。そのとき、驚天動地の騒動の幕が、切って落とされたのである。

　ぼくは、このピートの大活躍は、ぜひともよく見物してやろうと楽しみにしていた。だが、不幸にしてその願いはかなわなかった。裏のドアが大きくひらいて、網戸から煌こう々こうと光が流れていた。ばたばたと入り乱れる足音、なにかの壊れる音、ピートの血も凍る戦いの雄たけび、ベルの絹を裂くような悲鳴──だが、それらにもかかわらず、彼らはぼくの視野には依然とびこんでこなかった。ぼくは網戸までしのびよった。戦いの様子を、せめてひと目でも見ようと思ったのだ。

　なんたることだ！　網戸に鍵がかかっていた！　これは、計画どおりになっていなかった、たったひとつの事故だった。ぼくは、狂ったようになってポケットへ手をつっこんだ。ナイフの刃を立てようとして、爪を一枚はがした──そして、鍵穴につき刺し、ようやくのことで鍵をはずした、その瞬間──曲乗りオートバイが柵にぶつかろうとするときのような勢いで、網戸めがけて突進してきたピートの身体を、ぼくは間一髪でよけることができた。

　ぼくはバラの茂みの中に転がりこんだ。マイルズやベルが、外までピートを追ってくるかどうかはわからなかったが、そこまではすまいと思った。少なくとも、もしぼくが彼らの立場にいたら、そんな危険は冒さない。

　ようやく立ちあがると、ぼくは茂みのうしろに隠れながら、じりじりと家の横手にまわりこんでいった。その開いたドアと、そこから迸ほとばしり出る煌々たる光線から逃れたかったのだ。あとは、ピートが鎮まるのを待つだけだった。それまでは、ぼくは絶対に彼に手を触れようとは思わなかった。まして、抱きあげるなど、とんでもない話だ。ぼくは猫というものを知っていた。

　ピートはいくどもぼくの目の前を横切った。入口のあたりをうろつきながら、腹の底から絞り出すような声で戦いを挑むのだ。そのたびに、ぼくはそっと彼に呼びかけた。「ピート、来い、ピート。落ち着け、もういいから落ち着くんだ、ピート」

　ピートはぼくがそこにいることをすぐに知った。二度ほど、立ちどまってぼくを見つめた。だが、それ以外は知らん顔で無視した。猫にとっては、つねに〝一度にひとつ〟なのだ。彼はいま、闘争という重大事に集中していて、パパとのめぐりあいなどに関心は持てなかったのだ。だがぼくは、もう少し待って、激情が鎮まれば、彼がぼくのもとへ帰ってくることを知っていた。

　ぼくはそこにうずくまって待った。待つうちに、家の中の、浴室のあたりで水のほとばしる音が聞こえた。彼らは、〝ぼく〟を居間に残して、顔や手を洗いはじめたのだ。そう思ったとたん、ぼくは突然おそろしいことを考えた。もしいま、このぼくが居間にしのびこんで、そこに、力なく立ちつくしている〝ぼく〟の咽の喉どをかき切ったらどういうことになるだろう？　それは、じつに誘惑的だった。だが、ぼくはようやくそれを抑制した。状況は、数学的にあまりにも誘惑的だったが、そこまで好奇心を発揮して、もしものことがあったら、悔やんでも悔やみきれないではないか。

　やがてピートが、ぼくの前三フィートほどのところに立ちどまった。「アルルオウルル？」と彼はいった。〝一緒に戻っていって、二人を片づけてしまおうよ。あんたは上を、ぼくは下を攻めるんだ〟という意味だ。

「もういいんだ、ピート。ショーは終わりだ」

「アオウ、クムオーン（何言ってるんだ）！」

「家へ帰る時間だよ、ピート。さ、おいで」

　ピートは地面にすわりこんで顔を洗いだした。顔をあげたとき、腕を差し出すと、ピートはひらりと飛び乗ってきた。

「ニャゴォ、ルルウ、ニャン（戦闘開始のときどこへ行ってたんだ）？」

　ぼくはピートを車に連れていって、運転席の、まだあいていた狭い隙間におろした。ピートはいつもの自分の席を占領しているガラクタを、うさんくさげに嗅いで、はなはだおもしろくなさそうな顔だった。

「そんならぼくの膝にすわってればいいだろ。文句をいうんじゃないよ」

　車が街路に出るやいなや、ぼくはライトをつけた。それからハンドルを切って東へ、一路ビッグベアのガールスカウトのキャンプめざして車を進めた。十分ほど走る間に、ぼくはフランクの部品を片端から道端へほうり出して、ピートのいつもの席をあけてやった。それでピートの機嫌はなおるし、ぼくもずっと運転がしやすくなった。ぼくはなおもフランクのコマギレを捨て続けた。五、六十マイル走るうちには、床は空からっぽになってしまった。そこでぼくは車を停め、下敷になっていた設計図類を取り出して、折よくそばにあった排水溝の中へほうりこんだ。荷物入れに詰めこんだ車椅子ウイール・チエアーは、適当な棄て場所がなくて、とうとう山の中へ入ってから、小さな谷間にさしかかったとき、ひっぱり出して落としてやった。いい音が谷間にこだました。

　朝の三時ごろ、ぼくはガールスカウトのキャンプにほど近いモーテルに自動車を乗り入れていた。モーテルの主人が法外な値段を要求し、おまけにぼくがおとなしくそれを払ったので、危うくピートがボストンバッグから首をつき出して抗議するところだった。

「ロサンゼルスからの郵便が来るのはなん時ごろだ？」ぼくは訊いた。

「七時十三分ジャストに郵便ヘリが来ます」

「よし、それじゃ七時に起こしてくれ」

　八時までには、ピートとぼくは朝食をすませていた。ぼくはそのあとでシャワーをあび鬚ひげを剃った。ピートを昼の光でよく調べてみた結果、昨夜の戦闘で、かすり傷をひとつ二つ負ったほかは、ほとんど無傷であることがわかった。ぼくらはモーテルを出、キャンプへ通ずる私道を出発した。

　一生のあいだに、一度にあんな大勢の女の子を見たことはない。少女たちは仔猫の群れのように走りまわっている。緑色の制服を着ているので、みんなおなじように見えた。ぼくが入っていくと、通り道にいる少女たちはピートを見たがっていたが、恥ずかしがって逃げ散ってしまって、誰も近づいてこない。ぼくは〝本部〟と書いてあるキャビンに入っていった。そこで、少女たちとおなじ制服を着た、しかしいうまでもなくもう少女でない女性に会った。

　彼女は、当然のことながらぼくにうさん臭げな視線をなげた。やがて、思春期に入る少女たちを訪ねる見なれない男客は、まず例外なしにこういった待遇を受けるものだ。

　ぼくは彼女に説明した。かくいうぼくはこの子供の伯父で名はダニエル・Ｂ・デイヴィス、子供の家族に関するある伝言を持ってやって来たのである。彼女は答えて、

「ここの子供に面会するには、子供の両親か、そうでない場合は、両親のどちらかをともなってこなければ許されない。それに、いずれにしろ、面会時間は午後四時からになっておりますわ」

「ぼくはべつにフレデリカとおしゃべりするわけではないんです。ただ、この伝言をぜひ伝えたい。非常に急を要する伝言なのです」

「それならば、なにか書いていただければ、いまフレデリカがしているリズム・ゲームが終わりしだい、わたしが責任を持ってお渡ししますわ」

　ぼくは困惑しきった様子を装ってうなだれた（装っただけではなかった）。「それが、そうできないわけがあるんです。あの子に、直接話してやったほうが、ずっとあの子のためになるのです」

「ご家族の方がお亡くなりにでも？」

「いや、そうではないのですが……家庭的な不幸なのです。申しわけないが、あの子以外の誰にもこれは申しあげかねるのです。姪の母に関した問題で」

　女性の態度はだいぶ軟化してきたが、まだ心を決めかねていた。そのとき、ピートがこの会談に参加したのだ。ぼくはピートを、腕を曲げた上にのせて歩いていた。自動車の中に残してきたくなかったのと、リッキーが会いたがるだろうと思ったからだ。ピートは、かなり長いことそうして運ばれるのを我慢してきたのだが、とうとう痺れをきらしたのだった。「ニャァオン、オオン？」

　女性はピートを見た。「まあ、いい猫ちゃんね。わたしも、家にそれとそっくりな猫を一匹飼ってますわ」

「フレデリカの猫なのです」ここぞと、ぼくはものものしくいった。「姪のために、わざわざ連れてきたのです……もう、これの面倒を見てやるものがいなくなったものですから」

「まあ、可哀そうに！」彼女はいって、ふと手をのばすとピートの顎の下をなでた。ぼくは思わず息をのんだが、神様、彼女はうまくなでてくれたのだ！　ピートはなでられるままに顎をのばし、目をつむって、さも気持ちよさそうに咽喉を鳴らした。

　かくして、少女たちの守護の女神は、本部のすぐ外にある木立の下のテーブルに着いて待つようにといった。彼女の監視つきで、リッキーに会うことを許可してくれたのだった。ぼくは礼をのべてベンチで待った。

　リッキーの来るところは見落とした。いきなり、「ダニーおじさん！」という声が聞こえて、ふりかえったとたんに、「まあ、ピートも連れてきてくれたのね、すてき、すてき、すてき！」

　ピートは狂わんばかりに咽喉を鳴らして、ぼくの腕からリッキーの腕へと飛び移った。リッキーはピートをみごとに受けとめて、ピートのいちばん好きな姿勢で抱き、しばらくのあいだは、ぼくをふりむきもせず、猫語で挨あい拶さつを交わしていた。それから、ぼくを仰ぐようにすると、真面目な顔でいった。「ダニーおじさん！　ほんとに嬉しいわ、来てくれて」

　ぼくは、リッキーにキスはしなかった。身体に手をふれもしなかった。ぼくは、子供を、やたらといじりたがるほうではなかったし、リッキーも、ふれられるのが決して好きな子供ではなかった。ぼくらの友情は、リッキーが六つのときから、こうしたおたがいの個性と尊厳とを認め合うデリカシーの上に培つちかわれていたのである。

　ぼくはリッキーを凝視した。膝小僧をむきだした脚、筋ばった身体、縦にばかりひょろひょろのびた身体──赤ん坊時代のリッキーとくらべて、いまの彼女はちっともかわいくはなかった。着ているショートパンツとＴシャツがまた、日に焼けて皮のむけた肌や、すり傷やかき傷がほこりだらけになっているのと一緒になって、女の子らしさを帳消しにしている。やがて大人になったときこうもあろうという女の、ラフなスケッチといった、不器用な、骨ばった小馬のようなリッキーだった。ただそれが、大きな生真面目そうな瞳と、どこか妖精じみた線のほそい顔の表情で救われている。

　やっぱり、ぼくのかわいいリッキーだった。

「ぼくも嬉しいよ、リッキー」とぼくはいった。

　リッキーはピートを片手に抱こうと不器用な格好をしながら、片手でふくらんだショートパンツのポケットを探った。「とっても驚いちゃったわ。だって、ついさっき、お手紙もらったばかりなんだもの。いままで忙しくて、お手紙読むひまもなかったの。これ、今日おじさんが来るって書いてあるの？」リッキーはようやく手紙を取り出して、しわをのばした。

「いや、そうじゃないんだよ、リッキー。その手紙には、ぼくが遠くへ行かなきゃならないということが書いてあるんだ。でも、それを出したあとで、やっぱりリッキーに会ってさよならをいっていこうと思ったんだよ」

　リッキーは、急にしょげかえって足もとに目を落とした。

「遠くへ行っちゃうの？」

「そうだよ。リッキー、いまから理わ由けを聞かせてあげる。ちょっとお話が長くなるから、すわってお聞き、さあ」そしてぼくらは木陰のテーブルを挟んですわり、ぼくは話を始めた。ピートはぼくとリッキーのまんなかのテーブルに、前肢を手紙の上にのせて、図書館のライオンの像そっくりの格好ですわった。さも気持ちよさげに目を細め、まるでクローバーの中で唸る蜜蜂のように、ごろごろと咽喉を鳴らしながら。

　ぼくは、リッキーが、すでにマイルズとベルの結婚を知っていることを聞いて、ほっとした。その話が出ると、リッキーはちらっとぼくの顔を見あげ、またすぐ目を伏せた。

「ええ、知ってるわ。父さんが手紙で教えてくれたわ」無感動な声だった。

「ああ、そうだったね」

　リッキーはふいに暗い表情になった。子供とは思えぬ深刻な目の色になった。「あたし、もうお家には帰らないわよ。ダニーおじさん、ぜったい帰らないわよ」

「うん、しかしねえ、リッキー・ティッキー・ティヴィー、きみの気持ちはよくわかるんだよ。おじさんだって、きみに帰ってなんかもらいたくないよ。できたら、きみを連れていきたいぐらいだ。でも、どうして帰らないなんてことができる？　マイルズはきみのお父さんなんだし、きみはまだ十一だし──」

「だって、帰らなくてもいいんだもの。父さんはほんとはあたしの父さんじゃないのよ。お祖ば母あさんがあたしを迎えに来てくれるの」

「ほんとうか？　お祖母さんはいつ迎えに来るんだ？」

「あしたよ。ブローリーから、車で来るのよ。あたし、前に、お祖母さんにお手紙書いて、あの女のひとが家にいるんなら、もう父さんと一緒に暮らしたくない、だから、お祖母さんのところへ行っちゃいけないかって訊いたのよ」リッキーは、あの女のひとという言葉に大人の想像もつかないような激しい軽蔑をこめていった。「そしたらお祖母さんがすぐ返事をくれて、もしあたしがいやなら、父さんと住まなきゃいけないってことはないんだって説明してくれたの。父さんは、あたしを養子にする正式の手続きをしてないから、お祖母さんがあたしの保護者になってるんですって」リッキーはぼくを見あげて、ふいに心配そうな顔になった。「ね、そうなんでしょ？　むりにあたしを連れていけないんでしょ？」

　ぼくは、安堵感が洪水のように胸にあふれるのを感じて、しばらくの間は言葉もなかった。ぼくがどうしても考えつかなかった唯一の解決策はまさにこれだった。どうしたらリッキーがベルの悪影響のもとに青春時代を送ることをくいとめられるか、それが、何カ月もの間ぼくを悩まし続けてきたのだった。

「そうだとも、リッキー」ぼくはいった。「養子の手続きをしてないんだったら、きみとお祖母さんがしっかりしているかぎり、絶対そんなことを無理にさせられることはないさ」そういったとたんに、ぼくははっとした。顔をしかめて、ぼくは唇を嚙んだ。「しかし、ことによると、あしたきみがここを出ていくときに面倒がおきるかもしれないぞ。ここの人たちが、きみがお祖母さんと一緒に行くのに反対するかもしれない」

「反対したってだめよ。あたし、お祖母さんの車に乗って、ぶうーっと行っちゃうもの」

「そう簡単にはいかないんだよ、リッキー。このキャンプの先生たちにも、規則があるんだ。きみの父さん──というのはつまりマイルズのことだよ──が、きみをこのキャンプに預けたんだ。だから、ここの先生がたは、マイルズ以外のひとと一緒には、きみを行かせてくれないかもしれないんだ」

　リッキーは下唇をぎゅっと突きだした。「だってあたし行かないもの。あたしお祖母さんの家へ行くんだもの」

「そうともさ。そうだリッキー、きみにいいことを教えてあげる。面倒のおきないようにする方法だよ。いいかい、もしぼくがリッキーなら、あした出かけることは誰にもいわないな。そして、お祖母さんと一緒にちょっとドライブするだけだっていっておいて……そのまま帰ってこなきゃいいじゃないか」

　緊張がわずかにほぐれて、リッキーがうなずいた。

「そうするわ」

「でも、荷物なんか持って出ちゃいけないんだよ。でないと、勘づかれてしまうからね。服も、そのとき着てるものだけしか持っていけないよ。ほんとうにいるものやお金なんかだけ、ポケットにしまって行くんだ。どうせ、たいしたものはないんだから、置いてっちゃったっていいだろう」

「ううーん」とはいうものの、リッキーは世にも悲しげな顔をした。「でも、このあいだ買ったばかりの水着は？」

　十一の子供にむかって、世の中にはどんな貴重な荷物でも、捨てていかねばならないときがあると、どう納得のさせようがあろう？　子供はたった一体の人形のためにでも、あるいは象のおもちゃひとつのためにでも、燃えさかる建物の中へ戻るのだ。ぼくは考えたすえにいった。

「それじゃこうしよう、リッキー、お祖母さんが来たら、先生に、アローヘッドへ海水浴に連れていくっていってもらうんだ。そのあとで町のホテルで夕飯をたべるけど、必ず就寝時間に間にあうように帰ってくるからってね。ね、そうすればリッキーは水着とタオルは持っていけるだろ。でも、それだけだよ。ほかのものはだめだよ。でも、きみのお祖母さんは、こんな噓をついてくれるかな？」

「ついてくれるわ、きっと。必ずついてくれるわよ。だってお祖母さん、人間はどうしても少しは罪のない噓をつかなきゃ、おたがいに仲良く暮らしてはいけないって前からいってたもの。噓っていうものは、悪用しちゃいけないけど、つかわなきゃならないときもあるんですって」

「ふうん。きみのお祖母さんは、えらい人だな。そうだ、きみも、そのとおりするんだよ、いいね？」

「そのとおりするわ、ダニーおじさん」

「よし」ぼくはくしゃくしゃになった封筒を取りあげた。「リッキー、おじさんは遠いところへ行かなくちゃならないって話したね。それは、とても長いあいだなんだよ」

「どのくらい長いの？」

「三十年だ」

　リッキーの瞳が、張り裂けんばかりに見ひらかれた。十一の子供にとって、三十年は〝長いあいだ〟ではない。永遠なのだ。ぼくはいった。「ごめんね。リッキー。でも、しかたがないんだよ」

「どうしてしかたがないの？」

　これには、答えようがなかった。本当の答えは、とても理解できなかろうし、見えすいた噓をつくこともできなかった。「リッキー、その理わ由けは、とっても難しくて、説明してもきみにはわからないんだよ。それより、どうしても行かなくちゃならないんだ。おじさんにも、どうしようもないんだよ」ぼくはちょっと躊躇ためらってから、「おじさんは冷凍睡眠コールドスリープに行くんだ。冷凍睡眠って知っているだろう」

　これは、リッキーも知っていた。子供というものはむしろ大人より新しいものに対する順応力が強い。子供たちは、コミックの世界で、冷凍睡眠とはすっかりお馴染みになっていたのだ。リッキーは、ぎょっとした顔になって、口をとがらした。「だって、それじゃ、もうおじさんとは会えないじゃないのよ？」

「会えるさ。ずいぶん長い先だけど、三十年たったら、必ずまた会える。ピートにも会えるよ。ああ、話さなかったけど、ピートもぼくと一緒に冷凍睡眠に行くんだよ」

　リッキーはピートをちらと見やったが、それは、いままでにもまして深い悲しみに満ちた表情だった。

「だって──なぜ、ダニーおじさんもピートも、あたしと一緒にブローリーに来られないの？　そのほうが、ずっといいじゃないの。お祖母さんだって、ピートがきっと好きになるわ。おじさんだってよ。お祖母さんは、家の中に男のひとがいるほど気丈なことはないっていつもいってるわ」

「リッキー……ねえ、聞きわけのいい子だろう、リッキーは。おじさんとピートは、どうしても行かなきゃならないんだよ」ぼくはいいながら手紙の封を切りはじめた。

　リッキーは突然怒りだして、顎をぶるぶる震わせながら、叫びだした。「わかったわ。また、あの女のひとの悪だくみね？」

「なんだって？　ベルのことかい？　とんでもないよ！」

「あの女のひとも冷凍睡眠コールドスリープに行くんじゃないの？」

　いわれただけで鳥肌が立った。

「じょうだんじゃないよ、リッキー！　おじさんはあのベルから逃げてまわっているんじゃないか」

　リッキーはいくらか気が鎮まったようだった。

「あたし、あの女のひとのことで、おじさんがとっても憎らしかったのよ。憎らしくて憎らしくて、しようがなかったのよ」

「ごめんよ、リッキー。ほんとにすまなかった。きみが正しくて、ぼくがいけなかったよ。でも、ベルは、今度のことにはなにも関係ないんだ。ぼくはもう、ほんとうにあの女には愛想が尽きたんだ。さあ、ちょっとこれをごらん」ぼくは封筒から〈ハイヤーガール〉の株券を引き出して見せた。「リッキーはこれはなんだか知っているかい？」

「知らない」

　ぼくは説明して聞かせた。「これを、きみにあげるんだよ、リッキー。ぼくは長いあいだ冷凍睡眠コールドスリープに行くんだから、お別れに、きみにあげておきたいんだ」ぼくは自分の書いた譲渡の委任状を細かく裂いて、その破片をポケットにつっこんだ。こんな別々の手続きにしておいては、いとも簡単にベルに乗じられてしまう。ぼくは証券の裏を返して、裏面の譲渡形式をよく読みなおし、規定の記入欄を埋めて、直接バンク・オブ・アメリカ宛に委託するように書きあらためた。

「リッキー、きみのフルネームは？」

「フレデリカ・ヴァージニアよ。フレデリカ・ヴァージニア・ジェントリー。おじさん知ってるじゃない」

「ジェントリーじゃないんだろう？　さっき、きみはマイルズの養子になってないっていったじゃないか」

「あら！　そうだわ、あたし、ずうっとリッキー・ジェントリーっていってたもんだから、癖になっちゃったのね。あたしのほんとの名前ね？　お祖母さんとおんなじよ、あたしのほんとの父さんの名前と。ハイニックっていうのよ。でも、だあれもそうはいってくれないわ」

「そのうちいってくれるようになるさ」ぼくは書いた。〝この証券は、フレデリカ・ヴァージニア・ハイニックが二十一歳の誕生日を迎える日に再譲渡されるものとし、その間バンク・オブ・アメリカに信託する〟そしてふと、もしあのままにしておいたら、いずれにしろリッキーの手にこの証券は渡らなかったのだと思い当たった。背筋を、ぞっと悪寒が走った。

　署名しかけて、ぼくはまたもや舌うちした。証印がない。ぼくは時計を見た、しまった、もうこんな時間なのか！　ぼくたちは、知らぬまに、一時間あまりも話しこんでいたのだ。そのとき、わが番犬女氏が事務所から首をつき出した。「すみません」

「はい？」

「このへんに、公証人はいないでしょうか？　やっぱり村まで行かないとだめですか？」

「わたくしも公証人ですよ。なにかご用ですか？」

「すごい！　証印を持っていらっしゃいますか？」

「肌身離さず持っていますよ」

　そこでぼくは彼女の目の前で署名し、彼女が署名して、二人の署名の上に証印を打ち出した。ぼくは心の底から安堵の溜ため息いきをついた。さあ、ベル、これでも改かい竄ざんできるものなら、やってみるがいい！

　監視係兼公証人は、好奇の目を証券に注いだが、さすがに質問はしなかった。ぼくはことさら厳粛な面持ちで、「不幸というものは必ずおきるものです。その場合の用心ですよ」といった。公証人の女性はわかったようなわからないような顔でうなずいて、また事務所に戻っていった。

　ぼくはリッキーに向きなおった。「これを、きみのお祖母さんに渡すんだよ、リッキー。そして、バンク・オブ・アメリカのブローリーの支店に持っていくようにいうんだ。あとのことは、銀行でみんなやってくれる」そういって、リッキーの前にそれを置いた。

　だが、リッキーは手もふれなかった。

「それ、お金でしょう？」

「ああ。かなりのお金になるよ。この額面以上のものになる」

「あたし、そんなものいらない」

「そんなこといわないで。ぼくがもらってほしいんだよ」

「いらないわ。もらいたくないわ」リッキーの両眼に、ふいに涙があふれ出て、声があやしく震えた。「おじさんは行っちゃうんだもの──これっきり帰ってこないで──あたしのことなんかどうでもいいんだもの」リッキーはしゃくりあげた。「あの女のひとと婚約したときとおんなじだわ。あたしやお祖母さんと一緒に来てくれればいいのに、ピートも連れて……おじさんの意地わる。あたし、おじさんのお金なんかいらないわ！」

「リッキー、聞きわけをよくしておくれ、ね、リッキー。もうおそいんだよ。ぼくが持っていようと思ったって、もうだめなんだ。これはもうきみのものなんだよ」

「そんなこと、おじさんの勝手だわ。あたしはさわるのもいや」リッキーは、そういうと手を伸ばしてピートの背をなでた。「ピートだったら、あたしを棄ててなんかいかないわね。おじさんが連れていってしまうんだわ。あたしには、もうピートさえいなくなるんだわ」

　ぼくは嗄しわがれた声でいった。「リッキー……リッキー・ティッキー・ティヴィー……きみは、そんなにピートと……それからぼくに会いたいかい？」

　リッキーの返事は、低くて、ほとんど聞きとれないほどだった。「きまってるわ。でも、だめなんだわ」

「だめじゃない」

「え？　だって、どうして？　おじさんは、三十年も長い冷凍睡眠コールドスリープに行ってしまうっていったじゃない？」

「そうだよ。行かなくちゃならないんだ。それはどうしようもないんだけど、ぼくのいうことを聞けば、ちゃんと会えるようになるんだよ。リッキーは、お祖母さんのところへ行って、しばらく、いい子で学校に行ってお勉強するんだ。そのあいだに、このお金が、どんどんたまる。そしてきみが二十一になったとき、もしきみがまだぼくたちに会いたいと思ったら──そのときは、きみも冷凍睡眠コールドスリープに来ればいいんだよ。そのためのお金は、もう充分たまっている。そして、きみが目を覚ましたら、ぼくがちゃんとそこに待っていてあげる。ピートとぼくと、二人で待ってるよ。約束するよ、げんまんしてもいい」

　リッキーの表情は明るくなったが、それでも微笑は浮かべずに、彼女はしばしのあいだ黙って考えこんでいた。

「ほんとうに、おじさん、待っていてくれる？」

「待っているとも。だから、はっきり日を決めておかなきゃいけないな。いいかいリッキー、もし冷凍睡眠に行こうと思うなら、これからぼくのいうとおりにするんだよ。きみは、コスモポリタン保険会社と契約をして、きみの入る冷凍場サンクチユアリは、まちがいなく、リヴァーサイドのリヴァーサイド冷凍場を指定する。それから、これが、一番大切だよ、きみの目を覚ます日は、二〇〇一年五月一日、きっかりにするんだ。その日には、必ずぼくが待ってるよ。もし、きみが、目をあけたそのときにぼくにいてほしければ、冷凍睡眠に入る前にそのことを冷凍場の人にいっておかなければだめだよ。そうしないと、規則で、待合室までしか入れてもらえないからね、おじさんはその冷凍場をよく知ってるが、あそこの人たちはとても気難し屋だから」ぼくはデンバーを発つ前に準備しておいた封筒を取り出した。「いまいったことは、おぼえるのは大変だ。その時の用意にと思って、みんなこの中に書いておいたからね。きみは、二十一歳の誕生日が来たとき、決心して、行くか、行かないかを決めればいいんだ。きみが来るにしても来ないにしても、おじさんとピートは、必ずそこに行って待っているからね」

　ぼくはリッキーに充分わかるようにいって聞かせたつもりだったが、彼女はただ黙って二通の封筒を見つめるばかりで、それに手をふれようとしなかった。ぼくは不安になった。そのとき、リッキーが口を開いた。

「ねえ、ダニーおじさん？」

「なんだね、リッキー？」

　リッキーは顔もあげずにいった。低い声で、ほとんど聞きとれないほどだった。だがぼくには聞こえた──彼女はこういったのだ。「もしあたしがそうしたら──そうしたら、あたしをお嫁さんにしてくれる？」

　耳に轟ごう々ごうと耳鳴りがし、目に煌こう々こうと光が明滅した。ぼくは必死の思いで答えていた。彼女のそれよりは判然と、力強く、「もちろんだとも、リッキー。それこそ、ぼくの望みなんだ。だから、ぼくはこんな苦労をしてきたんだよ」。





　これで、あとなすべきことはわずかだった。ぼくは、やはりデンバーから用意してきたもう一通の封筒に、〝マイルズ・ジェントリー死亡の際開封のこと〟と記して前の二通と一緒にリッキーに渡した。これについては、とくにリッキーに説明はしなかったが、中には、例のベルの身上調査書が入っていた。これさえあれば、マイルズが死んだとき、遺産相続にベルが不足をいい立てることを完全に封ずることができるはずだった。

　最後に、ぼくがしていた大学の卒業指輪をはずし、エンゲージリングのかわりだといってリッキーに与えた。「リッキーにはまだ大きすぎるから、指にしないでしまっておいて。きみが、冷凍睡眠コールドスリープから目を覚ましたとき、またべつのを買ってあげるからね」

　彼女は指輪を小さな拳の中にしっかりとにぎりしめた。

「ううん、これがいいわ。ほかのなんかほしくない」

「そうか、そうか……。さあ、ピートにさよならしなさい。ぼくはもう行かなくちゃ。これ以上一分も余裕がないんだよ」

　リッキーはピートを胸に抱きしめると、ぼくの手に渡した。それからぼくを見つめたが、その目にはすでにいっぱいの涙があふれて、それが、鼻筋をつたい頰を流れて、はっきりと涙の跡がついた。

「さよなら、ダニーおじさん」

「さよならじゃないよ、リッキー。じゃあまた、だよ。ぼくたちはきみを待ってるからね」

　だが──そうだ、もしぼくがそれを見つけていたとしたらどうだったろう？　そこへ行き、ぼく自身に会って、そして──気が狂ってしまったろうか？　いや、そうじゃない。もしぼくがあの時それを見ていたら、ぼくはその後したようなことをしなかっただろうから。したがって、ぼくがあの時の自分の名をそこに見ることは、本来あり得ないことだったのだ。ぼくがそれを読まなかったからこそ、それが新聞に掲載されることになったのだ。

　時間旅行をしたのは、なにもぼく一人とはかぎらない。フォートは時間旅行以外に説明のつけようのないさまざまのケースをいくつも挙げている。アンブローズ・ビアースまた然しかり。さらにぼくは、かのトウィッチェル博士が、おそらく彼の認めた以上の回数、あのスイッチを押したにちがいないという気がしてならない。

　それにつけても思いだすのは、あのレナード・ヴィンセントのことだ。彼はやはりレオナルド・ダ・ヴィンチではなかったのだろうか？　彼は大陸を横断して、コロンブスと一緒に故郷イタリアへ戻ったのではないか？　もちろん、百科事典には、彼の生涯はかくかくしかじかであったと書いてある。しかし、彼はあとでいくらでも自己の記録を改訂することができたはずだ。ぼくはそれをよく知っている。なぜなら、ぼく自身がある程度それに似たことをしたからだ。しかも、十五世紀のイタリアに、社会保障番号も、ＩＤカードも、いや、指紋すら知られていなかったのだ。彼なら造作なくそのくらいのことはできたはずだ。

　しかし、それまで馴れ親しんできたあらゆるものから隔絶された彼の辛さは、いかばかりであったろう？　彼は空中を飛ぶことも、なん万馬力の動力も、その他ありとあらゆる文明の利器を知っていたのだ。そして彼は、そうした器具を、十五世紀のイタリアに実現しようと必死の努力を重ねた。だが、アイデアはいかに豊富だろうとも、知識はいかに深かろうとも、それを実現すべき数世紀ぶんの技術なくしては、ただ、失意と失敗とが、結局は彼を待っていた運命だったのである。

　タンタロスの苦しみも、これにまさりはしなかったろう。

　ぼくは、時間旅行が今後もし機密解除になったら、なんとか商業用に役立たないものかと考えてみた。タイムマシンの部品を持って、なん回も過去へ小ジャンプをする。そして、戻ってくるための設備を過去に設置するのだ。しかしそのうちにジャンプしすぎて、科学技術がまだととのっていない時代に行ってしまい、戻ってこられなくなるかもしれない。ごく簡単な、たとえばタイムマシンをつくるための材料の合金が手に入らないというような理由でだ。それに、第一、重大な障害がある。過去へ行くのか、未来へ行くのかという根本的な問題の解決がつかない以上、ひとつ間違ったらえらいことになる。二十五世紀へ行くつもりで、ヘンリー八世の宮廷へでも飛びこんでしまっては始末に困る。

　やっぱりだめだ。致命的な欠陥のあるものを、市場へ出すわけにはいかない。

　しかしぼくは、時間の〝パラドックス〟とか、〝時代錯誤〟をひきおこすことを、心配などはしない。もしも、三十世紀の技術者がタイムマシンの欠陥を克服して、時間ステーションを設け時間貿易をするようになれば、それは当然おこってくる。世界の造物主が、この世界をそんなふうに造ったのだから、仕方がないのだ。造物主は、われわれに目を、二本の腕を、そして頭脳を与え給うた。その目と、手と、頭脳とでわれわれのやることに、〝パラドックス〟などあり得ない。造物主は、その法則を施行するのに、お節介な人間など必要としないのだ。法則は、自らそれ自体を施行する。この世には奇跡などないのだし、〝時代錯誤〟ということは、語義学的には、なんの意味も持っていないのである。

　しかし、ぼくは、ピートに劣らず、こんな哲学には縁がない。この世の真理がどうであろうと、ぼくは現在をこよなく愛しているし、ぼくの夏への扉はもう見つかった。もしぼくの息子の時代になってタイムマシンが完成したら、あるいは息子が行きたがるかもしれない。その場合には、だめだとはいわないが、けっして過去へは行くなといおう。過去は非常の場合だけだ。そして未来は、いずれにしろ過去にまさる。誰がなんといおうと、世界は日に日に良くなりつつあるのだ。人間精神が、その環境に順応して徐々に環境に働きかけ、両手で、機械で、かんで、科学と技術で、新しい、よりよい世界を築いてゆくのだ。

　世の中には、いたずらに過去を懐かしがる気取り屋スノツブどもがいる。そんな連中は、釘ひとつ打てないし、計算尺ひとつ使えない。ぼくは、できれば、連中を、トウィッチェル博士のタイムマシンのテスト台にほうりこんで、十二世紀あたりへぶっとばしてやるといいと思う。

　だが現在、ぼくはだれにも腹を立てていないし、この現在に十二分の満足を感じている。ただひとつの気がかりといえばピートがだいぶ老衰して、少し肥り、若い猫に戦いを挑むことも少なくなってきたことだ。ぼくはやがて彼を、長期の冷凍睡眠コールドスリープに送らなければならないと思っている。再び彼が目覚めるときこそは、勇敢な彼の魂が、求める夏への扉を発見するだろうことをぼくは心の底から願っている。イヌハッカの花咲きみだれ、牝猫が群れ遊んで、闘い甲斐ある闘争用ロボット猫（ただし、最後には必ず負けるように設計してある）がいる──そして、人々は、優しく彼に膝を提供してくれこそすれ、決して蹴飛ばしたりなぐったりはしない世界、十全な平和の世界だ。

　リッキーも少し肥ってきた。だがこれは、一時的な、しかも嬉しい理由による現象なのだ。もちろんリッキーは前にも増して美しいし、彼女のあの甘い「はい」という返事に変わりはないが、立居振る舞いが少し辛そうだ。ぼくはいま、彼女用に、身体の楽にできるような道具を設計している。女性であるということは決して楽なことではない。それを、なんとか少しは楽にしてやらなければと、ぼくはつねづね考えていた。前かがみになる苦痛や背中の痛みだけでも止めようと、いまぼくはその道具を工夫している。そのほか、ぼくはリッキーに、水圧式ベッドを作ったが、これはそのうち特許を取ろうと思っている。

　ピートのためには、天気の悪いときに使うようにと思って〝猫式トイレ〟を作ってやった。全自動式で、自動的に砂が入り、清潔で無臭である。ただし、ピートは、どの猫でもそうなように、どうしても戸外へ出たがって仕方がない。彼はいつまでたっても、ドアというドアを試せば、必ずそのひとつは夏に通じるという確信を、棄てようとはしないのだ。

　そしてもちろん、ぼくはピートの肩を持つ。





訳者あとがき





　ＳＦを読みはじめて、これはと唸る長篇にお目にかかったことは、もちろん何度もあるわけだが、本書は、そうしたものの中で、一番愛着を感ずるものの一冊である。ぼくのＳＦ修業のなかで、比較的初期に属するころに、最新刊として読んだせいなのかもしれないが、主人公ダニエル・ブーン・デイヴィスのパーソナリティにまずいかれ、ハインライン十八番の、近い未来社会の生き生きとした描写にいかれ、その中でのロボット工業の発展のリアリスチックな話にいかれて読みすすむうちに、愛すべきダニーが、ヘマばかりやって、みすみす発明を奪われ仕事を奪われ裸にむかれて、放り出されるあたりにくると、腹がたってやりきれなくなったものだ。

　それが、後半のストーリイが展開するや、つぎからつぎへとひっくり返され、もののみごとに、こっちの胸をすかしてくれる痛快さ。ぼくは、本のページをたたいて、これこそＳＦの醍だい醐ご味みだと、さけびたくなったのをおぼえている。

　この作品は、強いて分類すれば時間テーマに属するだろうが、そこに使われたタイム・パラドックスが、とくに新手というわけではなし、タイムマシンがニューモードなわけでもない、まあ、冷凍睡眠とタイム・トラベルとを併用したところが、新しいといえば新しいだろうが、だからこの作品がおもしろいのではない。やはりむしろ、そうした設定のなかに、虚構のすき間風の、一筋だに吹きこむことをゆるさない、ハインライン一流の稠ちゆう密みつな小説構成と、スペキュレイティヴなストーリイ・テリングの腕の冴えとに、その成功の理由は、あるのだろう。

　とにかく、この作品を読み終わって本をおき、ふと周囲を見まわしたら、ぼくの家に、一台の〈ハイヤーガール文化女中器〉も、〈窓拭きウィリー〉も、〈万能フレキシブルフランク〉もないことが、ひどく奇妙に思われ、わずかにあった電気掃除機が、なんともはやぶさいくなものに見えて、しかたがなかったものだった。

　ハインラインの長篇、数あるなかに、総合点のいちばん高くつけられる作品はといわれたら、ぼくは、今のところ、ためらうことなしにこの作品を推すだろう。けだし、ＳＦの傑作とは、虚構の世界に読者をひきずりこんで虚構の世界の空気に馴れ親しませ、牢固としてぬきがたいこの世の常識主義に、一撃をくわえるものだろうからである。

（ハヤカワ・ＳＦ・シリーズ版より転載）





２０２１年の『夏への扉』





評論家

高橋良平





　一九五六年の発表から六十年の時を経て、永遠の名作『夏への扉』の映画化がついに実現した。

　二〇二一年二月に公開の決定した映画「夏への扉─キミのいる未来へ─」は、原作の魅力をそのままに、舞台を一九九五年の東京に設定して、登場人物、物語を再構築した作品だ。「タイムトラベルものは映画『バック・トゥ・ザ・フューチャー』も含めて数々あれど、時間旅行ものというジャンルを確立させた本作は後の作品に大きな影響を与えた古典中の古典と言える」と語るのは、本作のプロデューサーの小川真司。多くのハリウッド映画に影響を与えた伝説の小説が、全世界で初映画化される──





　ロボット開発を行う若き科学者の高倉宗一郎は、愛猫のピートと、亡き父の親友松下の娘・璃子との穏やかな日常の中で、研究に没頭する日々を送っていた。だが、信頼していた共同経営者と婚約者の裏切りにあい、自身の会社も発明途中のロボットや研究資料も奪われてしまう。さらに宗一郎は人体を冷凍し未来に行ける装置・コールドスリープに入れられ、目が覚めた時そこは、二〇二五年の東京だった……。

　罠にはめられてすべてを失った科学者を演じるのは、今もっとも新たな出演作が期待される山﨑賢人。共演には、二〇二一年の朝の連続テレビ小説「おかえりモネ」の主演が決定した清原果耶。加えて、藤木直人、夏菜、眞島秀和、浜野謙太、田口トモロヲ、高梨臨、原田泰造といった個性豊かなキャストが脇を固める。監督を務めるのは、『フォルトゥナの瞳』『ぼくは明日、昨日のきみとデートする』の三木孝浩。三木監督は、「幼い頃に観て心躍らせた八〇年代ハリウッド映画のようなみんなで楽しめるエンタテイメント作品に仕上げたい」と語っている。





　その原作である本書は、二〇一〇年刊の〔新装版〕から、訳語、表現などをアップデートした〔新版〕である。発表から半世紀以上が経過してもなお、色褪せぬ魅力を放つ『夏への扉』を、その成り立ちから振り返ってみよう。





一九五六年二月二日

　新作長篇は、いわゆるアダルト層むけをもくろみ、原稿で百四ページに突入。おかげで慢性の頭痛と不眠症に悩まされつづけ、なぜこんな馬鹿げた商売に首をつっこんだのか、自分でも訝いぶかしむ次第──とはいえ、このまま身がもてば、『夏への扉』の草稿は今月中に書き上げ、三月末ごろ無事に脱稿できるでしょう。

　こちらでは雪が三十センチほど積もり、雉き子じがそこらじゅうをうろついており、ピクシーは雪が嫌いで、ジニーに文句をつけています。





一九五六年五月三十一日

『夏への扉』のシノプシスについて。わたしは、編集者がわたしの腕をひねりあげて、梗概を書けと要求するとき（いつものことですが）にかぎって、自分で毎回のシノプシスを書いています。もしバウチャー自身がすすんで書いてくれるなら、大喜びです。なにしろ、彼のほうがわたしより文章上手ですからね。





一九五七年一月十二日

　ピクシーが死にかけています……尿毒症です。回復を望むにはあまりに重じゆう篤とくで、数日前、獣医が彼を戻してきました。わが家で死を迎えるようにするためです。いまは苦痛もなく喉をゴロゴロ鳴らしていますが、体はひどく弱っており、日に日にやせ衰えて──小さな黄色い幽霊が家の中にいるようです。苦しみがつづく段階になったら、痛みがおさまる手助けをしなければならないでしょうし、彼がずっと探してきた夏への扉をついに見つけることを願うでしょう。わたしたち夫婦は、いささか精神的にまいっています……この小柄な猫に度をこす愛着を抱くようになっていたのです。もちろん、飼いはじめたときから、こうなるのが避けられないのは承知していましたし、ペットがわたしたちより長生きするはずもなく、先立たれるだろうとは思っていました──わたしたちはそのときに耐える心の準備をしたほうがいいんでしょうね。にもかかわらず、そうしたところで、ちっとも気が楽になるものではありませんが……。





　以上は、ハインラインの死後、妻のジニーことヴァージニア・ハインラインが編纂した書簡集 Grumbles From the Grave（1989, A Del Rey Books/Ballantine Books）から、抜粋した文章で、いずれも、ハインラインがリテラリイ・エージェントのラートン・ブラッシンゲイムに書き送ったものである。お読みになれば分かるように、ピクシーは、牡猫ピートのモデルで、愛猫家のハインラインが『夏への扉』執筆当時に飼っていた猫の名。ちなみにこの名前、Petronius Arbiter、〝趣味の審判者〟と呼ばれた『サテュリコン』の作者で、ローマ時代の諷刺作家ガイアス・ペトロニウスに由来する。二通目に出てくるバウチャーは〈Ｆ＆ＳＦ〉誌の編集長で、『夏への扉』は、同誌一九五六年十月号から十二月号まで三回分載され、連載物には一ページほどのシノプシス、前回までのあらすじを添えるのが恒例だった。ハードカバーの単行本は翌五七年、それまでもハインラインのアダルト向けＳＦを手がけてきた老舗のダブルデイから出版されている。

　ついでに、ビブリオ・マニアむけに、わが国での翻訳バージョンを列挙すると──

　そして本書は、⑧からカバーイラストを一新し、訳語・表現などをアップデートした〔新版〕ということになる。

　注釈をつけておくと、①は、一九五八年の八月から十一月までの四カ月間に、わずか六冊を出しただけの短命のシリーズの一冊として出版された。その他の五冊は、フレドリック・ブラウン『星に憑かれた男』（田中融二訳）、ジョン・マントレイ『恐怖の27日間』（亀山龍樹訳）、アレクサンドル・ベリャーエフ『人工衛星ケーツ』（木村浩訳）、アルフレッド・ベスター『わが赴くは星の群』（中田耕治訳）、アイザック・アシモフ『裸の太陽』（伊藤照夫訳）という豪華ラインナップ。（ブラウン作品は原題に即した『天の光はすべて星』、ベスター作品はイギリス版タイトルをとった『虎よ、虎よ！』と改題されて〝ハヤカワ・ＳＦ・シリーズ〟に加わり、現在はハヤカワ文庫ＳＦに収められている）

　早川書房の編集者だった福島正実と都筑道夫のふたりが企画した〝ハヤカワ・ファンタジイ〟（のちの〝ハヤカワ・ＳＦ・シリーズ〟）が、ジャック・フィニイの『盗まれた街』（福島正実訳）とカート・シオドマクの『ドノヴァンの脳髄』（中田耕治訳）でスタートしたのが一九五七年十二月──それを追うように誕生した大手出版社の翻訳ＳＦシリーズは、強力なライヴァルと目されたのだが、そのじつ、この企画を立てたのも、福島・都筑のコンビだった。早川書房の会議で二度にわたってＳＦ叢書の企画がボツにされ、業を煮やしたふたりが講談社に持ちこんだ企画が、〝ハヤカワ・ファンタジイ〟にゴー・サインが出たのと同時期に、通ってしまったのだ。おまけに、六冊で終わってしまったのは、担当編集者が人事異動し、後任がいなかったため。詳しい顚末を知りたい方は、福島正実の回想録『未踏の時代』（ハヤカワ文庫ＪＡ）をひもといてください。

　そうしたいきさつの社外の仕事だったため、福島正実は加藤喬名義で①を翻訳し、ほとぼりがさめたころ（？）、〝ハヤカワ・ＳＦ・シリーズ〟で再刊されたのが②である。ちなみに、『裸の太陽』の訳者・伊藤照夫は、都筑道夫のペンネームのひとつだが、締切りに間に合いそうもなく、編集部の部下だった常盤新平が実質的に翻訳したとのこと。

　③は叢書名からもお分かりだろうが、ジュヴナイル向けのアブリッジ翻訳。④は『人形つかい』と共に全集に収録され、訳者が急逝して三年後に⑤として文庫化された。⑥は講談社インターナショナル発行の英語の副読本的出版物で、英文の行間に「わかりにくい単語・イディオム・言い回しには、ルビ（ふりがな）のように訳がつく」という「英文書がスラスラ読める〝ルビ訳〟」シリーズの一冊で、ＳＦでは他に『アルジャーノンに花束を』『火星年代記』『幼年期の終り』などを出している。⑦は「時をかけるエンターテインメント。新しい翻訳で贈る、すべてのひとびとへの応援歌」という帯のコピーのごとく、ふだん海外ＳＦに触れていない読者にアピールするためのバージョンである。そうした広い読者層をターゲットに読みやすく、いくつかの訳語も正された⑦を歓迎するのはむろんだが、かといって、福島訳に価値がなくなったわけではない。

「偉い翻訳者とは、それまでわが国に知られていなかった外国文学（その新旧を問わない）を紹介して、わが国の文壇に強烈な刺戟を与え、新しい文学を生む土壌を培う人であると私は考えている」というのは、河盛好蔵が堀口大學を称えた文章の一節だが、そうした意味で、福島訳版『夏への扉』の歴史的名訳の地位は揺るがないだろう。

　その証左に、一九六八年、ＳＦファングループ〝東海ＳＦの会〟がアンケートをとったオールタイム・ベスト以来、『夏への扉』は常にベスト３にランクインしており、〈Ｓ‐Ｆマガジン〉一九九八年一月号発表のオールタイム・ベストの海外長篇部門で、堂々の第一位に輝く。さらに、同誌六〇〇号記念となる二〇〇六年四月号発表のオールタイム・ベストでも、一位『ソラリス』（沼野充義訳・国書刊行会）、二位『幼年期の終り』（福島正実訳）、三位『夏への扉』、四位『火星年代記』（小笠原豊樹訳）、五位『虎よ、虎よ！』（中田耕治訳）と、その人気は衰えない。半世紀以上もの長きにわたり、読者に親しまれてきたこの福島訳版に、ＳＦファンはずっと夢中なのである。「彼（ピート）は、その人間用のドアの、少なくともどれかひとつが、夏に通じているという固い信念を持っていたのである」という物語の初めにでてくる言葉が、「彼はいつまでたっても、……必ずそのひとつは夏に通じるという確信を、棄てようとはしないのだ」と最後にまたリフレインされる、〝夏への扉〟──この希望に満ちたシンボリックな題名をもつ長篇には、日本のＳＦファンの琴線に触れる〝センス・オブ・ワンダー〟が息づいているのだ。

　日本のＳＦファンとことわったのには、理由がある。アメリカでも、何度もオールタイム・ベストを募っているが、ハインラインがトップランクの人気作家であるのは同じでも、選ぶ作品が違うのだ。一九五九年の『宇宙の戦士』（矢野徹訳）、六一年の『異星の客』（井上一夫訳・創元ＳＦ文庫）、六六年の『月は無慈悲な夜の女王』（矢野徹訳）のヒューゴー賞を受賞した三作品に限られ、さもなくば、未来史シリーズに属する短篇集の『月を売った男』や『地球の緑の丘』が挙がるばかりで、『夏への扉』が選ばれたことがない。

　これがアメリカのＳＦファンの特徴かと思えるのは、イギリスの〈インターゾーン〉の創刊編集長デイヴィッド・プリングルの選んだ Science Fiction: The 100 Best Novels: An English-Language Selection,1949-1984（1985, Xanadu Publications）で、ジョージ・オーウェルの『一九八四年』（高橋和久訳・ハヤカワepi文庫）からウィリアム・ギブスンの『ニューロマンサー』（黒丸尚訳）までのベスト１００作品のうち、ハインラインは『人形つかい』『夏への扉』、それにジュヴナイルの『スターファイター』（原題 Have Space Suit-Will Travel, 1958／矢野徹・吉川秀実訳・創元ＳＦ文庫）が選ばれているからだ。そして、アメリカのＳＦ情報誌〈ローカス〉二〇〇七年八月号で大きくページをさき、ハインライン生誕一世紀祝賀特集（余談だが、二〇〇九年に生誕百年で出版界ならずとも話題になった太宰治、松本清張と、ハインラインは同世代になるわけだ）をおこなったなか、ハインラインのジュヴナイル作品からＳＦを読みはじめたコニー・ウィリスただひとり、ベストワンが『スターファイター』で、二位に『夏への扉』を挙げているので、アメリカでも少し風向きが変わってくるのかもしれない。

　ところで、『夏への扉』で扱われているＳＦアイデアは、三つある。冷凍睡眠コールドスリープ、ロボット、タイム・トラベルである。

　まず、〈ハイヤーガール文化女中器〉、〈窓拭きウィリー〉、〈万能フレキシブルフランク〉といった主人公が発明・製作した万能自動機械が登場するが、彼が「いずれにしろぼくは、人間の形をした機械人間なんかを作るつもりはなかったんだ」とか「ぼくの意見では、機械に判断力はあり得ない」とか述懐するように、『月は無慈悲な夜の女王』のマイクが代表例だろうが、コンピュータを描くことはあっても、ヒューマノイド型ロボット、アンドロイドが存在する未来に、ハインラインは興味がなかったようだ。ロボットＳＦの第一人者のアイザック・アシモフに遠慮したわけではないだろうが、不思議である。アシモフの銀河帝国に、なぜか非ヒューマノイド型エイリアンが登場しないのと、双璧をなす謎である。

　トウィッチェル博士の時間転位装置はなかなかに興味ぶかいが、一回こっきりの過去へのタイム・トラベルでは時間ＳＦの醍醐味はないし、タイム・パラドックス的な面白さに無頓着なのが、残念。そちらの目まいを起こしそうな快感は、何度も読み返したくなる傑作「時の門」（稲葉明雄訳・『時の門』所収）と「輪廻の蛇」（井上一夫訳・『輪廻の蛇』所収）で存分に味わえるから、まあいいか。

　最後の冷凍睡眠は、あたまのほうで、「Ｈ・Ｇ・ウエルズの古典的ＳＦ『冬眠者めざめるとき』ぐらい」と書名を挙げているが、じつは、この本（When the Sleeper Wakes, 1899）はハインラインの大好きな作品で、一九三五年にカリフォルニアに講演旅行にきたウエルズ本人から、一九一〇年の改稿版 The Sleeper Awakes にサインをしてもらっており、彼の宝物のひとつだった。

　未来や宇宙に暮らす人間たちの物語を、ビビッドに描きだすストーリーテリングは、〝ハインラインネスク〟と呼ばれた彼の真骨頂だが、ユートピアにせよディストピアにせよ、現代人が未来社会を見聞するＳＦ（本書では、核兵器の使用された六週間戦争を経た一九七〇年の主人公が、冷凍睡眠で二〇〇〇年に目覚める設定の一九五七年作品なので、ちょっとヤヤコシイけれど）は、トマス・モア以来、本質的に文明批評・諷刺を眼目としている。つまり、ウエルズ作品がお気に入りということは、ハインラインは昔から、このテーマに並々ならぬ関心を持っていたということだ。

　晩年、The Cat Who Walks through Walls という原題で、四匹もの猫が登場する！　『ウロボロス・サークル』（矢野徹訳）や遺作『落日の彼方に向けて』（同訳）で、未来史に属していなかったはずの作品まで、統合してしまったハインラインだが、その一方、本書とタイム・スケールが違うが、現代人が未来にゆく作品を書いている。『自由未来』（浅倉久志訳）がそれで、第三次大戦が勃発し、核シェルターに逃げこんだ一家が、水爆の衝撃で二〇〇〇年後のディストピアに飛ばされてしまうストーリーである。

　一九六二年、『異星の客』で、ＳＦとして初めて〈ニューヨーク・タイムズ〉のベストセラー・リストにチャートインして以降、『愛に時間を』（矢野徹訳）、『獣の数字』（同訳）、『ヨブ』（斉藤伯好訳）、『ウロボロス・サークル』『落日の彼方に向けて』などが次々とベストセラー入りしたのに対し、ロングセラーであるものの話題にのぼることの少ない『夏への扉』や『自由未来』は継まま子こ扱い。それに不満を禁じえなかったが、二〇〇三年、驚くべき朗報が届く。ハインラインの未知の長篇、それもデビュー以前に書かれた作品が、スクリブナーズ社から刊行されたのだ！

　ハインラインのデビューについて、小説やノンフィクションを収めたバラエティブック Expanded Universe（1980, An Ace Science Fiction Book）でも、著者自身、デビュー作「生命線」（矢野徹訳・『デリラと宇宙野郎たち』所収）のまえがきに、有名なエピソードを紹介している。一九三八年の夏、カリフォルニア州議会選挙に立候補して落選し、尾羽うち枯らして職もなく借財を抱えたハインラインは、〈スリリング・ワンダー〉誌の新人コンテストを目にすると、さっそく賞金五十ドル欲しさに四日間で短篇を書きあげるが、応募はせずに原稿料のいちばん高い〈アスタウンディング〉誌に投稿。ジョン・Ｗ・キャンベル編集長のおめがねにかなって採用され、賞金よりも多額の原稿料を手にした。そのときの新人コンテストの入賞者が、アルフレッド・ベスターだったという逸話だ。

　しかし、最近のハインライン研究によると、事実はちがうらしい。空母レキシントン乗船中の海軍士官時代、船上での創作コンテストに、海軍士官学校内で起きる諜報と陰謀の短篇 Weekend Watch で応募して落選している。病気で退役し、二番目の妻のレスリンとカリフォルニアに戻り、ＵＣＬＡで勉学に勤しんで学位をとる夢も破れた一九三四年秋、社会主義作家で政界進出をめざすアプトン・シンクレア（一八七八～一九六八年）と知り合う。シンクレアは、半ば忘れられた作家だったが、二〇〇七年、ポール・トーマス・アンダーソン監督が、シンクレアの小説を原作に、ダニエル・デイルイス主演で《ゼア・ウィル・ビー・ブラッド》を発表し、原作本が新訳されたから、その名を耳にした方も多いことだろう。社会党からではなく、民主党から知事選に立候補したシンクレアであったが、彼の掲げた「カリフォルニア州貧困根絶」政策というユートピア・ヴィジョンに感銘したハインラインは、機関誌〈ＥＰＩＣ〉の編集・執筆を手伝い、選挙活動のボランティアでも奔走する。結局、シンクレアは落選し、やがて執筆活動に戻ってゆくが、ハインラインはその後の政治に関わっていったのだ。そして、州議会選挙落選後、長篇小説 For Us, the Living: A Comedy of Customs を執筆。マクミラン社やランダムハウスに送るが、どちらからもボツにされる。「生命線」で作家デビューする一年前のことだった。

　さて、その幻の第一長篇の内容はというと──一九三九年の夏、海軍航空兵の主人公は、休暇をすごしたロサンゼルスからサンディエゴに戻る途中、海岸線を走行中、対向車を避けようと急ハンドルをきると、道を飛びだし、はるか眼下の岩場に真っ逆様に落ちてゆく……気を失ってしまい、目を開けると、そこは雪の降りしきる山中だった……やがて彼は、その世界が百五十年後、二〇八六年の未来であることを知るのだが……。

　まさにウエルズ作品に感化された長篇で、そこには現実の政治で果たせなかったユートピアのヴィジョンが語られ、政治や経済、社会の仕組みに関する長口舌に、後期の作品で敬遠されぎみだった理屈っぽさ、お説教臭さも、かいま見ることができる。ここに、ハインラインの作家としての出発点があり、書評などでの評価はけっして高くないが、ハインラインというＳＦ作家を、二十一世紀の目で見直す起点が、ここにありそうだ。

　ともあれ、アルフレッド・ベスターのインタビュウでは、わずか十三日間で書きあげたと豪語するほど著者に脂がのりきっていた時期の、本書は不朽の名作ＳＦである。

        const chunkSize = 400;

        function chunkText() {
            for (let i = 0; i < fullText.length; i += chunkSize) {
                textChunks.push(fullText.substring(i, i + chunkSize));
            }
        }

        // 指定されたページの文章を表示する
        function displayPage(pageNumber) {
            if (pageNumber >= 0 && pageNumber < textChunks.length) {
                textDisplay.textContent = textChunks[pageNumber];
                pageInfo.textContent = `${pageNumber + 1} / ${textChunks.length}`;
            }
        }

        // キーが押された時の処理
        document.addEventListener('keydown', (e) => {
            // Enterキーが押されたら次のページへ
            if (e.key === 'Enter') {
                e.preventDefault();
                if (currentPage < textChunks.length - 1) {
                    currentPage++;
                    displayPage(currentPage);
                }
                inputBox.value = '';
            }

            // Backspaceキーが押され、入力バーが空の時に前のページへ
            if (e.key === 'Backspace') {
                if (inputBox.value === '') {
                    if (currentPage > 0) {
                        currentPage--;
                        displayPage(currentPage);
                    }
                }
            }
        });

        // ページ読み込み時の初期化処理
        function init() {
            chunkText();
            displayPage(currentPage);
            inputBox.focus();
        }

        // 実行
        init();
