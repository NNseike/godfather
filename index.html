　六週間戦争のはじまる少しまえのひと冬、ぼくとぼくの牡猫、護民官ペトロニウスとは、コネチカット州のある古ぼけた農家に住んでいた。マンハッタンの被爆地帯の端にあたったし、古い木造家屋というものはティッシュペーパーに火をつけたようによく燃えるから、今でも、まだあの農家がそこに建っているかどうかは疑問だ。おそらくはあるまい。たとえ建っていたとしても、死の灰が降ったから、価あたいよく貸すというわけにはいかないだろう──だが、当時ぼくら──つまり、ぼくとピートは気に入っていた。下水設備がなかったので家賃は安かったし、居間だった部屋に置いたぼくの製図机に、冬の陽ざしがよくあたった。

　ただし欠点があった。この家は、なんと外に通ずるドアが十一もあったのである。

　いや、ピートのドアも数に入れれば十二だ。ぼくは、いつもピートに、専用のドアをあてがってやることにしていたのだ。この家の場合には、使わない寝室の窓に打ちつけた板切れで、そこに、ちょうどピートのヒゲの幅にねこ通しを切ったのである。なぜこんな面倒なことをしたかといえば、今日までぼくはあまりに多くの時間を、猫のためにドアをあけたり閉めたりすることに消費しすぎていたからだ──ぼくが一度計算したところによると、文明の曙しよ光こうが射してこのかた、人類は九百七十八（人間）世紀分の時間を猫にかまけて費してきているのだ。なんなら、もっと詳しい数字をあげてみせてもいい。

　わがピートは、人間用のドアをあけろとせがむ場合は、遠慮会釈なくぼくの手を煩わずらわせたが、それ以外は、ふつうこの自分用のドアを用いた。ただし、地上に雪の積もっているあいだは、絶対に自分のドアを使おうとはしなかった。

　ふわふわの綿毛のような仔こ猫ねこ時代から、ピートはきわめて単純明快な哲学を編みだしていた。住居と食と天気の世話はぼく任せ、それ以外のいっさいは自分持ちという哲学である。だがその中でも、天気は特にぼくの責任だった。コネチカットの冬が素晴らしいのは、もっぱらクリスマス・カードの絵の中だけだ。その冬が来るとピートは、きまって、まず自分用のドアを試み、ドアの外に白色の不愉快きわまる代物を見つけると、（馬鹿ではなかったので）もう外へは出ようとせず、人間用のドアをあけてみせろと、ぼくにうるさくまとわりつく。

　彼は、その人間用のドアの、少なくともどれかひとつが、夏に通じているという固い信念を持っていたのである。これは、彼がこの欲求を起こすたびに、ぼくが十一カ所のドアをひとつずつ彼についてまわって、彼が納得するまでドアをあけておき、さらに次のドアを試みるという巡礼の旅を続けなければならないことを意味する。そしてひとつ失望の重なるごとに、彼はぼくの天気管理の不手際さに咽の喉どを鳴らすのだった。

　こうして見極めがつくと、それきり屋内に閉じこもり、生理的要求がぎりぎりの線に来るまでは絶対戸外に出ようとしない。外へ出て帰ってくると、四し趾しに雪が凍りついて、板敷の床の上に木靴でもはいているような音をたてる。そして、ぼくをにらみつけ、その氷を残らず舐めてしまわないうちは、ぼくがどんなに機嫌をとろうが決して咽喉など鳴らさない──舐め終わると、また次の要求の時まで、仲直りする。

　だが彼は、どんなにこれを繰り返そうと、夏への扉を探すのを、決して諦めようとはしなかった。

　そして一九七〇年十二月三日、かくいうぼくも夏への扉を探していた。

　ぼくは健康を害してもいず（慢性の二日酔いは別として）、あと数日間は年も三十のこちら側なら、無一文の貧乏人ではさらになかった。警察に追われる身でもなく、人妻を寝とってその夫につけまわされてもいなければ、裁判所の執行官から逃げまわっていたわけでもない。軽微なもの忘れの気味はあれ、不治の記憶喪失症などにかかってもいなかった。にもかかわらずぼくの心には冬が住まって、ぼくはひたすら夏への扉を探し求めていたのである。

　当時、ぼくがもっぱら試みていたのは、酒バ場ーのスイングドアだった。そのときもぼくは、そうしたスイングドアのひとつの前に立って、店の看板をながめていた。看板には〈バー・グリル無憂宮サン・スーシ〉という文字が出ていた。ぼくはドアを押して内部へ入ると、まんなかごろのボックスを選んで、そこへ、さげていたボストンバッグをそっと置き、その横へ腰かけてウェイターの来るのを待った。

　ボストンバッグがいった。「ウエアーア」

「ナーオウ」

「何をいうか。我慢するんだ。首を引っこめろ、ウェイターが来る」

「あるのか、ないのか」

「かしこまりました」ウェイターはテーブルの上を拭いた。「ステーキはいかがでしょう？　でなければホタテガイなどがよろしゅうございますが」

「おれはちゃきちゃきのカウボーイだ。ラッパ飲みといくよ」

　ボストンバッグにはチャックがしてなかった。ピートを入れて歩くときは、いつもチャックはしないのだ。彼は前脚でバッグを拡げ、頭をつき出し、素早くあたりを見回すと上半身を浮かせるようにして前脚をテーブルの縁にかけた。ぼくはスコッチのグラスをあげ、一瞬おたがいに顔を見合わせた。

「世の女とメスのために乾杯！　女なんかにクヨクヨするな！」

　ピートはうなずいた。それは彼の哲学と完全に一致していたのである。彼は頭を優雅に垂れ、すぐにジンジャーエールをピチャピチャやりだした。

「できればの話だがね、ピート」といい添えて、ぼくもガブリとひとくち飲んだ。ピートは答えもしなかったが、メスにクヨクヨしないことなんぞ、彼にとってはなんの造作もなかったのだ。彼は天性の独身者タイプだったのである。

　真正面のバーの窓越しに、さっきから三通りに変わる広告サインが見えていた。まずそれは〝財産は睡眠中に創られる〟ではじまり、〝苦労は夢とともに消える〟と変わって、それが消えると、こんどは二倍ほどもある大きな文字で、





　　　ミュチュアル生命　冷凍睡眠保険コールドスリープ・アシユアランス





　となるのだ。

　ぼくは、何も考えぬままその広告をながめていた。冷凍睡眠コールドスリープというものについてはたいていの人と同じように、知っているようでもあり、知らないようでもあった。もちろんぼくは、Ｈ・Ｇ・ウエルズの古典的ＳＦ『冬眠者めざめるとき』ぐらいは、保険会社が宣伝用に無料配布をはじめる以前から読んでいたし、週に二、三回は、朝の郵便の中に入ってくる保険会社のダイレクト・メールで見もしたのだが、ろくに気にもとめていなかった。冷凍睡眠など、ぼくには、口紅の広告同様、縁もゆかりもなかったからだ。

　第一、そのころよりちょっと前までは、縁があろうがなかろうが、費用がぼくの手に負えなかった。冷凍睡眠コールドスリープは、貧乏人には高嶺の花だったのだ。そして第二には──自分の仕事に生き甲斐を感じている上に金が儲かりだし、さらに儲かる見込みがあり、美人と恋をしていて、まもなく結婚しようとしている男が、なにを好きこのんで、なかば自殺に等しい冷凍睡眠などに関心を持つはずがあろう。

　不治の病に冒されて、いずれは死を免れないが、二十年後には医学が進歩して救われる見込みがあるというような男なら──そしてその男が、幸いにして、医学が彼の病気に追いつくまでの二十年間の冷凍睡眠の費用をまかなうに足る金を持っている場合なら──冷凍睡眠を試みるのも悪くはあるまい。あるいは、火星へ宇宙旅行に行きたいと願っている男が、彼の人生というフィルムのひとコマを端折はしよることによって、火星行宇宙船の旅費をまかないうると考えた場合──これまた、きわめて論理的な試みといってよかろう。事実、当時巷こう間かんに流布されていた噂話で、結婚したての若夫婦が、市役所からウェスタン・ワールド冷凍睡眠保険会社コールドスリープ・アシユアランスの冷凍場サンクチユアリに直行し、惑星間定期宇宙船インタプラネタリ・スペースライナーで蜜月旅行ハネムーンに出かけられる時代が来るまで起こさないようにといいおいて、無期限の冷凍睡眠に入ったという話が伝えられていた。ぼくは信用しなかった。おそらく、これは保険会社の細工した宣伝用のでっちあげで、その若夫婦は、あとから、変装をし名を変えて、保険会社の裏口からこっそり脱け出したのではないか。こともあろうに、楽しいはずの新婚初夜を、冷凍のサバよろしくコチコチに凍って過ごすなんて、いくらなんでも真実とは受けとりにくかったのだ。

　つぎなるは、例によって例のごときあからさまな物欲への訴えだ。保険会社の謳うたい文句に曰いわく〝財産は睡眠中に創られる〟。あなたの貯蓄が、眠っているあいだになん倍にもなる！　かりに、あなたが五十五で、隠退後の年金が月額二百ドルだとしよう。そこで冷凍睡眠コールドスリープに入り、なん年か眠って目が覚めると、あなたは依然として五十五のまま、しかも年金は千ドルになっているというわけだ。いかがですか？　しかも、あなたの目を覚ます輝かしい新時代が、あなたに、いまよりはるかに健康な老後と長寿を約束し、したがってその月額千ドルも、いまの数倍使いでのあるものになるであろうことはいうまでもない。さあどうだまいったか。というわけで、さまざまの保険会社が、いずれ劣らぬ〝論議の余地なき〟数字を提示して、当社の投資信託こそは他社にくらべて絶対早く、絶対多く利潤をあげると、たがいにしのぎを削っていたのである。

　だが、こんな宣伝も数字も、いっこうにぼくの気をそそることはなかった。

　ぼくは五十五ではなかったし、もちろん隠退したいわけもなく、おまけに一九七〇年に、なんの不満もなかったのだ……。

　つまり、ごく最近までは。

　いまはちがった。

　いまのぼくは、否応なしに──いやだったのだ──隠退を強いられた身の上だったのである。そして、ハネムーンに出かけるどころか、場末のバーにすわりこんで、ただ心を麻痺させるがためにスコッチのグラスをかたむけている──かたわらには、新にい妻づまのかわりに傷だらけの牡おす猫ねこ──ジンジャーエールに病的な嗜好を持つ猫をはべらせて。いましたいことを問われれば、ぼくはこいつをジン一ケースと交換して、残らず飲み倒してやりたい、と答えたろう。

　だが、一文なしでだけはなかった。

　ぼくは上着のポケットを探り、一通の封筒を取り出して開いてみた。中身は二つ。ひとつは、ぼくがいままで持ったこともない金額の小切手一枚。そしていまひとつは、〈ハイヤーガール文化女中器〉社の株券だった。二つとも、少し手て垢あかがついていた。彼らにそれを手渡されてから、肌身離さず持ち歩いたためだった。

　そうだ。冷凍睡眠コールドスリープという手があった。スコッチのグラスをもてあそびながら、いつしかぼくは考えていた。

　この悩みを、眠って忘れてしまえばどうだ？　外人部隊に参加するよりは快適だし、自殺するよりいくらか清潔だ。それに、ぼくの人生をこうまで踏みにじった連中や思い出も、完全にぼくから遮断してしまえる。いままで気がつかなかったが、これ以上のことはないではないか！

　ぼくは、金持ちになることなどに、たいした興味は持たなかった。だいいち、ぼくの持っている金で、長期の冷凍睡眠コールドスリープの費用と、未来で目が覚めたとき役に立つほどの信託預金をするのに足りるかどうかもわからなかった。しかし、もうひとつの点はぼくの気持ちをそそるに充分だった。ままならぬ世間に一時おさらばして、新世界で再び目を覚ます。もし保険会社の宣伝文句を信用すれば、おそらくはいまよりずっとましな世界になっているはずだ。もちろん、もっと悪い世界である場合もあり得る。だがともかく、いまの世界とちがった世界ではあるだろう。

　絶対確実なちがいがあった。冷凍睡眠に入れば、ぼくは、ベル・ダーキン──もしくはマイルズ・ジェントリー、もしくはその両方──しかしとくに、ベルのいなくなった世界が来るまで、なにも知らずに眠っていることができるのだ。ベルが死んで、土の中に埋められてしまえば、ぼくも彼女を忘れることができるだろう──彼女がぼくにした仕打ちを忘れ、彼女を心の外に追いやって──。彼女が、空間的にわずか数マイルの近くにいるという事実に、心を蝕むしばまれることもなくなるのだ……。

　ところで、そのためには何年眠ればいいだろう？　ベルは二十三だ──少なくとも、自分ではそういっている（ぼくはいつか彼女が、ルーズヴェルトの大統領時代を知っているとうっかり口を滑らしたことがあるのを思いだした）。ともかく、二十代なのは間違いあるまい。とすれば、七十年も眠れば、彼女も一片の死亡記事になってしまう。大事をとって、七十五年ということにしようか。

　そう思ったとき、ぼくは最近の高齢者医学ジエリアトリクスの長足の進歩を思いだした。日ならずして、人間の寿命が延び、百二十五歳までは正常な生活ができるようになるという話が伝えられていた。とすると、少なくとも百年眠らなければならない勘定だ。保険会社が、果たしてそんなに長い申込みを受けつけるかどうかは疑問だった。

　そのときぼくは、おそらくスコッチの酔いが気持ちよく身体を温めてきたせいだろう、ある残酷な名案に思いあたったのだった。なにも、ベルが死ぬまで眠る必要はなかったのだ。むこうがお婆さんになってしまったとき、こっちがまだ若々しい青年であれば充分──いや、充分以上の復讐になるではないか。女の鼻をあかしてやれる程度にこっちが若ければよいとすると──三十年がいいところか。

　腕に、ぼたん雪がぱらりと落ちたような感じがした。ピートが片足をかけていた。「モーア」

「食いしんぼうめ」ぼくはいいながら、受け皿の中にジンジャーエールを注いでやった。ピートは短いお預けで感謝の意を表すると、たちまちぴちゃぴちゃやりだした。

　このおかげで、ぼくの思索の糸が切れた。そうだ──ピートはいったいどうしたらいい？

　犬はひとに譲れるが、猫はそういうわけにはいかない。猫族は、譲られておとなしく環境に順応するようにはできていないのだ。なかには、人よりも家に馴れて生きていくのもいるが、ピートの場合はそうでなかった。彼にとっては、いまから九年前、母猫のもとから連れてこられて以来、ぼくだけを頼りに生きてきたのだ。ぼくは、戦争で軍隊にいたときですら、なんとか方策を講じて彼を飼いつづけたのだった。

　彼はいたって健康で、幾多の闘争を経て満身創そう痍いでこそあれ、まだ当分はがんばれそうな身体をしていた。もし、いつも右ライトでファイトしようとする癖をなおしさえすれば、少なくともあと五年は勝ちつづけ……そして近所のメス猫どもに仔猫を生ませつづけることは間違いなかった。

　ぼくは、決心さえすれば、一生死ぬまでの面倒をみてくれる犬猫保養所に彼を預けることもできたし（だめだ！）、あるいはいっそ、クロロフォルムを嗅かがしてしまうことも（冗談じゃない）、でなければ捨ててしまうこともできた。そうなのだ。要するに、それが猫の扱い方なのだ。猫は、後生大事に飼いつづけるか、でなければいっそ路ろ傍ぼうに放り出して、彼らが野性にもどり、世の正義をかなぐり捨てるままにするか──二つにひとつしかないのだ。

　ちょうど──ちょうど、ベルがぼくにしたように。

　だから、ダニーボーイ、やっぱりそんなことは忘れてしまったほうがいい。おまえさんの人生が酢漬けのキュウリよろしく酸っぱくなったのには同情するが、だからといって、そのわがままきわまる猫の面倒をみる義務がなくなったということにはならないよ。

　ちょうどぼくがこの哲学的真理に到達したとき、ピートがくしゅんとくしゃみをした。鼻の上に泡がくっついている。「ほい、お元気でゲズントハイト！」とぼくがいった。「あわてて飲む癖をいい加減になおせよ」

　ピートはぼくの言葉を聞き流した。彼のテーブルマナーは、平均を採ると、いつもぼくよりましだった。彼はちゃんとそれを心得ていたのだ。ウェイターがさっきからレジのあたりでぶらぶらして、レジ係と無駄話をしていた。ランチタイムのひけどきで、ぼくら以外に客といっては、カウンターに一人いるきりだった。ウェイターはぼくが、「ほい、お元気でゲズントハイト！」といったとき顔をあげてこちらを見、レジ係になにかいった。二人はぼくらのほうを向いた。と思うと、レジ係はカウンターの揚げ蓋をあげて、ぼくらのほうへ近寄ってきた。

　ぼくは早口にいった。「憲Ｍ兵Ｐだ、ピート」

　ピートは素早くあたりを見まわすと、ひらりとボストンバッグの中に身をもぐらせた。ぼくはバッグを閉めた。レジ係はつかつかとやってくると、テーブル越しに身をかがめて、ボックス席の両側に素早い金つぼ眼を向けた。

「お気の毒ですがね、お客さん」と男はきっぱりと、「その猫を店から出していただかんと困りますな」

「どの猫？」

「どの猫って、いまお客さんがその受け皿で飲ましてた猫ですよ」

「猫なんかいないぜ」

　こんどは、男はかがみこんでテーブルの下を覗いた。

「そのボストンバッグの中に隠したんだ」と彼は詰問した。

「このバッグに？　猫をか？」ぼくはさも驚いたという顔をしてみせた。「これはまた、いきなり現われたと思えば、なかなか辛しん辣らつなことを申されるな、お主ぬしは」

「ええ？　妙な言葉を使ってごまかそうったってだめだ。あんたは確かに猫をそのボストンバッグに隠した。あけて見せてもらおうか」

「捜査令状はあるか」

「なんだって？　ばかいいなさんな」

「ばかいってるのはそっちじゃないか。捜査令状もなく他人の鞄の中身を見せろといってるんだよ、きみは。修正第四条フオース・アメンドメント（アメリカ憲法の権利条項を規定した Bill of Rights 修正十カ条のうちの第四条。捜査に対する個人の権利を規定している）を知らないのか。しかも戦争が終わってなん年にもなるんだぜ。さて話がわかったら、ウェイター君に、さっきの注文とおなじものを持ってくるようにいいつけてくれ。でなきゃ、きみ自身が持ってくるか」

　レジ係は感情を害したようだった。「お客さん、べつにあんたに恨みがあるわけじゃないが、それならこっちにも考えがありますぜ、あの壁にちゃんと出てるんだ──〝犬猫お断り〟とね。こっちは、衛生第一の経営方針をとっているんだから」

「それにしちゃ、衛生状態は貧弱だな」ぼくはいいながらグラスを取りあげてみせた。「口紅の跡が見えるだろう？　客のことをとやかくいう前に、まず店の皿洗いの監督ぐらいは念入りにしてもらいたいな」

「あたしには口紅なんか見えないぞ」

「ぼくがおおかた拭きとったんだよ。そんなら、これを保健所へ持っていって精密検査をしてもらおうじゃないか」

　男は溜ため息いきをついた。「あんたは保健所のひとか？」

「いいや」

「そんなら引き分けとしよう。オレはあんたの鞄を調べない、あんたはオレを保健所へ連れていかない、と。酒がほしければカウンターへ来て飲みな……オレがおごる。とにかくここじゃ困るんだ」彼はいいおわると、くるりと振りむいて、もと来たほうへ戻り始めた。

　ぼくは肩をすくめた。「どっちみち、もう行くところだったんだ」

　ぼくがレジの前を通って外へ出ようとすると、レジ係がひょいと顔をあげた。「悪く思わんでくださいよ」

「いや。そのかわり、あとで馬と飲みにくるよ。いまは忙しくてだめだがね」

「好きなようにするさ。州条令には馬のことはいってないからね。おっと、もうひとつうかがいたいが、その猫は本当にジンジャーエールを飲むのかね」

「修正第四条フオース・アメンドメントを忘れたか？」

「猫が見たいんじゃないよ。本当にジンジャーエールを飲むのかどうか訊いただけさ」

「そうさね」ぼくは相あい槌づちをうった。「本当はビターズ入りのほうが口に合うんだが、ないときはストレートでも結構やるね」

「腎臓をやられちまうぜ、そんなことをすると。ところでお客さん、ちょっとあれを見てごらん」

「なにを？」

「ここに寄りかかって、オレの頭のへんまであんたの頭を持ってきて。そうだ、それでボックスの真上の天井を見てごらんなさい──ねえ、あのデコレーションの中に鏡があるでしょう。オレは、あんたが猫を連れてるのをちゃんと知ってたんでさ。なにしろこの目で見たんだから」

　ぼくは身体を倒して見あげてみた。店の天井はごてごてのデコレーションに飾られていたが、その中に鏡が多数使われていた。ところがそうして見ると、その鏡のうちの大半が、デザインでごまかしてあるのでふつうはわからないのだが、レジ係がレジにすわったまま全ボックスを見張れるように、一種のペリスコープ監視装置の役目をしていたのである。

「これが要いるんでさ」とレジ係は弁解がましい声になった。「こっちがしょっちゅう目を光らせてないとねえ……ボックスの中で、なにをやられるか知れたもんじゃないんですよ。どうもねえ、情けない世の中でさ」

「アーメン」とぼくはいって店を出た。

　外へ出ると、ボストンバッグの口をあけて、握りを片方だけ持って歩いた。ピートが頭をつき出した。

「あの男のいったことを聞いたか、ピート。〝情けない世の中〟だとさ。まったく、友だち同士が、スパイされずに静かに一杯飲むこともできないなんて、情けない以上だよ、なあ。これで決心がついた」

「ナアウ？」ピートはいった。

「おまえがその気ならね。どうせやるつもりなら、グズグズしていても意味がない道理だ」

「ニャアウ！」ピートは力強く賛意を表明した。

「異議なし。道路ひとつ向こうだよ」

　ミュチュアル生命保険会社の受付嬢は、機能美の好見本ともいえる姿をしていた。マッハ四の超高速流線形はしていないが、そのかわり、前突型のレーダー・ハウジングをはじめとする女性の基本的任務に必要ないっさいを具備している。ぼくが冷凍睡眠コールドスリープから覚めるころにはこのグラマーな受付嬢もホイッスラー（J. A. M. Whistler 一八三四～一九〇三。アメリカの画家、版画家）の『母の肖像』よろしくの姿になっているのだぞと浮気なわが心にいい聞かせると、ぼくは、だれか顧客担当に面会したいといった。

「どうぞおかけになってお待ちください。ただいま、顧客担当の重役がお目にかかれますかどうか、きいてみます」

　ぼくがまだ腰かけないうちに、彼女がいった。

「ミスタ・パウエルがお目にかかります。どうぞこちらへ」

　わがミスタ・パウエルは、堂々たるオフィスのひとつを占領していた。この塩あん梅ばいだと、ミュチュアル生命はかなり景気がいいらしいぞとぼくは思った。彼は妙にしめっぽくぼくと握手すると、椅子にすわらせ煙草をすすめて、ぼくの手からボストンバッグを取ろうとした。ぼくはバッグを離さなかった。

「さて、ご用のむきは」とパウエル氏はいった。

「長期の冷凍睡眠コールドスリープを申し込みたい」

　ぼくがいうと、彼の眉がたちまちぴんとはねあがって、その応対はいよいよ誠実そのものになった。ミュチュアル生命は、短期契約なら、はした金でも引き受ける。だが、長期契約となると話はちがう。長期なら申込者の全財産を、がっぽりあつかうことができるのだ。「それはご聡明な決意をされました」と彼は声音もうやうやしくいった。「わたくしとしては、さっそくにもお受けいたしたいところでございます、がしかし……ご家族の同意とか、その他さまざまの規則がありますので」彼はいいながら手を伸ばして申込用紙を一枚取りあげた。

「冷凍睡眠の申込者は一般にお急ぎですが。ひとつ、わたくしがかわりにこの書類の必要事項を埋めて、時間と面倒を省いてさしあげましょう……そして、それが終わりしだい、あなた様の健康診断の手続きを取らせていただきます」

「ちょっと待ちたまえ」

「はい？」

「ひとつ質問がある。あなたの会社では、猫の冷凍睡眠コールドスリープをひき受けてくれますか？」

　彼は驚いて、ぼくを見あげ、それからふくれっ面になった。

「ご冗談を」

　ぼくはボストンの口をあけた。ピートが頭を突き出した。

「相棒をご紹介しよう。そこでぼくの質問に答えてくれ。もし〝ノー〟なら、ぼくはセントラル・ヴァレー有限会社へ、悠々と出かけるんだ。確か、むこうも、このビルの中にあるんだね？」

　するとこんどは、ミスタ・パウエルのふくれっ面が恐怖の表情になった。「ミスタ……ええと、まだお名前をうかがっていませんでしたな？」

「ダン・デイヴィス」

「ミスタ・デイヴィス、一度わがミュチュアル生命保険の門をくぐられた方は、すべてわが社の厚き庇ひ護ごのもとに置かれているのです。あなたを、セントラル・ヴァレーなどへ行かせるわけにはまいりません」

「ほう。どうやって止める気だ。ジュードーでか？」

「とんでもない！」彼はあたりを見まわした。気も動どう顚てんのありさまだ。「わが社は倫理的経営をもって世に知られているのですぞ」

「ということは、セントラル・ヴァレーが非倫理的だという意味か？」

「そうは申しません。あなたが申されたのです。ミスタ・デイヴィス、どうかわたくしに余計なことをいわせないでいただきたい」

「いわなくていいさ」

「──しかし……それでは、試みに二、三の会社から契約書のサンプルを取り寄せてごらんなさい。弁護士を──いや、それより語義学者セマンテイシストを頼んで、わが社の契約内容を……いえ、実績を調べさせてごらんください。そして、セントラル・ヴァレーの条件と比較してごらんなさい」彼はそこまでいっきにいうと、再び素早く四囲に目をくばって、ぼくに寄りかかるように顔を近づけた。「こんなことはいってはいけないのですが──どうか、聞いても人にお話しにならないでくださいよ──あの社では、正規の保険利率表アクチユリアル・テーブルも用いていないのです」

「そのかわり客に幸運を与えるんじゃないかな」

「なんですと？　ミスタ・デイヴィス、わが社は、ありとあらゆる利益を株主に提供するのです。これは、ほかならぬ当社の定てい款かんの定めるところでありまして──当社にひきかえ、セントラル・ヴァレーは本質的には単なる一証券会社にすぎません」

「どうも、聞けば聞くほどむこうのほうが……いや、ねえパウエルさん。こんなことをしていても時間が無駄なんだ。ミュチュアル生命はここにいるぼくの相棒を受け入れてくれるのか、くれないのか。もし受け入れてくれないのなら、ぼくはもう長居をしすぎているんだ」

「つまり、あなたのおっしゃるのは、その動物を仮死生存状態ハイポサーミアに置くために金を出そうというので？」

「ぼくのおっしゃるのは、ぼくたちが二人とも長期睡眠ロングスリープに行きたいってことだ。それと、彼を〝その動物〟なんぞと呼んでもらいたくないね。ペトロニウスというれっきとした名前があるんだ」

「申しわけありません。では、質問をやりなおします。あなたがたお二人、あなたとそのドウブ……いえ、ペトロニウスとを、わが社の冷凍場サンクチユアリにお迎えするため、二人ぶんの費用をお支払いになる。こういうわけですね？」

「そうだ。しかし、二人ぶんまるまるじゃないよ。一人ぶんと、あと多少色をつけるというわけさ。そのかわり、彼はぼくとおなじ棺に入れてかまわないよ。いくらなんでも猫に人間一人ぶん取るのはがめつすぎるからね」

「じつに異例に属することで」

「あたりまえさ、だがとにかく、値段のことは、あとであなたを値切るから……いや、あんたか、セントラル・ヴァレーを値切るからいいとして、いま知りたいのは、きみの社が彼を引き受けるか、受けないかだ」

「あわわ……」ミスタ・パウエルはデスクの表面をやけにひっぱたいた。「ちょっとお待ちを」そういうと彼は電話をとりあげた。「ボーキスト博士につないでくれ」それから先の会話は、彼が秘話装置プライバシーガードのスイッチを入れたので聞こえなくなった。だが、やがて話を終えて電話を置いた彼は、まさに金持ちの伯父さんがたったいま死んだばかりというような、にこやかな笑顔でぼくに向きなおった。「吉報ですぞ、ミスタ・デイヴィス！　わたくしは、一連の輝かしい実験の成果が、猫の場合にも上がっていたことをたまたま失念していたのです。猫の冷凍睡眠コールドスリープに関するすべての技術的、臨床的要因はすでに完成しておりました。事実、アナポリスの海軍科学研究所には、仮死生存状態ハイポサーミアに置かれてすでに二十年、現在も生き続けている猫がおります」

「海科研ＮＲＬはワシントンが水爆にやられたとき、けし飛んじまったんじゃないか？」

「消えたのは地上の建築物だけでございます。地下深くにあったシェルターは安全でした。そして、これが、冷凍睡眠技術の完成に貢献したのです。かの動物は、二十年間、自動装置による調節以外はまったく放置されていました。にもかかわらず、なんの変化もなく、年をとらずに生き永らえたのです。まさに、これからあなたがミュチュアル生命に全幅の信頼をおかれ、何年間冷凍睡眠コールドスリープに入られようとも、その間生き続けられるようにです」

　彼は十字でも切りそうな勢いだった。

「わかった、わかりましたよ。それじゃ値切るほうを始めるとしようか」

　契約についての必要事項は以下の四つだった。（一）冷凍睡眠中の費用の支払方法　（二）希望年限　（三）冷凍器内に在るあいだの資産の投資方法　（四）もし睡眠中に死亡して二度と甦らなかった場合の資産の処置方法。

　このうち、期限については、○が三つ並んでいてきりもいいし、ちょうど三十年めにあたるので、二〇〇〇年とすることにした。これ以上長くすると、目を覚ましたとき、あまりズレすぎてしまう怖れがあったからだ。過去三十年（すなわちぼくの全生涯）間の世の中の変化は、まさに目を見張らせるものがあった。二回の大戦争と比較的小規模の一ダースもの戦闘、それに続くコミュニズムの没落、世界的経済恐慌、そして人工衛星の打ちあげ。すべての動力源の原子力への転換、等々である。

　だからあるいは、西暦二〇〇〇年の世界もぼくを面くらわせるかもしれない。しかし、少なくともその程度の跳躍はしないと、ベルの顔に必要な数の皺しわを寄らせるに充分とは思えないのだ。

　さてぼくの資産の投資方法はということになったとき、ぼくは政府公債その他保守的な株に投資するのは望ましくないと考えた。政府の財政方針はインフレを助長していた。そこでぼくは、ぼくの〈ハイヤーガール〉の株はそのまま持っていることにし、現金のほうで、ぼくが以前から今後の発展を見込んでいた二、三の株を買うことにした。企業のオートメーション化は、必ず、より大規模になる。ぼくはサンフランシスコのある肥料会社の株も買った。この会社では、イースト菌と海藻の研究を続けていた──毎年人口は増大の一途を辿たどり、ステーキはいっこうに値さがりしていなかったからだ。残余の現金については、ミュチュアル生命の信託保険に繰り入れるようにした。

　だが、本当に問題なのは、もしぼくが冷凍睡眠コールドスリープ中に死亡した場合のことだった。会社は、三十年間の冷凍睡眠中にぼくが生き永らえる見込みを、七〇％の確率であると主張していた。そして、会社はこの賭けのいずれか一方、加入者の選ばなかったほうを取る。これだと、五分五分の賭けではないが、そんな五分五分は、もちろん望ましくない。公正な賭けでは、胴元の側につねに見越し破損高が見てあるのが普通だ。保険業というものは合法化された賭博なのだ。インチキな会社にかぎって、カモにだけいいような話をするものだ。世界最古の伝統を持ち、もっとも信用度の高い保険会社はロンドンのロイズだが、ここでも、同様の賭けが行なわれている──つまりロイズ傘下の各保険会社は、いずれか一方を、文句なしに取っていたのである。ただし、だからといって常例以上の幸運を期待することもまちがいだ。いずれは、誰かが、わがパウエル氏のテイラーメイドのスーツの金を払ってやらなければならないのだから。

　そこでぼくは、もしぼくが死亡した場合は、最後の一セントまでミュチュアル生命の信託保険に繰りこむという方式を選んだ──これを聞くとミスタ・パウエルがほとんどぼくにキスしかねない喜びようを示したので、ぼくは、この七〇％という確率が、非常に楽観的なものではないかという疑いを感じたくらいだった。しかし、ぼくはあくまでこの決心を変えなかった。というのは、こうしておけば、（もしぼくが生き抜いた場合）ぼくとおなじオプションを持つ他人の（ただし彼らが死亡した場合）株を相続できるという契約になっていたからだ。

　こうしてぼくは、可能なかぎり最高額の金が戻ってくるように、ただしぼくの狙いがはずれた場合は文句なしということで、すべての選択をした。ミスタ・パウエルは、負け続けるカモに賭博場の胴元が持つような愛情を、ぼくに注いでくれた。そして、ぼくの資産の処理がひととおりすんだころには、ピートの冷凍処置料を、自分から進んでまけてくれる気持ちになっていた。結局、われわれはピートのぶんとして、人間一人分の十五パーセントを支払って二人前の契約をするということを取り決めた。

　あとは裁判所の認可と身体検査だけだった。ぼくは身体検査の結果にはほとんど不安を感じなかった。会社に、ぼくが死ぬほうに賭けさせた以上、たとえぼくが黒死病の第四期にあろうと、会社がぼくを受け入れることは絶対間違いなかったからだ。しかし、裁判所の認可を得るには、かなり時間がかかるのではないかと思った。冷凍睡眠コールドスリープに入るということは、法律的にまったく無能の状態──生きてはいるが、完全な無能力者となることだから、これは、ぜひとも必要な手続きなのだ。

　ところが、この心配も、なんら必要はなかったのだ。わがミスタ・パウエルは十九枚の異なる用紙からなる四通一組の書類を作成させた。ぼくはその全部にサインしたおかげで、手がつりそうになった。そして、ぼくが身体検査を受けているあいだに、メッセンジャーを立てて、裁判所の裁可をもらってきてしまったのである。ぼくは、判事の顔さえ見なかった。

　身体検査は、例によって例のごとき退屈きわまる形式にすぎなかったが、ひとつだけちがった。検査がそろそろ終わりに近づいたときだ。医者が、ぼくの目をぐっと見据えたかと思うと言ったのだ。「きみはどのくらいの期間このどんちゃん騒ぎを続けている？」

「どんちゃん騒ぎ？」

「どんちゃん騒ぎだ」

「なんでそんなことをおっしゃるのです、先生？　ぼくは先生に負けないぐらい素面しらふですよ。いいですか、ピイタア・パイパア・ピクダ・ペック・オ・ピックルダ……」

「くだらんおしゃべりはやめて、質問に答えて」

「あの……その、二週間ばかり……いや、もう少しになります」

「アル中なのかね？　いままでに、なんどぐらいこういう状態になった？」

「つまりその……まったくの話、今度がはじめてなんです。実は……」とぼくはベルとマイルズの仕打ちを医者に話しはじめようとした。なぜそんな気持ちになったかというとですね、先生──。

　だが、彼は手をあげてぼくを制した。「いや、結構。ぼくは自分の心配事だけでたくさんだし、だいいち精神分析医じゃない。ぼくのあんたに対する唯一の関心事は、あんたの心臓が、体温を摂氏四度に下げた場合の試練に耐えられるか否かだけだ。耐えられようと耐えられまいと、ぼくはどっちでもかまわない。元来ぼくは、なぜあんたがわざわざ穴の中に埋まりたいのか、そんな理由はどうでもいいのだ。むしろ、世の中から馬鹿が一人消えて結構だと思うぐらいだ。ただぼくにも、まだ役にもたたん職業的良心の切れっぱしがあるとみえて、それが脳までアルコール漬けになっている人間を棺桶の中へ送り込むのを拒むんだよ。それ以外は、きみが誰だろうと、どんなみじめな標本だろうと、ぼくの知ったことじゃない。まわれ右」

「はあ？」

「まわれ右だよ。左の尻に注射をするんだ」ぼくがうしろを向くと彼は無造作に注射した。ぼくがあとを擦さすっていると、彼は言葉を続けた。「これを飲みたまえ。二十分以内に、きみはこの一カ月間かつてなかったほど冷静な気持ちになる。そのとき、もしきみにいくらかでも頭脳あたまがあれば──疑わしいものだがね──とにかくそのとき、きみは、もう一度自分の立場をよく考えて、自分の問題を逃避するほうを選ぶか、でなければ男らしくそれに立ち向かってゆくかが決められる」

　ぼくはそれを飲んだ。

「これでおわり。服を着てよろしい。ぼくはきみの身体検査表を通すが、最後のぎりぎりの瞬間まで、ストップをかける権利を持っているのだから、それを忘れないように。アルコールは今から一滴たりともいけない。今晩は軽い食事をして、明朝は朝食ぬき。明日の正午に、ここへ最終検査を受けにくる」

　いい終わると、彼はさようならともいわずに踵きびすを返して行ってしまった。ぼくは服を着て、全身ハレモノになったような気持ちでそこを出た。パウエル氏が、すでにぼくの書類一式を用意万端整えて待っていた。ぼくがそれを取りあげようとすると彼がいった。「よろしければ、書類をここに置いていかれて、明日正午ここへいらしたときお持ちになったらいかがです。それは、あなたが冷凍睡眠コールドスリープにお入りになる際、棺の中に一緒に入れておくぶんですから……」

「ほかのはどうなった？」

「会社の控えが一通、ほかにあなたが冷凍睡眠につかれてから裁判所へ提出するぶんが一通、それから、カールズバード記録保存所へ送付するのが一通です。ところで医者から今晩以後のお食事の注意はお受けになりましたね」

「十二分に受けましたよ」ぼくは、困惑の表情を隠すために書類に目を通すふりをした。

　パウエルが手をのばした。「わたくしが今夜それを安全にお預かりいたします」

　ぼくは書類を引っこめた。「ぼくが保管することにするよ、安全にね。株の選択のことで、もう少し考えなおしてみたいことがあるから」

「ははあ。ですが、それはもうちょっと遅すぎますが……」

「せかさないでくれよ。もし変更したくなったら、間にあうように明日早く来る」

　ぼくはボストンバッグをあけて、ピートのわきのサイドポケットへ書類をつっこんだ。以前から、ぼくは重要書類をここへしまうことにしていた。カールズバード洞窟（ニューメキシコ州東南部にある同名の国立公園内の有名な石灰洞。前出の記録保存所はこの中に設置されたものという想定）ほど安全ではないかもしれないが、ここは、思ったよりずっと安全なしまい場所なのだ。かつて、コソ泥君が、このポケットからなんだったか忘れたが、盗もうとしたことがある。おそらく、彼の手の甲には、まだピートの爪傷と歯型が残っているだろう。





　　　　　２





　ぼくの自動車は、その日の朝乗り捨てたまま、パーシング・スクエアを少し下ったところに駐めてあった。ぼくは、駐車料金をメーターに入れて、自動車の自動操縦装置を西部国道に合わせ、ピートをボストンバッグから出して座席の上に載せると、ようやく落ち着いた。

　いや、落ち着こうとしたのだが、ロサンゼルスの交通は自動操縦装置にまかせて安心しきっているには、あまりに激しく殺人的だった。ぼくはこの全システムを根本的に設計しなおしたくなった。それは、真の意味で近代的なフェイル・セーフ方式ではなかったのだ。ウェスタン・アヴェニューの西へ出て、再び手動式の操縦にもどれるようになったころには、ぼくはひどくいらいらして、一杯飲みたくなっていた。「あそこにオアシスがあるぞ、ピート」

「ゴロニャン？」

「すぐ前だ」

　だが、駐車すべき場所を探しているうちに──ロサンゼルスは外来者をよせつけない。闖ちん入にゆう者しやは、駐車場が見つからないで往生するのが常だ──ぼくは、医者から、アルコールに触れてはいけないといわれたことを思いだした。

　しかし、とぼくは考えた。二十四時間近くたってから、ぼくが酒の一杯や二杯飲んだかどうかわかるだろうか。ぼくは、なにかそんなことを調べる方法があるというような記事を読んだことがあったのを思いだした。

　ちきしょう。あの医者のヘソ曲がりめ、アルコールがちょっとでも検出されたが最後、きっと、ぼくの冷凍睡眠コールドスリープを禁止するにちがいない。そんなことになっては困るので、ぼくは利口に立ちまわることにした。酒はやめとこう。

「ニャウ？」とピートが不審顔で訊いた。

「あとにしよう。どこかのドライブインに入ろう」そういったとたんだった。ぼくは、自分が、酒なんか少しも飲みたくなかったことに気がついた。ぼくが欲しいのは、軽い食事と、一夜の熟睡だったのだ。医者のいうとおりだった。ぼくは、このなん週間か、かつてなかったほど冷静で、しかも気分がよかった。要するに気の持ちようなのだ。おそらく、あのへんな注射にだって、ビタミンしか入っていなかったにちがいない。ぼくは、とあるドライブイン・レストランを見つけて、そこへ入った。そして、自分用に骨つきのチキンを、ピートのために半ポンドのハンバーガーとミルクを注文して、注文したものが来るあいだ、彼を連れてその辺を散歩した。ピートとぼくは、こうして、ドライブインで食事をすることが多かった。もちろん、彼を連れて入ったり出たりするのに、こそこそしなくてすんだからである。

　三十分ののち、食事をすませたぼくとピートは、再び、自動車を雑踏する通りから静かな郊外へ乗り入れていた。ぼくは自動車をとめ、煙草をつけて、ピートの顎の下をなでてやると、考えごとを始めた。

　おいダン、とぼくは自分に呼びかけた。あの医者のいったとおりだぜ。おまえさんは、壜の口から中へもぐりこもうとしているようなものなんだ。おまえさんのとんがり頭は入るだろうが、肩にはちょっと狭すぎる。いま、おまえは冷静になっている。胃に食物をつめこんだし、なん十日めかにしてはじめてゆっくり休養もとった。おかげで気持ちも落ち着いた。

　そのほかのことではどうか？　やっぱり、医者のいったとおりではないか？　わがままな子供じゃあるまいし、この程度の挫折に立ち向かう勇気もないほどの意気地なしなのか？

　なぜ冷凍睡眠コールドスリープなんかに行こうというのだ？

　冒険の精神からか？　それとも、母親の胎内に逃げこもうとする兵役不適者セクシヨン・エイトみたいに、自分自身から逃避しようとしているのか？　どうだ？

　だって、行きたいものはしょうがないだろう。ぼくは断然反撃に出た。考えてみろ！　西暦二〇〇〇年だぜ！

　よーし、それじゃ、冒険がしたいということにしておこう。しかしそれなら、なぜおまえはおまえの問題を片づけようとせずに慌てて出かけるんだ？

　わかったよ、わかったよ！　といって、どうしたらおれに片づけられるんだ？　あんな仕打ちをされたいまとなっては、もうベルをマイルズから取り返したくはない。逃げ出す以外、おれになにができるんだ？　二人を告訴するのか？　冗談じゃない。ぼくには、なんの証拠もないのだ。それにどっちみち、裁判なんてものは、弁護士以外には、得するやつがないようにできているのだ。

「ゴロニャン、ニャオウ」とピートがいった。

　ぼくはワッフル形に傷跡のついたピートの頭を見おろした。こんな場合、ピートなら、訴えるなんてまだるっこしいことはしない。ほかの猫のヒゲの格好が気にくわなければ、彼は単刀直入に、猫なら猫らしく立ちあがって外に出ろと戦いを挑むのだ。「おまえのいうとおりにしよう、ピート。これからマイルズに会いに行って、有無をいわさず押さえつけ、白状するまでぶんなぐってやる。冷凍睡眠コールドスリープに行くのはそのあとでいい。とにかく、やつらがおれたちに、どうしてあんなことができたのか、張本人は誰なのか、つきとめずにはおくもんか」

　カウンターの後ろに電話ボックスがあった。ぼくはマイルズを呼び出し、家にいるのを確かめると、いま行くから待っていろといいおいて外へ飛び出した。

　親父がぼくを、ダニエル・ブーン・デイヴィスと名づけたのには、れっきとした理由がある。父はその名をつけることで、ぼくに、自由を愛する精神と独立心とを授けようとしたのである（Daniel Boone 一七三四～一八二〇。アメリカ西部の開拓者、ケンタッキーを踏査、西部発展の基礎を築いた人物）。

　ぼくが生まれたのは一九四〇年、世界じゅうが、これからの世界は個人の尊厳など問題ではなく、全体こそが未来の主人になるのだと主張していた時代だった。父はこれを信じようとせず、ぼくの名前も、こうした風潮に対する一種の挑戦としてそうつけたのだ。そして、自説の正しさを最後の最後まで証明しようと空むなしい努力を続けつつ、北朝鮮で洗脳を受けて死んでしまった。

　やがて六週間戦争がやってきた。ぼくは機械工学の学位を持っていたので、徴兵で陸軍に取られたとき、将校への任官試験を受ける資格があったのだが、あえてそうしなかった。というのは、ひとえに、父親譲りの独立独行の野心にぼくが燃えていたためで、命令を与えず、命令を受けず、野心を持たず、とにかく義務だけ果たしたら一日も早く除隊になりたかったからだった。そして、冷戦がついに熱い戦争となって煮えたぎったとき──ぼくは、ニューメキシコのサンディア兵器廠しようで、下士官待遇の技術者として原爆弾頭にアトムを詰めこみながら、除隊の暁あかつきにはあれもやりたい、これもやりたいと計画を立てていた。サンディア兵器廠が一瞬にしてけし飛んだあの日、ぼくは〈恐怖〉の供給作業にダラスに出張していた。死の灰は風に乗ってオクラホマシティの方向へ吹き流された。ぼくが今日あるのは、いつにかかってそのおかげなのだ。

　ピートも、似たような理由で難を免れたのだった。

　ぼくには、マイルズ・ジェントリーという親友がいた。召集で軍隊に復帰した退役軍人だった。彼は娘が一人いる未亡人と結婚していたが、その細君は、彼が召集を受けたちょうどそのころ亡くなった。それで彼は、継まま娘むすめのフレデリカに家庭を与えるため、アルバカーキ市に家を持ち、そこに住んでいた。リッキー（ぼくらは、彼女を一度もフレデリカと本名で呼んだことはなかった）がぼくにかわって、ピートの世話をしてくれていたのだ。猫の女神ビュバスティスに幸あれ！　あの戦慄の週末、たまたま七十二時間の休暇をとれたマイルズが、リッキーとピートとともに家を空けていたために命拾いをしたのだった。ピートは、ぼくがダラスへ行くあいだ、連れて歩くわけにはいかないので、リッキーが旅行先まで一緒に連れていってくれていたのだ。

　原子力兵器の分工場が、スーリー（北極、アイスランド等の古名）をはじめ、およそ予想もしないところに、あらかじめ安全に分散してあったことを知って、ぼくは、他の人々同様あっと驚いた。しかもそれは、文字どおりの人工的資源を含んだ完璧な予備軍だったのである。

　人間の身体を冷却させて、新陳代謝を一時完全に中止させる方法は、すでに三〇年代から、理論的には広く知られていた。しかし、この六週間戦争の勃発までは、それはたんに研究室内の実験であるか、ないしは望みの綱の切れた病人に外科手術を行なう際に限って用いる最後の方法としてしか考えられていなかった。だが、金と人材とを惜しまなければ、どんなことでもできるものだ。血液停滞ステーシス、冷凍睡眠コールドスリープ、仮死状態ハイバーネーシヨン、新陳代謝人工減少リデユースト・メタボリズム──どう呼んでもそれは勝手だが、兵器廠の兵へい站たん医学課は、人間を材木かなにかのように積んでおいて、必要に応じて蘇生させて使う方法をついに発見していたのだった。まずその人間を麻酔し、つぎに仮死状態にしてから冷却を始め、摂氏四度──つまり水が氷の結晶をともなわぬマキシマムの比重に、体温を保つようにする。これでＯＫ。人間は文字どおり完全な人的資源となり、必要に応じて蘇生させるまで冬眠しつづける。急ぎの場合は高周波治療法ジアテルミと催眠覚醒法とを併用することによって、十分間以内に蘇生させることができた（現に、アラスカのノームでは、七分という記録がある）。ただし、こんなに超スピードで蘇生させると、細胞組織を老衰させてしまうため、それ以後その人間は少し頭が鈍くなってしまうおそれがあった。急がない場合には、ミニマム二時間が理想的なのだ。それ以上早い方法には、職業軍人のよくいう〝計算ずみの危険カルキユレーテツド・リスク〟があった。

　すべては、この〝計算ずみの危険カルキユレーテツド・リスク〟をわれわれが冒おかすであろうことに、敵が気がつかなかったことによって決定した。その結果、戦争はわれわれの勝利に帰し、ぼくは強制収容所に送られずに、金をもらってめでたく除隊して、保険会社がこれを冷凍睡眠コールドスリープと称して商売にしはじめたちょうどそのころ、マイルズと一緒にある事業を始めたのだった。

　ぼくらはモハーヴェ砂漠にあった空軍の払下げ建築物を利用して、ここに小さな工場を建て、〈ハイヤーガール〉の製作を始めた。ぼくが生産のいっさいを、マイルズがお得意の法律と実業の経験を生かして経営にあたった。そうだ、あれはぼくの発明なのだ。あれとか、〈窓拭きウィリー〉とか、その他これらの親類筋にあたる器具は、ぼくの名を冠してはいないが、すべてぼくの発明なのだ。理由をひととおり聞いてもらおう。軍隊にいたあいだ、ぼくは、技術者として、今後なにをしていったら一番よいかと頭をしぼって考えた。スタンダード・オイルとか、デュポンとか、でなければゼネラル・モーターズに行って職を求めるか？　それも良かろう。三十年も勤務すれば、会社から表彰パーティが開いてもらえ、年金もつくだろう。食事にこと欠くこともなく、会社の専用機にも飽きるほど乗れるだろう。だが、そうしているかぎり、永遠に他人の雇い人であって、自由は決して得られない。もうひとつの大きな技術者のマーケットは、公務員となることだ。だが、これとてその点では変わりない。初任給もよし、年金もよし、不安はなく、年三十日の有給休暇で身体もずっと自由ではある。だがぼくは、長いあいだ待ちこがれた長期休暇に、ようやくありついたばかりだった。完全な自由こそ、ぼくの求めていたものだった。

　だが、このマスプロ時代に、一個人技術者になにができるか？　かつては、自転車屋をやりながら、あるいは、少ない金を資本に成功した、フォードやライト兄弟の例があったが、そんな時代はとうに過ぎ去っていた。ぼくはそんな幸運を信じなかった。

　オートメーションは一世を風ふう靡びしつつあった。あらゆる企業が自動装置を完備していた。二人の計器係と守衛一人で運営される大工場、大都市ひとつぶんの切符を印刷してしまう印刷機、人力をまったく借りずに石炭を掘る削岩機など、およそオートメーションならざるものはない。ぼくも、軍の兵器廠にいたあいだ、電子工学や連鎖反応理論、電子頭脳理論をいやというほど教えこまれていた。

　オートメーションのまだ浸透していない最後の領域はどこか？　ぼくは考えた。いわずと知れた家庭である。それも、一家の主婦のいる家庭。ぼくは家そのものに自動装置を施したスイッチ式の家などを工夫しようとはしなかった。主婦はそんなものを望みはしない。彼女らの望んでいるのは、たとえ崖の下の洞窟でも、その中に便利な家具類の備わった家なのだ。ところが、家庭の主婦と呼ばれる人々は、執事やメイドの類がマストドン同様過去の遺物になってしまった現在も、いまだに、良いメイドを置きたいという希望を捨てていない。家庭の主婦で、多少なりともメイドを所有する希望を持っていないひとに、ぼくはいまだに会ったことがない。彼女らは、水道屋のアルバイトでも苦情をいう程度の賃金で、食事はテーブルからこぼれたパン屑で満足しながら、一日十四時間も床を這いずりまわって働くことをありがたがるような女のメイドが、まだ存在すると信じているらしいのだ。

　ぼくらが、ぼくらの怪物モンスターを〈ハイヤーガール〉と名づけた理由も、まさにこれあるがためであった。この名は、家庭の主婦たちに、子供のころお祖ば母あさんが雇っていた、移民のメイドを思いださせたのだ。種を明かせばこの怪物の正体は、真空掃除器の改良型で、ぼくらはこれを、ふつうの吸引式の真空掃除器とあまりちがわない値段で市販しようと計画していたのである。

〈ハイヤーガール〉は（もちろん、これはのちにぼくが改良を加え完成したセミ・ロボット型でなく、市販第一号時代のである）どんな床でも、二十四時間、人間の手をわずらわせずに掃除する能力を持っていた。そしておよそ世の中には、掃除しなくてよい床など、あるはずがないのだ。

〈ハイヤーガール〉は、一種の記憶装置の働きで、時に応じてあるいは掃き、あるいは拭き、あるいは真空掃除器とおなじようにゴミや埃ほこりを吸収し、場合によっては磨くこともする。そして、空気銃のＢＢ弾以上の大きさのものがあれば、これを拾いあげて上部に備えつけた受け皿の中に置き、あとで、彼らよりいくらか頭のよい人間様に、捨ててよいかどうかを判断してもらうこともできるのだ。こうして、〈ハイヤーガール〉は一日二十四時間、静かに汚れを求めて歩く。曲がり角であろうとどこだろうと、塵ひとつ見落とさず、すでにきれいになっている床は素通りして、一刻も休まず汚れた床を求めてまわるのだ。もし部屋に人がいる場合には、しつけの行き届いたメイド同様に、主婦がスイッチをひねって、掃除してもいいよといわないかぎりは、決して部屋に入ってこない。動力が切れるころになると、自動的に所定の置場へ出かけていって、動力をチャージする──ただしこれも、永久動力につけ替える以前のことである。

　要するに、このぼくらの〈ハイヤーガール〉第一号と真空掃除器とのあいだには、たいした相違はなかったのだが、ただひとつ──〈ハイヤーガール〉の、人間の手をわずらわせないという点が大いに違っていた。それで充分だった。〈ハイヤーガール〉は、予期したとおり、売れに売れたのである。

　実をいえば、この〈ハイヤーガール〉は、あまり自慢のできた発明ではなかったのだ。つまり、なにからなにまで借り物だったのである。移動装置は四〇年代の終わりごろのある科学雑誌に載っていた自動操縦草刈機のマネだし、記憶装置はミサイルの電子頭脳の盗用（軍の機密は、特許というものが取ってないから、こういう場合きわめて重宝だ）、掃除器具の考案にいたっては十いくつものさまざまな品物からお知恵を拝借した。陸軍病院で使っている床磨き機からジュース・ディスペンサー、はては原子力工場で使っている放射性物質をつかむ遠隔操作リモート・コントロールのマジック・ハンドなど、すべて利用したのである。新しく考案した部品はなにひとつなかった。要はその部品をひとつに組み立てたアイデアと、さらにはそれを大量生産の段階に持ってゆく技術的手腕にあったのだ。

　あらゆる部品は、すべて、スイート工業カタログの規格部品を取り寄せればこと足りた。唯一の例外は二個の立体カムとプリント基板サーキツトだけで、プリント基板のほうは下請に出し、カムは、ぼくらが〝工場〟と呼んでいた小屋で、ぼく自身が、軍の払下げ自動工作機でこしらえた。最初は、ぼくとマイルズだけだった。なにからなにまで二人でやった。第一号試作品を作るのに、四千三百十七ドル九セントかかった。市販できるようになって、最初の百台までは平均三十九ドルだった。ぼくらはこれをロサンゼルスのある商社に一台六〇ドルで売り、商社は八十五ドルで売り出した。ぼくらには直接販売の手段がなかったので、商品は委託販売によらざるを得なかった。そのため金が入ってきはじめたころには、餓死寸前のありさまだった。だが、これがきっかけだった。〈ハイヤーガール〉は人気の的となった。

　ベル・ダーキンがぼくらの仲間に加わったのはその直後だった。それまでは、ぼくとマイルズが、一九〇八年製という大時代のタイプライターで、手紙を打っていたのである。ぼくらは彼女をタイピスト兼会計係として雇った。そして、カーボンリボンつきのしゃれた書体の電動タイプライターをレンタルし、ぼくがレターヘッドをデザインした。すべてを事業に投資していたので、マイルズとリッキーは近くの小さな家で寝て、ぼくとピートは店で寝ていた。ほどなく、自己防衛の手段として株式会社を設立することにした際、ぼくらは彼女を加えることにした。株式会社の設立には三人の人間が必要だからだ。そこで彼女にも株の一部を持たせ、正式に経理担当重役という肩書を与えた。マイルズが社長兼ＧＭ、そしてぼくがチーフ・エンジニア兼取締役会議長で、総株の五十一パーセントを所有することになった。

　これには、若干の説明を要する。ぼくは、なにも欲得ずくで会社の主導権を握ったのではない。ただ一筋に、他人に従う身になりたくなかったから──自分自身の主人でいたかったからだ。マイルズは仲間として実によく働いてくれたし、ぼくも充分信用はしていた。しかし、最初この事業を始めたとき出した資本の六十パーセントがぼくの貯金だった上、発明と、生産技術は百パーセントぼくのものだった。マイルズは、ぼくなしには〈ハイヤーガール〉を製作できなかったのに対し、ぼくは、マイルズでなく他の誰とでも共同で事業を始められたわけだ。一人でも始められたかもしれない──だが、金もうけはできなかっただろう。マイルズは商売人だったが、ぼくはそうではなかったから。

〈ハイヤーガール〉第一号は球場のビールのようにとてつもない売行きを示した。それでぼくも、しばらくのあいだは、これの改良に専念したが、やがてもっとも能率的経済的な設計が完成すると同時に、製造の責任を工場長に持たせ、ぼくはまた別の家庭用器具の発明を始めた。そうして考えてみると、家事に対して払われている考慮の少ないことに、ぼくは今さらながら驚いた。家庭生活は、人生の少なくとも五十パーセントを占めているのだ。女性雑誌は家事の節減とか能率的なキッチンの必要を十年一日のごとく説いてはいたが、まず空理空論といって過言ではなく、美しいカラーのグラビアに出てくる新時代の家内設計なるものも、シェイクスピアの時代のそれと大差ない。馬力からジェット機への科学の革命的進歩も、家庭内には届いていなかった。

　ぼくは、再びぼくの持論に戻った。家庭の主婦が必要としているのは機械化された家ではなく、消滅してしまったメイドや執事のかわりを務める器具である。すなわち、掃除と料理と育児の世話をしてくれる器具。これである。

　そこでまず考えたのが窓拭きとバスタブ磨きだった。ことにバスタブを磨くとき身体を二つに折り曲げる苦労ときたら、なみたいていなものではない。こうした窓ガラス、バスタブ、トイレなどの汚れを、いっきょに消す電気器具があってしかるべきではないか。かくて、できたのが〈窓拭きウィリー〉だった。どうしてもっと早く誰かがこれを考え出さなかったのか不思議なくらいだ。ぼくはみんなが買わずにいられなくなるくらいウィリーの価格を下げるまで売り出さなかった。窓拭きをするのに一時間あたりいくらかかるか考えてみるといい。

　それでぼくはウィリーの製造を手控えていたのだが、これが、マイルズの気に入らなかった。彼は、ウィリーが、ある程度まで安くなると、すぐさま市販生産に取りかかりたかったのだ。だがぼくはそうさせなかった。ぼくはウィリーを、簡単に修理のきくものにしたかった。およそ、家庭用品類の最大の欠点は、故障しやすい点にある。便利な器具にかぎって故障しやすく、使おうとすると動かなかったり、一番こまるのは、ほんのつまらない修理にさえ、もとどおり動かすのに、一時間五ドルもの手間賃をかけなければならないということだ。そして、せっかく修理ができたと思えば次の週にはまた壊れる。皿洗い機が大丈夫と思えばこんどはエアコンのほうが、雪嵐のふきまくる土曜の夜更けかなんかに意地悪くばったりとまってしまうのだ。

　ぼくは、ぼくのウィリーに、絶対故障のないように、ウィリーを買った人たちが、ノイローゼで胃い潰かい瘍ようになったりしないようにしたかったのだ。

　だが、機械に故障はつきものだ。いかにぼくが手がけた優秀品といえども、〝絶対〟は期しがたい。ことに、家庭内にさまざまの機械機具類が充満している今日このごろでは、どこかでなにかが故障していないことはないといってもよいくらいだった。

　だが、軍ではすでにこの問題を克服していた。考えてみれば至し極ごくあたりまえのことで、親指ほどしかないちっぽけな部品が故障しても、軍の場合は、なん十万という人命を危険にさらし、場合によっては戦争そのものに敗北を喫することもあるのだから、真剣になるのもむりはない。そのためにつくられたのが、フェイル・セーフや予備回路スタンバイ・サーキツトや〈三度めの正直テルミー・スリー・タイムズ〉その他の巧妙きわまる部品である。だが、こうした軍用機械類のうち、家庭用品に利用できるのは、その部品交換式組立方式であった。

　まさに馬鹿みたいに単純明快なアイデア、修理しないで交換するというアイデアだった。ぼくは〈窓拭きウィリー〉の、多少とも故障をおこす可能性のある部品のすべてを、この部品交換式プラグインユニットにしようと考えたのだ。こうしておけば、部品のあるものが故障したり、または修繕に出す必要は、依然として残るかもしれないが、それはあくまで部分品そのものなのであって、ウィリー自体は、故障で使えないということが絶対になくなるのだ。

　さてこうした原理で〈窓拭きウィリー〉試作第一号が完成したのだが、ここで、マイルズとぼくに意見のくいちがいができたのだった。ぼくは、試作品から販売用製品を生産する時期を決定するのは、技術部門の権限だと主張し、彼は彼で、それを営業部の権限だとがんばった。もしぼくが会社の決定権を握っていなかったら、ウィリーはおそらく、他の胸くそのわるい中途半端な省力化器具の場合と同様、急性盲腸炎にも劣らぬすさまじさで市場に氾はん濫らんしていたにちがいない。

　ベル・ダーキンが、いきりたつぼくとマイルズとをなだめたので、喧嘩はようやく収まったが、もしそのとき、彼女に、マイルズのいうとおりウィリーを販売しましょうといわれていたら、どうなったかわからないのだ。おそらくぼくは、準備のできていないのを承知でそうしていたかもしれない。というのも、そのときのぼくは、およそ男として最高限度ののぼせかたを、ベルに対してしていたからである。

　ベルは秘書兼オフィス・マネージャーとして最適任者であったばかりか、プラクシテレス（紀元前四世紀のギリシャの彫刻家）をもほれぼれとさせたであろうすばらしいルックスと魅力の持ち主であった。その魅惑は──ちょうど、ピートがマタタビを見ておこすような反応を、ぼくのうちにおこしたのだった。優秀な女性事務員が払底していた折も折、こんな一流中の一流というべきベルが、水準以下のサラリーで、ぼくらの社のような零細資本の会社に自発的に働きにきてくれたのだから、ほかの場合だったら、一応は「なぜだろう？」と疑問をおこしたろう。だが、あのときのぼくらは、〈ハイヤーガール〉が市場に起こしつつあったセンセーションのおかげで、書類の流れに手も足も出ないありさまだった。そんな状態から救い出されたのがありがたくて、彼女に、前の職場のことを訊くことすら、まるで忘れていた。

　そしてそれ以後は、かりに誰かが、ベルの前歴を調査してはどうかといってきたとしても、ぼくは憤然としてそれを退けたにちがいない。そのころはすでに、彼女のバストのサイズが、ぼくの判断力に甚大な影響を及ぼしていたからだ。ベルは、ぼくに、彼女と会うまでのぼくの生活がいかに孤独なものであったかを告白させた。彼女はぼくの告白を静かに聞きおわるといった。あなたという方を、もっとよく知らなければなんともいえないけれど、わたくしも、あなたと同じように思うことがときどきありますわ──。

　マイルズとの喧嘩の仲裁をしてまもなく、ベルはついにぼくと生涯をともにすることに同意してくれた。

「ダン、あなたはきっと偉くなる方よ……わたくし、生涯あなたを助けていけるような女になりたいわ」

「だって、きみはすでにそうだよ！」

「まあ、そんな。でもね、ダン、わたくし、いますぐに結婚して、子供のことや生活のことで、あなたに苦労をかけさせるのはいけないと思うの。まず、当分のあいだはあなたと一緒に働いて、事業を完成することにしたいわ。それから結婚しましょうよ、ね？」

　ぼくは反対したが、ベルの決心は固かった。「だめだめ。ね、あなた。わたくしたちの一生はまだまだ長いわ。〈ハイヤーガール〉の名前は、やがて、ゼネラル・エレクトリックと肩を並べるような大きな名前になるんだわ。でも、わたくしは、結婚したら、お仕事のことなんかすっかり忘れて、あなたを幸福にしてあげることだけを考えたいのよ。だからこそ、まず、あなたの将来のために、いまは力をつくすのがほんとうだと思うの。ね、わかってくださるわね、あなた」

　ぼくはベルのいいなりだった。ベルは、ぼくが、高価なエンゲージリングを買ってやろうとするのをおしとどめた。そのかわりにぼくは、ぼくの持株の一部を、彼女に譲渡した。もちろんぼくのほうから提案した形だったのだが……いまにして思えば、このプレゼントが、誰の思いつきだったのか、自信がもてなくなってくる。

　それからのぼくは、よりいっそう馬車馬のように働いた。自動的に塵を空ける屑くず籠かごとか、皿洗い器が皿を洗い終わったあと、皿を片づける装置だとか……。誰も彼も、一人のこらず幸福だった。

　ただし、ピートとリッキーはべつだ。

　ピートはそれでも、不愉快ではあるが自分の手には負えないと考えたときいつもするように、ベルの存在を無視できた。不幸なのはリッキーだった。

　罪はぼくにあった。リッキーは、サンディアではじめて会った、髪にリボンをつけ大きなかわいいお目々の六つの少女のとき以来、ぼくの〝恋人〟だったのだ。彼女が大人になったら、かならず〝結婚〟して、二人でピートの世話をしようと固い約束をしてあった。ぼくはこの約束はゲームのようなものだと思っていた。おそらくはそのとおりだったはず。結婚すればぼくらの猫の面倒をみられるという点について、小さなリッキーは真剣だったのだ。だが、子供の心の中などわかるはずはない。

　ぼくは子供好きではない。それどころか、たいていの子供は小さな暴君、成長するまでは（時には成長してもおなじことだ）手がつけられない生き物だと思っていた。だが、フレデリカは、ちょうどその年ごろだった、ぼくの妹を思いださせた。そのうえ、ピートと仲良しで、世話もなかなかよく焼いてくれる。おそらく、リッキーにしてみれば、自分をいい加減にあしらわず（子供のときにはぼくもそうされるのが嫌だった）、ガールスカウトの話などを真面目に聞いてくれるぼくに、親しみにまさる信頼を感じていたのだろう。リッキーは確かにいい子だった。お転婆でもないしおしゃべりでもない、ずかずか膝の上にあがってくるがさつな神経も持っていなかった。ぼくらは大の親友で、二人してピートの面倒をみる共同責任を持っていた。そして、〝恋人〟ごっこは、そうしたぼくたちの、高級なゲームだったのだ。

　だがあの日、敵の水爆が、ぼくの母と妹とをいっきょに奪ってしまった日以来、ぼくはこのゲームをやめてしまった。もちろん、意識的に決心したわけでなく、そんな冗談が、突然耐えられなくなったのだ。リッキーはそのとき七つだった。そして、ベルがぼくらの仲間になったときが十、ぼくとベルが婚約したときはもう十一になるところだった。リッキーはベルを激しく憎んだ。だが、そうしたリッキーの感情がわかるのはぼくだけで、ベル自身は、どうしてもリッキーが自分に口をきこうとしないことを、きっと〝恥ずかしがる年ごろ〟だからだろうといっていた。マイルズもそう考えているのだろうとぼくは思っていた。

　ピートがまた、べつの意味で問題だった。そしておそらく、もしぼくがあれほどのぼせていなかったら、ベルとぼくとがとうてい理解しあえる相手ではないことは、すでにその一事から判断できたはずなのだ。ほかでもない、ベルがピートを〝好いて〟いたことだ。そうとも、そうだろうとも！　なにしろベルは、ぼくに関することならなんでも好きだった。レストランでのぼくの好みからぼくの禿はげにいたるまで──したがって、猫ももちろん大好きだったわけだ！

　しかし、猫好きの人間にむかって、猫嫌いが猫好きのふりをすることは難しい。世の中には猫好きがいくらかと、あと大多数の〝害のない、必要な猫であっても我慢できない〟人間とがある。もしそうでない人が、礼儀その他の理由から猫好きを装って近づくと、正体がわれてしまう。それは猫嫌いが猫の扱い方を知らないのと、猫のほうがそんな社交辞令を拒絶するためだ。

　猫にはユーモアのセンスがない。あるのは極端に驕きよう慢まんなエゴと過敏な神経だけなのだ。それではいったい、なぜそんな面倒な動物をチヤホヤするのだと訊かれたら、ぼくには、なんとも答えようがない。匂いの強いチーズをきらう人になぜリンバーガー・チーズ（ベルギー原産の匂いの強いチーズ）を〝好きにならねばならない〟のかを説明するほうがまだいいくらいだ。にもかかわらずぼくは、眠りこんでいる小猫をおこさないために、高価な袖を切り捨てたという昔の中国の官吏の話に、心の底から同感するのである。

　ベルがまさにその失敗をした。彼女はピートが好きだというところを見せようと、彼を犬を扱う手つきで扱おうとした結果──いやというほど手をやられたのだ。引っ搔いた後、ピートは、利口な猫らしく、ひらりと外へ飛び出したまま、しばらく帰ってこなかった。おかげでぼくは、ピートを折せつ檻かんせずにすんだ。ちなみにピートは、少なくともぼくからは、一度もなぐられたことはない。猫は忍耐をもって訓練すべきものでこそあれ、なぐってもなんの役にも立たないのだ。

　ぼくはベルの手の傷に消毒薬ヨードチンキを塗ってやりながら、彼女の過失を説明しようとこころみた。「わるかったね、ほんとにすまないことをした！　でも、あんなことをすると、また引っ搔かれるよ」

「まあ！　だって、わたくし、かわいがってやろうとしただけよ！」

「それはそうだけどね……しかし、きみのかわいがりかたは、犬のかわいがりかたで、猫のじゃなかったんだよ。猫の場合はたたいたりしちゃ絶対だめだ。なでてやらなきゃいけないんだよ。それに猫の爪の届く範囲で、急激な動作をしてもいけない──つまり、こっちがこれからなにをするかを、猫に理解するチャンスをまず与えてやらなくちゃいけないんだ。しかも、猫がこっちの愛撫を望んでいるかどうかが問題だ。望んでもいない愛撫を与えようとすると、つまりそれは、いささか礼儀にはずれたことになる。猫はとても礼儀を重んずる動物だからね」といってぼくはためらった。「ベル、きみは猫は嫌いなんだろ？」

「なんですって？　んまあ、冗談じゃないわ！　もちろん、わたくし、猫は大好きよ」だが、彼女はそこでつけ加えた。「でもいままで、猫があんまりそばにいなかったから。かのじょ、すこし神経質なんじゃない？」

「かれだよ。ピートは牡猫だ。いや、とくに神経質じゃないよ──いつも、大事にされつけているんだからね。猫を笑うことも、絶対いけない」

「なんですって？　それ、いったい、どういうことなの？」

「猫はけっしておもしろくはないからさ。彼らは滑稽なんだ。しかし、彼らにはユーモアのセンスがないから、それが彼らを怒らせるんだ。もちろん、猫は、笑われたからといって引っ搔きはしない。ただ、向こうへ行ってしまうだけだが、あとで仲直りが大変になるんだ。しかし、それも一番大切なことじゃない。一番大切なのは、猫の抱きあげかただよ。やつが帰ってきたら教えるよ」

　だがピートはその日ベルがいるあいだ帰ってこなかったので、ついに教えずじまいになってしまった。ベルはそれきり、絶対にピートに手をふれようとしなくなった。依然として、いかにも猫好きらしくしゃべりかけたりはするが、必ず一定の距離を置いていた。ピートのほうでもおなじだった。ぼくは、それきりこの事件を忘れることにした。大の男が、こんな些さ細さいなことで、生命より大切な恋人を疑うなどということが、できようはずがなかったからだ。

　しかし、後にこのピートの問題は、われわれのあいだに、ほとんど決裂の危機をつくりだそうとしたのである。ベルとぼくとは、前から、結婚したらどこに住もうかと、いろいろ話しあっていた。ベルのほうは、まだ結婚の日取りを決めようとしなかったが、結婚してからのそうしたこまごまとした問題については、よく話していたのだ。ぼくは、工場のそばに小綺麗な家をつくって住みたかった。しかし彼女のほうは、ベル屋敷とでもいう本式の大邸宅がつくられるようになるまでは、もっと中心にちかいところで、アパート住まいがしたいといったのだ。

「でもベル、それはあまり実際的じゃないよ。ぼくは、仕事のことで、工場のそばにいなきゃならないことが多い。それに、きみ、町のまんなかのアパートの中で、牡猫の面倒をみることがどんなに大変か知っているかい？」

「ああ、そのことよ。あなたから、そのことをいいだしてくれて、助かったわ。ねえ、あなた、わたくし、いろいろ猫のことを研究してみたのよ、いえ、ほんとうに。それで、ピートを、去勢しなければいけないと思うのよ。そうすれば、ずっとおとなしくなるし、アパートの中だって、ちゃんと飼えるようにもなるわ」

　ぼくは目を瞠みはってベルを見つめた。われとわが耳が信じられなかった。ぼくのピートを、誇りたかい老戦士を、去勢しろというのか？　彼を、炉辺の置きものに？

「ベル、なにをいってるんだ！」ぼくは思わず叫んだ。

　彼女は、例の〝ママはなんでも知っている〟調の甘い口調で、猫を私有財産とかんちがいしている連中の必ずつかう陳腐な言葉をならべてぼくを説きふせようとした──それが、彼にはなんの害も与えないこと、それが彼のためにこそなれ、悪いことはひとつもないこと、ぼくが彼をいかに愛しているかは、わたしが一番知っている、だから彼をぼくから取りあげようなどとは、これっぽっちも思っていないこと、それが、どんなに簡単で安全で、おまけにどんなにみんなのためになるかということなど……。

　ぼくは、ベルの言葉をさえぎった。「それじゃ、ぼくたちのために、ぼくもそうしたらどうなんだい、ベル？」

「どういうこと？」

「ぼくも一緒に去勢するのさ。そうすればぼくもずっとおとなしくなって、夜はずっと家にいるようになるし、きみに反対するようなこともなくなるだろう。いまきみがいったように、ちっとも痛くないし、ずっと幸福になるだろうよ」

　ベルは赤くなった。「非常識なこという人ね！」

「きみだってさ！」

　ベルは、二度とそのことはいいださなかった。彼女は、意見の相違を、絶対に争いにまで持っていくことをしない女だったのだ。そんなとき彼女は、おやすみなさいだけいうと口をつぐんで出ていった。だが、決して諦めはしなかった。いろいろな点で、ベル自身が、猫的な要素を持っていた──それが、おそらく、ぼくが彼女に抵抗できなかった理由だったのであろう。

　ぼくも、この問題が尻切れとんぼになったのを喜んだ。なぜならぼくは、年来の計画だった〈万能フレキシブルフランク〉の製作にとりかかっていたからである。

〈窓拭きウィリー〉と〈ハイヤーガール〉は、すでに莫大な儲けを約束してくれていた。だがぼくの頭の中にはうるさい蜂が一匹いて、そいつがぼくに、あらゆる仕事のできる万能自動機械の製作を、執拗にせがんできかなかった。自動機械という名前が野暮ったくて気に入らなければロボットと呼んでも結構だが、この言葉はあまりにも乱用されすぎているし、いずれにしろぼくは、人間の形をした機械人間なんかを作るつもりはなかったのだ。

　ぼくの望んでいたのは、およそ家庭内の仕事という仕事はなんでもできるような機械だった。掃除や料理はいうにおよばず、非常に面倒な仕事、たとえば赤ん坊のおむつを換えるとか、タイプライターのリボンをつけ替えるとかいった種類の仕事もやってのける機械。いい換えれば、〈ハイヤーガール〉や〈窓拭きウィリー〉、〈子守りのナン〉、〈召使ハリー〉や〈庭師ガス〉などのかわりに、世の中の夫婦が、高級自動車一台を買うぐらいの価格で、そのすべてを兼ねるような機械一台を買えばすむようにするのが、ぼくの狙いだった。

　もしこれが実現すれば、全世界の女性を、長いあいだの家事への奴隷的束縛から解放し、いわば第二の奴隷解放宣言をするに等しい意義がある。ぼくは、〝女の仕事に際き限りはない〟というあの昔ながらの格言を辞書から消してやりたかったのだ。家事は無限に繰り返される不必要きわまる苦役である。これが、前から、家庭用品技術者としてのぼくの誇りを傷つけてきたのだった。

　もちろん、孤立無援の一技術者の能力には自おのずからなる限界がある。〈万能フレキシブルフランク〉は、大部分規格部品を用い、しかも新しい原理をまったく用いないものでなければならない。そうでなければ、ぼく一人の力で、なにができるはずもないのだ。

　さいわいにして、〈万能フランク〉のために役立つ技術は充分すぎるほどにあった。そして、ぼくの作ろうとしていたものは、誘導ミサイルほど複雑なものではなかった。

　それではぼくは、〈万能フランク〉に、なにを求めようか？　答え。人間が家庭の内外においてやるすべての雑用だ。ぼくの〈万能フランク〉はカードゲームをして遊ぶ必要もなく、恋愛も飲み食いも眠る必要もない。そのかわり、人間様がカードゲームをした後始末をし、料理をつくり、ベッドを整え、赤ん坊の守りを──少なくとも、赤ん坊の寝息を注視していて、呼吸がおかしかったら人を呼ぶだけの能力が必要なのだ。ぼくは、彼に電話の応対の能力は授けまいと思ったが、それは、すでに当時ＡＴ＆Ｔが、電話用の応対機を完成し、レンタルをしていたからだった。同様に、玄関の客の応対もしなくてすむ。このころの新築の家のドアには、ドア用応答装置が備えつけになっていたからだ。

　さてそのために、ぼくは〈万能フレキシブルフランク〉に二本の手と眼、耳、頭脳──とくに、特別誂あつらえの良い頭脳を備えつけたいと考えた。

　まず手だが、これは、〈ハイヤーガール〉の手を買った原子力技術装置会社に注文すればよかろう。ただしフランクのためには、ワイド・レンジのサーボ・メカニズムと、ラジオ・アイソトープの重さを計ったり、顕微鏡分析の操作ができるような、非常にデリケートな自動制御装置フイード・バツクのついた、最高級品を必要とする。目も、おなじ会社の製品が役に立つが、この場合フランクに必要な目は、原子力発電所で使うような、厚いコンクリートの遮しや蔽へい壁の背後からむこうが見える──といったほどの高級品でなくていいから、手と較くらべてずっと単純だった。

　耳は、どこのラジオ・テレビ製造企業の製品でも間にあう。ただし、これらに、ちょうど人間の手が自然にそうしているように、見たり聞いたりふれたりすると同時に、手が動作をするような回路を設計する必要は生ずるだろう。

　だが、人間はトランジスターとプリント基板を使って小さなスペースでいろいろな仕事をやってのけることができるのだ。

　ぼくはフランクがハシゴを使う必要がないように、彼の首を駝鳥ダチヨウのように、手を手長ザルのように任意に伸ばせるようにしようと思った。では階段はどうするか？　フランクは階段をのぼれるようにしなければならないだろうか？

　そうだ、これは、動力つきの車椅子ウイール・チエアーが解決してくれる。あれを買って、フランクの台座として使うことにしよう。そうするためには、フランクの試作第一号を、車椅子ウイール・チエアーにおさまるぐらいの大きさで、しかもああいう椅子が容易に運べるぐらいの重さに限定しなければならない。そして、車椅子ウイール・チエアーの動力と操縦装置をフランクの頭脳に連結するのだ。

　さて頭脳だ。これが、最大の難問だった。外形はいかに難しくとも、これに比べれば問題ではない。種々の便利な装置を詰めこんでこれに自動制御装置をつければ、床を磨かせることも釘を抜くことも、卵を割ることも──割らないことも意のままだ。だが、これに頭脳がつかなければ、ちょうど人間の両耳のあいだにその物質がなければ人間ではないのと同様、死人ほどの役にもたたないのだ。

　ただしフランクの場合には、なにも人間のような頭である必要はない。たいていは同じような仕事の繰り返しである家事一般さえできればよい。従順なロボットの頭脳でこと足りるのだ。

　ここに、トーセン記憶メモリーチューブが登場する。われわれが報復攻撃に用いた大陸間ミサイルも、このトーセン・チューブによる〝思考力〟を持っていた。ロサンゼルスの交通管理システムに用いられているのも、同様の記憶装置である。ぼくらはここで、ベル研究所ですら充分に解明し得ない難解なエレクトロニクスの原理にまで深入りする必要はない。要は、このトーセン・チューブをコントロール回路に接続して、手動装置で、ある動作を一度やってみると、チューブはその動作を〝記憶〟し、それ以後は人間の監督などいっさいなしに、自動的に同じ動作を繰り返すのである。自動機械にはこれで充分なのだ。これに、サイド回路をつければミサイルも〈万能フレキシブルフランク〉も〝判断力〟をもつのだ。もちろんこれは、真の〝判断力〟ではない（ぼくの意見では、機械に判断力はあり得ない）。サイド回路は、一種の選択回路である。つまり〝ある制限内であるものを探せ。探しだしたら基本指令を果たせ〟というようにプログラムする能力を持っている。基本的な指令は、トーセン記憶チューブに詰めこめるかぎりにおいて──これがまた、ほとんど制限なしなのだ！──複雑化することができる。こうして、使用者は、〝判断〟回路を、その周波数が、トーセン・チューブに入れておいた記憶のそれに合わないときは、いつでも基本的指令を中止させることができるようにプログラミングすることができるのだ。

　この結果、〈万能フレキシブルフランク〉は、一度食卓を片づけ皿の残りものを捨てて、それを皿洗い器に持ってゆくことを教えられれば、それ以後は汚れた皿を見つけしだい、おなじように片づけられるようになる。しかも、絶対に皿を割るようなことはない。

　同様にして、別の〝記憶〟を与えたチューブを装着すれば、フランクは、赤ん坊がおむつを濡らししだい、すぐに換えてやることができ、赤ん坊にピンを刺したりは、絶対に──繰り返す──絶対にしないのだ。

　フランクの四角形の頭部は、こうしたさまざまのそれぞれ異なる仕事の電子工学的記憶を持ったチューブが、少なくとも百本は楽におさまるものになる。そして〝判断〟のための回路のまわりには安全回路を設け、彼の記憶にまだない何かに出くわした場合には、その場に静止して、救援ブザーが鳴るようにする。こうすれば、皿も赤ん坊も壊さずにすむというものだ。

　かくして、ぼくは動力つき車椅子ウイール・チエアーの骨組みの上に、フランクを設計製作しはじめたのだった。彼の格好は、まさに、帽子かけがタコに恋を囁ささやいているように見えた──だが、その彼の、銀食器を磨く手なみの鮮やかさといったら！





　マイルズは完成したフランク試作第一号をながめ、彼がマティーニをこしらえてぼくら二人に給仕するさまを見やった。フランクはそれから、部屋じゅうをまわって灰皿をあけ、それを掃除して──汚れていない灰皿には絶対に手をふれずに──つぎに窓をあけ、風で閉まらないようにとめ金をかけると、つづいてぼくの本棚のところに行き、塵をはらって、中の本を整頓した。そのあいだ、じっとフランクの動作を見つめていたマイルズは、マティーニをひと口すするといった。

「こりゃ甘すぎる」

「ぼくの好みだからな。しかし、お望みなら、きみにはきみの、ぼくにはぼくの好みでマティーニをつくるようにさせることもできるんだ。まだ予備のチューブがどっさりあるからね。すなわち、お気に召すままなのさ」

　マイルズはまたひとくち酒をすすった。「どのくらいで生産できるようになる？」

「そうだな。まあ、あと十年はいじくりたいね」ぼくは、彼が唸うなりはじめないうちにいい足した。「だがまあ、制限つきの商品は、五年以内に生産を始められるだろうよ」

「そんなばかな！　臨時を大勢やとってやるから、半年以内に生産段階に持っていってくれ」

「そういうだろうと思ったよ！　これはぼくのライフワークだぜ。ぼくは、フランクが芸術品になるまでは絶対に手放さない──大きさもいまの三分の一以下にしたいし、トーセン・チューブ以外のあらゆる部品を交換式にもしたい、そして、あらゆる意味で、お気に召すままフレキシブルにしたいんだ。猫をじゃれつかせたり、赤ん坊に湯をつかわせたりするだけじゃなくて、もし買い手が特別プログラミングに金を出す気があれば、ピンポンだってやれるようにしたいんだ」そういってぼくはフランクを見やった。彼は物静かにぼくのデスクの埃をはらい、はらい終わると、机の上にあった書類を正確にもとのところへ戻した。「もっとも、彼とピンポンをやってもあまりおもしろくないな。ぜったいにミスしないからね。いや、それは、不確定選択回路をつけて、たまにはミスもやるようにすることにしよう。そうだ……うん、それがいい。それに、こいつは、すてきな宣伝にもなるじゃないか」

「一年だ、ダン。それ以上一日も長くちゃいかん。ぼくがローウィ（レイモンド・ローウィ。工業デザインの草分け）のところから誰か連れてきて、スタイルの点できみの手伝いをするように手配しよう」

　ぼくは、ひらきなおった。「マイルズ、きみはいつになったらぼくが技術部門の責任者だってことをおぼえてくれるんだ？　ぼくがもうよしといってきみの手に渡したら、その日からフランクはきみの自由だ。しかし、それまでは、口を出さないでくれ」

　マイルズは答えた。「どうも甘いな、このマティーニは」





　ぼくは工場の機械工に手伝わせて、こつこつと仕事を続けた。やがて、フランクは、自動車が三重衝突したような最初のぶざまな格好をある程度脱し、隣近所の人たちに自慢したくなるような形に、どうやら近づいてきた。その間に、ぼくは操作上の欠点にいろいろと改良を加えた。そして、ピートの背をなでたり、あるいは咽の喉どをピートの気に入るようにさすったりすることさえ教えた。これは、原子力研究所で使われている制御装置のどれにも劣らぬ難しい作業だったのである。マイルズは、諦めたのか、わいわい言ってぼくをせかすこともなかった。ただ、しばしばやって来ては作業の進行状態を見てゆく。ぼくは、この仕事の大半を夜の時間を利用してやった。ベルと一緒に夕食に外出して、彼女を家に送りとどけると、再び会社に戻り、それから仕事を始めるのだ。そうしては、翌日の昼じゅうほとんど眠っていて、午後かなりおそくなってから会社につき、ベルが揃えてくれる書類をろくに見もせずに署名したり、昼のあいだの工場での作業の進捗状態を監督して、それからまた、夕食にベルと一緒に外出する。ぼくは前ほどは外出しなくなった。なにしろ創造的な仕事は男を山羊のように臭くする。工場で徹夜をしたあとは、ピート以外の誰もぼくの臭いに耐えられないのだ。

　そうしたある日、やはり夕食をベルとともにした晩のことだった。食事をもうほとんどすませたころ、ベルがいいだした。

「これから工場へお戻りになるでしょう？」

「うん。どうして？　いけないか？」

「ううん。ただ、マイルズが、会社でわたくしたちに会いたいっていってたから」

「へえ」

「株主総会が開きたいんですって」

「株主総会だって？　なんでまた？」

「長くはかからないんでしょう。それに、あなたはこのごろ、会社の事業内容にちっとも注意してないでしょう。マイルズは、会社のほうのしめくくりをつけて、そのほか、何か重要な提案をしたいんですって」

「そりゃ、ぼくは技術一本槍だからね。ぼくがそれ以外会社のためになにをすればいいっていうんだい」

「なにもしなくていいのよ。マイルズは、たいして時間はかからないっていってたわ」

「いったいなんなんだ？　ジェイクが、流れ作業を捌さばききれないのか？」

「わたくしは知らないのよ、あなた。マイルズは理由はいわなかったの。コーヒーを飲んでおしまいなさい」

　マイルズは事務所でぼくらを待っていた。ぼくを見ると、まるで一カ月も会わなかったようなまじめくさった握手をした。ぼくはいった。「マイルズ、いったい、この仰ぎよう々ぎようしさはなんのつもりだ？」

　彼はベルをふりむいた。「議事録を出してくれないか？」これだけで、ベルがぼくに、マイルズが今夜のことを話してくれなかったといったのが、噓だったことはわかったはずなのだ。それなのに、ぼくはそれに思いあたらなかった。ベルを信用していたからだ──こともあろうにベルなどを！　それに、そのときぼくの注意はべつのことに逸らされてしまった。ぼくはふと、妙なことに気づいたのだ。ベルが金庫に近づいて取ノ手ブをまわし、扉をあけている。

「あれれ。ねえベル。ゆうべ、ぼくがそいつをあけようとしたらあかなかったぜ。番号コンビネーシヨンを変えたのかい？」

　ベルは書類を引っぱり出すのに夢中で、ふりむかなかった。「あなたにお話ししてなかったかしら？　先週いつだったか、泥棒が入りそうになってから、警備員に金庫の番号を変えておいてくださいっていわれたのよ」

「へえ、そうかね。それじゃ、新しい番号を教えてくれといたほうがいいね。さもないと、そのうちにぼくが、真夜中に、きみらのどっちかをたたき起こす破目になるよ」

「そうしましょうね」ベルはいって、テーブルの上に、ぼくらが会議のとき使っていた書類のホルダーを置いた。

　マイルズが咳ばらいをした。「さて、では始めよう」

「よし、やろう。ベル、正式の会議のつもりなら、議事録をとったほうがいいね。ええと、一九七〇年十一月十八日水曜日、時間は午後九時二十分。株主全員出席──三人の名前を書いておいてくれ。さて、取締役会議長としてＤ・Ｂ・デイヴィスが司会をつとめます。既決議事に対するご意見はありますか？」

　これはなにもなかった。「よろしい、マイルズ、きみの出番だ。新しい提案があるんだろ？」

　マイルズは再び咳ばらいした。「ぼくは会社の経営方針を再検討し、あわせて将来に対するひとつの計画を述べさせていただく。その上で、重役諸君に、ぼくの財政的提案を考慮していただきたい」

「財政的提案だって？　なにを馬鹿いうんだ。会社は毎月黒字だし、それも月々よくなってるじゃないか。どうしようというんだ、マイルズ。売上げにまだ不足があるのか？　それなら値段をあげることだってできるだろう」

「新計画を始めたら、黒字だといって安閑としてはおれなくなる。会社には、もっと大きな資本が必要になるんだ」

「新計画って、なにをする気だ？」

「まあ待て。ぼくは詳細に書類をつくっておいたんだ。ベルに読みあげてもらおう」

「ふむ……よかろう」

　まわりくどい文句は省こう──法律家のご多分に洩れず、マイルズも難しい言葉が好きだったのだ──とにかく、マイルズの提案は、以下の三つに要約された。その（一）は〈万能フレキシブルフランク〉をぼくの手から取りあげ、生産段階に移して、一日も早く市販をはじめる。（二）は──だが、まずここで、ぼくは断固として反対を唱えた。

「反対！」

「まあ、待ってくれ、ダン。社長兼ＧＭとして、ぼくは自分の意見を整然と開陳する権利はあるはずだ。終わるまできみの意見は差し控えてくれ。ベルに最後まで読みあげてもらおうじゃないか」

「よし。しかし、断っておくが返事は〝ノー〟だよ」

　その（二）は、この際、いつまでも一頭立ての馬車のような小規模な町工場のままで労力を浪費することは、思いきって廃やめるべきだという趣旨のものであった。会社はいまや、かつて自動車工業が社会に対して持ったのと同じ重大な地位を持った。社はいまやその出発点にある。ゆえに、ただちに会社の規模を大幅に拡大し、全国的、いや全世界的な販売網と、その需要を満たし得る生産工場を組織すべきである──。

　ぼくは拳骨でテーブルを打ち鳴らした。ぼくは、そんな大工場のチーフ・エンジニアになった自分の姿が、容易に想像できた。おそらくぼくは、製図台ひとつ持たせてもらえず、はんだごてなど持とうものなら、労働組合がストライキをおっぱじめるにきまっているのだ。そんなことなら軍隊にいて将軍になるほうがまだましだ。

　だが、ぼくは約束だから文句は差し控えた。その（三）は、つぎのごとくであった。すなわち、この計画を推進するためには、少しくらいの金ではどうにもならない。なん百万という資本がいるが、さいわい、マニックス・エンタープライズが資本を出そうと申し出てくれている。これと引き換えに、会社はマニックス・グループに対して在庫品および〈万能フレキシブルフランク〉を売り渡し、マニックスの子会社になることを承認する。マイルズは営業責任者の地位にそのまますわり、ぼくには技術研究所のチーフ・エンジニアの椅子が与えられる。かくして、古き自由の時代は終しゆう焉えんを告げ、ぼくらは、そろって他人の雇われ人に身を落とすのだ……。

「それだけか？」とぼくはいった。

「うむ。よく話しあって、それから投票にかけてくれ」

「こんどはぼくの番だな？」

「きみの番だ」

　ぼくはただちに反対提案に移った。これは、前々から、ぼくの心の中に培つちかわれてきた考えでもあった。工場長のジェイク・シュミットは、人柄は良いのだが、腕があまり良くない。そのためぼくは、しばしば彼の誤りを是正したり彼に代わって工場の監督をする破目に陥った。ぼくが、主として夜仕事をすることにしていたのも、ひとつはこれが億おつ劫くうなためだった。ゼネラル・モーターズ・グループに肩を並べようなどという計画はもちろん問題にならないが、現在のままでも、ぼくには負担が重すぎた。ぼくは双生児ではないのだから、発明と生産と両方やらされてはとてもかなわない。

　そこでぼくは、規模を拡大するよりは、むしろ縮小しようと提案したのだ。〈ハイヤーガール〉と〈窓拭きウィリー〉の特許権を設定して、生産・販売は他人にやらせ、ぼくは、一台についていくらと特許権使用料をとる。〈万能フレキシブルフランク〉が完成したら、これも同様に特許権をつける。もしマニックス社がこれらの特許権を望んで、他社をしめだそうとすれば、当然特許の価もあがるから結構な話だ。そのうちに、こっちは、デイヴィス・アンド・ジェントリー技術研究所と社名を変更して、人間もぼくら三人だけに限定し、あと、ぼくが新しい発明をするのに手伝いの職工を一人二人置けば充分だ。マイルズとベルは、ただすわっていて、転がりこんでくる金の計算をすればよかろう。

　聞き終わるとマイルズは静かに首を左右に振った。

「だめだよ、ダン。特許権でも確かにある程度の金は入ってくる。それは認めるが、それでは、ぼくらが自分の手で生産から販売までやった場合入ってくる金と比べものにならない」

「なにをいってるんだ、マイルズ。ちっともぼくらが自分の手でやることにはならないじゃないか。ぼくらは、マニックス社に魂まで売り飛ばしちまうんだ。金のことにしてもそうだよ。マイルズ、きみはいったいいくらありゃ足りるんだ？　いくら金があったって、一度に二隻のヨットにゃ乗れまい。一度に二つのプールじゃ泳げないんだぜ──しかも、その二つとも、きみが欲しけりゃ、今年の末にならないうちに買えるじゃないか」

「そんなものは欲しくない」

「なにが欲しいんだ？」

　彼は目をあげてぼくを見た。「ダン、きみは発明がしたいだろう？　この計画が実現すれば、きみは、好きなだけの設備と、好きなだけの助手と、好きなだけの金をかけて自分の発明がやれるようになるんだ。そしてぼくは、大企業を経営したいんだ。本当の意味の大企業をだ。ぼくにはそれだけの才能があるんだ」マイルズは、ベルにちらと視線を投げた。「ぼくは、こんなモハーヴェ砂漠のまんなかで人間嫌いの発明家のお相手をして一生を終わりたくはないんだ」

　ぼくはマイルズの顔を睨にらんだ。「サンディア時代は、きみはそうはいわなかったぞ。辞めるというんだな、それでは。そうか──ぼくもベルも、きみと別れるのは心から残念だが、きみがそういうふうに思っているのなら、会社を抵当に入れてでも、きみの株を買い取ろう。本人の意志に反してまで、縛りつける気はないよ」そういいながらぼくは、心の底まで激しいショックを感じていた。だが十年来の旧友マイルズがいやだというものを、ぼくの流儀で束縛する権利はぼくにはないのだ。

「そうじゃない。ぼくは辞めるなどとはいわない。ぼくは、ぼくらの会社の発展を望んでいるんだ。ぼくの提案は聞いたろう。採否は会社が決定するんだ。ぼくは正式の手続きを踏んだ。投票に移ってくれ」

　ぼくはさぞ驚いた顔をしただろう。

「マイルズ、きみはどうしても痛い目を見なけりゃ気がすまないのか。よし、ベル、提案は否決されたと記録しておいてくれ。ただし、ぼくも、反対提案を今夜すぐ提出するのは見あわせる。みんなでよく相談して、議論を闘わそうじゃないか。なあ、マイルズ、ぼくはきみに納得してもらいたいんだ」

　だがマイルズは頑強だった。「正式に投票してもらおうじゃないか。ベル、票決を取ってくれないか」

「かしこまりました。マイルズ・ジェントリー、持株番号──」ベルは一連の番号を読みあげた。「提案に対して賛成ですか、反対ですか？」

「賛成」

　彼女は議事録に記入した。

「ダニエル・Ｂ・デイヴィス、持株番号──」彼女は再び電話番号めいた数字を読みあげた。ぼくはこの形式ばった言葉を聞いていなかった。「提案に対して賛成なさいますか、反対なさいますか？」

「反対。これで決まったよ、マイルズ、気の毒だったね」

「ベル・Ｓ・ダーキン」とベルがつづけた。「持株番号──」三たび番号の朗読。「わたくしの選択は〝賛成〟です」

　ぼくはぽかんと口をあけてベルを見た。ややあって、ようやく息をととのえたぼくは言葉を咽喉から押し出した。

「そ、そんなことってあるかい、ベル！　そりゃ、きみの持株はきみのものだが、しかしあれはきみも知ってのとおりの……」

「得票を発表するんだ」マイルズが声を張りあげた。

「〝賛成〟が二票、賛成が全株式の過半数をこえましたので提案は可決されました」

「記録したまえ」

　それからの二、三分はただもう混乱した。最初、ぼくはベルにくってかかり、ついで彼女を説き伏せようとし、またカッといきり立って怒鳴りつけた。きみのやりかたは正直じゃないぞとぼくはいった。確かにぼくは株を譲渡しはした、しかしそれは、彼女も百も承知だったように、単なる婚約のプレゼントであって、ぼくには会社の経営権を分与しようなどという意図はさらさらなかったのだ。冗談じゃない、ぼくは今年の四月にその所得税まで払ってやっているのだ。なにもかも承知の上でそんな曲芸をして見せたのか。それではぼくらの結婚はどうなるのだ？

　ベルはぼくの顔をまっこうから見かえした。それは、まだ見も知らぬ赤の他人の顔だった。

「ダン・デイヴィス、そんなひどいことをいっておきながら、まだわたしたちの婚約が有効と思っているのなら、あなたも相当のおばかさんね。ばかだとは前から思っていたけれど、それほどとは思わなかったわ」そういい終わると、ベルはジェントリーをふりむいた。「マイルズ、わたしを家へ送っていってくださる？」

「いいとも、送ろう」

　ぼくはなにかいいかけた、が、一瞬口を閉じて、帽子もかぶらずに部屋から外へ飛び出していた。それが去り時であった。さもなければ、ぼくはマイルズを殺していたろう──ぼくは、この期ごに及んでもなお、ベルに手をあげることができなかったのである。

　もちろん、その夜ぼくは一睡もできなかった。午前四時ごろぼくはベッドから起き出して、あちこちの運送会社に電話をかけ、法外な値段をふっかけられるのを承知の上で車をたのんだ。そして、午前五時半までには、小型トラックで会社の前に着いていた。ぼくは門にむかって進んだ。門をあけてトラックを入れ、積荷場へつけて、〈万能フレキシブルフランク〉の試作モデルをトラックに積みこむつもりだった。なにしろフランクは重量二百キロもあるのだ。

　門の南京錠をあけようとして、ぼくはおのれと思った。錠が替えられていたのである。

　ぼくはかんかんに腹をたてて、有刺鉄線をくぐりぬけて中へ入った。入ってしまえばこっちのものだ。工場には、南京錠ぐらいわけなくあけられる道具が、それこそごまんとある。

　だが──工場の入口のドアの錠まで替えられていたのだ。

　ぼくは錠を見ながら考えた。窓をぶちこわして入るほうがやさしいか、それともトラックに引き返してジャッキを持ってきて、ドアの枠とノブのあいだをこじあけたほうがいいか。そう思っていたとき、だれかが怒鳴った。「おい！　そこの男、手をあげろ！」

　ぼくは手をあげずにふりかえった。一人の中年の男が、小さな町のひとつくらい吹っ飛ばせそうなでかいピストルを、ぼくに向かって構えている。

「なんだおまえは？」ぼくはいった。

「そっちこそだれだ」

「おれはダン・デイヴィスだ。ここのチーフ・エンジニアだ」

「ああ、あんたか」男はすこし安心したようだったが、その大砲だけはまだぼくに向けたまま、「なるほど、人相書にも一致する。しかし、もし身分証明書かなにか持っていたら、念のために見せてくれませんかな」

「見せる必要はない。おまえはだれかと訊いているんだぞ」

「わしかね？　あんたの知らない人間だよ。砂漠警備巡察会社デザート・プロテクテイブ＆パトロール・カンパニーのジョー・トッドというもんだ。そういえば納得がいくはずだ、うちの会社はここんとこだいぶ長くあんたの会社の夜警に雇われてるんだから。もっとも、今夜はわしは特別警備員として来たんだが」

「そうか。それじゃ、鍵を持ってるなら、さっさと扉をあけてくれ。中に用があるんだ。それから、いい加減にその物騒なものを引っ込めたらどうなんだ」

　だが男は依然銃口をまっすぐぼくに向けている。

「それが、そういうわけにはいかないんで、デイヴィスさん。第一に、わしは鍵を持ってねえ。第二に、わしは、特にあんたに用心しろと命令を受けてきてる。あんたを中へ入れるわけにはいかねえんだ。そのかわり、門から出してあげますよ」

「ばかをいえ。おれはどうしても入るんだ」ぼくは窓を割る石がないかとあたりを見まわした。

「お願いだ、デイヴィスさん」

「なんだ？」

「強情はられると、こまるんで。ほんとによ。というのは、わしが、あんたの脚を撃てるとはかぎらねえんでね。わしは、あんまり銃がうまくねえ。脚を撃つつもりで腹にあたっちまわねえともかぎらねえ。おまけに、この鉄砲んなかにゃ、ダムダム弾がへえってる。こいつがあたると、やっかいなことになるんでねえ」

　ぼくの気持ちを変えさせたのは、この言葉にきまっているが、ぼくはそう思いたくなかった。その時ふと窓を見あげると、いつもぼくが置いておくところに〈万能フレキシブルフランク〉の姿が見えない。それで、入っても無駄だと思ったのだ。

　男はぼくを門の外へ出すと、はじめて一通の封筒を渡した。

「あんたが来たら、これを渡すようにといいつかってました」

　ぼくはトラックの運転席でこれを読んだ。それには、つぎのようにしたためられていた。

「ダン、あんたに忠告するが、一セントもかからずにすむ方法がある」

　ぼくは考えてみた。できっこなかった。工場長のジェイク・シュミットでさえ、取締役会の決定についてはなにも知らされていなかったのだ。ぼくのいうことが事実だと証明できるのは──マイルズとベルだけなのだ！

「そこであんたがベルに譲渡した株だ」と彼は続けた。「あれだけが、ことによったら、この八方ふさがりを打開するチャンスになるかもしれない。つまりあんたが──」

「そうだ。だが、その理由を考えてみたかね？　あんたはそれを、結婚を前提とした婚約のプレゼントとして彼女に与えたといった。彼女があんたに不利な票を入れたことは別だよ。それはここでは問題じゃない。もしあんたが、それを結婚を最終目的とした婚約のプレゼントとして与えたこと、そしてその当時彼女がそれを承知の上で受け取ったことを証明できれば、あんたは強制的に彼女にあんたとの結婚を承知させるか、もしくはだましとった株を吐き出させるか、どっちかをすることができるんだ。そうなれば、また会社はあんたのものになるわけだから、二人を逆に追い出すこともできる。どうだね、証明できるかね？」

　マイルズに会うべく自動車を走らせるあいだ、ぼくはこうしたすべてをつぎつぎと思いだしていた。ぼくらの事業が儲かりだすとすぐ、マイルズは、殺人的なモハーヴェ砂漠の暑熱を避けて、サンフェルナンド・ヴァレーに小ぢんまりした借家を見つけ、そこへリッキーとともに引っ越してきていた。ありがたいことにリッキーはいま家にいない。ぼくはそれを思いだしてほっとした。ガールスカウトのキャンプ旅行で、ビッグベア湖に行っているのだ。ぼくは、リッキーに、継まま父ちちとぼくの喧嘩を見られるのがいやだったのだ。

　セパルヴィーダ・トンネルの中で渋滞にまきこまれているときだった。ぼくはふと、マイルズに会う前に、〈ハイヤーガール〉の株券をどこかに移しておいたほうが賢明ではないかと思いついた。手荒なことがもちあがるとは思わなかったが（こっちでおっ始めないかぎり）そうしたほうがなんとなくいいように思ったのだ。網戸に尻尾を挟まれて痛い目をみた猫のように、おそらくぼくは、なにごとにも疑い深くなっていたのだろう。

　自分宛に郵送するという手もあったが、最近ぼくは、ぼく宛の手紙は、中央郵便局の局留扱いで受け取ることにしていた。猫を飼っていることをホテルの人間に見つけられる度たびに、ホテルからホテルへと渡り歩いていたからだ。

　そうだ。だれか、信用のおける人に郵送するのがいい。

　とは思ったものの、考えてみるとそんな人間はいやしない。

　そのとたんぼくは思いだした。いや、いる。一人だけ信用のおける人間がいる。

　リッキーだ！

リッキーの親友ダニーおじさんより





　つぎに、もう一枚の紙を出して、つぎのように書いた。





　一九七〇年十二月三日。カリフォルニア州、ロサンゼルス。ここに諸手続きのため一ドルを同封し、以下の株券を（と〈ハイヤーガール〉のぼくの持株の連続番号と記号を書きこんで）バンク・オブ・アメリカに信託する。これは、フレデリカ・ヴァージニア・ジェントリーが二十一歳の誕生日を迎える日に彼女に正式に譲渡されるものとする。





　ぼくはこれに署名した。ドラッグストアのカウンターで、ジューク・ボックスが耳もとでがんがん鳴っているのでは、これ以上のことはできなかったが、こうしておけば、マイルズやベルが、リッキーから株券を取りあげることもなかろう。

　そして、もし何事もなくすんだら、リッキーに封筒を返してくれといいさえすればよい。株券の裏に印刷された譲渡形式を使わなかったので、未成年の株式受取人から株券を返却してもらう場合でも繁雑な手続きを避けられる。ぼくが委任状を破るだけでよい。

　ぼくは株券とバンク・オブ・アメリカ宛の委任状を小さな封筒に入れて封をし、リッキーへの手紙と一緒に大きな封筒に入れると、ガールスカウトのキャンプの住所とリッキーの宛名を書き、切手を貼って、ドラッグストアのわきにあったポストへ投函した。ポストの集配時間を見て、四十分以内に集配に来ることを確かめると、ぼくは非常に気軽な気持ちになって、再び車上の人となった。ぼくの気が楽になったのは、株券の安全な処置をしたからというよりも、もっと大事な問題を解決できたからだった。

　いや……解決はまだできていないが、少なくとも、その問題に堂々と立ち向かう決定のできたことが嬉しかったのだ。ぼくはもう、リップ・ヴァン・ウィンクル（ワシントン・アーヴィングの小説の主人公）をきめこむことはやめた。それは確かに、ぼくは西暦二〇〇〇年が見たかった。しかし、それには、なにもへんな小細工の必要はない。腰を落ち着けてじっくり人生を生き、六十になれば、二〇〇〇年はむこうからやってくるのだ。六十になったって、ぼくはまだ充分若い。女の子に口笛を吹いて気を引くことくらいできるだろう。ともかくも、ひと眠りするあいだにお次の世紀へ跳躍ジヤンプするなんぞ、一人前の男のすることではない。それではまるで、映画を見るのに、まんなかのところを抜かして、ラストシーンだけ見るようなものだ。ラストシーンというものは、その中間のシークエンスが、ひとつひとつと展開していってはじめて理解もでき、味わうこともできるものなのだ。西暦二〇〇〇年また然しかり。

　まもなくぼくはマイルズとベルを相手に途方もない一大決戦を交える。おそらくぼくは勝てないだろう。だがぼくは、彼らに、戦いというものがどういうものか身にしみて感じさせてやるのだ。ピートが身体じゅうから血を流して帰ってきながら、なおも、「どっちが勝ったか決めるのは敵の姿を見てからにしてくれ」と主張する時のようにだ。

　とはいえぼくは、今夜の会見にあまり多くを期待してはいなかった。今夜のところは、正式の宣戦布告をしにゆくだけだ。今夜ひと夜のマイルズの安眠を台なしにしてやるだけだ。そうすればマイルズはベルに電話して、ベルの安眠もまた台なしになることうけあいだった。





　　　　　３





　マイルズの家へつくころ、ぼくは気も晴ればれとして口笛など吹いていた。あのお二人さんのことなど、とうに念頭から去って、マイルズの家まであと十五マイルというころから、ぼくは、やがてぼくに大金を儲けさせてくれること疑いなしの、できたてのほやほやの新発明二種類のアイデアを楽しんでいた。そのひとつは、電動タイプライターの要領で操作する製図機だった。アメリカ国内だけで、ゆうに五万人の技術者がいて、その五万人が、毎日具合のわるい製図台にむかって腰をかがめ、腎臓がわるくなるの、目が痛むのといっては製図台を呪っているにちがいないのだ。しかも彼らは製図という仕事を嫌っているわけではない──彼らにとって製図は生き甲斐なのだ。ただ製図台に長時間むかっていることが、肉体的にひどい重労働なのである。

　ところがこの器械を使えば、製図者は大きな安楽椅子にすわったまま、キーをたたくだけで、キーボードの上に備えたイーゼルに、思いのままに図を描くことができるのだ。三つのキーを一度に押せば、任意の場所に水平線が現われる。つぎのキーを押すと、垂直線が現われてこれと交叉する。二つのキーを押し、つづけてまた二つキーを押すと、厳密な傾斜角を持った斜線がひけるという具合である。

　これに細工を加えて、等角投象アイソメトリツクの設計デザインもできるようにしよう。

　しかもこの製図機は、部品のほとんど全部が標準部品で間に合うのがミソだ。たいていはラジオ部品屋とカメラ部品屋にあるもので用が足りるだろう。唯一の例外はキーボードだが、これは電動タイプライターを一台買い入れて、中身を引っ張り出し、その部品を応用すればわけはない。最初の原型を作るのに一カ月、改良その他に一カ月半もあればよかろう。

　だが、ぼくが俄が然ぜん嬉しくなったのは、もうひとつのほうだった。わが〈万能フレキシブルフランク〉を出し抜く方法を考えついたのである。ぼくは、ぼく以外の人間が、フランクを一年も研究した以上にフランクの性質を知り抜いている。ぼくはフランクを基本的に召使として設計した。だが今度は、召使としてでなく、人間として（ただし、判断力のみを省いて）設計することを思いついたのだった。

　そうだ、製図機のほうは後でもいい。まずこの全目的ロボットの完成を急ごう。人間のできることなら、なんでもできるロボットだ。

　いや、待てよ。やはり製図機が先のほうがいいかな。まず製図機をこしらえて、それを使ってこのロボットを設計するのだ。ロボットの名前は、そうだ──〈護民官ピート〉はどうだろう。

「どうだい、ピート。世界最初の真のロボットに、おまえの名前をつけるというのは」

「ニャアンニャアゴ？」

「そう疑ぐり深い顔をするなよ。大変な名誉なんだぜ」ぼくはいった。まずマイルズとベルを相手に一戦を交えたら、ぼくはただちにその製図機を用いて、うんと洗練されたピートを、しかもきわめて迅速に作り出してやろう。マイルズたちが、まだフランクを生産段階にまで持っていけずにぐずぐずしている間に、フランクを時代おくれの廃すたれものにするようなすごいロボットを完成させるのだ。そして彼らを破産させ、ぼくの前に手をついて、〝どうぞ戻ってきてください〟と哀願させてやる。思えば彼らは、貴重な、黄き金んの卵を生む鵞鳥ガチヨウを殺したも同様ではないか。

　マイルズの家には灯りがついて、彼の自動車が道路にとまっていた。ぼくは彼の自動車の前に駐車すると、ピートにいってきかせた。「おまえはここで待っているんだ、ピート。自動車の番を頼むよ。怪しいやつが来たら三回〝停とまれ〟と誰すい何かしてのち射殺だ。わかったな？」

「ニャーアウウ」

「一緒に来るんなら、ボストンバッグ入りだぞ」

「アオウ？」

「文句をいうな。ついて来たければバッグに入れ」

　ピートはボストンバッグに跳びこんだ。

　マイルズはぼくを招き入れた。むこうも、こっちも、握手の手は差し出さなかった。彼は居間にぼくを連れていくと、椅子にすわれと仕種しぐさでいった。

　居間にはベルがいた。彼女が来ていようとは予期していなかったが、考えてみれば、驚くほどのことではない。ぼくはベルにむかって笑いかけた。「これは思いがけないところでお目にかかったね。まさか、古い馴染みとお話しするために、モハーヴェ砂漠をはるばるお出ましになったわけではあるまいね？」

　見たまえ。ぼくだって、いざとなればかくも勇敢に振る舞えるのだ。

　ベルは綺麗な眉をひそめた。「冗談はよして、ダン。いうことがあったらさっさといって出ていってちょうだい」

「まあそうせかすなよ。せっかくいい気分になっているところだぜ──昔のパートナーもいる、昔のフィアンセもいる。ただないのは、ぼくの昔の仕事だけだ」

　マイルズが、なだめに出た。「ダン、そんな態度に出るのはよせよ。ぼくらがああしたのも、みんなきみのためを思えばこそだ。きみさえ良かったら、いつだってもとの仕事をしてもらっていいんだよ。ぼくは喜んできみを迎えるよ」

「ぼくのためを思えばこそだ？　そいつは確か、馬泥棒を吊るすときに使う台詞せりふだったぜ。もとの仕事にかえるのは──ベル、きみはどう思っているんだ？　ぼくが戻ってきてもいいのか？」

　ベルは唇を嚙みしめた。「マイルズがいいというんなら、わたくしには異存はないわ」

「マイルズがかい。つい昨日までは〝ダンがいいというんなら〟じゃなかったっけかね。が、まあそれも良かろう。有う為い転てん変ぺんは世のならい、それが人生というやつだ。気をもむことはないんだよ、お二人さん。ぼくには帰ってくる気なんかない。今夜は、あることを確かめにやって来たんだ」

　マイルズはベルをちらと見やった。ベルが、ぼくに向かっていった。「なにを確かめにきたというの？」

「まず第一に、このペテンを考え出したのはきみらのどっちだ？　それとも、二人の共謀か？」

　マイルズが低い声音でいった。「汚い言葉を使うな、ダン。ぼくは怒るぞ」

「なにをいいやがる。口先ばかりうまいことをいうなよ。言葉が汚いって、そっちが実際にやったことは十倍も汚いじゃないか。契約書を偽造し、特許の譲渡証書を偽造してさ──こいつはどう見ても共謀だな。ぼくにはわからないが、連邦捜査局へ持ちこめばすぐわかる」マイルズがひるむのを見て、ぼくは最後の言葉をつけ足した。「あしたにでもな」

「ダン、きみはへんないいがかりをつけるつもりじゃあるまいな？」

「いいがかりだと？　馬鹿をいえ、こっちの条件を飲めばよし、さもなかったら戦闘開始だ。民事でも刑事でも、およそあらゆる方法で徹底的にやっつけるぞ。そのうちには、痒かゆいところもかけないほど忙しくしてやるからな。特に〈万能フレキシブルフランク〉の設計図とノートと試作モデルを盗んだことは絶対に許せない。ただし、材料費はぼくが払うから請求書をまわすがいい。あれを作るのには会社の材料を使ったんだからな」

「盗んだなんて、そんなことあるもんですか！」ベルが嚙みついた。「あんたは会社のために働いたのよ！」

「どういたしまして。ぼくはほとんど夜だけ使ったんだ。それにベル、ご存知のようにぼくは会社に雇われていたわけじゃない。ぼくはただ自分の株の配当から生活費をもらっていただけさ。マニックス社がどう思うだろうな、ベル、彼らが買おうとしているものが会社の所有物じゃなくて、〈ハイヤーガール〉もウィリーも、おまけにフランクまで、みんなぼくから盗んだものだといって警察に訴えたら、え？」

「おどかしたってだめよ。あんたは会社のために働いていたのよ。ちゃんと契約書がありますからね」ベルは強情に繰り返した。

　ぼくはそっくりかえって笑いだした。「いいじゃないか、いまさら噓をつかなくても、そんな台詞せりふは証人台に立ったときのために取っておけよ。ここにはぼくら三人しかいない。ぼくの知りたいのはこういうことだ、いいか、誰がこのペテンを考えだしたのか？　どうしてやったか、方法はもうわかっている。ベル、きみはいつもぼくの署名を取りに書類を揃えて持ってきた。書類が二通以上あるときは、クリップで書類をひとまとめにしてきたね。もちろん、ぼくが署名しやすいようにな。きみはいつも完璧な秘書だったからね。そこで下の書類は、署名するところ以外ぜんぜん見えないわけだ。クリップで一括した書類の中に一枚ぐらいジョーカーを滑りこませておいても、ぼくにはわかりっこない。これできみがこの詐欺に手を貸していたことはわかったわけだ。マイルズにそんなことのできるはずはないからな。さてそこで、きみがぼくをだまして署名させたその書類の文句を誰が作ったかだ。きみか？　いや、そうではない。きみが法律の勉強をしていたことをいままで隠してきたのでなければね。マイルズ、きみはどう思う。たんなる速記者が、たとえばあの契約第七項のような素晴らしい文句を、ああもみごとに書けると思うか？　弁護士に相談したのじゃないか？　つまりきみにだよ」

　マイルズの葉巻はとうの昔に火が消えていた。彼は火の消えた葉巻を口から取って、注意深くいった。「ダン、ぼくらを罠にかけて口を割らそうたって、そうはいかないぞ」

「言いのがれはよせ、マイルズ。ここにはぼくらしかいないじゃないか。きみらは、どっちにしろ共犯なんだ。ぼくとしては、そこのたぶらかし嬢デリラがすっかりお膳立てしてきみのところへやってきて、きみの堅固な道徳心がゆるんだ瞬間につけこんで、きみを悪事に誘ったんだと思いたいところだが、まあそうとばかりもいえまいな。ベルが法律をかじっていたんじゃないかぎり、きみらは事前ならびに事後従犯で共犯だ。きみがあのインチキ文書をでっちあげて、ベルがそれをタイプした上、ぼくをたぶらかして署名をさせたんだ。そうだな？」

「答えちゃだめよ、マイルズ！」

「答えるもんか」マイルズが即座にいった。「あのボストンバッグの中にテープレコーダーを隠しているかもしれないからな」

「持ってくるべきだったねえ。ところが残念ながら持ってこなかった」ぼくはバッグの口を拡げてみせた。ピートが頭をつき出した。「みんな聞いたろうな、ピート？　注意して口をきいたほうがいいよ、諸君。ピートは象の記憶力を持っているんだ。うんにゃ、まことに残念ながらテープレコーダーは持ってこなかったよ、ぼくは、毎度のことながら血のめぐりの悪いダン・デイヴィスその人でね。きみらみたいに、先へ先へとまわって考えることができないのさ。バカ正直に苦労して、友だちは信用できるものと思いこんでさ、きみらを信じていたようにな。さて、ベルは弁護士の資格があるのか、ないのか、マイルズ？　質問に答えろ。それともきみが、古い友だちのぼくを平然とだまして盗んで裸にして、しかもそれを合法的なように見せかけようとしたのか、どうだ？」

「気をつけて、マイルズ！」ベルが遮った。「ダンの腕なら、煙草の箱ぐらいの大きさのテープレコーダーだって作れないとはかぎらないわよ」

「なるほど、そいつは名案だ、ベル。こんど来るときまでに作ってこよう」

「そんなことは気がついているよ、ベル」マイルズがいった。「もし彼が持ってきたら、きみこそもうしゃべりすぎてるぞ。口を慎め」

　ベルは、ぼくの聞いたこともない汚い言葉でいいかえした。ぼくは眉をあげた。「仲間喧嘩かい？　もう、盗人どうしの仲間割れが始まったのか？」

　癇かん癪しやくをおこす寸前のマイルズを見て、ぼくは胸のすくおもいがした。

「言葉に気をつけろ、きさま、ただじゃおかんぞ！」

「おいおい！　ぼくはきみより若いんだぞ、マイルズ。このごろはジュードーも習ってるんだ。といって、おまえさんにゃ、人を撃つこともできまい。せいぜい、インチキ書類を書いて人をたぶらかすぐらいが精一杯だ。だから泥棒だといったんだよ。泥棒の噓つきだと。おまえさんがた二人がだ」ぼくはベルを振りかえった。「ぼくの親父は、ご婦人を噓つきといってはならんと教えてくれたがね、あいにくきみはご婦人じゃない。この噓つきめ。噓つきで、泥棒で、あばずれだ」

　ベルの顔が鬼のように真っ赤になった。そしてぼくを睨んだその顔には、以前の美しさは影もなく、ただその裏に潜んでいた食肉獣の汚さが露わにむき出ていた。「マイルズ！」とベルはすさまじい声をあげた。「あんた、こんなことをいわせて黙ってる気なの！」

「黙れ」マイルズが吠えた。「わざと汚いことをいってるんだ、やつは。おれたちを興奮させて、後悔するようなことをいわそうという魂胆なんだ。きみはもういい加減ひっかかってるんだぜ、少し黙ってろ」ベルは口を閉じたが、その顔はまだ凶暴な様相を残していた。マイルズはまたぼくに向きなおった。「ダン、ぼくは実務家であろうと心がけている。ぼくは、きみが会社から出ていく前に理を尽くして説いたつもりだ。だからあの資産分配でも、きみが避けられない結末を品ある態度で甘受できるように、できるだけのことはしたつもりだぞ」

「つまり、なるべくお上品に盗もうとしたというわけだな？」

「どうとでもいうがいい。しかし、いまでも、ぼくは平和な解決を望んでいる。きみがいくら訴訟を起こそうが、絶対われわれに勝てっこない。しかし、弁護士としてぼくは、訴訟に勝つよりも、訴訟に巻きこまれないことのほうが、常に結局は得だということを知っている。もちろん、可能な場合はだ。きみはさっき条件があるといったな。それを話してみろ、話し合いがつかないものでもないぞ」

「そうそう、それだ、ぼくもいまそれをいおうと思っていたんだ。きわめて簡単な条件さ。ベルにいいつけて、ぼくが婚約のプレゼントとして贈った株を、ぼくに返させてもらいたいんだ」

「いやよ！」ベルが叫んだ。

「きみは黙っていろというんだ」マイルズがベルに向かっていった。

　ぼくはベルの顔を見やった。「なぜいやなんだ、わが愛しのもとフィアンセよ。ぼくはそのことを弁護士に相談したんだ、そしたら弁護士がいうには、きみがぼくと結婚することを約束した結果のプレゼントなら、きみは、道徳的にばかりじゃなく、法律的にもあれをぼくに返さなければならないんだそうだ。つまりあれは所謂いわゆる〝無拘束の贈物〟ではなくて、ある期待と契約との上に立ってなされた贈物であり、しかもその契約はついに果たされなかったんだ。ゆえに、きみはあれを返却する義務を負うというわけさ。そういうわけだから、おとなしく吐き出したらどうだい？　それとも、また心変わりしてぼくと結婚するか？」

　ベルは一連の口汚い罵ののしりの言葉を並べたてた。

　マイルズが、うんざりした口調で引き取った。「ベル、きみはこれ以上事態を悪化させたいのか。きみには、どうしても、彼がわざとぼくらを怒らせようとしているのがわからないのか？」彼はそういうとぼくをふりむいた。「ダン、きみの条件がそんなことだったのなら、お引き取りを願おうか。ぼくとしても、もし事実がきみのいうとおりだったとすれば、きみのいうことにも一理あると認めるところだ。だが、事実はそうじゃない。あれは、ベルに対する感謝の意を表わすために、きみが譲渡したものだ」

「なんだと？　感謝の意だ？　なんのために、ぼくが彼女に感謝の意を表わさなきゃならないんだ」

「彼女の、勤務の範囲を超えた会社への貢献に対する感謝の意だよ」

「なんという傑作な論理だ！　おいマイルズ、いいか、もしもだよ、もしもあれがぼくの個人的な贈物でなくて会社関係のものだとしたら、きみだってそれを知ってなくちゃならんわけだぞ。そして、きみもぼくと同じだけの額の株をベルに贈与してなきゃならんわけだ。ぼくらは儲けをフィフティ・フィフティで分けていたんだからな。いくらなんでもそう手まわしよくはやっちゃいまい？」

　二人は、ちらと視線を交わした。そのとたん、ぼくはいやあな虫の知らせを感じたのだ。

「そうか！　さてはやったんだな！　うん、ぼくのぐちゃぐちゃな頭にかけて、きさまは株を譲ってる。そうでもなきゃ、話に乗ってくる女じゃないものな、そうだろ？　そうだとすると、彼女がその株の名義変更をすぐに登録したことは間違いなしだ。と、その日付は、ぼくが彼女と婚約したと同時に彼女へ株を譲渡した、そのおなじ日だということになる──畜生！　あの日のデザート・ヘラルド新聞を見てみろ、婚約発表の記事が載ってるぞ！　その日にきみは彼女に株を書き替えてやり、それからぼくを追い出しにかかった。そして彼女はぼくを捨てたという順序だ。これは全部確実な事実だぞ、マイルズ！　裁判官はきっとぼくの言葉を信用する。どうだ、マイルズ？」

　ぼくは、彼らに一撃を加えた。ぼくの一撃は彼らを傷つけた！　彼らの顔つきが、さっと表情を失う様子から、偶然ぼくが、彼らの説明できない、ぼくだって知ろうとも思っていなかったある事情を掘り出したことは明らかだった。この機をはずさずに、ぼくはいっきに殺到した。もっと乱暴な推測をして。乱暴？　いや、論理的な推測だ。「なん株もらった、ベル？　ぼくから取ったぐらいじゃあるまい。あれはただの〝婚約〟用だが、マイルズのためには、きみは大変に尽くしているからな。もっともらわなきゃ噓だよ」ぼくは突然言葉を切った。「まてよ──おい……ぼくは、どうも、ベルがぼくとおしゃべりするだけのために、遠路はるばるやって来たのはおかしいと思っていたんだが──ことによると、きみはぜんぜんやって来る必要がなかったのかもしれないな。つまり、最初からここにいたんだとすりゃ。きみらは同棲中なのか？　それとも〝婚約〟中といってもらいたいか？　それとももう結婚しちまったのか？」ぼくはちょっと考えて、「そうだろうな、それに間違いない。マイルズ、きみはぼくみたいな夢追い人びとじゃない。ぼくの着替えのシャツに賭けて、きみは、たんなる結婚の約束なんかで、他人に株を書き替えてやるような男じゃなかったな。結婚の贈物としてなら──しかもその結婚によって、投票の決定権を確保できるような条件づきでなら、やる可能性はある。答えてくれなくてもいいよ。明日になったら、ぼくが自ら事実を掘り出してみせる。それも、ちゃんと記録されているはずだからな」

　マイルズはベルと視線を交わした。

「無駄な時間を費すことはない。ベルはもうジェントリー夫人だ」

「やっぱりねえ。それはおめでとう。まさに似合いのご夫婦だよ。そこでぼくの株だ。ジェントリー夫人がもはやぼくと結婚できない以上、夫人はぼくに──」

「なんとでもいうがいいさ」マイルズはいい捨てて、窓の戸締まりを確かめて歩いた。ベルがまず浴室に姿を消し、ついでマイルズもいなくなった。どのくらい二人が居間をあけていたか、ぼくは知らない。ぼくにとって、時間はまったく意味を持たなかったのだ。

　ベルが先に帰ってきた。すでに化粧も髪ももとの優雅さを取り戻していた。彼女は長袖の襟のつまったドレスに着替え、めちゃめちゃになったストッキングをはき替えていた。顔に貼った大きな絆ばん創そう膏こう以外には戦いの跡は完全に隠されていた。彼女の顔にうかんだすさまじい表情さえなかったら、それは快いながめだったかもしれない。

　ベルはまっすぐにぼくの前に歩いてきて、起立を命じた。命じられてぼくは立った。彼女は手馴れた敏速な手つきで、ぼくのあらゆるポケットを探りだした。時計入れのポケットも、シャツ・ポケットも、ふつうの背広にはついていないチョッキの左の内ポケットも忘れずにさぐった。収穫はあまり多くなかった。現金が少し残っている財布、身分証、運転免許証、鍵、小銭、スモッグ用の吸入マスク、その他こまごましたがらくた、それに彼女自身が切って送ってよこした支払保証小切手の入った封筒と、これだけだった。ベルはこれを引っくり返して見たが、そこに裏書きがしてあるのを見ると、へんな顔をしてぼくを見た。

「これはなに、ダン？　保険でもかけたの？」

「いいや」

　もしベルが二つの質問を別々に訊いたら、ぼくは詳しくしゃべってしまったろう。だが、たたみかけられたので、最後の質問にしか答えられなかった。

　彼女は眉をひそめて、それをポケットの中身の残りと一緒にした。それから、ピートのボストンバッグを見つけると、その中に内ポケットがついていて、ぼくが書類入れに使っていたのを思いだしたのだろう、拾いあげて内ポケットを開いた。

　たちまち、彼女は、ぼくが署名したミュチュアル生命保険の書類の束を発見した。ベルは手近の椅子に腰をおろして読みはじめた。ぼくは片づけられるのを待つ洋服屋のマネキンよろしくの格好で、そこにつっ立っていた。

　やがて、マイルズが、バスローブをまとい、スリッパをつっかけて戻ってきた。彼は大量のガーゼと絆創膏を貼りちらして、まるで、マネージャーに見放されたばかりの四流のミドル級ボクサーという格好だった。絆創膏のひとつが彼の禿げた頭の前から後ろまで縫目みたいに貼ってあった。倒れたところをピートにやられたのだろう。

　ベルが顔をあげて、黙ってという仕種で手を振り、読みかけの書類を示してみせた。マイルズも椅子にかけて読みはじめた。彼はたちまちベルに追いついて、最後の分は、ベルの肩越しにのぞきこんで読んだ。

「これで、だいぶん事情が違ってきたわ」とベルがいった。

「それどころじゃないぞ。この書類の日付は十二月四日になっている。つまり明日だ。ベル、彼は日中のモハーヴェ砂漠より危険なんだ。一刻も早くここから連れ出さないと、えらいことになる」彼は柱時計にちらと視線をくれて、「明日の朝になれば、ここの会社のやつらが彼を探しはじめる」

「マイルズ、あなたっていう人は、ちょっとなにかあると、すぐ能なしになってしまうのね。これは幸運なのよ。うまくすると、これ以上は望めないぐらいの幸運なんだわ」

「きみはまたなにを考えてるんだ？」

「このゾンビ・スープはね、すごく重宝なものだけど、ひとつだけ欠点があるのよ。かりに誰かに注射して、こっちの思うとおりのことを吹きこんでやったとするでしょ、すると、その人間はこっちの思うとおりになるのよ。ところが……マイルズ、あなた、催眠術のことは知ってて？」

「あまり知らんね」

「法律以外のことはなんにも知らないのね！　好奇心というものがないのね、デブちゃんは。催眠術にかかった人間の心の中では、受けた命令と、その人間のほんとうの意志とのあいだに、激しい衝突がおきるのよ。その衝突が激しすぎると、一時的な精神障害をおこすの。そのとき、精神分析医の手にかかったら、たちまち、催眠術にかけられているということがバレてしまうのよ。ダンの場合もそうなるかもしれないわ。精神分析医のとこで、あたしの命令をべらべらしゃべられてしまったら大おお事ごとだわ」

「きみはこの薬なら絶対だといったぞ」

「うるさいわね、このおデブちゃんは。人生ってものは少しぐらい冒険しなきゃ生きていけないのよ。だから人生はおもしろいんじゃないの。少し黙って考えさせてよ」

　短い沈黙ののち、ベルは再び口をひらいた。「だから、一番簡単でしかも安全な方法は、せっかく準備もすっかり整ってるんだから、彼をこのまま冷凍睡眠コールドスリープへ行かすことなのよ。もし、冷凍処理のショックで死んでくれればそれこそ手数がかからないですむし、危険もなくなるわけだわ。それなら、彼にいろんな命令を与えて、精神分析医の手に落ちないようにとお祈りしてるより、ずっと手っとり早い。まず彼に冷凍睡眠コールドスリープへ行けって命令して、それから正気にもどして外へ連れ出せば……いえ、まず連れ出して、それから正気にもどすほうがいいかな」彼女はいいかけて、ぼくの顔を見た。「ダン、あんたはいつ冷凍睡眠に行くの？」

「行かない」

「なんですって？　それじゃいったいこれはなによ」ベルはボストンバッグから取り出した書類を示す仕種をした。

「冷凍睡眠の書類。ミュチュアル生命保険の契約書」

「頭がおかしくなってやがる」マイルズがいった。

「あら、そうだったわ……ゾンビ・スープを注射されると、思考力がなくなるってことを忘れていたわ。耳も聞こえるし、話もできるし、訊かれれば答えることもできるけど、そのかわり正確な訊きかたをしなきゃだめなのよ。思考力がないんだから」彼女はずいとぼくに近寄ってぼくの瞳をじっと見つめた。「ダン、あたしに、冷凍睡眠のことをなにもかも正直に話してちょうだい。そもそもの始めから、途中もなにひとつ抜かさないで話すのよ。あんたは冷凍睡眠に行く書類を全部揃えて持ってるわ。今日署名したばかりのはずよ。それなのに、どうしていまになって行かないっていいだしたの？　さあ、なにもかも話して」

　そこでぼくは話しだした。こういう質問のしかたをされると、話すことができるのだ。ぼくはベルにいわれたとおり、なにごとも洩らさずに詳細にわたって話した。話すうちに、長い時間が経っていった。

「つまりあんたは、ドライブインにすわってるうちに、冷凍睡眠コールドスリープに行くのはやめて、そのかわりあたしたちに難癖をつけに行こうと思ったわけね？」

「そうだ」ぼくはさらに話をつづけようとした。ドライブインを出てからの長い道程みちのり、そのあいだにぼくがピートにいったこと、ピートがぼくに答えたこと、さらには、途中のドラッグストアで自動車を駐め、〈ハイヤーガール〉の株券をどう処置し、さてそれからマイルズの家までどう自動車を走らせて停めてピートに自動車の中で待っていろといったらピートがいうことをきかずに行くといってきかなかったので、ぼくが……。

　だが、ベルはぼくにその機会を与えなかった。彼女がぼくをさえぎったのである。「ダン、あんたはまた決心しなおしたのよ。あんたは冷凍睡眠に行きたくなったの。いいこと、あんたは冷凍睡眠に行くのよ。あんたはどんなことがあっても、なにがあっても冷凍睡眠にはどうしても行くの。わかった？　ダン、あんたはどうするのかいってごらんなさい」

「ぼくは冷凍睡眠コールドスリープに行く。ぼくは冷凍睡眠に行……」ぼくの身体がぐらぐらゆれだした。誰もなにもいってくれなかったので、ぼくは筋肉ひとつ動かさずに一時間あまりも旗はた竿ざおみたいな直立不動の姿勢で立っていたのだ。ぼくはゆっくりとベルのほうに倒れかかった。

　ベルは一メートルも跳びすさっていった。「おすわり！」

　ぼくはすわった。

　ベルはマイルズをふりかえった。「どう？　こんな調子よ。これから、彼がやり損じないようになるまで徹底的に仕込んでやるわ」

　マイルズは時計を見あげた。「間にあうかな。明日の昼には医者に診察を受けに行くっていってたじゃないか」

「充分よ。そのかわり、あたしたちが自動車で彼をそこまで送っていかなきゃならないけど……あっ、くそっ、だめだわ！」

「なんだ、なにがだめなんだ？」

「時間よ、時間がやっぱり足りないのよ。あたし、さっき彼に、馬にでも効くぐらいの分量を打っちゃった。早く効かそうと思って──なぐられる前に効くようにと思って。明日のお昼ごろになれば、そりゃ素人ならごまかせるぐらい正気にはなるけど、相手が医者じゃとてもだめだわ」

「しかし、診察ったって形式的なものだよ、きっと。身体検査のほうはちゃんとできて、医者の署名もあるんだから」

「ダンの話を聞いたでしょ？　医者は、明日、ダンがアルコールを飲んだかどうかテストするのよ。ということは、彼の反射作用や、反応時間のテストをしたり、目の検査をしたり──なんてことよ、こっちの一番してもらいたくないことばかりじゃないのさ！　マイルズ、これじゃだめだわ」

「あさってにしたらどうだ？　ここの会社に電話をかけて、少し遅れるからといってやれば？」

「ちょっと黙って考えさせて」

　いい捨てると、ベルは、もう一度書類を最初から読み返しはじめた。それから、急に立ち上がって部屋を出ていったと思うと、宝石屋の使うルーペを持ってすぐに引き返して、それを単眼鏡モノクルのように右の眼窩にはさみこみ、一枚一枚ミュチュアルＭＵＴＵＡＬ生命保険の書類を厳密に調べはじめた。マイルズがなにをする気かと問いかけたが、ベルはものもいわずに質問を退けた。

　やがて彼女はルーペを目から外した。「助かったわ。ありがたいことに、保険会社はみんなおなじ政府発行の用紙を使う規則になってるんだわ。デブちゃん、あのイエローページの電話帳をとってきて」

「なにをするんだ？」

「取ってきてったら取ってきてよ。ある会社の正確な綴つづりが知りたいのよ。もちろん知ってはいるけど、念には念を入れなきゃ」

　しぶしぶマイルズが電話帳を取ってくると、ベルはさっそくページをめくった。「あったわ。これ、これ。マスターＭＡＳＴＥＲ生命保険会社。うまいことに、一字ずつちゃんと空きはあるしね。これが、マスターじゃなくてモーターズＭＯＴＯＲＳだったらなおいいんだけど。そのほうが、仕事がしやすいから……でも、モーターズ保険じゃコネクションがないし、だいいち、冷凍睡眠コールドスリープを扱うかどうかわからないから。きっと、自動車やトラックの保険だけだわ」ベルはひょいと顔をあげた。

「デブちゃん、これからすぐにあたしを会社へ連れていって」

「なんだって？」

「でなけりゃ、どこかで、カーボンリボンつきでしゃれた書体の電動タイプライターを探してきてよ。いえ、それより、あんたが一人で行って持ってきてくれたほうがいいわ。あたしは電話をかける用があるから」

　マイルズは顔をしかめた。「ようやくきみの計画がわかりかけてきた。しかし、ベル、それは危ないぞ。とんでもなく危険だぞ」

「そういうだろうと思った」ベルが笑った。「あんた、あたしが、会社に入る前に、すごいところと関係があるって話したのおぼえてるでしょう？　あんた一人の力でマニックス社が動いてくれたと思う？」

「それは……わからん」

「動くもんですか。あたしがいたからよ。あんたは、マスター保険会社が、マニックス・グループの系列会社だってことも知らないでしょう」

「それは……知らない。しかし、それがこれとどう関係があるんだ？」

「あたしのコネクションはまだ相当の力があるのよ。あたしのもと勤めていた会社は、マニックス社の税金のほうをずいぶん助けてあげてたのよ──そのうち、社長が国外に亡命しちゃっておしまいになったけど。そのころのコネがまだ充分効き目があるってこと。さあ、わかったら早く行ってタイプライターを持ってきてちょうだい。そしたら、芸術家の腕のほどを見物させてあげるから。ああ、猫に気をつけなさいよ！」

　マイルズはぶつくさいいながら出ていったが、すぐ引き返してきた。「ねえ、ベル、さっきダンは家の前に自動車を駐めたんじゃないか？」

「どうして？」

「いま見たら、彼の自動車がないんだよ」マイルズはみょうに気がかりそうな表情だった。

「それじゃ、どこかの角にでも駐めたんでしょうよ。そんなことどうでもいいわ。タイプライターを早くしてよ」

　彼はまた出ていった。もし彼らがぼくに訊いたら、教えてやれたのだが、訊かれなかったから考えもしなかった。

　マイルズが行ってしまうとベルも家の中のどこかに姿を消し、しばらくのあいだぼくは一人取り残された。朝の陽がさしかかるころ、マイルズが、すっかりやつれた顔で、重いタイプライターを担いで戻ってきた。そして、再びぼくは一人置き去られた。

　それからしばらくして、やがてベルがまた現われると、いった。

「ダン、この書類に、あんたの〈ハイヤーガール〉の株を保険会社に信託するって書いてあるわね。あんたはそうしたくなくなったのよ。いい、あんたはこれをあたしにくれるのよ」

　ぼくは返事をしなかった。ベルは困ったような顔をしたが、ややあっていいなおした。

「それじゃ、こういえばいいかな。あんたはこれをあたしにくれたいの。あんたはこれをあたしにくれたいの。あんたはこれをあたしにくれるの。わかったわね？」

「わかった。ぼくはそれをきみにあげたい」

「よーし、いい子ね。あんたはこれをあたしにくれたい。くれなくちゃいけない。くれないうちは気がおさまらないのよ。さあ、株券はどこにあるの？　自動車の中？」

「いいや」

「それじゃどこ？」

「郵便で送った」

「なんですって？」と、ベルの声が鋭くなった。「いつ送ったの？　誰に送ったの？　なぜそんなことをしたの？」

　もしベルが第二の質問を最後にしていたら、ぼくはなにもかもしゃべってしまったろう。だが、ぼくは、最後の質問にだけ答えた。それしかぼくにはできないのだ。

「譲渡手続きをした」

　そのときマイルズが入ってきた。「どこへやったって？」

「郵便で送ったっていうのよ。誰かに譲渡したんだってさ！　あんた、ダンの自動車を探してみたほうがいいわ。郵便で送ったっていってるけど、そうしようと思っただけかもしれないから。だって、保険会社へ行ったときは持っていたはずなんだから」

「譲渡したって！」マイルズも跳びあがった。「いったい、だれに？」

「いま訊いてみるわ。ダン、だれにあんたの株を譲渡したの？」

「バンク・オブ・アメリカ」

　ベルは〝なぜ〟と訊かなかった。もしそう訊かれていたら、ぼくはリッキーのことをしゃべっていたところだった。

　ベルはがくんと肩をすぼめた。「舞踏会は終わりよ、デブちゃん。株のことは忘れましょ。銀行が相手じゃとても歯が立たないわ」いいかけて、ベルはまたしゃんと肩を起こした。「でも、ほんとうに郵送してなきゃ話は別だわ！　もしまだなら、あたしが譲渡署名を洗濯屋に出したみたいにきれいに消してみせる。それから、ダンが、改めてそれをあたしに──」

「ぼくらにだろ」マイルズが是正した。

「こまかいことはいわないで。自動車を探してきて」

　マイルズは出ていったが、間もなく帰ってきた。

「へんだぜ。この六区画以内にはどこにも駐めてない。通りという通りは、小路までもれなく巡ってみた。ダンはタクシーで来たんだろう」

「彼がさっき、自分の自動車を運転してきたといったわよ」

「だって現実にないんだ。株券を郵送したという時間と場所を聞いてごらん」

　ベルがそのとおり訊いたのでぼくは答えた。「ここへ来るすこし前。セパルヴィーダとヴェンチュラ・ブールヴァードの交差点のポストに入れた」

「噓をついているんじゃないか？」マイルズがいった。

「噓はつけないのよ、いまの状態では。それに、答えが判然としてるから、なにかと混同してるとも思えないわ。諦めるのよ、マイルズ。彼を片づけてしまってからでも、なんとかできるかもしれないわ。あの株は、譲渡前にあたしたちが買い取っているから、譲渡は無効だといってもいいし……そうだ、いまのうちに、白紙に彼の署名を取っておこう」

　ベルはぼくの署名を取ろうとし、ぼくはベルの命令に従おうと努めた。だが、あらたかなゾンビ・ドラッグのおかげで、ぼくはちっともうまく書けず、ついにベルを満足させることはできなかった。彼女はとうとう癇かん癪しやくをおこしてぼくの手から紙をひったくると、にくにくしげに、「ああ、胸がわるくなるわ！　その程度だったら、あたしのほうがよっぽどうまくマネられるわ！」それから、ぼくの上にのしかかるようにして、「あの猫、殺してやりたかったわよ！」

　そののち、昼すぎごろまで、彼らはぼくに構わなかった。やがてベルがやってきた。

「ダニー坊や、これからあんたにハイポを注射してあげる。うんと気持ちがよくなるわ。立ちあがることも、歩くこともできるし、あんたがいつもしていたようにしていいのよ。あんたはもう誰にも腹を立てていないの。とくに、あたしとマイルズにはね。あたしたちはあんたのお友だち。わかったわね？　さあ、あんたのお友だちはだれ？」

「きみたち。きみとマイルズ」

「あたしは友だち以上なのよ。あたしはあんたの妹なの。いってごらん」

「きみはぼくの妹」

「いい子ね。さあ、それじゃこれからあたしたちは一緒に自動車に乗って、あんたは冷凍睡眠コールドスリープに行くのよ。あんたはいままで病気だったの。目が覚めたらなおっていたのよ。わかった？」

「わかった」

「あたしはだれ」

「きみはお友だち。ぼくの妹」

「いい子、いい子。袖をまくって」

　ぼくはハイポの針の刺さるのは感じなかったが、抜かれたあとで飛びあがるほど痛みを感じた。

「ウッ、ベル、いたいな！　なんだいそれは？」

「あなたに効くお薬よ。あなたは病気だったでしょう」

「うん。病気だった。マイルズはどこ？」

「すぐ来るわよ。さあ、そっちの腕も出して。袖をまくって」

「なにするんだい」ぼくはいったが、いわれたとおりに袖をまくった。ベルはまた注射して、ぼくはまた飛びあがった。

　ベルが微笑を浮かべた。「そんなに痛くなかったでしょ？」

「え？　ああ、そんなに痛くはなかったな。なんの注射なんだい？」

「自動車で行くあいだ、眠くなる注射よ。むこうへ着くころには目が覚めるの」

「あ、そうか。ぼくは眠るのが好きだよ。冷凍睡眠コールドスリープに行くんだからね」ぼくはきゅうに目をぱちくりしてあたりを見まわした。「あれ、ピートはどこへ行った。ピートも冷凍睡眠に行くんだぜ」

「ピート？」ベルがいった。「あーら、ダンったら、忘れちゃったの？　ピートは、あなたが、リッキーのところへあずけたじゃないの。リッキーが面倒を見てくれるのよ」

「あっ、そうだったっけ！」ぼくは安堵の笑いを浮かべた。そうだ、ぼくはピートをリッキーのところへ郵便で送ったんだっけ。良かった。リッキーはピートが好きだから、ぼくが冷凍睡眠に行っているあいだ、よく世話をしてくれるだろう。

　彼らはぼくをソーテルの共同冷凍場サンクチユアリへ連れていった。ここは、規模の小さい、自社専用の冷凍場を持たない保険会社が共同で使っているのだ。道中ぼくは昏こん々こんと眠り続けていたが、自動車が目的地についてベルがぼくに声をかけると同時にパチリと目を覚ました。マイルズは自動車にそのまま残り、ベルがぼくを連れて中へ入った。受付のデスクにいた女性が顔をあげて、「デイヴィスさんですね？」といった。

「はい」とベルが答えた。「わたくし、妹でございます。マスター保険のかたはいらっしゃいますかしら？」

「とっくにすんでいますわ！　兄は療養延期を受けた組なんですの。アヘンを吸っておりまして──痛みを和らげるためにですわ……」

　受付嬢はメンドリのような同情の声をあげた。

「それじゃ、お急ぎになったほうが。そのドアをくぐって、左です」

「こっちのほうは大丈夫、胃は空からっぽだ」と男がいった。

「昨夜から、ぜんぜん飲食はしておりませんの」とベルがいった。

「それは結構。時どき、クリスマスの七面鳥みたいにやたら詰めこんで来る人がいますんでね。しようがないもんですよ」

「そうでございましょうねえ」

「よし、よろしい。さあ、手をぎゅっと握って力を入れて、注射をするからな」

　ぼくはいわれたとおりにした。そのとたん、頭の中に霞かすみがかかった。ぼくは突然あることを思いだして台の上に上半身を起こしかけた。「ピートはどこだ？　ピートにあいたい！」

　ベルがぼくの手を取って唇に押しつけた。

「さあ、さあ、おとなしくして、兄さん！　ピートは来られないのよ、忘れた？　ピートはリッキーと一緒にいるのよ」ぼくが静かになったのを見て、ベルがほかの連中に説明している声がした。「ピーターって、わたくしたちの弟ですの。下の妹が病気なものですから、家で看病しているのです」

　ぼくは深い眠りに落ちていった。

　やがて、ぼくはひどく寒くなった。しかし、掛布団をかけようとすると、どうもがいても、身動きひとつできないのだ……。





　　　　　５





　ぼくはバーテンにしきりと文句をいっていた。冷房装置がききすぎて、ぼくらは一人残らず風邪をひきそうだったのだ。「だいじょうぶだよ」とバーテンは自信ありげな声でいう。「眠ってしまえばなにもわからなくなるんだ。眠れ──眠れ──夕べのまどろみを──美うるわしの眠りを」ふと見ると、バーテンはベルの顔をしていた。

「それじゃ、温かい飲物でも作ってくれたらどうだ。トム・アンド・ジェリーがいいかな？　それともホット・バタード・ラムかな？」

「バカモンはきさまだ！」と例の医者がいった。「あいつにゃ眠りはもったいなすぎる。ほうり出してしまえ！」

　ぼくは脚をバーの足元のポールに絡からませて抵抗しようとした。そして気がつくと、このバーにはカウンターがなく、ぼくはあおむけに寝かされているのだった。へんなバーだ。ここでは脚なし人間につき添いサービスをするバーなのかな。ところがぼくも脚がなかった。ない脚を絡ませようというのは無理な話だ。あれ、手もないぞ。「ママ、見てごらん、手がない人間だよ！」ピートがぼくの胸の上で悲しげに鳴いた。

　いつか、ぼくは軍隊に戻っていた。基礎訓練のキャンプだ。いや──二次訓練のキャンプだった──なぜならぼくは、キャンプ・ヘイルにいたからだ。新兵を一人前の兵士に仕立てるためと称して首筋に雪をつっこむ、ばかげた訓練をやったところだ。ぼくはコロラド州じゅうで一番大きな一番ばかげた山に登らなければならなかった。山じゅう雪と氷に閉ざされて、おまけにぼくは脚がなかった。にもかかわらずぼくは世の中で一番でかい荷物を背に担いでいた。兵隊が荷役のロバ代わりに使えるかどうか実験しているのだ。そしてぼくが、一番役立たずというので選ばれたのだ。もしリッキーがあと押しをしてくれなかったら、とうていやり通せなかったろう。

　曹そう長ちようのやつがふりむくと、それもベルの顔をして、ぼくにむかって怒気満面でがなりたてた。「おい、こら、きさま！　きさまなんかを待っちゃおれんぞ。きさまが参ろうがどうしようが、おれはなんとも思いやせん。あそこへ着くまでは眠っちゃならんのだぞ！」

　ぼくは脚がなかったので、ちっとも道ははかどらなかった。ぼくは雪の中で転んだ。雪は冷たくなま温かかった。ぼくがとろとろと眠りかかると、リッキーがしくしくと泣きながら、眠っちゃだめよと哀願した。だが、ぼくは眠りに落ちていった。

　目を覚ましてみると、ぼくはベルと一緒に寝ていた。「起きてよ、ダン！　あたしは三十年もあんたを待っちゃいられないのよ。女は将さ来きのことを考えなきゃいけないんだから！」ぼくは起きあがって、ベッドの下から黄金の詰まった袋をひっぱり出してベルに渡そうとした。だが、ベルの姿はもう見えず、かわりにベルの顔をした〈ハイヤーガール〉がいて、黄金をしまいこむと、頭のてっぺんの皿の上に載っけて、ひらひらと部屋を出ていってしまった。ぼくは後を追いかけようとした。だがぼくには脚がなくて身体がなくてなにもないのだった……。「ぼくには身体ボデイがない。だれもいないノーボデイ、だれもぼくのことなんか心配してくれない……」全世界が、曹長と、辛い仕事でできていた……そんならどこで働こうと、ちっとも問題じゃないじゃないか？　でぼくは、ぼくの身体に馬具をもう一度つけてもらい、手綱を引かれて、氷の山をよじのぼっていた。まわりはどこまでも真っ白で美しく、そのバラ色の頂きへたどりつけさえすれば、眠らせてもらえるのだ。眠るのだけがぼくの望みなのだが、ぼくには頂上まで登ることはできそうにもない──足もなく、手もなく、身体もないのでは──。

　山の上が火事だ。

　雪は融けないのに、すさまじい熱波が、つぎつぎとぼくに襲いかかってくる。ぼくはもがいた。さっきの曹長が、ぼくの上にのしかかって叫んでいた。

「起きろ、起きろ、起きろ──」





　かなり長い時間、ぼくはなにがなにやらわからないでいた。確か、そのうちの一部は、手術台のようなものの上にいて、その台がぶるんぶるんと震動し、蛇のような格好の機械があって、煌こう々こうたる灯りがさし、無数の人間があたりを動きまわっていた。だが、ぼくがはっきりと目を覚ましたときは病院のベッドに寝かされていた。気分はもうすっかりよくて、ただ、サウナ風呂に入ったあと感ずるような、半分身体が漂うような不安定な感覚があった。手も脚も、もとどおりくっついていた。だが、誰一人ぼくに話しかけようともせず、一度など、看護師の姿を見かけてこっちから口をきこうとしたとたんに、口の中へ何かつっこまれた。それから、長い長いマッサージを受けた。

　そしてある朝、ぼくは爽快な気分で目を覚ますと同時にベッドからおりてみた。ちょっと眩暈めまいがしたが、たいしたことはなかった。自分の名前もわかったし、なぜこんなところへ来たのかも、この現実以外のすべてが夢だったこともちゃんとわかった。

　ぼくは、誰にここへ入れられたのかも知っていた。ゾンビ・ドラッグの麻酔をかけられて、ベルに、彼女の奸かん計けいを忘れてしまえと命ぜられたはずだったが、三十年間の冷凍睡眠コールドスリープがその催眠力を洗い流してしまったのだろう。細かいことは多少ぼんやりしていたが、彼らがぼくをどのようにしてここへつれてきたかも、ぼくははっきりと思いだすことができた。

　ぼくは最初、とくに怒りの感情をおぼえなかった。それもそのはずだ──それはほんの昨日の（昨日という言葉が一夜の眠りを境とした前の日のことである以上）出来事に過ぎないように思われこそすれ、実はその間に三十年の歳月が流れてしまったのだから。この感情は、非常に主観的なものなので、正確にいい表わしにくい。だが、ぼくの記憶はまさに昨日のことのようにまざまざと鮮明なのに、その記憶にまつわる感情は、遠くかすかなものでしかないのだ。あなたもテレビの野球実況を見ていて、画面がロング・ショットからクローズ・アップに移るとき、画面いっぱいに拡がった投手のピッチング・モーションのはるかむこうに、球場の全景が見えて、その彼方に投手自身の豆つぶのような姿が、まだ白昼の亡霊さながらに残っているのを見たことがあるだろう。ぼくの感情はなにかそれに似ていた……ぼくの記憶はクローズ・アップ。そしてぼくの感情は、画面の背後に拡がる球場の全景だ。

　もちろん、ぼくはベルとマイルズの悪党夫婦を必ず見つけだして切りきざみ、猫の餌にしてやるつもりだった。だが、それはまだゆっくりでいい。来年でも間に合うことだ。いまは一刻も早く西暦二〇〇〇年の様子が見たかった。

　が……猫の餌といえば……ピートはどこにいるだろう？　冷凍睡眠コールドスリープに来なかったのだから、いまは老いさらばえて、しかしまだどこかに生きているかもしれない……。

　そう思ったとたん、ぼくは、ピートを冷凍睡眠にともなうべく苦心してたてた計画が、ベルとマイルズの奸計によって、無惨にもぶちこわされたことに、はじめて思い到ったのだった。

　おのれ！　憎いやつらだ。ぼくは、ベルとマイルズを〝留保〟の籠から取り出して〝火急〟の籠へ入れなおした。やつらはピートを殺そうとしたろうか？

　いや、殺す以上のことをしてのけた。彼らはピートを野に追いやり、野性に返してしまったのだ。人家の裏小路を食物を漁って徘徊するうちに四肢は瘦せ衰え、妖しい妖精の気質は世のすべての二足動物への憎悪にこりかたまって──。

　彼らは、ピートに、ぼくに捨てられたと思いこんだまま死なせたのだ。

　この恨み、はらさぬわけにはいかぬ。彼らがこの世に生きてあるかぎり！　ぼくは切に願った、彼らがまだ余命をながらえてあることを！





　ふと気がつくと、ぼくはベッドの脚のかたわらに立って、ふらふらする身体を支えるために手すりにしっかりとつかまっていた。パジャマ一枚の姿だった。ぼくは、あたりを見まわして、人を呼ぶ方法はないものかと考えていた。病室というものは、三十年たってもあまり変わらないようだった。部屋には窓がなく、どこから光線が来るのか、柔らかな明るさだった。ベッドは背が高く幅が狭い。これも、昔の病院にあったのと変わりなく、さむざむとした肌触りだ。ぼくは例によって病院の室内装置の改良を考えはじめていたが、それより、早く看護師を呼ぶスイッチを見つけて、それから服を着たい。

　服は見あたらなかったが、スイッチ──らしいものが、テーブル──らしいものの横についている。そして、ぼくの手がそれに触れると、ベッドに横になったときに顔のまん前に来る位置にあった透明体に〝呼出〟という字がぽかりと点いた。点いたと思うと、すぐ〝ただいままいります〟という文字と入れ替わって消えた。

　待つ間もなく、ドアがすうと内側に捲まきこまれて、看護師が入ってきた。看護師も、あまり変わっていなかった。なかなかかわいい顔をして、教育部隊の下士官といったしっかり者らしい態度。蘭のような明るい紫色のショートカットの髪にこざっぱりとした粋な白の帽子を載せ、おなじく白の制服をまとっている。ただその制服の様子が変わっていた。つまり、一九七〇年ごろとちがったところが肌を隠し、ちがったところが肌を出しているのだ。まあ、いずれにせよ、女性の服というものは、つねにこうしたものなのだが。

「ベッドにおもどりなさい！」

「ぼくの着るものは？」

「ベッドにお入りなさい。早く！」

　ぼくは理を尽くして説きはじめた。「ねえ、看護師さん。ぼくは善良な市民で、年も二十一歳以上だし、犯罪者でもないんだ。ベッドにもどる義務はないからもどらないよ。さ、ぼくに服の在り場所を教えてくれるか、さもなければ、ぼくが勝手に探しはじめるのを見ててくれるか、どっちがいい？」

　看護師はぼくを見つめたと思うと、急にきびすを返して出ていった。ドアは彼女の背後で音もなく閉まってしまった。

　こんなことに驚くもんかとぼくは思った。このドアもエンジニアが作ったものなら、こっちもエンジニアだ。この仕組みがわからないわけはない。そう考えはじめたとき、再びドアがあいて、一人の男が入ってきた。

「やあ、おはよう」男がいった。「アルブレヒト博士です」

　彼は日曜日の晴着とピクニック着を半々ずつ混ぜたような妙な服を着ていた。だが、そのきびきびした態度といい、どこか疲れた目の色といい、いかにも有能な医者らしい。ぼくは男を信用することにした。「おはよう、先生。ぼくの服を返してほしいんですが」

「いや、結構です」

「お取りなさい。害にはなりませんよ」

　ぼくはまた首を振った。以前は、仕事中も四六時中煙草の煙をもうもうと身辺に漂わせていたぼくだった。仕事の進行ぶりは、そこらじゅうの灰皿に吸殻が山と盛りあがり、製図板に煙草の焼け焦げがいくつできるかで判断できたのだ。ところがいま、煙草の煙を見ただけで頭がふらふらする。眠りとおした三十年間に、ニコチン中毒をどこかに置き忘れてきたのかしらとぼくは思った。

「せっかくですが」

「そうですか。ところでデイヴィスさん、ぼくはこの病院に六年います。冷凍睡眠コールドスリープおよび蘇生科の専門医です。今日まで八千とんで七十三人の患者に冬眠状態からノーマルな状態への蘇生処置を施してきました。あなたで八千とんで七十四人めです。したがってぼくは患者が蘇生した際におこすおよそあらゆる奇異な症状を──つまり、素人目に奇異であって、ぼくにとってではありません──見てきました。覚めた直後、再び冬眠状態に戻ることを望む患者もいます。この種の患者は、ぼくらが、覚醒状態を維持しようと努めているあいだも、ぼくらにたいして、罵ば詈り雑ぞう言ごんを浴びせかけます。このうちの一部が実際に再び冬眠に戻ります。覚醒してから、冷凍睡眠コールドスリープが片道切符であって、なん年に出発しようと二度と再びもとへ帰ることができないことにはじめて気がつき、際限なく歎き悲しむタイプの患者もあり、そして、あなたのように、真っ先に服をよこせといって外へ飛び出したがる患者もいる。こういったわけです」

「しかし、それがなぜいけませんか？　ぼくは自由を束縛されているんですか？」

「そんなことはありません。服は返してさしあげます。おそらくはいささか時代遅れになっているのではないかと思いますが、これは個人の趣味の問題ですからな。がしかしだ、いま取りにやるあいだ、あなたが、たったいますぐにとおっしゃるお急ぎのわけを、よろしかったらお聞かせ願えませんかな？　三十年もたった後でなぜ分秒を争わなければならないのか、その理由をです。三十年ですよ。それほどほんとうに急ぐのですか？　それとも、今日じゅうだったらもう少しあとでもいいですか？　あるいは、明日でも？」

　ぼくは絶対火急の大急ぎだと答えかけたが、ふと思いなおした。恥ずかしくなったのである。

「それほどの急用でもないです」

「ではぼくの願いを容いれ、一度ベッドにおもどりになって、診察などさせていただけませんかな？　診察のあとで朝食をめしあがって、できれば、どこへなりとふっ飛んで行かれる前に、ぼくと二、三分お話しになる。場合によっては、あなたがふっ飛んで行く先を忠告してさしあげられるかもしれませんよ」

「これはどうも。そうしましょう、先生。お手数をかけて申しわけないです」ぼくはベッドに横になった。すると気持ちが落ち着いて──そして突然激しい疲労を感じた。

「どういたしまして。あなたなんかいいほうだ。えらい騒ぎをおっぱじめる人がいますからね」彼は掛布団をなおすと、ベッドに作りつけのテーブルに顔をよせた。

「第十七病室のアルブレヒト博士だ。朝食を一人前頼む。ええと──４マイナスの献立だ」

　彼はぼくにふりかえった。「横にむいて上衣を上までまくりあげて、脇腹を見せてください。診察しているあいだに、訊きたいことがあったら、質問してよろしい」

　脇腹をいじられながらぼくは考えようと努めた。彼がぼくの脇腹に押しつけているのは、超小型の補聴器のような格好をしているが、おそらく聴診器なのだろう。発達したものだが、昔ながらの欠点がひとつある。ピックアップが冷たくてこつこつするのは感じがわるい。

　さて、なにを訊こうか？　三十年眠ったあとで、人はふつうどんなことを訊くものだろう？　星間飛行はもう実現しましたか？　こんどは、どこの国が〈最終戦争〉を始めましたか？　赤ん坊はもう実験室で試験管の中から生まれるようになりましたか？　ぼくはいった。「先生、映画館のロビーには、まだポップコーン自動販売器が置いてありますか？」

「ぼくが最後に見たときはまだ置いてありましたな。もっともこのごろは、とんとそんなものを見る暇がないが。話はちがうが、このごろは映画とはいいませんよ、映動グラビーというんです」

「ほう。なぜです？」

「一度見てみなさい。わかりますよ。ただし、忘れずに、座席のベルトを締めること。映動グラビーの最中に、なんシーンか、劇場そのものが虚ヌ無ルしますからね。……わかるでしょう、デイヴィスさん、われわれはほとんど毎日のようにこの問題を──すなわち新語の問題に直面しているのです。毎新年ごとに、語ご彙いの調整をしなければならんのです。歴史的、文化的な調整をも含めてですよ。これはぜひとも必要なのです、というのが、いかに一方でショックを軽減しても、定位錯誤はえてして極端に走りやすいですからな」

〝どかん〟の話はぼくにはあまりぞっとしなかった。アルブレヒト博士は平然とつづけた。

　ぼくはカードを返すと、ベッドから降りて、ロボットのデータプレートを見ていた。ぼくはロボットの製造会社が、〈ハイヤーガール〉株式会社だとばかり思っていた。ところが、アラジン自動工業の名があったので、もしかすると、アラジンというのは、〈ハイヤーガール〉の子会社ではないかと思ったのだ。だが、データプレートでは、型式・製造番号、製造工場以外はわからなかった。ただ、それには、およそ四十にも及ぶ特許がずらりと連記してあって、そのうちもっとも年代の若いのは一九七〇年となっていた。ぼくは非常に興味の湧くのをおぼえた。これは、ぼくのオリジナルの設計を基にしたものに、ほぼ間違いなさそうだ。

　ぼくはテーブルの上を探して鉛筆とメモ用紙を見つけ、その最初の特許番号を書き写した。だが、もちろんこれは純粋に専門家としての興味からだった。というのは、かりにこれがぼくの発明を盗んだものであっても（盗んだものにちがいないのだ）、法令が改正されていないかぎり、ぼくの特許は一九八七年に消滅してしまっているからで、現在特許権があるのは、一九八三年以降のものに限られるのだ。だが、ぼくは知りたかった。

「ほかでわたしを呼んでいます。行ってよろしいですか？」

「ありがとうございます。失礼します」それはぼくを巧みに避けて戸口へむかった。

「ありがとう」
